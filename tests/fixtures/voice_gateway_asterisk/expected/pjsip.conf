; Rendered by python -m voice_gateway.asterisk.render; do not edit.

; Registered lines are matched by the ;line= parameter of their Contact
; (always tried first), peer lines by the PBX's address; nothing else.

[global]
type = global
user_agent = SRW voice gateway
endpoint_identifier_order = ip

[srw-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5062
local_net = 10.42.0.0/16
local_net = 192.168.10.0/24
external_signaling_address = 192.168.10.50
external_media_address = 192.168.10.50

[srw-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5062
local_net = 10.42.0.0/16
local_net = 192.168.10.0/24
external_signaling_address = 192.168.10.50
external_media_address = 192.168.10.50

; ---- line reception: registers as extension 2000 at 192.168.10.2:5060

[srw-reception-auth]
type = auth
auth_type = digest
username = 2000
password = test-reception-secret

[srw-reception]
type = aor
contact = sip:192.168.10.2:5060

[srw-reception]
type = endpoint
transport = srw-udp
context = srw-line-reception
aors = srw-reception
outbound_auth = srw-reception-auth
from_user = 2000
from_domain = 192.168.10.2
disallow = all
allow = alaw,g722
dtmf_mode = auto
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
timers = yes
allow_transfer = no
send_pai = no
inband_progress = no

[srw-reception]
type = registration
transport = srw-udp
outbound_auth = srw-reception-auth
server_uri = sip:192.168.10.2:5060
client_uri = sip:2000@192.168.10.2
contact_user = 2000
line = yes
endpoint = srw-reception
expiration = 600
retry_interval = 30
forbidden_retry_interval = 120
fatal_retry_interval = 120
max_retries = 1000000
auth_rejection_permanent = no

; ---- line clinic: registers as extension ai-desk at pbx.example.internal:5070

[srw-clinic-auth]
type = auth
auth_type = digest
username = auth-4711
password = test-clinic-secret

[srw-clinic]
type = aor
contact = sip:pbx.example.internal:5070;transport=tcp

[srw-clinic]
type = endpoint
transport = srw-tcp
context = srw-line-clinic
aors = srw-clinic
outbound_auth = srw-clinic-auth
from_user = ai-desk
from_domain = clinic.example
disallow = all
allow = ulaw
dtmf_mode = auto_info
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
timers = yes
allow_transfer = no
send_pai = no
inband_progress = no

[srw-clinic]
type = registration
transport = srw-tcp
outbound_auth = srw-clinic-auth
server_uri = sip:pbx.example.internal:5070;transport=tcp
client_uri = sip:ai-desk@clinic.example
contact_user = ai-desk
line = yes
endpoint = srw-clinic
expiration = 600
retry_interval = 30
forbidden_retry_interval = 120
fatal_retry_interval = 120
max_retries = 1000000
auth_rejection_permanent = no

; ---- line hotline: takes calls the PBX at 192.168.10.3/32, 192.168.10.4/32 sends

[srw-hotline]
type = aor
contact = sip:192.168.10.3:5060

[srw-hotline]
type = endpoint
transport = srw-udp
context = srw-line-hotline
aors = srw-hotline
from_user = 31
from_domain = 192.168.10.3
disallow = all
allow = alaw,g722
dtmf_mode = auto
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
timers = yes
allow_transfer = no
send_pai = no
inband_progress = no

[srw-hotline]
type = identify
endpoint = srw-hotline
match = 192.168.10.3/32
match = 192.168.10.4/32
