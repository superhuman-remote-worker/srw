; Rendered by python -m voice_gateway.asterisk.render; do not edit.
; Without file formats Asterisk cannot write a recording (§2.4: no
; audio on disk). The addon registers to the PBX and is nobody's
; registrar.
[modules]
autoload = yes
noload = format_wav.so
noload = format_pcm.so
noload = format_sln.so
noload = res_ari_recordings.so
noload = app_playback.so
noload = app_echo.so
noload = res_pjsip_registrar.so
noload = res_pjsip_config_wizard.so
