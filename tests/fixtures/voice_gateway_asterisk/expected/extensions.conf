; Rendered by python -m voice_gateway.asterisk.render; do not edit.

; Every call goes to the voice gateway's Stasis app with its line's
; name. Nothing here records or plays audio.

[general]
static = yes
writeprotect = yes
autofallthrough = yes

[srw-line-reception]
exten => _X!,1,Goto(s,1)
exten => _+!,1,Goto(s,1)
exten => s,1,Set(SRW_LINE=reception)
 same => n,Set(SRW_PBX=192.168.10.2:5060)
 same => n,Stasis(srw-voice,reception)
; Reached only while the gateway is not connected: 480 to the PBX.
 same => n,Hangup(19)

[srw-line-clinic]
exten => _X!,1,Goto(s,1)
exten => _+!,1,Goto(s,1)
exten => ai-desk,1,Goto(s,1)
exten => s,1,Set(SRW_LINE=clinic)
 same => n,Set(SRW_PBX=pbx.example.internal:5070)
 same => n,Stasis(srw-voice,clinic)
; Reached only while the gateway is not connected: 480 to the PBX.
 same => n,Hangup(19)

[srw-line-hotline]
exten => _X!,1,Goto(s,1)
exten => _+!,1,Goto(s,1)
exten => s,1,Set(SRW_LINE=hotline)
 same => n,Set(SRW_PBX=192.168.10.3:5060)
 same => n,Stasis(srw-voice,hotline)
; Reached only while the gateway is not connected: 480 to the PBX.
 same => n,Hangup(19)

[srw-transfer]
; Blind REFER on the caller's own dialog; the gateway gets the caller
; back with TRANSFERSTATUS (SUCCESS/FAILURE) and the SIP code.
exten => s,1,Transfer(PJSIP/${SRW_REFER_TO})
 same => n,Stasis(srw-voice,${SRW_LINE},transfer,${TRANSFERSTATUS},${TRANSFERSTATUSPROTOCOL})
 same => n,Hangup()

[srw-handover]
; The fallback transfer's target answered: the caller leaves the
; gateway's app and bridges to it here (x: the target's leg ends with
; the bridge), so a gateway restart never drops the two parties.
exten => s,1,Bridge(${SRW_HANDOVER_TO},x)
 same => n,Hangup()
