apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  # Replaced by the harness before creation. A committed, fixed cluster name
  # would make it too easy to target a developer's long-lived cluster.
  name: __CLUSTER_NAME__
servers: 1
agents: 1
image: rancher/k3s:v1.31.5-k3s1
# Configure the internal server load balancer for HTTP and HTTPS while asking
# Docker for dynamic host ports. The browser runs on this cluster's private
# bridge and uses ports 80/443 directly; host ports 80/443 may belong to a
# developer cluster. Only secure-origin profiles serve TLS on 443.
ports:
  - port: "0:80"
    nodeFilters:
      - loadbalancer
  - port: "0:443"
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: 180s
    disableLoadbalancer: false
    disableImageVolume: false
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  runtime:
    labels:
      - label: srw.io/e2e-owned=true
        nodeFilters:
          - server:*
          - agent:*
