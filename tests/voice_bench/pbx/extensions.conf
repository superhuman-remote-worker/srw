; =============================================================================
; WP0 voice bench dialplan: one business number and one context per profile
; =============================================================================
; The caller dials the business number; the profile context rings the AI
; extension (2000) through that profile's endpoint (see pjsip.conf). Nothing
; here records audio.

[general]
static = yes
writeprotect = yes

[from-caller]
exten => 100,1,Goto(profile-register,s,1)
exten => 101,1,Goto(profile-peer,s,1)
exten => 102,1,Goto(profile-alaw-only,s,1)
exten => 103,1,Goto(profile-dtmf-info,s,1)
exten => 104,1,Goto(profile-dtmf-rfc4733,s,1)
exten => 105,1,Goto(profile-reinvite,s,1)
exten => 106,1,Goto(profile-session-timer,s,1)
exten => 107,1,Goto(profile-refer-accept,s,1)
exten => 108,1,Goto(profile-refer-refuse,s,1)
; The diversion profiles model the reception hunt group 200/201 that forwards
; to the AI extension.
exten => 200,1,Goto(profile-diversion-on,s,1)
exten => 201,1,Goto(profile-diversion-off,s,1)
exten => _X.,1,Hangup(1)

[ring-ai]
; ${ARG1} = the AI endpoint for this profile.
exten => s,1,NoOp(bench: ringing ${ARG1})
 same => n,Dial(PJSIP/${ARG1},30)
 same => n,Hangup()

[profile-register]
exten => s,1,Gosub(ring-ai,s,1(2000))
 same => n,Hangup()

[profile-peer]
exten => s,1,Gosub(ring-ai,s,1(2000-peer))
 same => n,Hangup()

[profile-alaw-only]
exten => s,1,Gosub(ring-ai,s,1(2000-alaw))
 same => n,Hangup()

[profile-dtmf-info]
exten => s,1,Gosub(ring-ai,s,1(2000-dtmf-info))
 same => n,Hangup()

[profile-dtmf-rfc4733]
exten => s,1,Gosub(ring-ai,s,1(2000-dtmf-rfc4733))
 same => n,Hangup()

[profile-reinvite]
exten => s,1,Gosub(ring-ai,s,1(2000-reinvite))
 same => n,Hangup()

[profile-session-timer]
exten => s,1,Gosub(ring-ai,s,1(2000-timer))
 same => n,Hangup()

[profile-refer-accept]
exten => s,1,Gosub(ring-ai,s,1(2000-refer-ok))
 same => n,Hangup()

[profile-refer-refuse]
exten => s,1,Gosub(ring-ai,s,1(2000-refer-no))
 same => n,Hangup()

[profile-diversion-on]
; The call was addressed to the hunt group 200 and forwarded unconditionally.
exten => s,1,Set(REDIRECTING(orig-num,i)=200)
 same => n,Set(REDIRECTING(from-num,i)=200)
 same => n,Set(REDIRECTING(from-name,i)=Rezeption)
 same => n,Set(REDIRECTING(to-num,i)=2000)
 same => n,Set(REDIRECTING(reason,i)=unconditional)
 same => n,Set(REDIRECTING(count,i)=1)
 same => n,Gosub(ring-ai,s,1(2000-div-on))
 same => n,Hangup()

[profile-diversion-off]
exten => s,1,Set(REDIRECTING(orig-num,i)=201)
 same => n,Set(REDIRECTING(from-num,i)=201)
 same => n,Set(REDIRECTING(from-name,i)=Rezeption)
 same => n,Set(REDIRECTING(to-num,i)=2000)
 same => n,Set(REDIRECTING(reason,i)=unconditional)
 same => n,Set(REDIRECTING(count,i)=1)
 same => n,Gosub(ring-ai,s,1(2000-div-off))
 same => n,Hangup()

[transfer-targets]
; Blind transfers from the AI extension land here (Refer-To user part).
exten => 3000,1,NoOp(bench: transfer to the human extension)
 same => n,Dial(PJSIP/3000,30)
 same => n,Hangup()
exten => _X.,1,Hangup(1)

[from-ai]
; Like any internal phone, the AI extension may call the reception. A device
; whose REFER is refused can dial the target itself (SRW does; the stand-in
; never calls out).
exten => 3000,1,NoOp(bench: the AI extension calls the human extension)
 same => n,Dial(PJSIP/3000,30)
 same => n,Hangup()
exten => _X.,1,Hangup(1)

[from-internal]
exten => _X.,1,Hangup(1)
