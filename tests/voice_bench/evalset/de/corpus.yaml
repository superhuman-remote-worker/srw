# The German caller corpus (README.md, "Corpus"): single caller lines for
# the file-level STT pass, scored under every condition below.
#
# Everything is fictional: the hotel is testset/de/facts.md's Hotel
# Beispielhof; names are common or rare German (and German-resident)
# surnames with no person behind them; phone numbers come only from the
# Bundesnetzagentur's ranges for films and books ("Drama Numbers", never
# assigned: 030 23125 xxx, 069 90009 xxx, 040 66969 xxx, 0221 4710 xxx,
# 089 99998 xxx, 0152 28817386, 0171 39200 xx, 0172 9925904, 0174 9091317,
# 0176 040690 xx …); e-mail domains end in .example (RFC 2606); towns are
# made up (Beispielstadt, Musterhausen, Teststadt …).
#
# text:   what the caller says; numbers in words, as people say them;
#         <pause S> is S seconds of silence mid-sentence.
# style:  plain, hesitation (ähm, äh), pause, self_correction, spelled,
#         grouped (numbers in groups), short.
# values: what must survive STT exactly (values.py): name, phone, date
#         (absolute "13.11." or a relative phrase), time, email, number,
#         address, keyword ("a|b" for either).
# voice:  a voice from voices.yaml; default: the rotation.
# sweep:  also rendered in every voice (the voice comparison).

conditions: [clean, g711a, g711u, g722, mobile, loss-3, loss-8, street, cafe, office, quiet, clipped]
sweep_conditions: [clean, g711a, mobile]

utterances:
