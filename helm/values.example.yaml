# =============================================================================
# values.example.yaml — starter overlay for production / customer installs
# =============================================================================
# This is a customer-friendly template assuming you bring your own external
# services (managed Postgres, OIDC provider, git server, cloud storage). Every
# field in this file MUST be reviewed before install.
#
# For all configurable options and defaults, see values.yaml or run:
#   helm show values oci://ghcr.io/superhuman-remote-worker/charts/superhuman-remote-worker
#
# For evaluation with everything bundled in-cluster, see the README's
# "Quick start" section instead — most of this file does not apply.
# =============================================================================

# REQUIRED: accept the license terms (see LICENSE in the source repository).
license:
  acceptTerms: false

global:
  # REQUIRED: base domain. All subdomains (api, auth, git, cloud, mcp) are
  # derived from this. DNS records must point at your ingress controller.
  domain: "srw.example.com"
  # Pull credentials for private GHCR images. Omit if images are public.
  imagePullSecrets:
    - name: ghcr-pull-secret
  # Override individual subdomain hostnames when the flat default is already
  # taken in the parent zone. Anything left empty falls back to
  # <subdomain>.<domain>. See helm/values.yaml for the full key list.
  # hostnames:
  #   git: "git-srw.example.com"   # if git.example.com is already in use
  #   auth: "login.example.com"    # share an existing IdP hostname

# -----------------------------------------------------------------------------
# Secrets — pre-create a K8s Secret named "srw-secrets" with the keys listed
# in the chart README ("Secret schema") and reference it here.
# Alternative modes: secrets.create (chart-managed, dev only) or
# externalSecrets.enabled (Vault via ESO). See README.
# -----------------------------------------------------------------------------
secrets:
  existingSecret: srw-secrets

# -----------------------------------------------------------------------------
# OIDC — point at your existing IdP (Azure AD, Google Workspace, Okta, etc.)
# -----------------------------------------------------------------------------
keycloak:
  enabled: true
  internal: false  # do not deploy the bundled Keycloak
  externalIssuerUrl: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  cockpitClientId: "srw-cockpit"
  adminApiDisabled: true  # required when using a non-Keycloak IdP

# -----------------------------------------------------------------------------
# Git server — your existing Gitea / GitHub Enterprise / GitLab.
# -----------------------------------------------------------------------------
gitea:
  enabled: true
  internal: false
  internalUrl: "https://git.internal.example.com"
  externalUrl: "https://git.internal.example.com"

# Exact self-hosted Git endpoints approved for orchestrator-side OKF datasource
# reads. Public github.com/gitlab.com/bitbucket.org/codeberg.org are built in.
orchestrator:
  kbGitAllowedHosts: "git.internal.example.com"
  kbExternalReindexConcurrency: 2
  kbReindexSweepSeconds: 900
  # Recovery readers, controls and cleanup guards ship in every version. These
  # switches open automatic probes only after the protocol rollout described
  # in the chart README and its disposable-cluster gate have passed.
  vmWorkspaceRecovery:
    enabled: false
    replacementEnabled: false
    deadlineSeconds: 900
    maxGlobalProbes: 4
    maxProbesPerNode: 1
    claimTtlSeconds: 30
    permitTtlSeconds: 30
    externalCallTimeoutSeconds: 10
  # Disposable k3d gate only; installs its in-image command contract and RBAC.
  vmWorkspaceRecoveryAcceptanceGate:
    enabled: false

# -----------------------------------------------------------------------------
# Office Canvas — Collabora Online remains dark until every exact-origin and
# network boundary below is supplied. Keep Cloudflare Access off the Office
# hostname; it breaks Collabora WebSockets and WOPI callbacks.
# -----------------------------------------------------------------------------
collabora:
  enabled: false
  publicUrl: ""
  # A configured sessionRouter.jwtSecret or jwtSecretName is also mandatory;
  # Office WOPI tokens reuse that existing HS256 secret boundary.
  # Enabling also requires these values (see values.yaml for the full block):
  # collabora:
  #   server_name: "office.srw.example.com"
  #   aliasgroups:
  #     - host: "http://<release>-superhuman-remote-worker-orchestrator:8085"
  #   extra_params: >-
  #     --o:ssl.enable=false
  #     --o:ssl.termination=true
  #     --o:per_document.always_save_on_exit=true
  #     --o:admin_console.enable=false
  #     --o:net.content_security_policy=frame-ancestors https://cockpit.srw.example.com;
  # networkPolicy:
  #   edgeNamespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: cloudflare-tunnel
  #   edgePodSelector:
  #     matchLabels:
  #       app: cloudflared

# -----------------------------------------------------------------------------
# Databases — external managed instances. See README for required Secret keys.
# -----------------------------------------------------------------------------
databases:
  postgres:
    enabled: true
    internal: false
    # HA: must be a direct/session-mode endpoint — NOT a transaction-mode pooler
    # (PgBouncer/pgcat txn mode breaks the leader-election session advisory lock).
    externalUrl: "postgres://srw:<pw>@pg.example.com:5432/srw"
  vector:
    enabled: true
    internal: false
    externalUrl: "postgresql://srw:<pw>@pg.example.com:5432/srw_vector"
  # Dedicated Postgres for the bundled Keycloak. Only relevant when keycloak.internal=true.
  # When the customer brings an external IdP (the recommended setup above), this block is ignored.
  keycloak:
    enabled: true
    internal: false
    # JDBC URL — password still comes from KC_DB_PASSWORD in the secret.
    externalUrl: "jdbc:postgresql://kc-pg.example.com:5432/keycloak?user=keycloak"
  neo4j:
    # Neo4j is optional. Disable unless you use the project knowledge graph.
    enabled: false
    # Edition toggle — defaults to community. To run Neo4j Enterprise:
    #   edition: enterprise
    #   acceptLicense: "yes"   # Startup Program / commercial license, or
    #   acceptLicense: "eval"  # non-production developer license
    # Image is auto-selected from edition; override .image to pin a specific tag.
    edition: community
    acceptLicense: ""

# -----------------------------------------------------------------------------
# Cloud storage — point at your existing Nextcloud / OpenCloud / WebDAV.
# Disables the bundled cloud StatefulSet.
# -----------------------------------------------------------------------------
opencloud:
  enabled: false
nextcloud:
  enabled: false
cloud:
  externalBackend: "nextcloud"  # "nextcloud" | "opencloud" | "webdav"
  externalUrl: "https://cloud.internal.example.com"
  externalServiceUrl: "https://cloud.internal.example.com"
  # CLOUD_SERVICE_USER / CLOUD_SERVICE_PASSWORD live in srw-secrets.

# -----------------------------------------------------------------------------
# S3 / object storage — used for snapshot / backup archives.
# -----------------------------------------------------------------------------
s3:
  endpoint: "https://s3.eu-central-1.amazonaws.com"
  bucket: "srw-snapshots"
  region: "eu-central-1"
  snapshotMaxSizeGb: "10"
  snapshotRetentionDays: "90"

# -----------------------------------------------------------------------------
# Disable home-cluster-only components.
# -----------------------------------------------------------------------------
headscale:
  enabled: false
pgadmin:
  enabled: false
dozzle:
  enabled: false
codexProxy:
  enabled: false

# -----------------------------------------------------------------------------
# LLM defaults — provider keys live in the secret. The orchestrator reads the
# active model catalog from the database (system_api_keys + llm_endpoints),
# seeded post-install via Admin → Providers in the UI.
# -----------------------------------------------------------------------------
llm:
  baseUrl: "https://api.openai.com/v1"
  visionModel: "gpt-4o-mini"
  embeddingModel: "qwen3-embedding-8b"
  # Optional: seed system endpoints declaratively at install time.
  # See values.yaml `llm.seed.*` for schema.
  seed:
    enabled: false

# -----------------------------------------------------------------------------
# Ingress — set to match your cluster's ingress controller and cert-manager.
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx  # or "traefik"
  tls:
    enabled: true
    issuerName: letsencrypt-prod

# Workspace-port Canvas previews remain unavailable until the deployment has
# a separate viewer domain and has passed the browser security gates. The
# gateway can be fronted three ways: the optional chart Ingress below
# (viewer.ingress, wildcard host + cert-manager DNS-01), a Cloudflare tunnel
# entry pointing at the gateway Service, or an operator-owned edge. Ordinary
# normalizing proxies are supported. An enabled production viewer must
# reference a separately provisioned, least-privilege database credential. A
# chart-owned CNPG database can provision that identity declaratively during
# the same Helm install; external Postgres remains an operator-owned setup.
canvas:
  livePreview:
    enabled: false
    deniedPorts: []
    viewer:
      enabled: false
      deploymentProfile: production
      cookieMode: ""
      domain: ""
      hostSuffix: ""
      cockpitOrigins: []
      pslBoundaryVerified: false
      # Optional wildcard Ingress for the gateway (`*` + hostSuffix); off when
      # a tunnel or operator edge routes to the Service directly.
      ingress:
        enabled: false
        className: ""
        annotations: {}
        tls:
          enabled: true
          issuerName: ""   # needs a DNS-01 solver for wildcard certs
          secretName: ""
      database:
        username: "srw_canvas_gateway"
        credentials:
          # Set true with provisionRole on chart-owned CNPG to keep the whole
          # Canvas database setup inside this Helm release.
          create: false
          existingSecret: ""
          # Required only when an existing Secret is used with automatic CNPG
          # provisioning; asserts basic-auth keys + cnpg.io/reload metadata.
          existingSecretCnpgCompatible: false
          # Alternatively, set a Vault path while using externalSecrets; it is
          # synced only after viewer.enabled becomes true.
          vaultPath: ""
          passwordKey: "CANVAS_VIEWER_POSTGRES_PASSWORD"
        # With engine=cnpg, CNPG 1.30+ owns the role/password and a normal
        # revision Job owns the object grants. No pre-install role step.
        provisionRole: false
        pool:
          min: 1
          max: 4
      # Keep both selectors empty while disabled. Enabling requires non-empty
      # selectors for whatever fronts the gateway (cloudflared, the cluster's
      # ingress-controller pods, or a dedicated edge); only TCP/8086 opens.
      networkPolicy:
        edgeNamespaceSelector: {}
        edgePodSelector: {}
        extraEgress: []

# -----------------------------------------------------------------------------
# SSH gateway — user-facing `ssh s-<handle>@<hostname>` into session workspaces
#
# Off by default. Enabling it requires TWO operator-provided Secrets (the chart
# never generates key material; a template-time key would rotate on every sync
# and break every user's known_hosts) plus an origin allow-list and the trusted
# proxy hop — the gateway's load_config fails closed on all of them.
#
#   ssh-keygen -t ed25519 -N "" -f ./ssh_host_ed25519_key      # Ed25519 ONLY
#   ssh-keygen -t ed25519 -N "" -f ./user-ca
#   kubectl -n <ns> create secret generic srw-ssh-gateway-hostkey \
#     --from-file=ssh_host_ed25519_key --from-file=ssh_host_ed25519_key.pub
#   kubectl -n <ns> create secret generic srw-ssh-gateway-ca \
#     --from-file=user-ca --from-file=user-ca.pub
#
# The `.pub` host-key halves are NOT optional: the orchestrator mounts them to
# serve GET /api/ssh/host-keys, and without them every pinning client silently
# falls back to trust-on-first-use.
#
# A THIRD step is easy to miss: `user-ca.pub` must also land in the vm-ssh-key
# Secret, which is where the workspace provisioner projects it from. See the
# "SSH gateway" section of helm/README.md.
#
# The gateway also REQUIRES a sessionRouter JWT secret (see below): it is the
# HMAC key it verifies the attach token with. The chart refuses to render
# without one rather than shipping a pod that crash-loops.
#
# Every abuse cap the gateway enforces is per POD, so `replicas` multiplies
# all of them — including `max_attachments_per_workspace`, a security cap.
# Leave it at 1 unless you have read helm/values.yaml's note on it.
# -----------------------------------------------------------------------------
# sshGateway:
#   enabled: true
#   hostname: "ssh.example.com"
#   allowedOrigins: ["https://app.example.com"]
#   trustedProxies: "10.42.0.0/16"     # every proxy hop (ingress + tunnel connector), or the literal "none"
#   hostKeySecret: "srw-ssh-gateway-hostkey"
#   userCaSecret: "srw-ssh-gateway-ca"
#   tcp:
#     enabled: true                    # raw :2222 door via MetalLB
#     allowedClientCIDRs: ["10.0.0.0/8"]
#     externalTrafficPolicy: Local     # required for the CIDR rules to match

# -----------------------------------------------------------------------------
# Session router — Direct Session WebSockets
#
# Generate a strong key with:  openssl rand -hex 32
# Then pass at install time so it never lives in the repo:
#   helm install srw ./helm \
#     --set-string sessionRouter.jwtSecret="$(openssl rand -hex 32)"
# -----------------------------------------------------------------------------
sessionRouter:
  ingressClass: nginx          # match your cluster's controller (Tier-1: traefik)
  ingressHost: ""              # default: api.<global.domain>

  # Layout A — chart renders a standalone Secret. Pass the random value at
  # install time:  --set-string sessionRouter.jwtSecret="$(openssl rand -hex 32)"
  jwtSecret: ""                # REQUIRED for Layout A
  # jwtSecretName: ""          # defaults to <release>-session-jwt
  # jwtSecretKey: "jwt-secret"

  # Layout B — key already lives on an existing Secret (e.g. ESO-synced from
  # Vault, sealed-secrets, etc.). Leave jwtSecret empty so the standalone
  # Secret isn't rendered; point the chart at the existing bundle:
  #   jwtSecret: ""
  #   jwtSecretName: srw                  # the bundle Secret your release already has
  #   jwtSecretKey: SESSION_JWT_SECRET    # the key inside that bundle

  jwtTtlSeconds: 60
  # annotations:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# -----------------------------------------------------------------------------
# Sizing — defaults are dev-friendly. Adjust for production load.
# -----------------------------------------------------------------------------
agent:
  pool:
    minAgents: "2"
    maxAgents: "10"
    reservedSessionSlots: "2"
    reservedJobSlots: "2"

logLevel: "INFO"
# "json" (structured, for log aggregation) or "text" (human-readable).
logFormat: "json"

# -----------------------------------------------------------------------------
# VM Controller — uncomment to run KubeVirt VMs in this cluster instead of a
# separate agent cluster. Requires KubeVirt + CDI installed beforehand and
# nodes with hardware virtualization enabled.
#
# transport=http carries lifecycle (create/delete/query) only — in-VM daemon
# events (heartbeat, freeze/resume) require NATS. Use transport=both with a
# nats.url if you need those signals.
# -----------------------------------------------------------------------------
# vmController:
#   enabled: true
#   transport: http
#   namespace: agent-vms
#   vmStorageClass: longhorn
#   vmDiskSize: 30Gi
#   vmSshPublicKey: "ssh-ed25519 AAAA... agent@srw"
