apiVersion: v2
name: superhuman-remote-worker
description: AI agent orchestration system — Orchestrator, Agents, Cockpit UI
type: application
# Placeholders: a published chart never carries these. CI sets both at
# package time: main.yml releases superhuman-remote-worker with the release
# version as version and appVersion, and develop.yml publishes srw-dev as
# 0.0.<run number> with the commit SHA as appVersion. A local `./helm` install
# keeps them, and no image is tagged v0.0.0-local, so pin
# vmController.defaultVmImage (its default is srw-agent-vm-base:v<appVersion>)
# and the image tags explicitly. See docs/versioning.md.
version: 0.0.0-local
appVersion: "0.0.0-local"
home: https://github.com/superhuman-remote-worker/srw
maintainers:
  - name: superhuman-remote-worker
dependencies:
  - name: collabora-online
    alias: collabora
    version: "1.3.0"
    repository: https://collaboraonline.github.io/online
    condition: collabora.enabled
