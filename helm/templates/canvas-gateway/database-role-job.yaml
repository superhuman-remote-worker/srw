{{- if and .Values.canvas.livePreview.viewer.enabled .Values.canvas.livePreview.viewer.database.provisionRole }}
{{- $database := .Values.canvas.livePreview.viewer.database -}}
{{- $credentials := $database.credentials -}}
{{- $databaseSecretName := include "srw.canvasGatewayDatabaseSecretName" . -}}
{{- $postgresEngine := include "srw.dbEngine" (dict "context" . "db" .Values.databases.postgres) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.fullname" . }}-canvas-gateway-role
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "canvas-gateway-role") | nindent 4 }}
data:
  canvas-viewer-role.sql: |
{{ .Files.Get "files/canvas-viewer-role.sql" | indent 4 }}
  canvas-viewer-role-safety.sql: |
{{ .Files.Get "files/canvas-viewer-role-safety.sql" | indent 4 }}
  canvas-viewer-self-configure.sql: |
{{ .Files.Get "files/canvas-viewer-self-configure.sql" | indent 4 }}
  canvas-viewer-grants.sql: |
{{ .Files.Get "files/canvas-viewer-grants.sql" | indent 4 }}
{{- /*
A regular revision-scoped resource, deliberately not a Helm hook. The gateway
cannot become Ready until these grants exist, while a post-install hook under
`helm --wait` runs only after normal resources are Ready. A hook therefore
creates a fresh-install readiness cycle.

Do not add ttlSecondsAfterFinished. Fleet monitors release.Manifest; deleting
the current Job makes success and failure both look like a missing resource.
The revision suffix avoids immutable Job-field collisions, and Helm removes the
previous revision when the next manifest is applied.

The orchestrator guard keeps a migration-dependent Job out of deliberately
quiesced releases. Unlike the former hook, a mistake here cannot wedge Helm in
pending-upgrade, but a Job that can never observe migrations is still noise.
*/ -}}
{{- if gt (int .Values.orchestrator.replicas) 0 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "srw.fullname" . }}-canvas-gateway-role-{{ .Release.Revision }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "canvas-gateway-role") | nindent 4 }}
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "canvas-gateway-role") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-owner-schema
          image: {{ .Values.databases.postgres.image }}
          command:
            - sh
            - -ec
            - |
              set +x
              error_file=/tmp/canvas-wait-error
              for attempt in $(seq 1 300); do
                if result="$(psql --no-psqlrc --quiet --tuples-only --no-align \
                    --set ON_ERROR_STOP=1 \
                    --command "SELECT to_regclass('public.canvas_origin_sessions') IS NOT NULL AND COUNT(*) = 5{{ if eq $postgresEngine "cnpg" }} AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'srw_canvas_gateway' AND rolcanlogin AND NOT rolsuper AND NOT rolcreaterole AND NOT rolcreatedb AND NOT rolinherit AND NOT rolreplication AND NOT rolbypassrls AND rolconnlimit = -1){{ end }} FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'canvas_view_bootstraps' AND column_name IN ('authorized_at', 'browser_binding_hash', 'challenge_hash', 'exchange_token_hash', 'ready_receipt_hash')" \
                    2>"$error_file")" && [ "$result" = t ]; then
                  exit 0
                fi
                sleep 2
              done
              echo "Canvas database owner, migrated schema, or declarative role was not ready before the provisioning deadline" >&2
              if [ -s "$error_file" ]; then
                echo "Last database error:" >&2
                tail -n 20 "$error_file" >&2
              fi
              exit 1
          env:
            - name: PGHOST
              value: {{ include "srw.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ include "srw.postgresPort" . | quote }}
            - name: PGDATABASE
              value: {{ include "srw.postgresDb" . | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        {{- if ne $postgresEngine "cnpg" }}
        {{- /*
        Only the bundled StatefulSet gets here (an external database is refused
        above). CREATE ROLE and ALTER ROLE ... IN DATABASE need superuser or
        CREATEROLE, and SRW's role has neither there (see _postgres-roles.tpl),
        so this one step logs in as the bootstrap superuser; every other step
        stays the database owner. CREATEROLE for SRW's role instead would let it
        grant itself predefined roles such as pg_execute_server_program on
        PostgreSQL 15.
        */}}
        - name: reconcile-legacy-identity
          image: {{ .Values.databases.postgres.image }}
          command:
            - sh
            - -ec
            - |
              set +x
              if [ "${#CANVAS_VIEWER_POSTGRES_PASSWORD}" -lt 16 ]; then
                echo "Canvas gateway database password must contain at least 16 characters" >&2
                exit 1
              fi
              exec psql --no-psqlrc --quiet --set ON_ERROR_STOP=1 \
                --file /etc/srw-canvas-db/canvas-viewer-role.sql
          env:
            - name: PGHOST
              value: {{ include "srw.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ include "srw.postgresPort" . | quote }}
            - name: PGDATABASE
              value: {{ include "srw.postgresDb" . | quote }}
            - name: PGUSER
              value: {{ include "srw.postgresSuperuser" . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.postgresSuperuserSecretName" . }}
                  key: POSTGRES_SUPERUSER_PASSWORD
            - name: CANVAS_VIEWER_POSTGRES_USER
              value: {{ $database.username | quote }}
            - name: CANVAS_VIEWER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseSecretName }}
                  key: {{ $credentials.passwordKey }}
          volumeMounts:
            - name: role-sql
              mountPath: /etc/srw-canvas-db
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        {{- end }}
        - name: preflight-owner-contract
          image: {{ .Values.databases.postgres.image }}
          command:
            - psql
            - --no-psqlrc
            - --quiet
            - --set
            - ON_ERROR_STOP=1
            - --file
            - /etc/srw-canvas-db/canvas-viewer-role-safety.sql
          env:
            - name: PGHOST
              value: {{ include "srw.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ include "srw.postgresPort" . | quote }}
            - name: PGDATABASE
              value: {{ include "srw.postgresDb" . | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: CANVAS_VIEWER_POSTGRES_USER
              value: {{ $database.username | quote }}
          volumeMounts:
            - name: role-sql
              mountPath: /etc/srw-canvas-db
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: prove-target-password
          image: {{ .Values.databases.postgres.image }}
          command:
            - sh
            - -ec
            - |
              set +x
              error_file=/tmp/canvas-target-error
              for attempt in $(seq 1 150); do
                if psql --no-psqlrc --quiet --set ON_ERROR_STOP=1 \
                    --file /etc/srw-canvas-db/canvas-viewer-self-configure.sql \
                    2>"$error_file"; then
                  exit 0
                fi
                sleep 2
              done
              echo "Canvas restricted login did not accept the expected credential before the provisioning deadline" >&2
              if [ -s "$error_file" ]; then
                echo "Last restricted-login error:" >&2
                tail -n 20 "$error_file" >&2
              fi
              exit 1
          env:
            - name: PGHOST
              value: {{ include "srw.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ include "srw.postgresPort" . | quote }}
            - name: PGDATABASE
              value: {{ include "srw.postgresDb" . | quote }}
            - name: PGUSER
              value: {{ $database.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseSecretName }}
                  key: {{ $credentials.passwordKey }}
            - name: CANVAS_VIEWER_POSTGRES_USER
              value: {{ $database.username | quote }}
          volumeMounts:
            - name: role-sql
              mountPath: /etc/srw-canvas-db
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: reconcile-owner-grants
          image: {{ .Values.databases.postgres.image }}
          command:
            - psql
            - --no-psqlrc
            - --quiet
            - --set
            - ON_ERROR_STOP=1
            - --file
            - /etc/srw-canvas-db/canvas-viewer-grants.sql
          env:
            - name: PGHOST
              value: {{ include "srw.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ include "srw.postgresPort" . | quote }}
            - name: PGDATABASE
              value: {{ include "srw.postgresDb" . | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: CANVAS_VIEWER_POSTGRES_USER
              value: {{ $database.username | quote }}
          volumeMounts:
            - name: role-sql
              mountPath: /etc/srw-canvas-db
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: attest-effective-privileges
          image: {{ include "srw.imageRef" (dict "image" .Values.image.orchestrator) | quote }}
          imagePullPolicy: {{ .Values.image.orchestrator.pullPolicy }}
          command:
            - python
            - -m
            - orchestrator.operator_cli.canvas_viewer_database_attestation
          envFrom:
            - configMapRef:
                name: {{ include "srw.fullname" . }}-canvas-gateway-config
          env:
            - name: CANVAS_VIEWER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseSecretName }}
                  key: {{ $credentials.passwordKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: role-sql
          configMap:
            name: {{ include "srw.fullname" . }}-canvas-gateway-role
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-canvas-gateway-role
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "canvas-gateway-role") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "canvas-gateway-role") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
