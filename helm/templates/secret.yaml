{{- if .Values.secrets.create }}
{{- /*
Chart-managed Secret (dev/testing mode). `APP_ENCRYPTION_KEY` is bootstrapped
here with dual-mode semantics:

  * Fresh install and the key is not in `secrets.values` → generate a new
    32-byte key (base64-encoded) so encryption at rest works out of the box.
  * Upgrade → `lookup` the existing Secret and preserve whatever value is
    already stored. Losing this key makes every row in `user_api_keys`,
    `system_api_keys`, and `llm_endpoints.api_key` unrecoverable, so
    preservation is essential.
  * `secrets.values.APP_ENCRYPTION_KEY` explicitly set by the operator wins.

ESO mode (`externalSecrets.enabled=true`) renders its own Secret via
`templates/external-secret.yaml` — ensure `app_encryption_key` exists in the
Vault path referenced by `externalSecrets.vaultPath`, or the orchestrator
will fail to start.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "srw.secretName" .) }}
{{- $existingKey := "" }}
{{- if and $existing $existing.data (index $existing.data "APP_ENCRYPTION_KEY") }}
{{- $existingKey = index $existing.data "APP_ENCRYPTION_KEY" | b64dec }}
{{- end }}
{{- $userKey := index .Values.secrets.values "APP_ENCRYPTION_KEY" | default "" }}
{{- $appKey := $userKey }}
{{- if not $appKey }}
{{- $appKey = $existingKey }}
{{- end }}
{{- if not $appKey }}
{{- $appKey = randAlphaNum 32 | b64enc }}
{{- end }}
{{- $existingInternalKey := "" }}
{{- if and $existing $existing.data (index $existing.data "MCP_INTERNAL_KEY") }}
{{- $existingInternalKey = index $existing.data "MCP_INTERNAL_KEY" | b64dec }}
{{- end }}
{{- $userInternalKey := index .Values.secrets.values "MCP_INTERNAL_KEY" | default "" }}
{{- $internalKey := $userInternalKey }}
{{- if not $internalKey }}
{{- $internalKey = $existingInternalKey }}
{{- end }}
{{- if not $internalKey }}
{{- $internalKey = randAlphaNum 48 }}
{{- end }}
{{- /*
Root key for per-workspace code-server credentials
(src/orchestrator/services/ide_credentials.py). The IDE proxy derives each
workspace's credential from this key, and the same value was injected into the
Pod at create time — so ROTATING IT 401s every already-running workspace IDE
until its Pod is recreated. Hence the same generate-and-preserve semantics as
the keys above, and hence `helm.sh/resource-policy: keep` below.

Unset means no credential can be derived, which means the browser IDE stays
contained. That is a deliberate fail-closed default, never a fallback to an
unauthenticated code-server.
*/ -}}
{{- $existingIdeKey := "" }}
{{- if and $existing $existing.data (index $existing.data "IDE_CREDENTIAL_KEY") }}
{{- $existingIdeKey = index $existing.data "IDE_CREDENTIAL_KEY" | b64dec }}
{{- end }}
{{- $ideCredentialKey := index .Values.secrets.values "IDE_CREDENTIAL_KEY" | default "" }}
{{- if not $ideCredentialKey }}
{{- $ideCredentialKey = $existingIdeKey }}
{{- end }}
{{- if not $ideCredentialKey }}
{{- $ideCredentialKey = randAlphaNum 48 }}
{{- end }}
{{- /*
Password for the bundled Gitea's metadata Postgres. Same generate-and-preserve
semantics as the keys above: an operator value wins, otherwise the live Secret's
value is kept, otherwise one is generated. Preservation matters — rotating this
silently would leave the `srw-giteadb` volume (whose superuser password is set
once at initdb) unreachable by the Gitea pod.
*/ -}}
{{- $existingGiteaDb := "" }}
{{- if and $existing $existing.data (index $existing.data "GITEA_DB_PASSWORD") }}
{{- $existingGiteaDb = index $existing.data "GITEA_DB_PASSWORD" | b64dec }}
{{- end }}
{{- $giteaDbPassword := index .Values.secrets.values "GITEA_DB_PASSWORD" | default "" }}
{{- if not $giteaDbPassword }}
{{- $giteaDbPassword = $existingGiteaDb }}
{{- end }}
{{- if not $giteaDbPassword }}
{{- $giteaDbPassword = randAlphaNum 32 }}
{{- end }}
{{- /*
Password for the bundled Nextcloud's Postgres, with the same keep-existing
semantics: rotating it would leave `srw-nextclouddb` (password set once at
initdb) unreachable for a new install, and an installed Nextcloud keeps its own
copy in config.php. Generated only while the chart deploys that database, but a
stored value is kept regardless, so turning the database off and on again does
not mint a second password.
*/ -}}
{{- $nextcloudDbPassword := index .Values.secrets.values "NEXTCLOUD_DB_PASSWORD" | default "" }}
{{- if and (not $nextcloudDbPassword) $existing $existing.data (index $existing.data "NEXTCLOUD_DB_PASSWORD") }}
{{- $nextcloudDbPassword = index $existing.data "NEXTCLOUD_DB_PASSWORD" | b64dec }}
{{- end }}
{{- if and (not $nextcloudDbPassword) (include "srw.dbPrereqs" (dict "context" . "key" "nextcloud")) }}
{{- $nextcloudDbPassword = randAlphaNum 32 }}
{{- end }}
{{- /*
The bundled Nextcloud's Valkey password. Valkey keeps nothing, so a rotation
costs only the web sessions, but Apache, cron and Valkey must agree within one
rollout; keep-existing makes every upgrade a no-op. Generated only while
nextcloud.redis.enabled, kept once stored.
*/ -}}
{{- $nextcloudRedisPassword := index .Values.secrets.values "NEXTCLOUD_REDIS_PASSWORD" | default "" }}
{{- if and (not $nextcloudRedisPassword) $existing $existing.data (index $existing.data "NEXTCLOUD_REDIS_PASSWORD") }}
{{- $nextcloudRedisPassword = index $existing.data "NEXTCLOUD_REDIS_PASSWORD" | b64dec }}
{{- end }}
{{- if and (not $nextcloudRedisPassword) (include "srw.nextcloudRedisEnabled" .) }}
{{- $nextcloudRedisPassword = randAlphaNum 32 }}
{{- end }}

{{- /*
Bundled Garage object store credentials. Preserve compatible live values before
generating replacements. Operator-supplied S3 credentials must be complete
pairs and cannot silently rotate an existing valid Garage key. Only emitted
when garage.enabled. GARAGE_RPC_SECRET must be a 32-byte hex string — sha256sum
of a random string gives 64 hex chars.
*/ -}}
{{- $garageKeys := dict }}
{{- if (include "srw.garageEnabled" .) }}
{{- /*
S3 access keys MUST be in Garage's native format so the bootstrap Job's
`key/import` accepts them: access key id = "GK" + 24 hex chars (12 bytes),
secret = 64 hex chars (32 bytes). S3 signature v4 treats these as opaque
strings, so the orchestrator/agent consume them unchanged. GARAGE_RPC_SECRET
is likewise a 32-byte hex string.
*/ -}}
{{- $rpcPattern := "^[0-9A-Fa-f]{64}$" }}
{{- $accessPattern := "^GK[0-9A-Fa-f]{24}$" }}
{{- $secretPattern := "^[0-9A-Fa-f]{64}$" }}

{{- $rpc := index .Values.secrets.values "GARAGE_RPC_SECRET" | default "" }}
{{- if and $rpc (not (regexMatch $rpcPattern $rpc)) }}
{{- fail "secrets.values.GARAGE_RPC_SECRET is not in Garage native format; leave it empty to generate a compatible value" }}
{{- end }}
{{- if and (not $rpc) $existing $existing.data (index $existing.data "GARAGE_RPC_SECRET") }}
{{- $candidate := index $existing.data "GARAGE_RPC_SECRET" | b64dec }}
{{- if regexMatch $rpcPattern $candidate }}{{- $rpc = $candidate }}{{- end }}
{{- end }}
{{- if not $rpc }}{{- $rpc = sha256sum (randAlphaNum 32) }}{{- end }}
{{- $_ := set $garageKeys "GARAGE_RPC_SECRET" $rpc }}

{{- $admin := index .Values.secrets.values "GARAGE_ADMIN_TOKEN" | default "" }}
{{- if and (not $admin) $existing $existing.data (index $existing.data "GARAGE_ADMIN_TOKEN") }}
{{- $admin = index $existing.data "GARAGE_ADMIN_TOKEN" | b64dec }}
{{- end }}
{{- if not $admin }}{{- $admin = randAlphaNum 32 }}{{- end }}
{{- $_ := set $garageKeys "GARAGE_ADMIN_TOKEN" $admin }}

{{- /*
An S3 access ID and secret are one credential. Preserve or regenerate the pair
atomically; mixing one old member with one new member creates a syntactically
valid Secret that Garage can never authenticate.
*/ -}}
{{- $pairs := list
      (dict "id" "SNAPSHOT_S3_ACCESS_KEY_ID" "secret" "SNAPSHOT_S3_SECRET_ACCESS_KEY")
      (dict "id" "VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID" "secret" "VIRTUAL_WORKSPACE_S3_SECRET_ACCESS_KEY") }}
{{- range $pair := $pairs }}
{{- $idKey := index $pair "id" }}
{{- $secretKey := index $pair "secret" }}
{{- $userID := index $.Values.secrets.values $idKey | default "" }}
{{- $userSecret := index $.Values.secrets.values $secretKey | default "" }}
{{- if or (and $userID (not $userSecret)) (and $userSecret (not $userID)) }}
{{- fail (printf "secrets.values.%s and secrets.values.%s must be supplied together or both left empty" $idKey $secretKey) }}
{{- end }}

{{- $existingID := "" }}
{{- $existingSecret := "" }}
{{- if and $existing $existing.data (index $existing.data $idKey) }}
{{- $existingID = index $existing.data $idKey | b64dec }}
{{- end }}
{{- if and $existing $existing.data (index $existing.data $secretKey) }}
{{- $existingSecret = index $existing.data $secretKey | b64dec }}
{{- end }}
{{- if and (regexMatch $accessPattern $existingID) (not (regexMatch $secretPattern $existingSecret)) }}
{{- if not $userID }}
{{- fail (printf "the existing Secret contains a valid Garage access ID in %s but no valid matching %s; recover that exact pair or explicitly revoke the orphaned Garage key before upgrading" $idKey $secretKey) }}
{{- end }}
{{- if ne $userID $existingID }}
{{- fail (printf "secrets.values.%s must keep the existing Garage access ID until its orphaned key is explicitly revoked" $idKey) }}
{{- end }}
{{- end }}

{{- $id := "" }}
{{- $secret := "" }}
{{- if $userID }}
{{- if not (regexMatch $accessPattern $userID) }}
{{- fail (printf "secrets.values.%s is not in Garage native format" $idKey) }}
{{- end }}
{{- if not (regexMatch $secretPattern $userSecret) }}
{{- fail (printf "secrets.values.%s is not in Garage native format" $secretKey) }}
{{- end }}
{{- if and (regexMatch $accessPattern $existingID) (regexMatch $secretPattern $existingSecret) (or (ne $existingID $userID) (ne $existingSecret $userSecret)) }}
{{- fail (printf "secrets.values.%s/%s cannot replace an existing valid Garage credential pair automatically; revoke the old key through an explicit rotation procedure first" $idKey $secretKey) }}
{{- end }}
{{- $id = $userID }}
{{- $secret = $userSecret }}
{{- else if and (regexMatch $accessPattern $existingID) (regexMatch $secretPattern $existingSecret) }}
{{- $id = $existingID }}
{{- $secret = $existingSecret }}
{{- else }}
{{- $id = printf "GK%s" (substr 0 24 (sha256sum (randAlphaNum 32))) }}
{{- $secret = sha256sum (randAlphaNum 32) }}
{{- end }}
{{- $_ := set $garageKeys $idKey $id }}
{{- $_ := set $garageKeys $secretKey $secret }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "srw.secretName" . }}
  labels:
    {{- include "srw.labels" . | nindent 4 }}
  annotations:
    # Chart-managed mode carries the encryption root and Garage credentials.
    # Preserve them across an uninstall/reinstall (including Tilt's custom-
    # deploy Force Update); an explicit namespace/Secret deletion still wipes
    # local state when that is genuinely intended.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  APP_ENCRYPTION_KEY: {{ $appKey | quote }}
  MCP_INTERNAL_KEY: {{ $internalKey | quote }}
  IDE_CREDENTIAL_KEY: {{ $ideCredentialKey | quote }}
  GITEA_DB_PASSWORD: {{ $giteaDbPassword | quote }}
  {{- with $nextcloudDbPassword }}
  NEXTCLOUD_DB_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $nextcloudRedisPassword }}
  NEXTCLOUD_REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := $garageKeys }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.values }}
  {{- if and (ne $key "APP_ENCRYPTION_KEY") (ne $key "MCP_INTERNAL_KEY") (ne $key "IDE_CREDENTIAL_KEY") (ne $key "INFRASTRUCTURE_METERING_INGESTION_KEY") (ne $key "INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY") (ne $key "NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY") (ne $key "GITEA_DB_PASSWORD") (ne $key "NEXTCLOUD_DB_PASSWORD") (ne $key "NEXTCLOUD_REDIS_PASSWORD") (not (hasKey $garageKeys $key)) }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- if and .Values.infrastructureMetering.collectorEnabled (not .Values.infrastructureMetering.ingestionSecretName) }}
{{- /*
The collector request-signing key must not share the application Secret:
dynamic agents consume that bundle and would otherwise be able to forge
inventory. Preserve this dedicated credential across ordinary chart upgrades.
Use a new explicitly managed Secret name for a coordinated rotation.
*/ -}}
{{- $ingestionSecretName := printf "%s-infra-ingestion" (include "srw.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $existingIngestionSecret := lookup "v1" "Secret" .Release.Namespace $ingestionSecretName }}
{{- $existingIngestionKey := "" }}
{{- if and $existingIngestionSecret $existingIngestionSecret.data (index $existingIngestionSecret.data "INFRASTRUCTURE_METERING_INGESTION_KEY") }}
{{- $existingIngestionKey = index $existingIngestionSecret.data "INFRASTRUCTURE_METERING_INGESTION_KEY" | b64dec }}
{{- end }}
{{- $userIngestionKey := index .Values.secrets.values "INFRASTRUCTURE_METERING_INGESTION_KEY" | default "" }}
{{- if and $existingIngestionKey $userIngestionKey (ne $existingIngestionKey $userIngestionKey) }}
{{- fail "the chart-managed infrastructure metering ingestion key cannot be rotated automatically; use a new dedicated ingestionSecretName" }}
{{- end }}
{{- $ingestionKey := $userIngestionKey }}
{{- if not $ingestionKey }}
{{- $ingestionKey = $existingIngestionKey }}
{{- end }}
{{- if not $ingestionKey }}
{{- $ingestionKey = randAlphaNum 48 }}
{{- end }}
{{- if lt (len $ingestionKey) 32 }}
{{- fail "secrets.values.INFRASTRUCTURE_METERING_INGESTION_KEY must be at least 32 bytes" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ingestionSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "infra-collector") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  INFRASTRUCTURE_METERING_INGESTION_KEY: {{ $ingestionKey | quote }}
{{- end }}
{{- if and .Values.secrets.create .Values.infrastructureMetering.pvInventoryEnabled (not .Values.infrastructureMetering.volumeIdentitySecretName) }}
{{- /*
The physical-volume identity key lives in its own Secret so the orchestrator,
agents, and other consumers of the application Secret cannot read it. It must
remain stable across ingestion-key rotations because its HMAC output is the
durable, non-secret identity stored for CSI assets.
*/ -}}
{{- $volumeIdentitySecretName := printf "%s-infra-volume-identity" (include "srw.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $existingVolumeIdentitySecret := lookup "v1" "Secret" .Release.Namespace $volumeIdentitySecretName }}
{{- $existingVolumeIdentityKey := "" }}
{{- if and $existingVolumeIdentitySecret $existingVolumeIdentitySecret.data (index $existingVolumeIdentitySecret.data "INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY") }}
{{- $existingVolumeIdentityKey = index $existingVolumeIdentitySecret.data "INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY" | b64dec }}
{{- end }}
{{- $existingVolumeIdentityKeyVersion := "" }}
{{- if and $existingVolumeIdentitySecret $existingVolumeIdentitySecret.data (index $existingVolumeIdentitySecret.data "INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY_VERSION") }}
{{- $existingVolumeIdentityKeyVersion = index $existingVolumeIdentitySecret.data "INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY_VERSION" | b64dec }}
{{- end }}
{{- $userVolumeIdentityKey := index .Values.secrets.values "INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY" | default "" }}
{{- if and $existingVolumeIdentityKey $userVolumeIdentityKey (ne $existingVolumeIdentityKey $userVolumeIdentityKey) }}
{{- fail "the chart-managed infrastructure metering volume identity key cannot be rotated automatically" }}
{{- end }}
{{- if and $existingVolumeIdentityKeyVersion (ne $existingVolumeIdentityKeyVersion .Values.infrastructureMetering.volumeIdentityKeyVersion) }}
{{- fail "the chart-managed infrastructure metering volume identity key version cannot be changed automatically" }}
{{- end }}
{{- $volumeIdentityKey := $userVolumeIdentityKey }}
{{- if not $volumeIdentityKey }}
{{- $volumeIdentityKey = $existingVolumeIdentityKey }}
{{- end }}
{{- if not $volumeIdentityKey }}
{{- $volumeIdentityKey = randAlphaNum 48 }}
{{- end }}
{{- if lt (len $volumeIdentityKey) 32 }}
{{- fail "secrets.values.INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY must be at least 32 bytes" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $volumeIdentitySecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "infra-collector") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY: {{ $volumeIdentityKey | quote }}
  INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY_VERSION: {{ .Values.infrastructureMetering.volumeIdentityKeyVersion | quote }}
{{- end }}
{{- end }}
