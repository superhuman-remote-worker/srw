{{- if and .Values.keycloak.enabled .Values.keycloak.internal }}
{{- $existingRealm := lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-keycloak-realm" (include "srw.fullname" .)) -}}
{{- $bootstrapUsername := include "srw.keycloakBootstrapAdminUsername" (dict "context" . "existingRealmConfigMap" $existingRealm) -}}
{{- $bootstrapEmailDomain := .Values.global.domain | default "srw.invalid" -}}
{{- $cockpitRedirects := list "http://localhost:4200/*" "http://localhost:4000/*" (printf "%s/*" (include "srw.cockpitUrl" .)) -}}
{{- $cockpitOrigins := list "http://localhost:4200" "http://localhost:4000" (include "srw.cockpitUrl" .) -}}
{{- $bffRedirects := list "http://localhost:8085/auth/callback" (printf "%s/auth/callback" (include "srw.apiUrl" .)) (printf "%s/auth/callback" (include "srw.cockpitUrl" .)) | uniq -}}
{{- $bffOrigins := list (include "srw.apiUrl" .) (include "srw.cockpitUrl" .) | uniq -}}
{{- $gitRedirects := list "http://localhost:3000/user/oauth2/Keycloak/callback" (printf "%s/user/oauth2/Keycloak/callback" (include "srw.gitUrl" .)) -}}
{{- $gitOrigins := list "http://localhost:3000" (include "srw.gitUrl" .) -}}
{{- $cloudRedirects := list "http://localhost:8800/apps/user_oidc/code" (printf "%s/apps/user_oidc/code" (include "srw.cloudUrl" .)) -}}
{{- $cloudOrigins := list "http://localhost:8800" (include "srw.cloudUrl" .) -}}
{{- if include "srw.singleOrigin" . -}}
{{- $origin := include "srw.publicOrigin" . -}}
{{- $cockpitRedirects = list (printf "%s/*" $origin) -}}
{{- $cockpitOrigins = list $origin -}}
{{- $bffRedirects = list (printf "%s/auth/callback" $origin) -}}
{{- $bffOrigins = list $origin -}}
{{- $gitRedirects = list (printf "%s/git/user/oauth2/Keycloak/callback" $origin) -}}
{{- $gitOrigins = list $origin -}}
{{- $cloudRedirects = list (printf "%s/cloud/apps/user_oidc/code" $origin) -}}
{{- $cloudOrigins = list $origin -}}
{{- end -}}
# Keycloak SSO — Identity provider for all SRW services
#
# Secrets injected via env vars (Vault/ESO/manual → secret):
#   GITEA_OIDC_CLIENT_SECRET, OPENCLOUD_KEYCLOAK_CLIENT_SECRET,
#   PGADMIN_OIDC_CLIENT_SECRET, MCP_OIDC_CLIENT_SECRET,
#   KC_REALM_ADMIN_PASSWORD, SMTP_PASSWORD
#   (NEXTCLOUD_OIDC_CLIENT_SECRET only when .Values.nextcloud.enabled)
#
# The realm-export JSON uses ${VAR} placeholders — Keycloak resolves them
# from the container's environment at realm import time.
#
# IMPORTANT: Use plain ${VAR}, NOT the legacy $[env.VAR] style (write it out,
# do not use the bracket form here). The env.-prefix syntax is Keycloak ≤24
# and silently fails to substitute in 25+ for client secrets and user
# credentials — the literal placeholder string becomes the stored credential,
# causing invalid_client_credentials errors.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.fullname" . }}-keycloak-realm
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
data:
  srw-realm.json: |
    {
      "realm": {{ .Values.keycloak.realm | quote }},
      "enabled": true,
      "displayName": "Superhuman Remote Worker",
      "displayNameHtml": "<div class=\"kc-logo-text\"><span>Superhuman Remote Worker</span></div>",
      "registrationAllowed": true,
      "registrationEmailAsUsername": false,
      "verifyEmail": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      {{- /* TLS terminates at the ingress, so "all" would reject in-cluster
           plaintext traffic. "external" is Keycloak's own default: HTTPS
           required for external addresses, plaintext from private IPs. */}}
      "sslRequired": "external",
      "passwordPolicy": "length(16) and notUsername(undefined)",
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "rememberMe": {{ .Values.keycloak.session.rememberMe }},
      "ssoSessionIdleTimeout": {{ .Values.keycloak.session.ssoSessionIdleTimeout }},
      "ssoSessionMaxLifespan": {{ .Values.keycloak.session.ssoSessionMaxLifespan }},
      "ssoSessionIdleTimeoutRememberMe": {{ .Values.keycloak.session.ssoSessionIdleTimeoutRememberMe }},
      "ssoSessionMaxLifespanRememberMe": {{ .Values.keycloak.session.ssoSessionMaxLifespanRememberMe }},
      "accessTokenLifespan": {{ .Values.keycloak.session.accessTokenLifespan }},
      "offlineSessionIdleTimeout": {{ .Values.keycloak.session.offlineSessionIdleTimeout }},
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Full system access, user management",
            "composite": false
          },
          {
            "name": "user",
            "description": "Standard access to cockpit, Gitea repos, own project files",
            "composite": false
          },
          {
            "name": "viewer",
            "description": "Read-only access for stakeholder dashboards",
            "composite": false
          }
        ]
      },
      "clients": [
        {
          "clientId": "cockpit",
          "name": "SRW Cockpit",
          "description": "Angular frontend (SPA, public client with PKCE)",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": {{ $cockpitRedirects | toJson }},
          "webOrigins": {{ $cockpitOrigins | toJson }},
          "protocol": "openid-connect",
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "http://localhost:4200/*##http://localhost:4000/*##{{ include "srw.cockpitUrl" . }}/*"
          },
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ],
          "optionalClientScopes": [
            "offline_access"
          ],
          "protocolMappers": [
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "config": {
                "introspection.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "orchestrator-api",
          "name": "SRW Orchestrator API",
          "description": "FastAPI backend — validates tokens, never initiates login",
          "enabled": true,
          "bearerOnly": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ]
        },
        {
          "clientId": "cockpit-bff",
          "name": "SRW Cockpit BFF",
          "description": "Confidential client for the orchestrator's cookie BFF (knowledge-base/knowledge/features/auth_bff_and_api_tokens.md). Distinct from the cockpit SPA's public client — same realm + same user identity, different auth model.",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${KC_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "redirectUris": {{ $bffRedirects | toJson }},
          "webOrigins": {{ $bffOrigins | toJson }},
          "attributes": {
            "post.logout.redirect.uris": "{{ include "srw.cockpitUrl" . }}/*##{{ include "srw.apiUrl" . }}/*",
            "backchannel.logout.url": "{{ include "srw.orchestratorInternalUrl" . }}/auth/backchannel-logout",
            "backchannel.logout.session.required": "true",
            "backchannel.logout.revoke.offline.tokens": "false"
          },
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ],
          "optionalClientScopes": [
            "offline_access"
          ],
          "protocolMappers": [
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "config": {
                "introspection.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "gitea",
          "name": "Gitea",
          "description": "Git repository service (confidential client)",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "secret": "${GITEA_OIDC_CLIENT_SECRET}",
          "redirectUris": {{ $gitRedirects | toJson }},
          "webOrigins": {{ $gitOrigins | toJson }},
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "email",
            "groups"
          ],
          "protocolMappers": [
            {
              "name": "gitea-username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "given-name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "firstName",
                "claim.name": "given_name",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "family-name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "lastName",
                "claim.name": "family_name",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            }
          ]
        }
        {{- if .Values.nextcloud.enabled }}
        ,{
          "clientId": "nextcloud",
          "name": "Nextcloud",
          "description": "Cloud storage",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "secret": "${NEXTCLOUD_OIDC_CLIENT_SECRET}",
          "redirectUris": {{ $cloudRedirects | toJson }},
          "webOrigins": {{ $cloudOrigins | toJson }},
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "groups"
          ]
        }
        {{- end }}
        {{- if .Values.pgadmin.enabled }}
        ,{
          "clientId": "pgadmin",
          "name": "pgAdmin",
          "description": "Database administration UI (optional)",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "secret": "${PGADMIN_OIDC_CLIENT_SECRET}",
          "redirectUris": [
            "http://localhost:5050/oauth2/authorize",
            "https://{{ include "srw.pgadminHost" . }}/oauth2/authorize"
          ],
          "webOrigins": [
            "http://localhost:5050",
            "https://{{ include "srw.pgadminHost" . }}"
          ],
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "profile",
            "email"
          ]
        }
        {{- end }}
        {{- if .Values.mcp.enabled }}
        ,{
          "clientId": "mcp-server",
          "name": "MCP OAuth Bridge",
          "description": "MCP server OAuth proxy — enables Claude.ai, ChatGPT, and other OAuth-based AI platforms to connect via OIDC",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "secret": "${MCP_OIDC_CLIENT_SECRET}",
          "redirectUris": [
            "http://localhost:8055/auth/callback",
            "{{ include "srw.mcpUrl" . }}/auth/callback"
          ],
          "webOrigins": [
            "http://localhost:8055",
            "{{ include "srw.mcpUrl" . }}"
          ],
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ]
        }
        {{- end }}
      ],
      "users": [
        {
          "username": {{ $bootstrapUsername | toJson }},
          "email": {{ printf "admin@%s" $bootstrapEmailDomain | quote }},
          "emailVerified": true,
          "enabled": true,
          "firstName": "Test",
          "lastName": "User",
          "attributes": {
            "gitea_username": ["srw-admin"]
          },
          "realmRoles": [
            "admin",
            "user",
            "default-roles-{{ .Values.keycloak.realm }}"
          ],
          "credentials": [
            {
              "type": "password",
              "value": "${KC_REALM_ADMIN_PASSWORD}",
              "temporary": false
            }
          ]
        }
        {{- if .Values.keycloak.devUsers.enabled }}
        {{- range .Values.keycloak.devUsers.users }},
        {
          "username": {{ .username | quote }},
          "email": {{ printf "%s@%s" .username $bootstrapEmailDomain | quote }},
          "emailVerified": true,
          "enabled": true,
          "realmRoles": [
            {{- if .admin }}
            "admin",
            {{- end }}
            "user",
            "default-roles-{{ $.Values.keycloak.realm }}"
          ],
          "credentials": [
            {
              "type": "password",
              "value": {{ .password | quote }},
              "temporary": false
            }
          ]
        }
        {{- end }}
        {{- end }}
      ],
      "scopeMappings": [
        {
          "clientScope": "roles",
          "roles": [
            "admin",
            "user",
            "viewer"
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "email",
          "protocol": "openid-connect",
          "description": "OpenID Connect built-in scope: email",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true",
            "consent.screen.text": "Your email address"
          },
          "protocolMappers": [
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "email",
                "claim.name": "email",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "email verified",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "emailVerified",
                "claim.name": "email_verified",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "boolean"
              }
            }
          ]
        },
        {
          "name": "roles",
          "protocol": "openid-connect",
          "description": "Realm and client role mappings",
          "attributes": {
            "include.in.token.scope": "false",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "realm roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "multivalued": "true",
                "claim.name": "realm_access.roles",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "client roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-client-role-mapper",
              "config": {
                "multivalued": "true",
                "claim.name": "resource_access.${client_id}.roles",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            }
          ]
        },
        {
          "name": "groups",
          "protocol": "openid-connect",
          "description": "User group memberships for project access control",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true",
            "consent.screen.text": "Your group memberships"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        },
        {
          "name": "profile",
          "protocol": "openid-connect",
          "description": "OpenID Connect built-in scope: profile",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true",
            "consent.screen.text": "User profile information"
          },
          "protocolMappers": [
            {
              "name": "full name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-full-name-mapper",
              "config": {
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "given name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "firstName",
                "claim.name": "given_name",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "family name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "lastName",
                "claim.name": "family_name",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            }
          ]
        }
      ],
      "internationalizationEnabled": false,
      "loginTheme": "srw",
      "emailTheme": "srw",
      "accountTheme": "keycloak.v3"
    }
---
# Keycloak SSO — Deployment
#
# The 'keycloak' database is created by the postgres container's postStart
# lifecycle hook on every start (idempotent).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-keycloak
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.keycloak.replicas }}
  {{- if include "srw.singleOrigin" . }}
  # A mixed set of old/new public issuers can poison Gitea's discovery cache.
  # This evaluation profile accepts auth downtime during identity upgrades.
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Theme edits are invisible without a pod roll: Keycloak caches the
        # resolved theme, the compiled FreeMarker templates, AND gzipped static
        # resources -- the last only regenerates when the .gz is absent, so
        # browsers get stale CSS while curl looks fine. /opt/keycloak/data is an
        # emptyDir here, so a roll clears it.
        checksum/keycloak-theme: {{ include (print $.Template.BasePath "/services/keycloak-theme-configmap.yaml") . | sha256sum | quote }}
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "keycloak") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.databases.keycloak.internal }}
        - name: wait-for-keycloakdb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.keycloakDbHost" . }} 5432; do sleep 2; done"]
        {{- end }}
        {{- if .Values.keycloak.bridgeCert.enabled }}
        - name: extract-bridge-cert
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              apk add --no-cache openssl >/dev/null 2>&1
              echo "Waiting for ProtonMail Bridge SMTP..."
              for i in $(seq 1 30); do
                if echo | openssl s_client -starttls smtp \
                    -connect {{ .Values.keycloak.bridgeCert.smtpHost }}:1025 \
                    2>/dev/null | openssl x509 -outform PEM \
                    > /certs/bridge-cert.pem 2>/dev/null \
                  && [ -s /certs/bridge-cert.pem ]; then
                  echo "Bridge cert extracted."
                  exit 0
                fi
                sleep 2
              done
              echo "WARNING: Could not extract bridge cert — SMTP STARTTLS may fail."
          volumeMounts:
            - name: bridge-cert
              mountPath: /certs
        - name: import-bridge-cert
          image: {{ .Values.keycloak.image }}
          command:
            - sh
            - -c
            - |
              cp /etc/pki/java/cacerts /certs/cacerts && chmod 644 /certs/cacerts
              if [ -s /certs/bridge-cert.pem ]; then
                keytool -importcert -noprompt -alias protonmail-bridge \
                  -file /certs/bridge-cert.pem -keystore /certs/cacerts \
                  -storepass changeit
                echo "Bridge cert imported into JVM truststore."
              else
                echo "No bridge cert found, using default truststore."
              fi
          volumeMounts:
            - name: bridge-cert
              mountPath: /certs
        {{- end }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args:
            # Production mode. `start-dev` was a multi-replica dead end: it
            # pins `cache=local` (every pod an island — sessions bound to
            # whichever pod served them) and `hostname-strict=false`, both
            # from dev-mode classpath defaults rather than anything we set.
            #
            # `start` gives `cache=ispn` with the `jdbc-ping` discovery stack
            # by default, which finds peers through the Keycloak database we
            # already run — no headless Service, no DNS_PING, no new infra.
            # Together with persistent user sessions (stored in the DB by
            # default since KC 26.0) that makes keycloak.replicas > 1 safe.
            #
            # Everything production mode demands is already set below:
            # KC_HOSTNAME (required once hostname-strict defaults to true),
            # KC_HTTP_ENABLED (TLS terminates at the ingress), KC_PROXY_HEADERS,
            # and a real database. Note `--features` is a build-time option, so
            # the first start after this change re-augments the image and takes
            # noticeably longer — the startupProbe allows 300s.
            - start
            - --import-realm
            - --health-enabled=true
            - --tls-hostname-verifier=ANY
            # Legacy V1 token-exchange enabled so the ``requested_subject``
            # impersonation parameter works (RFC 8693 standard V2 mode
            # rejects it). Required by Phase 2.1 of
            # knowledge-base/knowledge/features/cloud_collaboration_model.md §9 so the agent
            # can mint user-scoped WebDAV tokens for default-project
            # (user-home) mounts on OpenCloud Personal Spaces.
            # The feature is called ``token-exchange`` in Keycloak 26.2;
            # ``token-exchange-standard`` is the V2 form (default-on; we
            # don't need to add it).
            - --features=token-exchange
          ports:
            - containerPort: 8080
          env:
            # Database
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: {{ include "srw.keycloakDbJdbcUrl" . | quote }}
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KC_DB_PASSWORD
            # Hostname — must match what the browser sees
            - name: KC_HOSTNAME
              value: {{ include "srw.authUrl" . | quote }}
            {{- if include "srw.singleOrigin" . }}
            - name: KC_HTTP_RELATIVE_PATH
              value: "/identity"
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: "/"
            {{- end }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            {{- if .Values.keycloak.bridgeCert.enabled }}
            # Trust ProtonMail Bridge self-signed cert for SMTP STARTTLS.
            # KC_TRUSTSTORE_PATHS only applies to Quarkus HTTP clients, not Jakarta Mail.
            # We override the JVM truststore with a copy that includes the bridge cert.
            # --tls-hostname-verifier=ANY makes DefaultEmailSenderProvider set
            # mail.smtp.ssl.checkserveridentity=false (fix from keycloak#28095),
            # so the cert CN=127.0.0.1 vs service hostname mismatch is ignored.
            - name: JAVA_OPTS_APPEND
              value: "-Djavax.net.ssl.trustStore=/opt/keycloak/certs/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
            {{- end }}
            # Admin credentials (Keycloak server admin)
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KEYCLOAK_ADMIN_USER
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KEYCLOAK_ADMIN_PASSWORD
            # Realm import secrets — referenced as ${VAR} in realm JSON and
            # resolved by Keycloak at import time from these env vars.
            - name: KC_REALM_ADMIN_USERNAME
              value: {{ $bootstrapUsername | quote }}
            - name: KC_REALM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KC_REALM_ADMIN_PASSWORD
            - name: GITEA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: GITEA_OIDC_CLIENT_SECRET
            {{- if .Values.nextcloud.enabled }}
            - name: NEXTCLOUD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEXTCLOUD_OIDC_CLIENT_SECRET
            {{- end }}
            {{- if .Values.pgadmin.enabled }}
            - name: PGADMIN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: PGADMIN_OIDC_CLIENT_SECRET
            {{- end }}
            {{- if .Values.opencloud.enabled }}
            - name: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
                  optional: true
            - name: OPENCLOUD_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_PUBLIC_URL
                  optional: true
            {{- end }}
            {{- if .Values.mcp.enabled }}
            - name: MCP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: MCP_OIDC_CLIENT_SECRET
                  optional: true
            {{- end }}
            # Cockpit BFF — flips the cockpit client from public-PKCE to
            # confidential when a value is present. Absence keeps the
            # client public (pre-BFF behavior). See
            # knowledge-base/knowledge/features/auth_bff_and_api_tokens.md.
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KC_CLIENT_SECRET
                  optional: true
            - name: COCKPIT_CLIENT_ID
              value: {{ .Values.keycloak.cockpitClientId | quote }}
            - name: BFF_CLIENT_ID
              value: {{ .Values.auth.bff.clientId | quote }}
            - name: API_URL
              value: {{ include "srw.apiUrl" . | quote }}
            - name: COCKPIT_URL
              value: {{ include "srw.cockpitUrl" . | quote }}
            # Internal Service URL — used for backchannel-logout callbacks
            # the Keycloak pod fires itself. Routing via the public ingress
            # fails in any cluster where the pod can't resolve the public
            # hostname (split-DNS, k3d's `localhost` loopback hijack); also
            # cheaper and avoids re-traversing TLS for a server→server hop.
            - name: ORCHESTRATOR_INTERNAL_URL
              value: {{ include "srw.orchestratorInternalUrl" . | quote }}
            {{- if .Values.email.enabled }}
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_HOST
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SMTP_PASSWORD
            {{- end }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Sync OIDC client config from env vars into Keycloak DB.
                    # Realm import only runs on FIRST boot (empty DB). On every
                    # subsequent pod start the realm already exists, so any
                    # secret rotation in Vault/ESO must be propagated via
                    # kcadm here. The hook also ensures the OpenCloud client
                    # set + groups exist (idempotent).
                    KC="/opt/keycloak/bin/kcadm.sh"
                    until (echo > /dev/tcp/localhost/9000) 2>/dev/null; do sleep 3; done
                    $KC config credentials --server http://localhost:8080{{ if include "srw.singleOrigin" . }}/identity{{ end }} \
                      --realm master --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null || exit 0
                    # --- Set realm admin password ---
                    # Realm import does resolve ${KC_REALM_ADMIN_PASSWORD} on
                    # first boot (verified on Keycloak 26.2), but we still
                    # force-set on every start so Vault-rotated admin
                    # passwords propagate without requiring a DB wipe.
                    $KC set-password -r {{ .Values.keycloak.realm }} --username "$KC_REALM_ADMIN_USERNAME" --new-password "$KC_REALM_ADMIN_PASSWORD" 2>/dev/null
                    # --- Sync client secrets ---
                    # cockpit-bff is included so secret rotations in Vault
                    # propagate to KC on the next pod restart. The other
                    # entries pre-date the BFF and follow the same pattern.
                    for pair in "gitea:$GITEA_OIDC_CLIENT_SECRET" \
                                {{- if .Values.nextcloud.enabled }}
                                "nextcloud:$NEXTCLOUD_OIDC_CLIENT_SECRET" \
                                {{- end }}
                                {{- if .Values.opencloud.enabled }}
                                "opencloud-orchestrator:$OPENCLOUD_KEYCLOAK_CLIENT_SECRET" \
                                {{- end }}
                                {{- if .Values.pgadmin.enabled }}
                                "pgadmin:$PGADMIN_OIDC_CLIENT_SECRET" \
                                {{- end }}
                                {{- if .Values.mcp.enabled }}
                                "mcp-server:$MCP_OIDC_CLIENT_SECRET" \
                                {{- end }}
                                "${BFF_CLIENT_ID:-cockpit-bff}:$KC_CLIENT_SECRET"; do
                      CID="${pair%%:*}"; SEC="${pair#*:}"
                      [ -z "$SEC" ] && continue
                      ID=$($KC get clients -r {{ .Values.keycloak.realm }} -q "clientId=$CID" --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      [ -z "$ID" ] && continue
                      $KC update "clients/$ID" -r {{ .Values.keycloak.realm }} -s "secret=$SEC" 2>/dev/null
                    done
                    # --- Enforce cockpit client = public-PKCE ---
                    # Self-heal for clusters where someone manually flipped
                    # the cockpit client to confidential in the KC admin UI
                    # (a tempting wrong turn before cockpit-bff existed). The
                    # cockpit SPA does PKCE-only token exchange and cannot
                    # supply a client_secret, so confidential cockpit silently
                    # breaks SPA login. cockpit-bff carries the BFF identity.
                    if [ -n "$COCKPIT_CLIENT_ID" ]; then
                      COCKID=$($KC get clients -r {{ .Values.keycloak.realm }} -q "clientId=$COCKPIT_CLIENT_ID" --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      if [ -n "$COCKID" ]; then
                        $KC update "clients/$COCKID" -r {{ .Values.keycloak.realm }} \
                          -s 'redirectUris={{ $cockpitRedirects | toJson }}' \
                          -s 'webOrigins={{ $cockpitOrigins | toJson }}' \
                          -s "publicClient=true" \
                          -s "clientAuthenticatorType=client-secret" 2>/dev/null \
                          || echo "WARN: kcadm cockpit public-flip failed"
                      fi
                    fi
                    # --- Ensure cockpit-bff confidential client exists ---
                    # Realm-import creates it on fresh installs (line ~117 of
                    # this file). For existing realms that pre-date the BFF,
                    # we create-if-missing here. The "Sync client secrets"
                    # loop above already keeps the secret rotated.
                    if [ -n "$KC_CLIENT_SECRET" ] && [ -n "$API_URL" ]; then
                      BFF_CID="${BFF_CLIENT_ID:-cockpit-bff}"
                      BFFID=$($KC get clients -r {{ .Values.keycloak.realm }} -q "clientId=$BFF_CID" --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      if [ -z "$BFFID" ]; then
                        $KC create clients -r {{ .Values.keycloak.realm }} \
                          -s "clientId=$BFF_CID" \
                          -s "name=SRW Cockpit BFF" \
                          -s "enabled=true" \
                          -s "publicClient=false" \
                          -s "clientAuthenticatorType=client-secret" \
                          -s "secret=$KC_CLIENT_SECRET" \
                          -s "standardFlowEnabled=true" \
                          -s "directAccessGrantsEnabled=false" \
                          -s "serviceAccountsEnabled=false" \
                          -s 'redirectUris={{ $bffRedirects | toJson }}' \
                          -s 'webOrigins={{ $bffOrigins | toJson }}' \
                          -s "attributes.\"backchannel.logout.url\"=$ORCHESTRATOR_INTERNAL_URL/auth/backchannel-logout" \
                          -s "attributes.\"backchannel.logout.session.required\"=true" \
                          -s "attributes.\"backchannel.logout.revoke.offline.tokens\"=false" 2>/dev/null \
                          || echo "WARN: kcadm cockpit-bff create failed"
                        BFFID=$($KC get clients -r {{ .Values.keycloak.realm }} -q "clientId=$BFF_CID" --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      else
                        # Always re-assert the redirect URI + backchannel
                        # logout URL — a Vault-domain change or chart bump
                        # needs to propagate without manual UI clicks.
                        $KC update "clients/$BFFID" -r {{ .Values.keycloak.realm }} \
                          -s "publicClient=false" \
                          -s "clientAuthenticatorType=client-secret" \
                          -s 'redirectUris={{ $bffRedirects | toJson }}' \
                          -s 'webOrigins={{ $bffOrigins | toJson }}' \
                          -s "attributes.\"backchannel.logout.url\"=$ORCHESTRATOR_INTERNAL_URL/auth/backchannel-logout" \
                          -s "attributes.\"backchannel.logout.session.required\"=true" 2>/dev/null \
                          || echo "WARN: kcadm cockpit-bff update failed"
                      fi
                      # Attach default client scopes. kcadm `create clients`
                      # does NOT resolve scope names to IDs — they have to be
                      # PUT individually via /default-client-scopes/{id}.
                      # Idempotent: re-PUT on an already-attached scope is a
                      # no-op. profile + email power the email/preferred_username
                      # claims the orchestrator's JIT provisioning reads; roles
                      # carries realm_access.roles (is_approved derivation).
                      if [ -n "$BFFID" ]; then
                        for SC in profile email roles; do
                          SCID=$($KC get client-scopes -r {{ .Values.keycloak.realm }} -q "name=$SC" --fields id --format csv --noquotes 2>/dev/null | tail -1)
                          [ -z "$SCID" ] && continue
                          $KC update "clients/$BFFID/default-client-scopes/$SCID" -r {{ .Values.keycloak.realm }} 2>/dev/null \
                            || echo "WARN: kcadm cockpit-bff scope=$SC attach failed"
                        done
                      fi
                    fi
                    # --- Sync SMTP config ---
                    # Sole source of truth for SMTP — realm-import JSON
                    # deliberately omits smtpServer because the import-time
                    # cached RealmRepresentation stays stale even after a
                    # later kcadm update (keycloak#15428), which left the
                    # in-memory password broken until someone clicked Save
                    # in the admin UI. By only writing here AND flushing
                    # the realm cache after, the very first value Keycloak
                    # caches is the correct one — and Vault rotations on
                    # later boots are picked up immediately, no UI dance.
                    # KNOWINGLY UNHARDENED: the three interpolations below —
                    # .Values.keycloak.realm here, and .Values.email.smtp.from
                    # twice — land raw inside this double-quoted shell word, so
                    # a value carrying a double quote closes it and appends a
                    # command. Verified live:
                    #   --set-string 'email.smtp.from=a"; id; echo "'
                    # port and starttls are safe because they go through
                    # srw.keycloak.smtpPort / smtpStartTls, whose output
                    # alphabet is closed; see helm/templates/_helpers.tpl for
                    # the whitelist pattern these fields should adopt. Both
                    # values are chart-owned (not user input), which is why
                    # this is a pre-existing hardening item and not a live
                    # vulnerability — do not read the helpers' comment as a
                    # claim that the whole hook is covered.
                    if [ -n "$SMTP_HOST" ]; then
                      $KC update "realms/{{ .Values.keycloak.realm }}" \
                        -s "smtpServer.host=$SMTP_HOST" \
                        -s "smtpServer.port={{ include "srw.keycloak.smtpPort" . }}" \
                        -s "smtpServer.from={{ .Values.email.smtp.from | default (printf "noreply@%s" .Values.global.domain) }}" \
                        -s "smtpServer.fromDisplayName=Superhuman Remote Worker" \
                        -s "smtpServer.envelopeFrom={{ .Values.email.smtp.from | default (printf "noreply@%s" .Values.global.domain) }}" \
                        -s "smtpServer.ssl=false" \
                        -s "smtpServer.starttls={{ include "srw.keycloak.smtpStartTls" . }}" \
                        -s "smtpServer.auth=true" \
                        -s "smtpServer.authType=basic" \
                        -s "smtpServer.user=$SMTP_USER" \
                        -s "smtpServer.password=$SMTP_PASSWORD" || \
                        echo "WARN: kcadm smtpServer update failed"
                      $KC create "realms/{{ .Values.keycloak.realm }}/clear-realm-cache" 2>&1 || \
                        echo "WARN: kcadm clear-realm-cache failed"
                    fi
                    # --- Sync session/token lifespans ---
                    # Same self-heal pattern as SMTP: realm-import only seeds
                    # these on first boot, so existing deployments would keep
                    # Keycloak's 30-min default idle timeout forever. Force
                    # them on every start so values.yaml is the source of truth.
                    $KC update "realms/{{ .Values.keycloak.realm }}" \
                      -s "rememberMe={{ .Values.keycloak.session.rememberMe }}" \
                      -s "ssoSessionIdleTimeout={{ .Values.keycloak.session.ssoSessionIdleTimeout }}" \
                      -s "ssoSessionMaxLifespan={{ .Values.keycloak.session.ssoSessionMaxLifespan }}" \
                      -s "ssoSessionIdleTimeoutRememberMe={{ .Values.keycloak.session.ssoSessionIdleTimeoutRememberMe }}" \
                      -s "ssoSessionMaxLifespanRememberMe={{ .Values.keycloak.session.ssoSessionMaxLifespanRememberMe }}" \
                      -s "accessTokenLifespan={{ .Values.keycloak.session.accessTokenLifespan }}" \
                      -s "offlineSessionIdleTimeout={{ .Values.keycloak.session.offlineSessionIdleTimeout }}" \
                      -s "sslRequired=external" \
                      -s "passwordPolicy=length(16) and notUsername(undefined)" 2>/dev/null
                    {{- if .Values.opencloud.enabled }}
                    # --- Ensure OpenCloud clients + group ---
                    # Idempotent: creates only if missing.
                    # Helm-gated on opencloud.enabled: the runtime `-n` guard alone was
                    # not enough, because OPENCLOUD_KEYCLOAK_CLIENT_SECRET outlives the
                    # backend in Vault. A cluster migrated off OpenCloud would otherwise
                    # keep re-creating the five OpenCloud clients — and re-registering
                    # opencloudUser as a realm DEFAULT group, so every new user kept
                    # joining it — on every Keycloak pod restart.
                    if [ -n "$OPENCLOUD_KEYCLOAK_CLIENT_SECRET" ]; then
                      OC_URL="${OPENCLOUD_PUBLIC_URL:-{{ include "srw.cloudUrl" . }}}"
                      # opencloudAdmin group (role mapping for OpenCloud admin access)
                      OCGRP=$($KC get groups -r {{ .Values.keycloak.realm }} -q search=opencloudAdmin --fields id,name 2>/dev/null \
                        | grep -B1 '"opencloudAdmin"' | grep '"id"' | sed 's/.*"id" : "//;s/".*//' || true)
                      [ -z "$OCGRP" ] && OCGRP=$($KC create groups -r {{ .Values.keycloak.realm }} -s name=opencloudAdmin -i 2>/dev/null)
                      # opencloudUser group (default role for all SSO users)
                      OCUGRP=$($KC get groups -r {{ .Values.keycloak.realm }} -q search=opencloudUser --fields id,name 2>/dev/null \
                        | grep -B1 '"opencloudUser"' | grep '"id"' | sed 's/.*"id" : "//;s/".*//' || true)
                      [ -z "$OCUGRP" ] && OCUGRP=$($KC create groups -r {{ .Values.keycloak.realm }} -s name=opencloudUser -i 2>/dev/null)
                      # Make opencloudUser a realm default group — auto-assigned to new users
                      [ -n "$OCUGRP" ] && $KC update "realms/{{ .Values.keycloak.realm }}/default-groups/$OCUGRP" -r {{ .Values.keycloak.realm }} 2>/dev/null
                      # Add existing realm users (non-service-accounts) to opencloudUser
                      for OCUID in $($KC get users -r {{ .Values.keycloak.realm }} --fields id --format csv --noquotes 2>/dev/null); do
                        [ -z "$OCUID" ] && continue
                        $KC update "users/$OCUID/groups/$OCUGRP" -r {{ .Values.keycloak.realm }} \
                          -s realm={{ .Values.keycloak.realm }} -s userId="$OCUID" -s groupId="$OCUGRP" -n 2>/dev/null || true
                      done
                      # Add realm admin to opencloudAdmin
                      ADMIN_UID=$($KC get users -r {{ .Values.keycloak.realm }} -q "username=$KC_REALM_ADMIN_USERNAME" -q exact=true --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      [ -n "$ADMIN_UID" ] && [ -n "$OCGRP" ] && \
                        $KC update "users/$ADMIN_UID/groups/$OCGRP" -r {{ .Values.keycloak.realm }} \
                          -s realm={{ .Values.keycloak.realm }} -s userId="$ADMIN_UID" -s groupId="$OCGRP" -n 2>/dev/null
                      # opencloud-web (public client — browser OIDC login)
                      if ! $KC get clients -r {{ .Values.keycloak.realm }} -q clientId=opencloud-web 2>/dev/null | grep -q '"opencloud-web"'; then
                        $KC create clients -r {{ .Values.keycloak.realm }} \
                          -s clientId=opencloud-web -s name="OpenCloud Web" \
                          -s enabled=true -s publicClient=true -s standardFlowEnabled=true \
                          -s "redirectUris=[\"$OC_URL/*\"]" -s "webOrigins=[\"$OC_URL\"]" \
                          -s 'attributes={"pkce.code.challenge.method":"S256"}' 2>/dev/null
                      fi
                      # Re-assert redirect URI + web origin on every start so a
                      # domain flip (OPENCLOUD_PUBLIC_URL / cloudUrl change) propagates
                      # to an existing client without a DB wipe — the create above
                      # only fires when missing. Same self-heal as gitea/cockpit-bff.
                      OWID=$($KC get clients -r {{ .Values.keycloak.realm }} -q clientId=opencloud-web --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      if [ -n "$OWID" ]; then
                        $KC update "clients/$OWID" -r {{ .Values.keycloak.realm }} \
                          -s "redirectUris=[\"$OC_URL/*\"]" -s "webOrigins=[\"$OC_URL\"]" 2>/dev/null \
                          || echo "WARN: kcadm opencloud-web redirectUris re-assert failed"
                      fi
                      # OpenCloud Desktop sync client (public, localhost OAuth redirect)
                      if ! $KC get clients -r {{ .Values.keycloak.realm }} -q clientId=OpenCloudDesktop 2>/dev/null | grep -q '"OpenCloudDesktop"'; then
                        $KC create clients -r {{ .Values.keycloak.realm }} \
                          -s clientId=OpenCloudDesktop -s name="OpenCloud Desktop" \
                          -s enabled=true -s publicClient=true -s standardFlowEnabled=true \
                          -s 'redirectUris=["http://localhost:*","http://127.0.0.1:*"]' 2>/dev/null
                      fi
                      # Legacy ownCloud-branded desktop client
                      if ! $KC get clients -r {{ .Values.keycloak.realm }} -q clientId=xdXOt13JKxym1B1QcEncf2XDkLAexMBFwiT9j6EfhhHFJhs2KM9jbjTmf8JBXE69 2>/dev/null \
                           | grep -q '"xdXOt13JKxym1B1QcEncf2XDkLAexMBFwiT9j6EfhhHFJhs2KM9jbjTmf8JBXE69"'; then
                        $KC create clients -r {{ .Values.keycloak.realm }} \
                          -s clientId=xdXOt13JKxym1B1QcEncf2XDkLAexMBFwiT9j6EfhhHFJhs2KM9jbjTmf8JBXE69 \
                          -s 'name=ownCloud Desktop (legacy)' \
                          -s enabled=true -s publicClient=true -s standardFlowEnabled=true \
                          -s 'redirectUris=["http://localhost:*","http://127.0.0.1:*"]' 2>/dev/null
                      fi
                      # OpenCloud Android app (custom scheme redirect)
                      if ! $KC get clients -r {{ .Values.keycloak.realm }} -q clientId=OpenCloudAndroid 2>/dev/null | grep -q '"OpenCloudAndroid"'; then
                        $KC create clients -r {{ .Values.keycloak.realm }} \
                          -s clientId=OpenCloudAndroid -s name="OpenCloud Android" \
                          -s enabled=true -s publicClient=true -s standardFlowEnabled=true \
                          -s 'redirectUris=["oc://android.opencloud.eu"]' 2>/dev/null
                      fi
                      # OpenCloud iOS app (custom scheme redirect)
                      if ! $KC get clients -r {{ .Values.keycloak.realm }} -q clientId=OpenCloudIOS 2>/dev/null | grep -q '"OpenCloudIOS"'; then
                        $KC create clients -r {{ .Values.keycloak.realm }} \
                          -s clientId=OpenCloudIOS -s name="OpenCloud iOS" \
                          -s enabled=true -s publicClient=true -s standardFlowEnabled=true \
                          -s 'redirectUris=["oc://ios.opencloud.eu"]' 2>/dev/null
                      fi
                      # opencloud-orchestrator (service-account client)
                      OCID=$($KC get clients -r {{ .Values.keycloak.realm }} -q clientId=opencloud-orchestrator --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      if [ -z "$OCID" ]; then
                        OCID=$($KC create clients -r {{ .Values.keycloak.realm }} \
                          -s clientId=opencloud-orchestrator -s name="OpenCloud Orchestrator" \
                          -s enabled=true -s publicClient=false \
                          -s standardFlowEnabled=false -s directAccessGrantsEnabled=false \
                          -s serviceAccountsEnabled=true -s "secret=$OPENCLOUD_KEYCLOAK_CLIENT_SECRET" -i 2>/dev/null)
                      fi
                      # Add service account to opencloudAdmin group + populate profile
                      if [ -n "$OCID" ] && [ -n "$OCGRP" ]; then
                        SAID=$($KC get "clients/$OCID/service-account-user" -r {{ .Values.keycloak.realm }} --fields id --format csv --noquotes 2>/dev/null | tail -1)
                        if [ -n "$SAID" ]; then
                          $KC update "users/$SAID/groups/$OCGRP" -r {{ .Values.keycloak.realm }} \
                            -s realm={{ .Values.keycloak.realm }} -s userId="$SAID" -s groupId="$OCGRP" -n 2>/dev/null
                          $KC update "users/$SAID" -r {{ .Values.keycloak.realm }} \
                            -s firstName=OpenCloud -s lastName=Orchestrator -s email=orchestrator@srw.local 2>/dev/null
                        fi
                      fi
                      # Grant the realm-management `impersonation` role to the
                      # service account: legacy V1 token-exchange only honors
                      # `requested_subject` when the calling client may
                      # impersonate users. Powers user-home (Personal Space)
                      # mounts for sync (cloud_collaboration_model.md §9
                      # Phase 2.1) and rclone (rclone_cloud_mount.md Phase 6
                      # step 3). Idempotent — re-adding an existing mapping
                      # is a no-op.
                      if [ -n "$OCID" ]; then
                        $KC add-roles -r {{ .Values.keycloak.realm }} \
                          --uusername service-account-opencloud-orchestrator \
                          --cclientid realm-management --rolename impersonation 2>/dev/null \
                          || echo "impersonation role grant skipped (already present or realm-management missing)"
                      fi
                      # Ensure `profile` client scope exists — realm-import only creates
                      # it on first boot, and the explicit clientScopes array in the
                      # realm JSON replaces Keycloak's built-in defaults. Without this,
                      # orchestrator service-account tokens lack the `name` claim and
                      # OpenCloud rejects autoprovisioning with 500 on /roleDefinitions.
                      PID=$($KC get client-scopes -r {{ .Values.keycloak.realm }} --fields id,name 2>/dev/null \
                        | grep -B1 '"name" : "profile"' | grep '"id"' | head -1 | sed 's/.*"id" : "//;s/".*//' || true)
                      if [ -z "$PID" ]; then
                        PID=$($KC create client-scopes -r {{ .Values.keycloak.realm }} \
                          -s name=profile -s protocol=openid-connect \
                          -s 'attributes={"include.in.token.scope":"true","display.on.consent.screen":"true"}' -i 2>/dev/null || true)
                        if [ -n "$PID" ]; then
                          printf '%s' '{"name":"full name","protocol":"openid-connect","protocolMapper":"oidc-full-name-mapper","config":{"id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}' \
                            | $KC create "client-scopes/$PID/protocol-mappers/models" -r {{ .Values.keycloak.realm }} -f - 2>/dev/null
                          printf '%s' '{"name":"given name","protocol":"openid-connect","protocolMapper":"oidc-usermodel-attribute-mapper","config":{"user.attribute":"firstName","claim.name":"given_name","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true","jsonType.label":"String"}}' \
                            | $KC create "client-scopes/$PID/protocol-mappers/models" -r {{ .Values.keycloak.realm }} -f - 2>/dev/null
                          printf '%s' '{"name":"family name","protocol":"openid-connect","protocolMapper":"oidc-usermodel-attribute-mapper","config":{"user.attribute":"lastName","claim.name":"family_name","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true","jsonType.label":"String"}}' \
                            | $KC create "client-scopes/$PID/protocol-mappers/models" -r {{ .Values.keycloak.realm }} -f - 2>/dev/null
                          printf '%s' '{"name":"username","protocol":"openid-connect","protocolMapper":"oidc-usermodel-attribute-mapper","config":{"user.attribute":"username","claim.name":"preferred_username","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true","jsonType.label":"String"}}' \
                            | $KC create "client-scopes/$PID/protocol-mappers/models" -r {{ .Values.keycloak.realm }} -f - 2>/dev/null
                        fi
                      fi
                      # Attach default client scopes (profile, email, groups + openid for web)
                      for CNAME in opencloud-orchestrator opencloud-web OpenCloudDesktop \
                          "xdXOt13JKxym1B1QcEncf2XDkLAexMBFwiT9j6EfhhHFJhs2KM9jbjTmf8JBXE69" \
                          OpenCloudAndroid OpenCloudIOS; do
                        CCID=$($KC get clients -r {{ .Values.keycloak.realm }} -q "clientId=$CNAME" --fields id --format csv --noquotes 2>/dev/null | tail -1)
                        [ -z "$CCID" ] && continue
                        SCOPES="openid profile email groups"
                        [ "$CNAME" = "opencloud-orchestrator" ] && SCOPES="profile email groups"
                        for SNAME in $SCOPES; do
                          SID=$($KC get client-scopes -r {{ .Values.keycloak.realm }} --fields id,name 2>/dev/null \
                            | grep -B1 "\"name\" : \"$SNAME\"" | grep '"id"' | head -1 | sed 's/.*"id" : "//;s/".*//' || true)
                          [ -n "$SID" ] && $KC update "clients/$CCID/default-client-scopes/$SID" -r {{ .Values.keycloak.realm }} 2>/dev/null
                        done
                      done
                    fi
                    {{- end }}
                    {{- if .Values.nextcloud.enabled }}
                    # --- Ensure the Nextcloud client exists ---
                    # The realm-import entry above only lands on FIRST boot (empty
                    # DB). A cluster that turns Nextcloud on later — e.g. migrating
                    # off OpenCloud — would otherwise never get the client, and
                    # "Log in with Keycloak" on the cloud host fails with
                    # "Client not found" even though Nextcloud's own setup hook
                    # registered the provider on its side. Create-if-missing, then
                    # re-assert redirect URIs on every start so a global.domain
                    # flip propagates (same self-heal as gitea/mcp-server below).
                    if [ -n "$NEXTCLOUD_OIDC_CLIENT_SECRET" ]; then
                      NCID=$($KC get clients -r {{ .Values.keycloak.realm }} -q clientId=nextcloud --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      if [ -z "$NCID" ]; then
                        NCID=$($KC create clients -r {{ .Values.keycloak.realm }} \
                          -s clientId=nextcloud -s name="Nextcloud" \
                          -s description="Cloud storage" \
                          -s enabled=true -s publicClient=false \
                          -s standardFlowEnabled=true -s implicitFlowEnabled=false \
                          -s directAccessGrantsEnabled=false -s serviceAccountsEnabled=false \
                          -s protocol=openid-connect \
                          -s "secret=$NEXTCLOUD_OIDC_CLIENT_SECRET" -i 2>/dev/null)
                      fi
                      if [ -n "$NCID" ]; then
                        $KC update "clients/$NCID" -r {{ .Values.keycloak.realm }} \
                          -s 'redirectUris={{ $cloudRedirects | toJson }}' \
                          -s 'webOrigins={{ $cloudOrigins | toJson }}' 2>/dev/null \
                          || echo "WARN: kcadm nextcloud redirectUris re-assert failed"
                        # Match the realm-import defaultClientScopes.
                        for SNAME in openid profile email groups; do
                          SID=$($KC get client-scopes -r {{ .Values.keycloak.realm }} --fields id,name 2>/dev/null \
                            | grep -B1 "\"name\" : \"$SNAME\"" | grep '"id"' | head -1 | sed 's/.*"id" : "//;s/".*//' || true)
                          [ -n "$SID" ] && $KC update "clients/$NCID/default-client-scopes/$SID" -r {{ .Values.keycloak.realm }} 2>/dev/null
                        done
                      fi
                    fi
                    {{- end }}
                    # --- Ensure Gitea protocol mappers have config ---
                    # (realm import sometimes stores empty config objects)
                    GID=$($KC get clients -r {{ .Values.keycloak.realm }} -q clientId=gitea --fields id --format csv --noquotes 2>/dev/null | tail -1)
                    if [ -n "$GID" ]; then
                      # Re-assert redirect URIs + web origins on every start so a
                      # domain flip (global.domain change) propagates without a DB
                      # wipe — realm-import only seeds these on first boot, mirroring
                      # the cockpit-bff self-heal above. Gitea builds its OAuth
                      # redirect from ROOT_URL (srw.gitUrl), so only that host is ever
                      # sent; localhost stays for in-cluster/dev callbacks.
                      $KC update "clients/$GID" -r {{ .Values.keycloak.realm }} \
                        -s 'redirectUris={{ $gitRedirects | toJson }}' \
                        -s 'webOrigins={{ $gitOrigins | toJson }}' 2>/dev/null \
                        || echo "WARN: kcadm gitea redirectUris update failed"
                      ensure_mapper() {
                        NAME="$1"; ATTR="$2"; CLAIM="$3"; JTYPE="$4"
                        MID=$($KC get "clients/$GID/protocol-mappers/models" -r {{ .Values.keycloak.realm }} 2>/dev/null \
                          | grep -B1 "\"name\" : \"$NAME\"" | grep '"id"' | sed 's/.*: "//;s/".*//')
                        [ -n "$MID" ] && $KC delete "clients/$GID/protocol-mappers/models/$MID" -r {{ .Values.keycloak.realm }} 2>/dev/null
                        $KC create "clients/$GID/protocol-mappers/models" -r {{ .Values.keycloak.realm }} -f - 2>/dev/null <<MAPPER
                    {"name":"$NAME","protocol":"openid-connect","protocolMapper":"oidc-usermodel-attribute-mapper","config":{"user.attribute":"$ATTR","claim.name":"$CLAIM","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true","jsonType.label":"$JTYPE"}}
                    MAPPER
                      }
                      ensure_mapper "gitea-username" "username" "preferred_username" "String"
                      ensure_mapper "given-name" "firstName" "given_name" "String"
                      ensure_mapper "family-name" "lastName" "family_name" "String"
                    fi
                    {{- if .Values.mcp.enabled }}
                    # --- Re-assert mcp-server redirect URIs (domain-flip self-heal) ---
                    # realm-import seeds these on first boot only; a global.domain
                    # change (mcpUrl) otherwise strands the MCP OAuth-bridge → Keycloak
                    # callback at the old host, breaking interactive MCP login while
                    # discovery still looks healthy. Mirrors the gitea/cockpit-bff pattern.
                    MSID=$($KC get clients -r {{ .Values.keycloak.realm }} -q clientId=mcp-server --fields id --format csv --noquotes 2>/dev/null | tail -1)
                    if [ -n "$MSID" ]; then
                      $KC update "clients/$MSID" -r {{ .Values.keycloak.realm }} \
                        -s "redirectUris=[\"http://localhost:8055/auth/callback\",\"{{ include "srw.mcpUrl" . }}/auth/callback\"]" \
                        -s "webOrigins=[\"http://localhost:8055\",\"{{ include "srw.mcpUrl" . }}\"]" 2>/dev/null \
                        || echo "WARN: kcadm mcp-server redirectUris update failed"
                    fi
                    {{- end }}
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: keycloak-theme
              mountPath: /opt/keycloak/themes/srw
              readOnly: true
            - name: bridge-cert
              mountPath: /opt/keycloak/certs
              {{- if .Values.keycloak.bridgeCert.enabled }}
              readOnly: true
              {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            failureThreshold: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm-import
          configMap:
            name: {{ include "srw.fullname" . }}-keycloak-realm
        - name: keycloak-theme
          configMap:
            name: {{ include "srw.fullname" . }}-keycloak-theme
            items:
              - key: login_theme.properties
                path: login/theme.properties
              - key: login_resources_css_srw.20260910.css
                path: login/resources/css/srw.20260910.css
              - key: login_resources_img_srw-logo.svg
                path: login/resources/img/srw-logo.svg
              - key: email_theme.properties
                path: email/theme.properties
              - key: email_html_template.ftl
                path: email/html/template.ftl
        - name: bridge-cert
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-keycloak
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "keycloak") | nindent 4 }}
{{- end }}
