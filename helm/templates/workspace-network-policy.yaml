{{- if .Values.workspace.networkPolicy.enabled }}
{{- range $tier := .Values.workspace.networkPolicy.tiers }}
---
# Unified workspace NetworkPolicy — covers BOTH container workspaces (pods)
# and VM workspaces (KubeVirt virt-launcher pods). KubeVirt propagates labels
# from VMI.spec.template.metadata.labels to the virt-launcher pod, so a
# single podSelector matches both implementations.
#
# PR 3: one NetworkPolicy per tier. Each policy selects pods that carry
# *both* `srw.io/component=agent-workspace` AND the matching
# `srw.io/network-tier=<name>` label (orchestrator-set, derived from
# `projects.network_tier`). Tier `internet-only` is the default for pods
# lacking the tier label; the other tiers are opted into per project.
#
# See knowledge-base/knowledge/features/workspace_network_policy_unification.md for the full
# unification rationale, and knowledge-base/knowledge/features/workspace_network_isolation.md §3
# for the tier model.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" $ }}-workspace-policy-{{ $tier.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "srw.labels" $ | nindent 4 }}
    srw.io/network-tier: {{ $tier.name }}
spec:
  podSelector:
    matchLabels:
      srw.io/component: agent-workspace
      srw.io/network-tier: {{ $tier.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # SSH + CDP from agent pods (RemoteBackend + browser automation).
    # Legacy agent pods are created by the orchestrator's provisioners (not by
    # Helm), so they carry the custom `app: srw-agent` /
    # `app: srw-persistent-agent` labels rather than Helm's
    # `app.kubernetes.io/component` labels. The flag-gated stateless Deployment
    # has its own non-overlapping `app` label and joins this allow-list only
    # while that lane is enabled.
    - from:
        - podSelector:
            matchLabels:
              app: srw-agent
        - podSelector:
            matchLabels:
              app: srw-persistent-agent
        {{- if $.Values.agent.stateless.enabled }}
        - podSelector:
            matchLabels:
              app: srw-agent-stateless
        {{- end }}
      ports:
        {{- if include "srw.vmSameCluster" $ }}
        - protocol: TCP
          port: 22
        {{- end }}
        - protocol: TCP
          port: 30022
        - protocol: TCP
          port: 9222
    # SSH from orchestrator: thread uploads plus IDE/snapshot control paths.
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "orchestrator") | nindent 14 }}
      ports:
        {{- if include "srw.vmSameCluster" $ }}
        # Keep the pre-v1 transport path available while the exact-effect
        # protocol is dark.  Read-only capture/probe paths for already-running
        # VMs also use guest SSH, so NetworkPolicy cannot be the activation
        # fence without turning a dark rollout into an availability cutover.
        # The flag-triggered Recreate plus the monotonic database gate is the
        # zero-old-replica mutation fence.
        - protocol: TCP
          port: 22
        {{- end }}
        - protocol: TCP
          port: 30022
    {{- if $.Values.canvas.livePreview.viewer.enabled }}
    # The Canvas gateway opens request-scoped direct channels to workspace
    # loopback. Container workspaces use 30022; VM/KubeVirt inventory may use
    # the conventional port 22. No application port is opened on the pod net.
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "canvas-gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 30022
        - protocol: TCP
          port: 22
    {{- end }}
    {{- if $.Values.sshGateway.enabled }}
    # The ssh-gateway's inner hop: one certificate-authenticated SSH
    # connection per user attach, multiplexed into channels. Container
    # workspaces (30022) or exact admitted VM guests (22). The gateway's
    # VM credential is distinct from the container user CA.
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "ssh-gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 30022
        {{- if include "srw.vmSameCluster" $ }}
        - protocol: TCP
          port: 22
        {{- end }}
    {{- end }}
    # code-server from orchestrator (IDE session proxying)
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "orchestrator") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 38080
    # code-server via Traefik ingress (direct IDE access)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 38080
  egress:
    {{- if include "srw.vmSameCluster" $ }}
    # Guest daemons call the co-located orchestrator directly over HTTP.
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "orchestrator") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8085
    {{- end }}
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTP/HTTPS for the public internet (browser automation via CDP,
    # Tailscale DERP-relay fallback when UDP is blocked) and SSH for git
    # clone of SSH-auth repository datasources (GitHub, GitLab, self-hosted
    # Gitea-over-SSH, etc.). The tier's `except` list controls which CIDRs
    # are subtracted from the wildcard — see values.yaml workspace.networkPolicy.tiers.
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 22
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $cidr := $tier.except }}
              - {{ $cidr }}
              {{- end }}
    # Tailscale mesh — direct WireGuard peer (UDP/41641) and STUN (UDP/3478).
    # If UDP is blocked end-to-end, Tailscale falls back to DERP-over-443
    # transparently (still works, just relayed). Applies equally to container
    # workspaces (Tailscale runs in the pod netns) and VM workspaces (Tailscale
    # runs inside the VM, NAT'd through virt-launcher's veth — pod-level
    # policy sees only the encrypted envelope).
    - ports:
        - protocol: UDP
          port: 41641
        - protocol: UDP
          port: 3478
    # Gitea (workspace git repos)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "gitea") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
        {{- if $.Values.gitea.ssh.enabled }}
        - protocol: TCP
          port: {{ $.Values.gitea.ssh.internalPort }}
        {{- end }}
    {{- if $.Values.nextcloud.enabled }}
    # Nextcloud (rclone/WebDAV cloud mounts)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "nextcloud") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
    {{- if $.Values.opencloud.enabled }}
    # OpenCloud (rclone/WebDAV cloud mounts)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "opencloud") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9200
    {{- end }}
    # PostgreSQL (App DB — for datasource shell tools like psql)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    # PostgreSQL (Vector DB)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "pgvector") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    # Neo4j (for datasource shell tools)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" $ "component" "neo4j") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 7688
    {{- with $.Values.workspace.networkPolicy.extraEgress }}
    # Deployment-specific extra egress from the values overlay — e.g. local
    # k3d's in-cluster Traefik hairpin for the OpenCloud tus data gateway.
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # No general internet beyond TCP 80/443 + Tailscale UDP. Workspaces
    # cannot reach each other (no podSelector matchLabels srw.io/component:
    # agent-workspace in any allowed source).
{{- end }}
---
# Fail-closed fallback for workspace pods. Targets every pod carrying
# `srw.io/component=agent-workspace` regardless of tier label, with empty
# ingress AND egress rule sets. K8s NetworkPolicy union semantics: each
# policy's allows compose additively, so the tier-specific policies above
# still grant their allows when their tier label matches. But a pod whose
# tier label doesn't correspond to any rendered tier policy (DB ↔ helm
# values drift, label-stripping accident, pre-PR-3 pod that survived the
# upgrade, ...) would otherwise be policy-less for ingress/egress and
# therefore fully unrestricted by K8s default. This fallback closes that
# hole — such a pod is targeted by *this* policy with no allow rules, so
# it ends up fully isolated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-workspace-fallback-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      srw.io/component: agent-workspace
  policyTypes:
    - Ingress
    - Egress
{{- end }}
