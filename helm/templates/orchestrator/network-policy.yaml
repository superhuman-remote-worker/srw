{{- $leases := .Values.orchestrator.connectorLeases }}
{{- if $leases.exchangePort }}
{{- $driverNamespace := include "srw.connectorsNamespace" . }}
# Orchestrator ingress (connector drivers C2, "Reachability").
#
# The API port stays open to every source, exactly as before this policy
# existed: once a NetworkPolicy selects a pod, every ingress it does not allow
# is denied, so 8085 is listed with no `from` (ingress controller, agents,
# MCP, collectors, kubelet probes). The credential lease exchange port admits
# only pods in the connector driver namespace, so a driver reaches the
# exchange and nothing else of the API, and no other pod reaches the exchange.
# With service pods on, the exchange server's canary port is admitted from the
# driver namespace too: only a driver pod's own egress policy may refuse it,
# which is what its start-up wait proves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator-ingress
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8085
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $driverNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ $leases.exchangePort }}
        {{- if .Values.connectors.servicePods.enabled }}
        - protocol: TCP
          port: {{ .Values.connectors.servicePods.canaryPort }}
        {{- end }}
{{- end }}
