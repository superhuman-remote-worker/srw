                  key: INFRASTRUCTURE_METERING_DEPLOYMENT_MODE
            - name: INFRASTRUCTURE_METERING_NAMESPACE_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_NAMESPACE_ALLOWLIST
            - name: INFRASTRUCTURE_METERING_RELIST_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_RELIST_INTERVAL_SECONDS
            - name: INFRASTRUCTURE_METERING_STALE_AFTER_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_STALE_AFTER_SECONDS
            - name: INFRASTRUCTURE_METERING_LIST_PAGE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_LIST_PAGE_SIZE
            - name: INFRASTRUCTURE_METERING_SCOPE_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_SCOPE_CONCURRENCY
            - name: INFRASTRUCTURE_METERING_WATCH_QUEUE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_WATCH_QUEUE_SIZE
            - name: INFRASTRUCTURE_METERING_MAX_SNAPSHOT_ITEMS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_MAX_SNAPSHOT_ITEMS
            - name: INFRASTRUCTURE_METERING_MAX_SNAPSHOT_BYTES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_MAX_SNAPSHOT_BYTES
            - name: INFRASTRUCTURE_METERING_INGESTION_TICKET_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_INGESTION_TICKET_TTL_SECONDS
            - name: INFRASTRUCTURE_METERING_SNAPSHOT_ITEM_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_SNAPSHOT_ITEM_RETENTION_DAYS
            - name: INFRASTRUCTURE_METERING_DIAGNOSTIC_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_DIAGNOSTIC_RETENTION_DAYS
            - name: INFRASTRUCTURE_METERING_CLEANUP_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_CLEANUP_INTERVAL_SECONDS
            - name: INFRASTRUCTURE_METERING_INGESTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infrastructureMetering.ingestionSecretName | default (printf "%s-infra-ingestion" (include "srw.fullname" .) | trunc 63 | trimSuffix "-") }}
                  key: {{ .Values.infrastructureMetering.ingestionSecretKey | default "INFRASTRUCTURE_METERING_INGESTION_KEY" }}
                  optional: {{ not .Values.infrastructureMetering.collectorEnabled }}
            - name: INFRASTRUCTURE_METERING_VMI_INGESTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infrastructureMetering.vmIngestionSecretName | default "unused-vmi-metering-secret" }}
                  key: {{ .Values.infrastructureMetering.vmIngestionSecretKey | default "INFRASTRUCTURE_METERING_VMI_INGESTION_KEY" }}
                  optional: {{ not .Values.infrastructureMetering.vmInventoryEnabled }}
            - name: INFRASTRUCTURE_METERING_VM_STORAGE_INGESTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infrastructureMetering.vmStorageIngestionSecretName | default "unused-vm-storage-metering-secret" }}
                  key: {{ .Values.infrastructureMetering.vmStorageIngestionSecretKey | default "INFRASTRUCTURE_METERING_VM_STORAGE_INGESTION_KEY" }}
                  optional: {{ not (or (.Values.infrastructureMetering.vmPvcInventoryEnabled | default false) (.Values.infrastructureMetering.vmPvInventoryEnabled | default false)) }}
            {{- with .Values.orchestrator.kbGitAllowedHosts }}
            - name: KB_GIT_ALLOWED_HOSTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.orchestrator.kbGitSshKnownHosts }}
            - name: KB_GIT_SSH_KNOWN_HOSTS
              value: {{ . | quote }}
            {{- end }}
            - name: KB_EXTERNAL_REINDEX_CONCURRENCY
              value: {{ .Values.orchestrator.kbExternalReindexConcurrency | quote }}
            - name: KB_REINDEX_SWEEP_SECONDS
              value: {{ .Values.orchestrator.kbReindexSweepSeconds | quote }}
            # Agent pool sizing (AgentProvisioner)
            - name: MAX_AGENTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MAX_AGENTS
            - name: MIN_AGENTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MIN_AGENTS
            - name: AGENT_BUFFER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AGENT_BUFFER
            - name: RESERVED_SESSION_SLOTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: RESERVED_SESSION_SLOTS
            - name: RESERVED_JOB_SLOTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: RESERVED_JOB_SLOTS
            # Logging
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: LOG_FORMAT
            {{- if .Values.sshGateway.enabled }}
            # SSH gateway host-key publication. `GET /api/ssh/host-keys` runs
            # HERE, not in the gateway: it reads these two variables and the
            # .pub files the volume below projects. Without them the endpoint
            # answers 200 with `{"host_keys": [], "hostname": ""}` forever and
            # a pinning client silently degrades to trust-on-first-use.
            #
            # Explicit `env:` entries because this Deployment does not use
            # `envFrom` at all — a key added to the shared ConfigMap would
            # never arrive here.
            #
            # APPENDED AT THE END OF THIS LIST ON PURPOSE. Inserting into the
            # middle of an existing env list can trip the Kubernetes
            # strategic-merge bug that reports `env[N].valueFrom` patch errors
            # and needs a delete+recreate of the Deployment; appending leaves
            # every pre-existing index where it was.
            - name: SSH_GATEWAY_PUBLIC_HOST_KEYS
              value: {{ include "srw.sshGatewayPublicHostKeyPaths" . | quote }}
            - name: SSH_GATEWAY_HOSTNAME
              value: {{ .Values.sshGateway.hostname | quote }}
            {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: vm-ssh-key
              mountPath: /run/secrets/vm-ssh-key
              subPath: ssh-privatekey
              readOnly: true
            {{- if .Values.sshGateway.enabled }}
            - name: ssh-gateway-host-keys
              mountPath: {{ include "srw.sshGatewayHostKeyDir" . }}
              readOnly: true
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.orchestrator.preStopDrainSeconds }}"]
          startupProbe:
            httpGet:
              path: /api/health
              port: 8085
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8085
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-workspace
        - name: vm-ssh-key
          secret:
            secretName: {{ include "srw.vmSshKeySecretName" . }}
            # 0444 (world-readable) so the non-root `srw` user the orchestrator
            # runs as in prod (USER srw, docker/Dockerfile.orchestrator) can read
            # this root:root-owned key. The pod is single-purpose, so world-
            # readable in-container is acceptable. Required by
            # services/thread_uploads.py (paramiko SFTP for live thread uploads).
            #
            # Do NOT lower this to 0400: a non-root process cannot read a
            # root-owned 0400 file — that breaks prod, including the paramiko
            # path above.
            #
            # Every SSH caller resolves this mount through
            # services.resolve_ssh_key_path(). When the projected file is not a
            # runtime-owned private file (including root-running Tilt), the
            # resolver atomically stages a process-owned 0600 copy and returns
            # that path. This keeps the readable 0444 mount required by the
            # non-root production image without relying on OpenSSH's
            # owner-dependent permission exception.
            defaultMode: 0444
        {{- if .Values.sshGateway.enabled }}
        # The ssh-gateway's host keys, PUBLIC HALVES ONLY. This pod serves
        # `GET /api/ssh/host-keys` and needs the .pub files on disk to
        # fingerprint them; `items:` is what keeps the gateway's host private
        # keys out of a second pod. Pointing the endpoint at the private files
        # instead would also work (asyncssh emits only public material) and is
        # deliberately rejected.
        #
        # NOT `optional`. A hostKeySecret missing its .pub halves fails this
        # pod loudly, at the moment the operator enables the component, rather
        # than publishing an empty key list forever — which reads as "no
        # gateway configured" to a client and is indistinguishable from one.
        # 0444 for the same reason as vm-ssh-key above.
        - name: ssh-gateway-host-keys
          secret:
            secretName: {{ .Values.sshGateway.hostKeySecret }}
            defaultMode: 0444
            items:
              {{- range .Values.sshGateway.hostKeyNames }}
              - key: {{ printf "%s.pub" . | quote }}
                path: {{ printf "%s.pub" . | quote }}
              {{- end }}
        {{- end }}
