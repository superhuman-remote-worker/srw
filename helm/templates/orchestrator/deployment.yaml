            - name: WORKSPACE_FUSE_PRIVILEGED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_FUSE_PRIVILEGED
                  optional: true
            - name: OPERATOR_HOME_ALLOWED_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
