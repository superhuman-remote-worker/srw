{{- $runtimeAuthorityCutover := .Values.orchestrator.runtimeAuthorityMigrationMaintenanceAck | default false -}}
{{- $vmRemoteProtocol := .Values.orchestrator.vmRemoteOperationProtocol.enabled | default false -}}
{{- $workspaceCleanupProtocol := .Values.orchestrator.workspaceCleanupReconciliationEnabled | default false -}}
{{- $workspaceLifecycleCutover := .Values.orchestrator.workspaceLifecycleProtocolCutoverEnabled | default false -}}
{{- $manifestCutover := .Values.orchestrator.manifestContractCutoverEnabled | default false -}}
{{- $orchestratorRecreate := or $manifestCutover (or $runtimeAuthorityCutover (or $vmRemoteProtocol (or $workspaceLifecycleCutover $workspaceCleanupProtocol))) -}}
{{- if and $runtimeAuthorityCutover (ne (lower (toString (.Values.agent.requirePinnedStatusIdentity | default "true"))) "true") -}}
{{- fail "orchestrator.runtimeAuthorityMigrationMaintenanceAck requires agent.requirePinnedStatusIdentity=true" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  strategy:
    type: {{ ternary "Recreate" "RollingUpdate" $orchestratorRecreate }}
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 8 }}
        {{- if $vmRemoteProtocol }}
        srw.io/vm-remote-operation-protocol: v1
        {{- end }}
      annotations:
        {{- if .Values.vm.resourceAdmission.observerEnabled }}
        checksum/vm-resource-policy: {{ include "srw.vmResourceInventoryConfig" . | sha256sum | quote }}
        {{- end }}
        checksum/infrastructure-metering-gates: {{ toJson .Values.infrastructureMetering | sha256sum | quote }}
        # This flag is a money-spending admission fence. The orchestrator reads
        # it from a ConfigMap key, so bind its exact value into the Pod template
        # even when the optional Reloader controller is disabled. A source-
        # controlled enable/disable therefore deterministically converges every
        # replica before operators rely on the new policy.
        checksum/officer-auto-pull-release: {{ dict "officerAutoPullReleaseEnabled" (.Values.orchestrator.officerAutoPullReleaseEnabled | default false) | toJson | sha256sum | quote }}
        # Completion/control policy is read once at process startup. Hash the
        # exact ConfigMap inputs so mode and finalizer changes replace every
        # orchestrator replica without relying on the optional Reloader.
        checksum/completion-control-settings: {{ dict "commandsEnabled" (.Values.orchestrator.completionCommandsEnabled | default false) "statusReorderEnabled" (.Values.orchestrator.completionStatusReorderEnabled | default false) "finalizerInlineDelaySeconds" (.Values.orchestrator.completionFinalizerInlineDelaySeconds | default 0) | toJson | sha256sum | quote }}
        # Stateless session/worker admission is also read once at startup.
        # Keep the authority that admits work synchronized with executor
        # topology after any source-controlled pool-mode change.
        checksum/stateless-admission-settings: {{ dict "sessionEnabled" (.Values.agent.stateless.enabled | default false) "cloudPushRecoveryEnabled" (and .Values.agent.stateless.enabled .Values.agent.stateless.cloudPushRecoveryEnabled) "workerEnabled" (.Values.agent.stateless.worker.enabled | default false) "workerDefaultEnabled" (.Values.agent.stateless.worker.defaultEnabled | default false) | toJson | sha256sum | quote }}
        # Native admission reads these values at startup. Operator changes must
        # replace the process even when the optional Reloader is disabled.
        checksum/manifest-hosting: {{ toJson .Values.manifestHosting | sha256sum | quote }}
        checksum/workspace-cleanup-reconciliation: {{ dict "enabled" $workspaceCleanupProtocol | toJson | sha256sum | quote }}
        checksum/workspace-preparation: {{ include "srw.vmPreparationEnvironment" . | sha256sum | quote }}
        checksum/workspace-lifecycle-protocol-cutover: {{ dict "enabled" $workspaceLifecycleCutover | toJson | sha256sum | quote }}
        checksum/workspace-lifecycle-service-account: {{ .Values.orchestrator.workspaceLifecycleServiceAccountGeneration | default "0197" | toString | sha256sum | quote }}
        checksum/vm-remote-operation-protocol: {{ dict "enabled" $vmRemoteProtocol | toJson | sha256sum | quote }}
        checksum/vm-workspace-recovery: {{ toJson .Values.orchestrator.vmWorkspaceRecovery | sha256sum | quote }}
        checksum/vm-workspace-recovery-acceptance-gate: {{ toJson .Values.orchestrator.vmWorkspaceRecoveryAcceptanceGate | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "srw.orchestratorServiceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.orchestrator.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if and .Values.databases.postgres.enabled .Values.databases.postgres.internal }}
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.postgresHost" . }} 5432; do sleep 2; done"]
        {{- end }}
        {{- if and .Values.databases.vector.enabled .Values.databases.vector.internal }}
        - name: wait-for-pgvector
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.vectorPostgresHost" . }} 5432; do sleep 2; done"]
        {{- end }}
        {{- if and .Values.databases.audit.enabled .Values.databases.audit.internal }}
        - name: wait-for-auditdb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.auditPostgresHost" . }} 5432; do sleep 2; done"]
        {{- end }}
        {{- if and .Values.gitea.enabled .Values.gitea.internal }}
        - name: wait-for-gitea
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.fullname" . }}-gitea 3000; do sleep 2; done"]
        {{- end }}
        {{- if and .Values.keycloak.enabled .Values.keycloak.internal }}
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.fullname" . }}-keycloak 8080; do sleep 2; done"]
        {{- end }}
      containers:
        - name: orchestrator
          image: {{ include "srw.imageRef" (dict "image" .Values.image.orchestrator) | quote }}
          imagePullPolicy: {{ .Values.image.orchestrator.pullPolicy }}
          ports:
            - containerPort: 8085
          env:
            # Migration 0185 is intentionally not rolling-compatible.  An
            # existing database accepts it only after the operator drains old
            # pinned/agent writers and acknowledges the named maintenance
            # gate; the same value switches this Deployment to Recreate so no
            # old orchestrator overlaps the migration transaction.
            - name: MIGRATION_MAINTENANCE_GATES
              value: {{ ternary "pinned-runtime-authority-v1" "" $runtimeAuthorityCutover | quote }}
            - name: VM_REMOTE_OPERATION_PROTOCOL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VM_REMOTE_OPERATION_PROTOCOL_ENABLED
            - name: WORKSPACE_CLEANUP_RECONCILIATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_CLEANUP_RECONCILIATION_ENABLED
            # The orchestrator is the only reader of this key
            # (services/pinned_k8s_effect.py). Without it the bounded legacy
            # namespace search collapses to the release namespace alone, which
            # silently disables both 0185 adoption across a namespace move and
            # the session-route shadow refusal.
            - name: PINNED_LEGACY_AGENT_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: PINNED_LEGACY_AGENT_NAMESPACES
            - name: PORT
              value: "8085"
            # License acceptance — orchestrator refuses to start if not "true"
            - name: LICENSE_TERMS_ACCEPTED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: LICENSE_TERMS_ACCEPTED
            # Encryption key for API keys stored at rest (user_api_keys,
            # system_api_keys, llm_endpoints.api_key). Must be present
            # before the orchestrator starts — see NOTES.txt for the
            # operator backup procedure.
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: APP_ENCRYPTION_KEY
            # Core databases — DSNs are composed at runtime from the parts
            # below (src/shared/db_url.py). Storing a full URL in
            # the Secret is no longer needed and was a footgun: passwords
            # with `/` truncated the netloc under urlsplit.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: POSTGRES_DB
            # libpq TLS mode for this store's DSN. Explicit env because the
            # orchestrator does NOT envFrom the shared ConfigMap (see above) --
            # the ConfigMap key alone would never reach the process. Agent pods
            # DO envFrom it and inherit the same key for free.
            - name: POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: POSTGRES_SSLMODE
            # DB-backed experts: orchestrator uses explicit env (not envFrom), so
            # the configmap flag must be referenced here too (agents get it via
            # envFrom on the provisioner-built pods).
            - name: EXPERTS_DB_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: EXPERTS_DB_ENABLED
            - name: SKILLS_DB_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SKILLS_DB_ENABLED
            - name: PRODUCT_CAPABILITIES_ENDPOINT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: PRODUCT_CAPABILITIES_ENDPOINT_ENABLED
            - name: SRW_DEPLOYMENT_PROVENANCE_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_DEPLOYMENT_PROVENANCE_JSON
            - name: MCP_DATASOURCES_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MCP_DATASOURCES_ENABLED
            - name: MCP_STDIO_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MCP_STDIO_ENABLED
            - name: DATASOURCE_DEFAULTS_ON_OMISSION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DATASOURCE_DEFAULTS_ON_OMISSION
            - name: DATASOURCE_SCOPE_AUTO_ATTACH_V1_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DATASOURCE_SCOPE_AUTO_ATTACH_V1_ENABLED
            - name: PROTECTED_CLOUD_MODE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: PROTECTED_CLOUD_MODE_ENABLED
            - name: REQUIRE_PINNED_STATUS_IDENTITY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: REQUIRE_PINNED_STATUS_IDENTITY
            - name: CANVAS_LIVE_PREVIEW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_LIVE_PREVIEW_ENABLED
            - name: CANVAS_LIVE_PREVIEW_DENIED_PORTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_LIVE_PREVIEW_DENIED_PORTS
            - name: CANVAS_SHARED_BROWSER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_SHARED_BROWSER_ENABLED
            # Browser viewer control plane. The positive capability requires
            # both Canvas gates plus the validated deployment attestations;
            # default values remain false/empty.
            - name: CANVAS_VIEWER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_ENABLED
            - name: CANVAS_VIEWER_DEPLOYMENT_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_DEPLOYMENT_PROFILE
            - name: CANVAS_VIEWER_COOKIE_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_COOKIE_MODE
            - name: CANVAS_VIEWER_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_DOMAIN
            - name: CANVAS_VIEWER_HOST_SUFFIX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_HOST_SUFFIX
            - name: CANVAS_VIEWER_COCKPIT_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_COCKPIT_ORIGINS
            - name: CANVAS_VIEWER_PSL_BOUNDARY_VERIFIED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_PSL_BOUNDARY_VERIFIED
            - name: CANVAS_VIEWER_SESSION_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_SESSION_TTL_SECONDS
            - name: CANVAS_VIEWER_BOOTSTRAP_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_BOOTSTRAP_TTL_SECONDS
            - name: CANVAS_VIEWER_ATTACHMENT_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_ATTACHMENT_TTL_SECONDS
            - name: CANVAS_VIEWER_REVALIDATE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_REVALIDATE_SECONDS
            - name: CANVAS_VIEWER_MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_MAX_CONNECTIONS
            - name: CANVAS_VIEWER_MAX_HTTP_PER_SESSION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_MAX_HTTP_PER_SESSION
            - name: CANVAS_VIEWER_MAX_HEADER_BYTES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_MAX_HEADER_BYTES
            - name: CANVAS_VIEWER_MAX_HEADER_FIELDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_MAX_HEADER_FIELDS
            - name: CANVAS_VIEWER_MAX_QUERY_BYTES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_MAX_QUERY_BYTES
            - name: CANVAS_VIEWER_MAX_QUERY_FIELDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_MAX_QUERY_FIELDS
            - name: CANVAS_VIEWER_MAX_REQUEST_BODY_BYTES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_MAX_REQUEST_BODY_BYTES
            - name: CANVAS_VIEWER_MAX_RESPONSE_BODY_BYTES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_MAX_RESPONSE_BODY_BYTES
            - name: CANVAS_VIEWER_CONNECT_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_CONNECT_TIMEOUT_SECONDS
            - name: CANVAS_VIEWER_IDLE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_IDLE_TIMEOUT_SECONDS
            - name: CANVAS_VIEWER_EXCHANGE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_VIEWER_EXCHANGE_TIMEOUT_SECONDS
            # Read-only Office Canvas / Collabora discovery and WOPI host.
            - name: COLLABORA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COLLABORA_ENABLED
            - name: COLLABORA_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COLLABORA_INTERNAL_URL
            - name: COLLABORA_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COLLABORA_PUBLIC_URL
            - name: COLLABORA_WOPI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COLLABORA_WOPI_BASE_URL
            - name: COLLABORA_COCKPIT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COLLABORA_COCKPIT_ORIGIN
            - name: COLLABORA_TOKEN_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COLLABORA_TOKEN_TTL_SECONDS
            - name: COLLABORA_DISCOVERY_CACHE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COLLABORA_DISCOVERY_CACHE_TTL_SECONDS
            - name: COLLABORA_DISCOVERY_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COLLABORA_DISCOVERY_TIMEOUT_SECONDS
            - name: CANVAS_MAX_OFFICE_BYTES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CANVAS_MAX_OFFICE_BYTES
            - name: VECTOR_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: VECTOR_POSTGRES_USER
            - name: VECTOR_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: VECTOR_POSTGRES_PASSWORD
            - name: VECTOR_POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VECTOR_POSTGRES_HOST
            - name: VECTOR_POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VECTOR_POSTGRES_PORT
            - name: VECTOR_POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VECTOR_POSTGRES_DB
            - name: VECTOR_POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VECTOR_POSTGRES_SSLMODE
            - name: AUDIT_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: AUDIT_POSTGRES_USER
            - name: AUDIT_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: AUDIT_POSTGRES_PASSWORD
            - name: AUDIT_POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AUDIT_POSTGRES_HOST
            - name: AUDIT_POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AUDIT_POSTGRES_PORT
            - name: AUDIT_POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AUDIT_POSTGRES_DB
            - name: AUDIT_POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AUDIT_POSTGRES_SSLMODE
            # Per-store asyncpg pool sizing. Explicit env (the orchestrator does
            # NOT envFrom the shared ConfigMap), sourced from orchestrator.dbPool
            # so the control/vector/audit pools size independently. These are
            # deliberately NOT the ConfigMap's POSTGRES_*_CONNECTIONS keys —
            # those carry the small AGENT-pod sizing (agent.dbPool) that must not
            # reach the orchestrator.
            - name: POSTGRES_MIN_CONNECTIONS
              value: {{ .Values.orchestrator.dbPool.app.min | quote }}
            - name: POSTGRES_MAX_CONNECTIONS
              value: {{ .Values.orchestrator.dbPool.app.max | quote }}
            - name: VECTOR_POSTGRES_MIN_CONNECTIONS
              value: {{ .Values.orchestrator.dbPool.vector.min | quote }}
            - name: VECTOR_POSTGRES_MAX_CONNECTIONS
              value: {{ .Values.orchestrator.dbPool.vector.max | quote }}
            - name: AUDIT_POSTGRES_MIN_CONNECTIONS
              value: {{ .Values.orchestrator.dbPool.audit.min | quote }}
            - name: AUDIT_POSTGRES_MAX_CONNECTIONS
              value: {{ .Values.orchestrator.dbPool.audit.max | quote }}
            # Checkpointer backend (sqlite|postgres). The orchestrator reads it to
            # prune LangGraph checkpoints on terminal jobs; it uses explicit env
            # (not envFrom), so the ConfigMap key must be referenced here too
            # (agents get it via envFrom on the provisioner-built pods).
            - name: CHECKPOINTER_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CHECKPOINTER_BACKEND
            # Session admission reads the exact gate that renders the generic
            # executor Deployment, so an admitted session always has a pool.
            # Worker-job admission remains independent. All values come from
            # one ConfigMap so the control and execution planes agree.
            - name: STATELESS_SESSION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: STATELESS_SESSION_ENABLED
            - name: STATELESS_CLOUD_PUSH_RECOVERY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: STATELESS_CLOUD_PUSH_RECOVERY_ENABLED
            - name: SESSION_REWIND_IDLE_CONVERSATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SESSION_REWIND_IDLE_CONVERSATION_ENABLED
            - name: STATELESS_WORKER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: STATELESS_WORKER_ENABLED
            - name: STATELESS_WORKER_DEFAULT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: STATELESS_WORKER_DEFAULT_ENABLED
            # Recovery admission, workers, and the leader reconciler consume
            # one rendered protocol surface. This Deployment does not use the
            # shared ConfigMap through envFrom, so every key is explicit here.
            {{- range $key := list "VM_WORKSPACE_RECOVERY_ENABLED" "VM_WORKSPACE_REPLACEMENT_RECOVERY_ENABLED" "VM_WORKSPACE_RECOVERY_DEADLINE_SECONDS" "VM_WORKSPACE_RECOVERY_MAX_GLOBAL_PROBES" "VM_WORKSPACE_RECOVERY_MAX_PROBES_PER_NODE" "VM_WORKSPACE_RECOVERY_CLAIM_TTL_SECONDS" "VM_WORKSPACE_RECOVERY_PERMIT_TTL_SECONDS" "VM_WORKSPACE_RECOVERY_EXTERNAL_CALL_TIMEOUT_SECONDS" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" $ }}
                  key: {{ $key }}
            {{- end }}
            # Durable completion admission and the finalizer/drain must flip as
            # one gate. Stateless agents inherit this same ConfigMap key via
            # envFrom, while the orchestrator intentionally uses an explicit
            # reference so its independently-sized DB env stays isolated.
            - name: COMPLETION_COMMANDS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COMPLETION_COMMANDS_ENABLED
            - name: COMPLETION_STATUS_REORDER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COMPLETION_STATUS_REORDER_ENABLED
            - name: COMPLETION_FINALIZER_INLINE_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COMPLETION_FINALIZER_INLINE_DELAY_SECONDS
            - name: WORKER_BATCH_MIN_WALL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKER_BATCH_MIN_WALL_SECONDS
            # LLM-outage/cooldown pause budget (12h default). Must equal the value
            # every agent pod reads via envFrom on the shared ConfigMap, so the
            # orchestrator references the same key here (it does not envFrom).
            # knowledge-base/knowledge/features/llm_cooldown_pause_and_resume.md
            - name: LLM_OUTAGE_CEILING_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: LLM_OUTAGE_CEILING_SECONDS
            - name: WORKSPACE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_PATH
            - name: WORKSPACE_STORAGE_CLASS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_STORAGE_CLASS
            # Branch (a): PVC-backed workspaces, jobs AND sessions. The
            # orchestrator runs the dispatcher's create_workspace, the session
            # agent provisioner (which gates its own pvc-agent-s-* claim on the
            # SAME WORKSPACE_PVC_ENABLED flag) and the lifecycle reaper, so it
            # must see these. The deployment maps configmap keys explicitly
            # (not envFrom), so new keys need an entry here to reach the pod.
            - name: WORKSPACE_PVC_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_PVC_ENABLED
            - name: WORKSPACE_PVC_SIZE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_PVC_SIZE
            - name: WORKSPACE_REATTACH_READY_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_REATTACH_READY_TIMEOUT
            - name: WORKSPACE_REATTACH_FRESH_FALLBACK
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_REATTACH_FRESH_FALLBACK
            # Reclaim-on-idle (Task 7): the orchestrator runs
            # suspend_thread_workspace, so it must see this flag too.
            - name: WORKSPACE_RECLAIM_ON_IDLE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_RECLAIM_ON_IDLE
            # Gitea
            - name: GITEA_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: GITEA_URL
            - name: GITEA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: GITEA_ADMIN_USER
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: GITEA_ADMIN_PASSWORD
            - name: GITEA_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: GITEA_INTERNAL_URL
            - name: GITEA_SSH_INTERNAL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: GITEA_SSH_INTERNAL_HOST
            - name: GITEA_SSH_INTERNAL_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: GITEA_SSH_INTERNAL_PORT
            - name: GITEA_SSH_EXTERNAL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: GITEA_SSH_EXTERNAL_HOST
            - name: GITEA_SSH_EXTERNAL_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: GITEA_SSH_EXTERNAL_PORT
            - name: GITEA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: GITEA_OIDC_CLIENT_SECRET
                  optional: true
            # Keycloak SSO
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: KEYCLOAK_URL
            - name: KEYCLOAK_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: KEYCLOAK_ISSUER_URL
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: KEYCLOAK_REALM
            # KEYCLOAK_ADMIN_* — required for runtime project-group sync
            # (KeycloakGroupSync). Without these the orchestrator can't add
            # users to project groups, and OpenCloud's reconciler then strips
            # any direct LibreGraph group membership on the user's next login
            # — leaving them locked out of their project Space.
            #
            # Internal Keycloak: the chart-rendered Secret uses key
            # KEYCLOAK_ADMIN_USER/PASSWORD. External Keycloak: the runtime
            # Vault bundle uses KC_ADMIN_USER/PASSWORD (the bootstrap-Job
            # convention). Same credential either way; just different secret
            # keys depending on who owns the Keycloak instance.
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: {{ if .Values.keycloak.internal }}KEYCLOAK_ADMIN_USER{{ else }}KC_ADMIN_USER{{ end }}
                  optional: true
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: {{ if .Values.keycloak.internal }}KEYCLOAK_ADMIN_PASSWORD{{ else }}KC_ADMIN_PASSWORD{{ end }}
                  optional: true
            # Cookie BFF — see knowledge-base/knowledge/features/auth_bff_and_api_tokens.md.
            # KEYCLOAK_CLIENT_ID + the SRW_* knobs come from the ConfigMap;
            # KC_CLIENT_SECRET is pulled from the runtime srw Secret (synced
            # from the same Vault path as MCP_OIDC_CLIENT_SECRET et al.).
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: KEYCLOAK_CLIENT_ID
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KC_CLIENT_SECRET
            - name: SRW_BFF_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_BFF_REDIRECT_URI
            - name: SRW_SPA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_SPA_BASE_URL
            - name: SRW_COOKIE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_COOKIE_DOMAIN
            - name: SRW_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_COOKIE_SECURE
            - name: SRW_COOKIE_SAMESITE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_COOKIE_SAMESITE
            - name: SRW_SESSION_IDLE_TIMEOUT_S
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_SESSION_IDLE_TIMEOUT_S
            - name: SRW_SESSION_ABSOLUTE_TIMEOUT_S
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_SESSION_ABSOLUTE_TIMEOUT_S
            - name: SRW_ACCESS_TOKEN_REFRESH_SKEW_S
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SRW_ACCESS_TOKEN_REFRESH_SKEW_S
            # Session router config (knowledge-base/knowledge/features/direct_session_websockets.md)
            - name: SESSION_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sessionRouter.jwtSecretName | default (printf "%s-session-jwt" (include "srw.fullname" .)) }}
                  key: {{ .Values.sessionRouter.jwtSecretKey | default "jwt-secret" }}
                  optional: true
            - name: SESSION_JWT_TTL_S
              value: {{ .Values.sessionRouter.jwtTtlSeconds | default 60 | quote }}
            {{- if include "srw.singleOrigin" . }}
            - name: SESSION_PUBLIC_ORIGIN
              value: {{ include "srw.publicOrigin" . | quote }}
            - name: SESSION_INGRESS_HOST
              value: ""
            - name: SESSION_INGRESS_CLASS
              value: {{ include "srw.singleOriginIngressClass" . | quote }}
            - name: SESSION_INGRESS_SINGLE_ORIGIN
              value: "1"
            - name: SESSION_INGRESS_TLS_SECRET
              value: ""
            {{- else }}
            - name: SESSION_PUBLIC_ORIGIN
              value: ""
            - name: SESSION_INGRESS_HOST
              value: {{ .Values.sessionRouter.ingressHost | default (printf "api.%s" .Values.global.domain) | quote }}
            - name: SESSION_INGRESS_CLASS
              value: {{ .Values.sessionRouter.ingressClass | default "traefik" | quote }}
            - name: SESSION_INGRESS_SINGLE_ORIGIN
              value: "0"
            {{- if .Values.sessionRouter.tlsSecretName }}
            # Per-session Ingress emits a `tls:` block so the browser can open
            # wss:// on the same TLS entrypoint as the cockpit. Only needed
            # for split-host edges (cluster-internal LBs without their own
            # ACME flow, local dev with mkcert, etc.).
            - name: SESSION_INGRESS_TLS_SECRET
              value: {{ .Values.sessionRouter.tlsSecretName | quote }}
            {{- end }}
            {{- end }}
            - name: SESSION_INGRESS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SESSION_INGRESS_ANNOTATIONS
              {{- if include "srw.singleOrigin" . }}
              value: {{ mergeOverwrite (dict) (.Values.sessionRouter.annotations | default dict) (dict "kubernetes.io/ingress.class" (include "srw.singleOriginIngressClass" .) "traefik.ingress.kubernetes.io/router.entrypoints" "websecure") | toJson | quote }}
              {{- else }}
              value: {{ .Values.sessionRouter.annotations | default dict | toJson | quote }}
              {{- end }}
            # Name + key of the Secret holding the shared HS256 JWT key.
            # The orchestrator passes both through to dynamically-provisioned
            # agent pod manifests (services/agent_provisioner.py) so the
            # pod's JWT validator (src/agent/api/_session_auth.py) can resolve the
            # same secret/key pair and verify handshake tokens.
            - name: SESSION_JWT_SECRET_NAME
              value: {{ .Values.sessionRouter.jwtSecretName | default (printf "%s-session-jwt" (include "srw.fullname" .)) | quote }}
            - name: SESSION_JWT_SECRET_KEY
              value: {{ .Values.sessionRouter.jwtSecretKey | default "jwt-secret" | quote }}
            # Shared internal auth for MCP and dynamically-provisioned agents.
            # Optional preserves graceful degradation when an externally
            # managed Secret has not enabled delegated internal calls yet.
            - name: MCP_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: MCP_INTERNAL_KEY
                  optional: true
            # Root key for per-workspace code-server credentials. The IDE proxy
            # derives one credential per workspace runtime and injects it into
            # the workspace Pod; code-server refuses anything else, so a proxy
            # that dialled a reused Pod IP is rejected by the destination.
            # `optional` keeps the fail-closed default: without the key no
            # credential exists and the browser IDE stays contained.
            - name: IDE_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: IDE_CREDENTIAL_KEY
                  optional: true
            {{- if .Values.mcp.enabled }}
            # MCP_DEV_TOKEN — dev-only fixed admin MCP token. When set, the
            # orchestrator seeds this exact token for the admin user at startup
            # and on first admin login (init._seed_admin_mcp_token) so a
            # committed .mcp.json works out of the box against a local cluster.
            # optional:true and unset in prod values — prod admins mint tokens
            # via the cockpit, and an unset var means no auto-seed.
            - name: MCP_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: MCP_DEV_TOKEN
                  optional: true
            {{- end }}
            # CORS
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CORS_ORIGINS
            # Cockpit external URL (deep links in notifications)
            - name: COCKPIT_EXTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COCKPIT_EXTERNAL_URL
            # Instruction Builder
            # BUILDER_API_KEY removed — _create_builder_llm now resolves the
            # provider key from system_api_keys (seeded via the llm-seed-job).
            # See knowledge-base/knowledge/api_key_resolution.md for the wire-format vs config-source
            # split.
            # ELEVENLABS_API_KEY — one ElevenLabs account per deployment for the
            # TTS read-aloud voice provider (knowledge-base/knowledge/features/tts_vendor_providers.md).
            # TTS runs in-process here (orchestrator-only), so the orchestrator
            # reads the key directly; it is NOT fanned out to agent/workspace pods.
            # The adapter (services/tts.py) also accepts the key via the
            # `elevenlabs` system_api_keys row when seeded — this env is the
            # simpler Tavily-style path. optional:true so installs without an
            # ElevenLabs account still start.
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: ELEVENLABS_API_KEY
                  optional: true
            # BUILDER_MODEL + BUILDER_LLM_PROVIDER removed in chunk 7 of
            # models_yaml_removal — both resolved from the catalog at
            # request time (system_settings['llm.default_builder_model']
            # + the joined transport's provider_kind/provider_ref).
            # Default Neo4j datasource (local instance — optional)
            - name: DEFAULT_DS_NEO4J_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_NEO4J_URL
                  optional: true
            - name: DEFAULT_DS_NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEO4J_USERNAME
                  optional: true
            - name: DEFAULT_DS_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEO4J_PASSWORD
                  optional: true
            - name: DEFAULT_DS_NEO4J_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_NEO4J_NAME
                  optional: true
            - name: DEFAULT_DS_NEO4J_READ_ONLY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_NEO4J_READ_ONLY
                  optional: true
            {{- if or .Values.nextcloud.enabled (eq (default "" .Values.cloud.externalBackend) "nextcloud") }}
            # Nextcloud — bundled (nextcloud.enabled=true) or external
            # (cloud.externalBackend=nextcloud). Skipped entirely otherwise so
            # the chart doesn't reference Secret keys the operator hasn't
            # populated.
            - name: NEXTCLOUD_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_URL
                  optional: true
            - name: NEXTCLOUD_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_PUBLIC_URL
                  optional: true
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_ADMIN_USER
                  optional: true
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEXTCLOUD_ADMIN_PASSWORD
                  optional: true
            - name: NEXTCLOUD_AGENT_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_AGENT_USER
                  optional: true
            - name: NEXTCLOUD_AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEXTCLOUD_AGENT_PASSWORD
                  optional: true
            {{- if and .Values.nextcloud.enabled (eq (include "srw.nextcloudProtectedEffectEnabled" .) "true") }}
            - name: NEXTCLOUD_PROTECTED_EFFECT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_PROTECTED_EFFECT_URL
                  optional: false
            - name: NEXTCLOUD_PROTECTED_EFFECT_CONFIG_SHA256
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_PROTECTED_EFFECT_CONFIG_SHA256
                  optional: false
            - name: NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.nextcloudProtectedEffectSecretName" . }}
                  key: NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY
                  optional: false
            {{- end }}
            - name: NEXTCLOUD_RCLONE_USER_HOME_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_RCLONE_USER_HOME_USERNAME
                  optional: true
            - name: NEXTCLOUD_RCLONE_USER_HOME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEXTCLOUD_RCLONE_USER_HOME_PASSWORD
                  optional: true
            {{- end }}
            # Default WebDAV datasource (optional)
            - name: DEFAULT_DS_WEBDAV_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_WEBDAV_URL
                  optional: true
            - name: DEFAULT_DS_WEBDAV_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: DEFAULT_DS_WEBDAV_USERNAME
                  optional: true
            - name: DEFAULT_DS_WEBDAV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: DEFAULT_DS_WEBDAV_PASSWORD
                  optional: true
            - name: DEFAULT_DS_WEBDAV_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_WEBDAV_NAME
                  optional: true
            - name: DEFAULT_DS_WEBDAV_READ_ONLY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_WEBDAV_READ_ONLY
                  optional: true
            # Cloud backend selector (set when any cloud is enabled — bundled or external)
            - name: MAIN_CLOUD_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MAIN_CLOUD_BACKEND
                  optional: true
            - name: CLOUD_WORKSPACE_DRIVER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CLOUD_WORKSPACE_DRIVER
            - name: CLOUD_RCLONE_ALLOW_CONTAINER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CLOUD_RCLONE_ALLOW_CONTAINER
                  optional: true
            # Virtual workspace tier (no_workspace_agent_mode.md §4/§5). type/root
            # are non-secret (ConfigMap); for s3 the credentials come from the
            # bundled Secret (VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID /
            # _SECRET_ACCESS_KEY). All optional — absent keys leave the tier
            # disabled.
            - name: VIRTUAL_WORKSPACE_RCLONE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VIRTUAL_WORKSPACE_RCLONE_TYPE
                  optional: true
            - name: VIRTUAL_WORKSPACE_RCLONE_ROOT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VIRTUAL_WORKSPACE_RCLONE_ROOT
                  optional: true
            - name: VIRTUAL_WORKSPACE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VIRTUAL_WORKSPACE_S3_ENDPOINT
                  optional: true
            - name: VIRTUAL_WORKSPACE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VIRTUAL_WORKSPACE_S3_REGION
                  optional: true
            - name: VIRTUAL_WORKSPACE_S3_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VIRTUAL_WORKSPACE_S3_PROVIDER
                  optional: true
            - name: VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID
                  optional: true
            - name: VIRTUAL_WORKSPACE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: VIRTUAL_WORKSPACE_S3_SECRET_ACCESS_KEY
                  optional: true
            {{- if or .Values.opencloud.enabled (eq (default "" .Values.cloud.externalBackend) "opencloud") }}
            # OpenCloud — bundled (opencloud.enabled=true) or external
            # (cloud.externalBackend=opencloud). Skipped entirely otherwise so
            # the chart doesn't reference Secret keys the operator hasn't
            # populated.
            - name: OPENCLOUD_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_URL
                  optional: true
            - name: OPENCLOUD_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_PUBLIC_URL
                  optional: true
            - name: OPENCLOUD_KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_KEYCLOAK_ISSUER
                  optional: true
            - name: OPENCLOUD_KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_KEYCLOAK_CLIENT_ID
                  optional: true
            - name: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
                  optional: true
            - name: OPENCLOUD_MOUNT_INSECURE_TLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_MOUNT_INSECURE_TLS
                  optional: true
            {{- end }}
            # External cloud service account (used with cloud.externalBackend)
            - name: CLOUD_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: CLOUD_SERVICE_USER
                  optional: true
            - name: CLOUD_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: CLOUD_SERVICE_PASSWORD
                  optional: true
            # S3 / MinIO (snapshots + IDE sessions)
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: S3_ENDPOINT
            # S3 credentials are optional — when absent the orchestrator
            # detects "no S3" via empty S3_ENDPOINT and disables snapshots
            # / external IDE session storage.
            - name: SNAPSHOT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SNAPSHOT_S3_ACCESS_KEY_ID
                  optional: true
            - name: SNAPSHOT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SNAPSHOT_S3_SECRET_ACCESS_KEY
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: S3_BUCKET
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: S3_REGION
            - name: SNAPSHOT_MAX_SIZE_GB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SNAPSHOT_MAX_SIZE_GB
            - name: SNAPSHOT_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SNAPSHOT_RETENTION_DAYS
            # Opt-in fail-closed object-store policy (read at lifespan startup).
            - name: OBJECT_STORE_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OBJECT_STORE_REQUIRED
            # IDE sessions
            - name: IDE_SESSION_IDLE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IDE_SESSION_IDLE_TIMEOUT
            - name: IDE_SESSION_MAX_LIFETIME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IDE_SESSION_MAX_LIFETIME
            - name: IDE_MAX_CONCURRENT_PER_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IDE_MAX_CONCURRENT_PER_USER
            - name: CODE_SERVER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CODE_SERVER_IMAGE
            - name: IDE_PROXY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IDE_PROXY_BASE_URL
            # Notification — SMTP
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_PORT
            {{- if .Values.email.enabled }}
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SMTP_PASSWORD
            {{- end }}
            - name: SMTP_USE_TLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_USE_TLS
            - name: SMTP_TRUST_SELF_SIGNED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_TRUST_SELF_SIGNED
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_FROM
            # Notification — IMAP (inbound email replies)
            - name: IMAP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_HOST
            - name: IMAP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_PORT
            {{- if .Values.email.enabled }}
            - name: IMAP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: IMAP_USER
            - name: IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: IMAP_PASSWORD
            {{- end }}
            - name: IMAP_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_USE_SSL
            - name: IMAP_TRUST_SELF_SIGNED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_TRUST_SELF_SIGNED
            - name: IMAP_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_POLL_INTERVAL
            - name: AGENT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AGENT_EMAIL
            - name: MAIL_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MAIL_DOMAIN
            # Notification — Webhooks (optional; empty/missing → transport disabled)
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SLACK_WEBHOOK_URL
                  optional: true
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: DISCORD_WEBHOOK_URL
                  optional: true
            - name: NTFY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NTFY_URL
            - name: NTFY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NTFY_TOPIC
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NTFY_TOKEN
                  optional: true
            # VM lifecycle (optional)
            {{- if .Values.vm.resourceAdmission.observerEnabled }}
            - name: VM_RESOURCE_ADMISSION_CONFIG
              value: {{ include "srw.vmResourceInventoryConfig" . | quote }}
            {{- end }}
            - name: VM_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VM_MODE
            {{- if eq (include "srw.vmMode" .) "external" }}
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NATS_URL
                  optional: true
            - name: ORCHESTRATOR_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: ORCHESTRATOR_ID
                  optional: true
            {{- end }}
            {{- if and (include "srw.vmSameCluster" .) (include "srw.vmLifecycleAuthSecretName" .) }}
            - name: VM_LIFECYCLE_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.vmLifecycleAuthSecretName" . | quote }}
                  key: {{ .Values.vm.lifecycleAuthSecretKey | quote }}
            {{- else if and (eq (include "srw.vmMode" .) "external") (include "srw.vmLifecycleAuthSecretName" .) }}
            - name: VM_LIFECYCLE_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.vmLifecycleAuthSecretName" . | quote }}
                  key: {{ ternary .Values.vm.lifecycleAuthSecretKey (.Values.infrastructureMetering.vmLifecycleAuthSecretKey | default "VM_LIFECYCLE_HMAC_SECRET") (not (empty .Values.vm.lifecycleAuthSecretName)) | quote }}
            {{- end }}
            {{- if include "srw.vmSameCluster" . }}
            - name: VM_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VM_NAMESPACE
                  optional: true
            - name: VM_CONTROLLER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VM_CONTROLLER_URL
                  optional: true
            {{- end }}
            - name: VM_PERSISTENT_ROOTDISK
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VM_PERSISTENT_ROOTDISK
                  optional: true
            # Admission must see the same capabilities as the VM controller.
            {{- range $key, $_ := (include "srw.vmPreparationEnvironment" . | fromYaml) }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" $ }}
                  key: {{ $key }}
            {{- end }}
            # Workspace containers
            - name: WORKSPACE_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_IMAGE
                  optional: true
            - name: WORKSPACE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_NAMESPACE
                  optional: true
            - name: WORKSPACE_FUSE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_FUSE_ENABLED
