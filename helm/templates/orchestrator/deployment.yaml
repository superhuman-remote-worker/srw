            - name: INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY_VERSION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY_VERSION
            - name: INFRASTRUCTURE_METERING_VOLUME_RESOURCE_MAPPINGS_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VOLUME_RESOURCE_MAPPINGS_JSON
            - name: INFRASTRUCTURE_METERING_STABLE_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
