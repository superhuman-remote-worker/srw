            - name: WORKSPACE_SSH_SECRET
              value: {{ include "srw.vmSshKeySecretName" . | quote }}
            - name: AGENT_SECRET
              value: {{ include "srw.secretName" . | quote }}
            - name: AGENT_CONFIGMAP
              value: {{ include "srw.configMapName" . | quote }}
            # Used by AgentProvisioner / PersistentProvisioner to derive
            # the host:port for the wait-for-orchestrator init container
            # injected into dynamically-spawned agent pods. Without this
            # the provisioners fall back to the hardcoded "srw-orchestrator"
            # default — which only matches the dev install's fullnameOverride
            # and breaks every other install (e.g. srw-prod, srw-prod-vm).
            - name: ORCHESTRATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: ORCHESTRATOR_URL
            # Chart-standard labels for dynamically-provisioned agent pods.
            # The chart's database NetworkPolicies match on these labels;
            # without them, dynamic agent pods are blocked from reaching
            # postgres/pgvector/neo4j.
            - name: AGENT_LABEL_NAME
              value: {{ include "srw.name" . | quote }}
            - name: AGENT_LABEL_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: SSH_KEY_PATH
              value: "/run/secrets/vm-ssh-key"
            - name: VM_ROOTDISK_STALL_TIMEOUT_S
              value: {{ .Values.orchestrator.vmProvisioning.rootdiskStallTimeoutSeconds | quote }}
            - name: VM_CREATION_RETRY_ENABLED
              value: {{ .Values.orchestrator.vmProvisioning.creationRetryEnabled | default false | quote }}
            - name: VM_WORKSPACE_RECOVERY_ACCEPTANCE_GATE_ENABLED
              value: {{ .Values.orchestrator.vmWorkspaceRecoveryAcceptanceGate.enabled | quote }}
            {{- if .Values.orchestrator.vmWorkspaceRecoveryAcceptanceGate.enabled }}
            - name: VM_WORKSPACE_RECOVERY_GATE_SLOW_BOOT_SECONDS
              value: "15"
            {{- end }}
            # Budget for the WS proxy's /ready poll. Must outlast the agent's
            # own _poll_workspace_ready (120s) plus margin for cold image pulls.
            - name: WS_READY_TIMEOUT_S
              value: {{ .Values.orchestrator.wsReadyTimeoutSeconds | default 180 | quote }}
            # Budget for the WS proxy waiting for an agent to register and
            # bind to the thread. Must accommodate a cold agent image pull.
            - name: AGENT_BIND_TIMEOUT_S
              value: {{ .Values.orchestrator.agentBindTimeoutSeconds | default 300 | quote }}
            # Persistent agent pods (on-demand provisioning)
            - name: PERSISTENT_AGENT_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: PERSISTENT_AGENT_IMAGE
                  optional: true
            - name: PERSISTENT_AGENT_IMAGE_PULL_POLICY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: PERSISTENT_AGENT_IMAGE_PULL_POLICY
                  optional: true
            - name: PERSISTENT_AGENT_RECONCILIATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: PERSISTENT_AGENT_RECONCILIATION_ENABLED
            - name: OFFICER_RUNTIME_VERIFICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OFFICER_RUNTIME_VERIFICATION_ENABLED
            - name: OFFICER_AUTO_PULL_RELEASE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OFFICER_AUTO_PULL_RELEASE_ENABLED
            {{- if eq (include "srw.vmMode" .) "external" }}
            # Agent tailscale sidecar gate (consumed by AgentProvisioner)
            - name: AGENT_TAILSCALE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AGENT_TAILSCALE_ENABLED
                  optional: true
            - name: AGENT_TAILSCALE_DARK_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AGENT_TAILSCALE_DARK_TIMEOUT_SECONDS
                  optional: true
            - name: HEADSCALE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: HEADSCALE_URL
                  optional: true
            {{- end }}
            # AI Subscriptions proxy (CLIProxyAPI).
            #
            # The Service, the Secret keys and the auth PVC keep their
            # historical CODEX_* names deliberately: the display rename to
            # "Subscription proxy" does not rename storage or Kubernetes
            # objects, so an upgrade needs no credential migration. See
            # knowledge-base/knowledge/features/subscription_proxy.md §8.5.
            - name: CODEX_PROXY_URL
              value: "http://{{ include "srw.fullname" . }}-codex-proxy:8317"
            # CODEX_BASE_URL removed in chunk 7 of models_yaml_removal —
            # the subscription transport is a system endpoint catalog row now,
            # not an env-var-injected base URL.
            - name: CODEX_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: CODEX_MANAGEMENT_KEY
                  optional: true
            {{- if .Values.codexProxy.inferenceApiKeySecret.name }}
            # Optional: a credential distinct from the management key, sent on
            # /v1/* inference calls only. Management and inference auth are
            # separate concerns on CLIProxyAPI; without this the seeder keeps
            # storing the management key as the endpoint credential, which is
            # what every existing deployment does.
            - name: SUBSCRIPTION_PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.codexProxy.inferenceApiKeySecret.name }}
                  key: {{ .Values.codexProxy.inferenceApiKeySecret.key }}
                  optional: true
            {{- end }}
            # Orchestrator settings
            - name: AUTO_ASSIGN_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AUTO_ASSIGN_ENABLED
            # Infrastructure metering Slice 0 dark-launch gates. All default
            # off; setting them does not grant Kubernetes RBAC.
            - name: INFRASTRUCTURE_METERING_V2_READS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_V2_READS_ENABLED
            - name: INFRASTRUCTURE_METERING_SOURCE_AWARE_READS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_SOURCE_AWARE_READS_ENABLED
            - name: INFRASTRUCTURE_METERING_COLLECTOR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_COLLECTOR_ENABLED
            - name: INFRASTRUCTURE_METERING_SHADOW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_SHADOW_ENABLED
            - name: INFRASTRUCTURE_METERING_CUTOVER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_CUTOVER_ENABLED
            - name: INFRASTRUCTURE_METERING_PUBLICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_PUBLICATION_ENABLED
            - name: INFRASTRUCTURE_METERING_PVC_INVENTORY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_PVC_INVENTORY_ENABLED
            - name: INFRASTRUCTURE_METERING_PV_INVENTORY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_PV_INVENTORY_ENABLED
            - name: INFRASTRUCTURE_METERING_PVC_SHADOW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_PVC_SHADOW_ENABLED
            - name: INFRASTRUCTURE_METERING_PV_SHADOW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_PV_SHADOW_ENABLED
            - name: INFRASTRUCTURE_METERING_PVC_PUBLICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_PVC_PUBLICATION_ENABLED
            - name: INFRASTRUCTURE_METERING_PV_PUBLICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_PV_PUBLICATION_ENABLED
            - name: INFRASTRUCTURE_METERING_IDE_POD_SHADOW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_IDE_POD_SHADOW_ENABLED
            - name: INFRASTRUCTURE_METERING_AGENT_POD_SHADOW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_AGENT_POD_SHADOW_ENABLED
            - name: INFRASTRUCTURE_METERING_IDE_POD_PUBLICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_IDE_POD_PUBLICATION_ENABLED
            - name: INFRASTRUCTURE_METERING_AGENT_POD_PUBLICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_AGENT_POD_PUBLICATION_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_INVENTORY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VM_INVENTORY_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_SHADOW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VM_SHADOW_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_PUBLICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VM_PUBLICATION_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_PVC_INVENTORY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VM_PVC_INVENTORY_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_PV_INVENTORY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VM_PV_INVENTORY_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_PVC_SHADOW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VM_PVC_SHADOW_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_PV_SHADOW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VM_PV_SHADOW_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_PVC_PUBLICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: INFRASTRUCTURE_METERING_VM_PVC_PUBLICATION_ENABLED
            - name: INFRASTRUCTURE_METERING_VM_PV_PUBLICATION_ENABLED
              valueFrom:
                configMapKeyRef:
