apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srw.orchestratorServiceAccountName" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
rules:
  # Workspace container + agent pod lifecycle (create, delete, get status,
  # patch labels/annotations from the lifecycle reconciler).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  # Read pod logs before reap — supports the diagnostic log capture added
  # in commit 8e92c81 (Capture agent logs before pod deletion). Without
  # this, AgentProvisioner._capture_agent_logs_before_reap fails with 403
  # and the very logs we need to debug agent-side incidents are lost.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Read a newly provisioned workspace's public SSH host-key fingerprint via
  # the authenticated Kubernetes control plane. Canvas never learns it by
  # trusting the same SFTP socket it is about to use.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Finalizer manipulation for the lifecycle reconciler — guarantees
  # cleanup hooks run before a pod disappears from etcd. Adopted in
  # Phase 1 of the unified instance lifecycle redesign; Phase 1c is the
  # first consumer.
  - apiGroups: [""]
    resources: ["pods/finalizers"]
    verbs: ["update", "patch"]
  # PVC lifecycle for workspace persistence
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch"]
  # Exact UID/resourceVersion finalizer release for retained agent workspaces.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/finalizers"]
    verbs: ["update", "patch"]
  # Per-workspace code-server settings seed ConfigMap (IdeSettingsStore →
  # container_provisioner._create_seed_configmap). Created at provision,
  # replaced on conflict (update), adopted via ownerReference (patch), and
  # GC'd on teardown (delete). Without this the seed step 403s and the
  # workspace boots with default IDE settings instead of the user's.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  # Session router: per-session Service + Ingress lifecycle managed by
  # SessionRouterService when a thread binds to an agent. See
  # knowledge-base/knowledge/features/direct_session_websockets.md §RBAC changes.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "srw.fullname" . }}-orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.orchestratorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.agent.stateless.enabled .Values.agent.stateless.processZeroFinalizer }}
---
# Read-only Node access for the stateless executor retention sweep: an
# executor retained by its process-zero finalizer on a Node that is gone (404)
# or tainted node.kubernetes.io/out-of-service never gets terminal container
# statuses from a kubelet, so the Node is the only evidence left. Exact `get`
# by name only; no list/watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator-node-observer
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator-node-observer
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "srw.fullname" . }}-orchestrator-node-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.orchestratorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- range $namespace := (.Values.agent.pinnedLegacyNamespaces | default list | uniq) }}
{{- if ne $namespace $.Release.Namespace }}
---
# Explicit, temporary cross-namespace authority for exact 0185 adoption and
# convergence. No list/watch/log/exec/Secret access is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "srw.pinnedLegacyAuthorityName" $ }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "srw.componentLabels" (dict "context" $ "component" "orchestrator") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "patch"]
  - apiGroups: [""]
    resources: ["pods/finalizers", "persistentvolumeclaims/finalizers"]
    verbs: ["update", "patch"]
  # A PVC-bound pinned runtime cannot move namespaces during adoption. Publish
  # and retire only its deterministic exact-owner session route in that same
  # explicitly allowlisted legacy namespace.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "srw.pinnedLegacyAuthorityName" $ }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "srw.componentLabels" (dict "context" $ "component" "orchestrator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "srw.pinnedLegacyAuthorityName" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.orchestratorServiceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
