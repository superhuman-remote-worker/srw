apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    # A Service with two ports names both; the API port stays 8085.
    - name: http
      port: 8085
      targetPort: 8085
    {{- with .Values.orchestrator.connectorLeases.exchangePort }}
    # The credential lease exchange (connector drivers C2). Drivers reach it
    # by this Service; no Ingress names this port.
    - name: lease-exchange
      port: {{ . }}
      targetPort: lease-exchange
    {{- end }}
    {{- if and .Values.connectors.servicePods.enabled .Values.orchestrator.connectorLeases.exchangePort }}
    # The exchange server's canary (connector drivers D5): driver pods must
    # find it refused by their own policy while the exchange answers.
    - name: lease-canary
      port: {{ .Values.connectors.servicePods.canaryPort }}
      targetPort: lease-canary
    {{- end }}
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
