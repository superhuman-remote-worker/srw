{{- if include "srw.vmSameCluster" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srw.vmControllerName" . }}
  namespace: {{ include "srw.vmControllerNamespace" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "srw.vmControllerName" . }}
  namespace: {{ include "srw.vmControllerNamespace" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # Keep reconciliation/retirement authority when new builds are disabled.
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete", "patch"]
  # Golden-image cloning: the controller creates a shared golden DataVolume per
  # image digest and GCs stale ones. Same-namespace clone → no
  # datavolumes/source cross-namespace grant needed. PVC delete is needed too:
  # a captured (snapshot-taken) teardown deletes the exact rootdisk PVC by UID
  # precondition after the DataVolume, rather than trusting the cascade, so
  # a superseded incarnation's disk can never be purged by mistake. Without
  # the verb every captured teardown 403s and the job's VM context is left
  # `ready` forever.
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  # Durable replay claims for authenticated create/delete request UUIDs.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "srw.vmControllerName" . }}-node-observer
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
rules:
  # Exact recovery evidence binds a launcher to the immutable Node UID rather
  # than trusting a reusable node name from the Pod spec.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "srw.vmControllerName" . }}-node-observer
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.vmControllerName" . }}
    namespace: {{ include "srw.vmControllerNamespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "srw.vmControllerName" . }}-node-observer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "srw.vmControllerName" . }}
  namespace: {{ include "srw.vmControllerNamespace" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.vmControllerName" . }}
    namespace: {{ include "srw.vmControllerNamespace" . }}
roleRef:
  kind: Role
  name: {{ include "srw.vmControllerName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
