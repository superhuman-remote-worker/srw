{{- if include "srw.vmSameCluster" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.vmControllerName" . }}-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
data:
  vm-template.yaml: |
    apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      name: agent-vm-${JOB_ID}
      labels:
        vm.kubevirt.io/name: agent-vm-${JOB_ID}
        job-id: ${JOB_ID}
        srw.io/owner-kind: "${OWNER_KIND}"
        srw.io/owner-id: "${OWNER_ID}"
    spec:
      runStrategy: RerunOnFailure
      dataVolumeTemplates:
        - metadata:
            name: agent-vm-${JOB_ID}-rootdisk
            labels:
              srw.io/owner-kind: "${OWNER_KIND}"
              srw.io/owner-id: "${OWNER_ID}"
          spec:
            storage:
              accessModes: [ReadWriteOnce]
              # Name the mode; do NOT let CDI infer it. An unset volumeMode is
              # filled from the target StorageClass's CDI StorageProfile, which
              # is empty for rancher.io/local-path (so the omission was
              # invisible) but populated for a real CSI, where it resolves to
              # Block. A Block rootdisk cannot be imported on a node running
              # SELinux with the importer's capabilities dropped. The controller
              # already hardcodes Filesystem for the golden DataVolume and the
              # clone target, so this keeps all three paths in agreement.
              volumeMode: Filesystem
              storageClassName: ${VM_STORAGE_CLASS}
              resources:
                requests:
                  storage: ${VM_DISK_SIZE}
            source:
              registry:
                url: docker://${VM_IMAGE}
      template:
        metadata:
          labels:
            vm.kubevirt.io/name: agent-vm-${JOB_ID}
            job-id: ${JOB_ID}
            srw.io/owner-kind: "${OWNER_KIND}"
            srw.io/owner-id: "${OWNER_ID}"
            srw.io/component: agent-workspace
            srw.io/network-tier: "${NETWORK_TIER}"
        spec:
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          domain:
            cpu:
              cores: ${CPU_CORES}
            memory:
              guest: ${MEMORY}
            devices:
              disks:
                - name: rootdisk
                  disk: {bus: virtio}
                - name: cloud-init
                  disk: {bus: virtio}
              interfaces:
                - name: default
                  masquerade: {}
            machine: {type: q35}
          networks:
            - name: default
              pod: {}
          volumes:
            - name: rootdisk
              dataVolume:
                name: agent-vm-${JOB_ID}-rootdisk
            - name: cloud-init
              cloudInitNoCloud:
                secretRef:
                  name: agent-vm-${JOB_ID}-cloudinit
  cloud-init.yaml: |
    #cloud-config
    write_files:
      - path: /etc/default/srw-guest
        permissions: '0600'
        owner: root:root
        content: |
          ORCHESTRATOR_URL=${ORCHESTRATOR_URL}
          VM_AUTH_TOKEN=${VM_AUTH_TOKEN}
          ENTITY_ID=${JOB_ID}
          ENTITY_TYPE=${OWNER_KIND}
          JOB_ID=${JOB_ID}
          VM_ID=agent-vm-${JOB_ID}
      - path: /run/agent/job-config.json
        permissions: '0644'
        content: |
          {
            "job_id": "${JOB_ID}",
            "agent_config": "${AGENT_CONFIG}",
            "cpu_cores": ${CPU_CORES},
            "memory": "${MEMORY}"
          }
      - path: /etc/ssh/authorized_keys/agent-host
        permissions: '0600'
        owner: agent-host:agent-host
        content: |
          ${SSH_AUTHORIZED_KEY}
      - path: /usr/local/bin/srw-network-qualification
        permissions: '0755'
        owner: root:root
        content: |
          #!/usr/bin/env python3
          # Read-only retained-disk recovery evidence. This deliberately does
          # not clean cloud-init state or rewrite legacy network configuration.
          import glob
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          def command(*argv):
              result = subprocess.run(argv, check=False, capture_output=True,
                                      text=True, timeout=5)
              return result.stdout.strip() if result.returncode == 0 else None

          def command_json(*argv):
              value = command(*argv)
              return json.loads(value) if value is not None else None

          def hashes(pattern):
              return {
                  path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
                  for path in sorted(glob.glob(pattern))
                  if pathlib.Path(path).is_file()
              }

          challenge = sys.argv[1] if len(sys.argv) == 2 else ''
          if not challenge:
              raise SystemExit(2)
          raw_interfaces = command_json('ip', '-j', 'address')
          routes = command_json('ip', '-j', 'route')
          if not isinstance(raw_interfaces, list) or not isinstance(routes, list):
              raise SystemExit(3)
          interfaces = []
          for item in raw_interfaces:
              addresses = item.get('addr_info') or []
              local = next((entry.get('local') for entry in addresses
                            if entry.get('local')), None)
              if item.get('ifname') != 'lo' and local and item.get('address'):
                  interfaces.append({
                      'ifname': item['ifname'],
                      'address': local,
                      'mac': item['address'],
                  })
          default_route = next((route for route in routes
                                if route.get('dst') in
                                ('default', '0.0.0.0/0', '::/0')), None)
          instance_id = pathlib.Path('/var/lib/cloud/data/instance-id')
          cache = pathlib.Path('/var/lib/cloud/instances')
          cache_entries = '\n'.join(
              str(path.relative_to(cache))
              for path in sorted(cache.rglob('*'))
              if path.is_file()
          )
          boot_id = pathlib.Path(
              '/proc/sys/kernel/random/boot_id').read_text().strip()
          machine_id = pathlib.Path('/etc/machine-id').read_text().strip()
          print(json.dumps({
              'challenge': challenge,
              'boot_id': boot_id,
              'machine_id': machine_id,
              'interfaces': interfaces,
              'address': interfaces[0]['address'] if interfaces else None,
              'routes': routes,
              'default_route': default_route,
              'dns': pathlib.Path('/etc/resolv.conf').read_text(errors='replace'),
              'netplan_sha256': hashes('/etc/netplan/*'),
              'networkd_sha256': hashes('/etc/systemd/network/*'),
              'cloud_init_instance_id': (
                  instance_id.read_text().strip() if instance_id.is_file() else None
              ),
              'cloud_init_cache_identity': hashlib.sha256(
                  cache_entries.encode()).hexdigest() if cache_entries else None,
              'cloud_init_cache_cleaned': False,
          }, sort_keys=True))
    runcmd:
      - mkdir -p /run/agent
      - chmod 755 /run/agent
      # The controller injects ssh_keys into the per-VM Secret at render time.
      # Regenerating here would replace the orchestrator-pinned identity.
      - systemctl restart ssh
      - systemctl daemon-reload
      - systemctl enable management-daemon.service
      - systemctl start management-daemon.service
      - systemctl restart sudo-gated.socket
{{- end }}
