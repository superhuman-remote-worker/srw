{{- if and (include "srw.vmSameCluster" .) .Values.vm.resourceAdmission.observerEnabled .Values.vm.resourceAdmission.clusterWidePodReadAcknowledged }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "srw.vmControllerName" . }}-resource-observer
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "persistentvolumes"]
    verbs: ["list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "srw.vmControllerName" . }}-resource-observer
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.vmControllerName" . }}
    namespace: {{ include "srw.vmControllerNamespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "srw.vmControllerName" . }}-resource-observer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
