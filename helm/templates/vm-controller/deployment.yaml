{{- if include "srw.vmSameCluster" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.vmControllerName" . }}
  namespace: {{ include "srw.vmControllerNamespace" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  replicas: 1
  # Lifecycle create/delete locking is process-local; avoid rollout overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "vm-controller") | nindent 6 }}
  template:
    metadata:
      {{- if (get (.Values.vm.resourceAdmission | default dict) "observerEnabled" | default false) }}
      annotations:
        checksum/vm-resource-policy: {{ include "srw.vmResourceInventoryConfig" . | sha256sum | quote }}
      {{- end }}
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "vm-controller") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "srw.vmControllerName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vm-controller
          image: "{{ .Values.vmController.image.repository }}:{{ .Values.vmController.image.tag }}"
          imagePullPolicy: {{ .Values.vmController.image.pullPolicy }}
          env:
            {{- if (get (.Values.vm.resourceAdmission | default dict) "observerEnabled" | default false) }}
            - name: VM_RESOURCE_ADMISSION_CONFIG
              value: {{ include "srw.vmResourceInventoryConfig" . | quote }}
            {{- end }}
            - name: TRANSPORT
              value: "http"
            - name: LISTEN_PORT
              value: {{ .Values.vmController.service.port | quote }}
            - name: VM_TEMPLATE_PATH
              value: "/config/vm-template.yaml"
            - name: VM_CLOUD_INIT_PATH
              value: "/config/cloud-init.yaml"
            - name: VM_NAMESPACE
              value: {{ include "srw.vmControllerNamespace" . | quote }}
            - name: DEFAULT_VM_IMAGE
              value: {{ .Values.vmController.defaultVmImage | default (printf "ghcr.io/superhuman-remote-worker/srw-agent-vm-base:v%s" .Chart.AppVersion) | quote }}
            - name: VM_NETWORK_PROFILE_ENABLED
              value: {{ .Values.vmController.networkProfile.enabled | default false | quote }}
            - name: VM_NETWORK_PROFILE_IMAGE_ALLOWLIST
              value: {{ join "," (.Values.vmController.networkProfile.imageAllowlist | default list) | quote }}
            - name: DEFAULT_CPU
              value: {{ .Values.vmController.defaultCpu | quote }}
            - name: DEFAULT_MEMORY
              value: {{ .Values.vmController.defaultMemory | quote }}
            - name: VM_STORAGE_CLASS
              value: {{ .Values.vmController.vmStorageClass | quote }}
            - name: VM_DISK_SIZE
              value: {{ .Values.vmController.vmDiskSize | quote }}
            - name: ORCHESTRATOR_URL
              value: {{ include "srw.orchestratorClusterUrl" . | quote }}
            - name: VM_DEFAULT_NETWORK_TIER
              value: {{ .Values.vmController.defaultNetworkTier | quote }}
            - name: VM_MAX_CONCURRENT
              value: {{ .Values.vmController.maxConcurrentVms | quote }}
            - name: VM_NODE_SELECTOR
              value: {{ toJson .Values.vmController.nodeSelector | quote }}
            - name: VM_TOLERATIONS
              value: {{ toJson .Values.vmController.tolerations | quote }}
            - name: SSH_AUTHORIZED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.vmSshKeySecretName" . | quote }}
                  key: ssh-publickey
            {{- if include "srw.vmLifecycleAuthSecretName" . }}
            - name: VM_LIFECYCLE_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.vmLifecycleAuthSecretName" . | quote }}
                  key: {{ .Values.vm.lifecycleAuthSecretKey | quote }}
            {{- end }}
            # Golden-image boot acceleration
            # (knowledge-base/knowledge/features/vm_golden_image_boot_acceleration.md)
            - name: VM_GOLDEN_IMAGE_ENABLED
              value: {{ .Values.vmController.goldenImage.enabled | default false | quote }}
            - name: VM_GOLDEN_DISK_SIZE
              value: {{ .Values.vmController.goldenImage.diskSize | default .Values.vmController.vmDiskSize | quote }}
            - name: VM_GOLDEN_GC_ENABLED
              value: {{ .Values.vmController.goldenImage.gc.enabled | default true | quote }}
            - name: VM_GOLDEN_KEEP
              value: {{ .Values.vmController.goldenImage.gc.keep | default 3 | quote }}
            - name: VM_GOLDEN_GC_MIN_AGE_MINUTES
              value: {{ .Values.vmController.goldenImage.gc.minAgeMinutes | default 30 | quote }}
            # Persistent rootdisks (knowledge-base/knowledge/features/vm_persistent_rootdisk.md)
            - name: VM_PERSISTENT_ROOTDISK
              value: {{ .Values.vmController.persistentRootdisk.enabled | default false | quote }}
            - name: VM_ROOTDISK_GC_ENABLED
              value: {{ .Values.vmController.persistentRootdisk.gc.enabled | default false | quote }}
            - name: VM_ROOTDISK_ORPHAN_HOURS
              value: {{ .Values.vmController.persistentRootdisk.gc.orphanHours | default 72 | quote }}
            {{- range $key, $value := (include "srw.vmPreparationEnvironment" . | fromYaml) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.vmController.service.port }}
              protocol: TCP
          volumeMounts:
            - name: vm-template
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.vmController.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: vm-template
          configMap:
            name: {{ include "srw.vmControllerName" . }}-template
{{- end }}
