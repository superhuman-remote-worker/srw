{{- if .Values.searxng.enabled }}
{{- $component := "searxng" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-searxng" (include "srw.fullname" .)) -}}
{{- $secret := "" -}}
{{- if and $existing $existing.data (index $existing.data "SEARXNG_SECRET") -}}
{{- $secret = index $existing.data "SEARXNG_SECRET" | b64dec -}}
{{- end -}}
{{- if not $secret -}}{{- $secret = randAlphaNum 48 -}}{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.fullname" . }}-searxng
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
data:
  settings.yml: |
    use_default_settings: true
    general:
      debug: false
      instance_name: "Superhuman Remote Worker Search"
    search:
      safe_search: 1
      autocomplete: ""
      formats:
        - html
        - json
    server:
      bind_address: "0.0.0.0"
      port: {{ .Values.searxng.service.port }}
      secret_key: "overridden-by-SEARXNG_SECRET"
      limiter: false
      image_proxy: false
    {{- with .Values.searxng.engines }}
    engines:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "srw.fullname" . }}-searxng
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # A Helm install gets a private instance secret. On upgrade, preserve the
  # live value so ordinary renders do not rotate it.
  SEARXNG_SECRET: {{ $secret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-searxng
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.searxng | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: searxng
          image: {{ .Values.searxng.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.fullname" . }}-searxng
                  key: SEARXNG_SECRET
          ports:
            - name: http
              containerPort: {{ .Values.searxng.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "srw.fullname" . }}-searxng
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.serviceName" (dict "context" . "component" $component) }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.searxng.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" $component) | nindent 4 }}
{{- end }}
