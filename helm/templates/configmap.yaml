apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.configMapName" . }}
  labels:
    {{- include "srw.labels" . | nindent 4 }}
data:
  MANIFEST_NETWORK_ISOLATION_VERIFIED: {{ .Values.manifestHosting.networkIsolationVerified | quote }}
  MANIFEST_NAMESPACE: {{ .Values.manifestHosting.namespace | default (printf "%s-native" (include "srw.fullname" . | trunc 56 | trimSuffix "-")) | quote }}
  MANIFEST_MAX_CONCURRENT_JOBS: {{ .Values.manifestHosting.maxConcurrentJobs | quote }}
  MANIFEST_HARNESS_EGRESS: {{ toJson .Values.manifestHosting.harnessEgress | quote }}
  # PostgreSQL (App DB) — non-secret connection parts. The DSN is composed
  # at runtime from these + POSTGRES_USER/POSTGRES_PASSWORD (Secret), with
  # URL-quoting applied to the credentials. Storing a full DATABASE_URL in
  # the Secret was redundant and a footgun (urlsplit truncates netlocs at
  # the first ``/`` — passwords with a slash broke config parsing).
  POSTGRES_HOST: {{ include "srw.postgresHost" . | quote }}
  POSTGRES_PORT: {{ include "srw.postgresPort" . | quote }}
  POSTGRES_DB: {{ include "srw.postgresDb" . | quote }}
  POSTGRES_SSLMODE: {{ .Values.databases.postgres.sslMode | default "prefer" | quote }}

  # Vector DB — non-secret connection parts. Composed with
  # VECTOR_POSTGRES_USER/VECTOR_POSTGRES_PASSWORD from the Secret.
  VECTOR_POSTGRES_HOST: {{ include "srw.vectorPostgresHost" . | quote }}
  VECTOR_POSTGRES_PORT: {{ include "srw.vectorPostgresPort" . | quote }}
  VECTOR_POSTGRES_DB: {{ include "srw.vectorPostgresDb" . | quote }}
  VECTOR_POSTGRES_SSLMODE: {{ .Values.databases.vector.sslMode | default "prefer" | quote }}

  # Audit DB (srw-auditdb) — non-secret connection parts. Composed with
  # AUDIT_POSTGRES_USER/AUDIT_POSTGRES_PASSWORD from the Secret. Agent pods
  # inherit this ConfigMap via envFrom, so the audit writer reaches them too.
  AUDIT_POSTGRES_HOST: {{ include "srw.auditPostgresHost" . | quote }}
  AUDIT_POSTGRES_PORT: {{ include "srw.auditPostgresPort" . | quote }}
  AUDIT_POSTGRES_DB: {{ include "srw.auditPostgresDb" . | quote }}
  AUDIT_POSTGRES_SSLMODE: {{ .Values.databases.audit.sslMode | default "prefer" | quote }}

  # App-DB asyncpg pool sizing for provisioned agent pods, which inherit this
  # ConfigMap via envFrom. Kept SMALL on purpose: the connection multiplier is
  # agent COUNT (maxAgents), so a fat per-agent pool exhausts the app DB's
  # max_connections. The agent's vector pool reads the same POSTGRES_* env, so
  # this one knob bounds both. The ORCHESTRATOR does NOT envFrom this ConfigMap
  # — it sizes its own (larger) control/vector/audit pools via explicit env in
  # orchestrator/deployment.yaml, so these agent-scale values never reach it.
  POSTGRES_MIN_CONNECTIONS: {{ .Values.agent.dbPool.app.min | quote }}
  POSTGRES_MAX_CONNECTIONS: {{ .Values.agent.dbPool.app.max | quote }}

  # Active checkpointer backend (sqlite|postgres). Worker agents read it to pick
  # the LangGraph checkpointer (postgres = shared Postgres, cross-pod resume);
  # the orchestrator reads it to prune checkpoints on terminal. Agents inherit
  # via envFrom; the orchestrator gets it as an explicit env (see
  # orchestrator/deployment.yaml). Default postgres (cross-pod resume on);
  # set checkpointer.backend=sqlite to fall back to the legacy pod-local store.
  CHECKPOINTER_BACKEND: {{ .Values.checkpointer.backend | default "postgres" | quote }}

  # The generic stateless executor gate is also the session-admission gate.
  # Keeping one rendered value prevents admission without an executor pool.
  # Worker *admission* remains separately gated so enabling stateless sessions
  # cannot silently move new jobs off the pinned dispatcher. Executor-mode
  # pods keep claiming durable worker_batch residue after admission is closed.
  # Agents inherit these keys via envFrom; the orchestrator references them
  # explicitly from this same ConfigMap.
  STATELESS_SESSION_ENABLED: {{ .Values.agent.stateless.enabled | default false | quote }}
  STATELESS_CLOUD_PUSH_RECOVERY_ENABLED: {{ and .Values.agent.stateless.enabled .Values.agent.stateless.cloudPushRecoveryEnabled | quote }}
  SESSION_REWIND_IDLE_CONVERSATION_ENABLED: {{ .Values.agent.stateless.rewind.idleConversationEnabled | default false | quote }}
  STATELESS_WORKER_ENABLED: {{ .Values.agent.stateless.worker.enabled | default false | quote }}
  STATELESS_WORKER_DEFAULT_ENABLED: {{ .Values.agent.stateless.worker.defaultEnabled | default false | quote }}
  # Hold-aware workers and the orchestrator read the same default-off protocol
  # gate. Recovery budgets remain visible even while automation is disabled so
  # an enable is one coordinated Pod rollout rather than an implicit default.
  VM_WORKSPACE_RECOVERY_ENABLED: {{ $vmRecovery.enabled | quote }}
  VM_WORKSPACE_REPLACEMENT_RECOVERY_ENABLED: {{ $vmRecovery.replacementEnabled | quote }}
  VM_WORKSPACE_RECOVERY_DEADLINE_SECONDS: {{ $vmRecovery.deadlineSeconds | quote }}
  VM_WORKSPACE_RECOVERY_MAX_GLOBAL_PROBES: {{ $vmRecovery.maxGlobalProbes | quote }}
  VM_WORKSPACE_RECOVERY_MAX_PROBES_PER_NODE: {{ $vmRecovery.maxProbesPerNode | quote }}
  VM_WORKSPACE_RECOVERY_CLAIM_TTL_SECONDS: {{ $vmRecovery.claimTtlSeconds | quote }}
  VM_WORKSPACE_RECOVERY_PERMIT_TTL_SECONDS: {{ $vmRecovery.permitTtlSeconds | quote }}
  VM_WORKSPACE_RECOVERY_EXTERNAL_CALL_TIMEOUT_SECONDS: {{ $vmRecovery.externalCallTimeoutSeconds | quote }}
  COMPLETION_COMMANDS_ENABLED: {{ .Values.orchestrator.completionCommandsEnabled | default false | quote }}
  # Admission policy is persisted per command; this value never reorders an
  # already accepted row after a restart or rollback.
  COMPLETION_STATUS_REORDER_ENABLED: {{ .Values.orchestrator.completionStatusReorderEnabled | default false | quote }}
  COMPLETION_FINALIZER_INLINE_DELAY_SECONDS: {{ .Values.orchestrator.completionFinalizerInlineDelaySeconds | default 0 | quote }}
  # Two-stage rollout fence for the interim dedicated Officer-pod owner.
  PERSISTENT_AGENT_RECONCILIATION_ENABLED: {{ .Values.orchestrator.persistentAgentReconciliationEnabled | default false | quote }}
  # Reader-first rollout gate for terminal direct-human input cancellation.
  # Provisioned pinned agents inherit this ConfigMap via envFrom.
  PERSISTENT_INPUT_CANCELLATION_ENABLED: {{ .Values.agent.persistentInputCancellationEnabled | default false | quote }}
  # Admin-only exact-binding longevity/fault verification seam. Dark in every
  # normal profile and consumed only by the orchestrator.
  OFFICER_RUNTIME_VERIFICATION_ENABLED: {{ .Values.orchestrator.officerRuntimeVerificationEnabled | default false | quote }}
  # BP-01 owner control ships dark until the unattended-release scorecard is
  # complete. This gates new pulls even if unsupported JSON already says true.
  OFFICER_AUTO_PULL_RELEASE_ENABLED: {{ .Values.orchestrator.officerAutoPullReleaseEnabled | default false | quote }}
  WORKER_BATCH_MIN_WALL_SECONDS: {{ .Values.agent.stateless.worker.batchMinWallSeconds | default 300 | quote }}

  # Reject pickle fallback in LangGraph checkpoint serialization. This is
  # required for every worker process that can read shared Postgres state.
  LANGGRAPH_STRICT_MSGPACK: "true"

  # LLM-outage/cooldown pause budget (seconds; default 12h). Read by BOTH the
  # orchestrator give-up ceiling (evaluate_llm_outage) AND every agent pod's
  # cooldown pause-vs-fail-fast cutoff (src/agent/graph.py _COOLDOWN_MAX_PAUSE_SECONDS)
  # — they MUST agree, so both read this one ConfigMap key. Agents inherit via
  # envFrom; the orchestrator references it explicitly (see
  # orchestrator/deployment.yaml). knowledge-base/knowledge/features/llm_cooldown_pause_and_resume.md
  LLM_OUTAGE_CEILING_SECONDS: {{ .Values.llmOutage.ceilingSeconds | default 43200 | quote }}

  # (Citations live in the vector store — srw_vector — reached through the
  # agent's shared VECTOR_POSTGRES_* pool. No separate citation DB/role/DSN.
  # See knowledge-history/done/citation_engine_integration.md.)

  # Gitea
  GITEA_URL: {{ include "srw.gitUrl" . | quote }}
  GITEA_INTERNAL_URL: {{ include "srw.giteaInternalUrl" . | quote }}
  {{- if .Values.gitea.ssh.enabled }}
  GITEA_SSH_INTERNAL_HOST: {{ default (ternary (printf "%s-gitea" (include "srw.fullname" .)) "" .Values.gitea.internal) .Values.gitea.ssh.internalHost | quote }}
  GITEA_SSH_INTERNAL_PORT: {{ .Values.gitea.ssh.internalPort | quote }}
  GITEA_SSH_EXTERNAL_HOST: {{ .Values.gitea.ssh.externalHost | quote }}
  GITEA_SSH_EXTERNAL_PORT: {{ .Values.gitea.ssh.externalPort | quote }}
  {{- else }}
  GITEA_SSH_INTERNAL_HOST: ""
  GITEA_SSH_INTERNAL_PORT: "0"
  GITEA_SSH_EXTERNAL_HOST: ""
  GITEA_SSH_EXTERNAL_PORT: "0"
  {{- end }}

  # Orchestrator
  ORCHESTRATOR_URL: {{ printf "http://%s:8085" (include "srw.serviceName" (dict "context" . "component" "orchestrator")) | quote }}
  # Public component declarations only. Agent pods inherit this ConfigMap;
  # the orchestrator references this key explicitly.
  SRW_DEPLOYMENT_PROVENANCE_JSON: {{ include "srw.deploymentProvenanceJson" . | quote }}

  # Workspace
  WORKSPACE_PATH: {{ "/workspace" | quote }}
  WORKSPACE_STORAGE_CLASS: {{ .Values.workspace.ephemeralStorageClass | default "longhorn-ephemeral" | quote }}
  WORKSPACE_PVC_ENABLED: {{ .Values.workspace.pvcEnabled | default false | quote }}
  WORKSPACE_PVC_SIZE: {{ .Values.workspace.pvcSize | default "10Gi" | quote }}
  # Single-replica node-loss fallback (Phase 3b): extended reattach ready-wait
  # (gives a transient node reboot time to recover before discarding) + the
  # data-destructive discard kill-switch.
  WORKSPACE_REATTACH_READY_TIMEOUT: {{ .Values.workspace.reattachReadyTimeout | default 180 | quote }}
  WORKSPACE_REATTACH_FRESH_FALLBACK: {{ .Values.workspace.freshFallback | quote }}
  # Default-dark background replay for durable non-pinned cleanup generations.
  # Explicit operations and generations already admitted by the database can
  # still converge while this is false.
  WORKSPACE_CLEANUP_RECONCILIATION_ENABLED: {{ .Values.orchestrator.workspaceCleanupReconciliationEnabled | default false | quote }}
  # Reclaim-on-idle (Task 7, opt-in, fail-safe): drop a session's workspace
  # PVC on idle-suspend once its S3 snapshot verifies restorable. Default off
  # keeps today's retain-on-idle behavior. See workspace_suspension.py and
  # knowledge-base/knowledge/features/workspace_durability_tiering.md §D3.
  WORKSPACE_RECLAIM_ON_IDLE: {{ .Values.workspace.reclaimOnIdle | default false | quote }}

  # Agent
  AGENT_CONFIG: {{ .Values.agent.config | quote }}
  AGENT_PORT: {{ .Values.agent.port | quote }}
  PERSISTENT_AGENT_CONFIG: {{ .Values.agent.persistentConfig | quote }}

  # Apply DB-backed config overrides (admin-curated rows in the config_overrides
  # table) to dynamically provisioned agents. Read by the agent prompt loader
  # (src/shared/runtime/core/loader.py) via envFrom on this shared ConfigMap. Default-off
  # chart-wide (prod-safe); the dev/experimental values file turns it on.
  CONFIG_DB_OVERRIDES_ENABLED: {{ .Values.agent.configDbOverridesEnabled | default "false" | quote }}
  # DB-backed experts (experts table). The orchestrator owns selection and
  # resolved-config delivery; agents receive the flag through the shared
  # ConfigMap for compatibility. Enabled because root creation resolves DB pointers;
  # false is retained only as an emergency compatibility switch.
  EXPERTS_DB_ENABLED: {{ .Values.agent.expertsDbEnabled | default "true" | quote }}
  # DB-backed Agent Skills (skills + skill_files). Read by the orchestrator's
  # skill CRUD/list endpoints. Default-off chart-wide (prod-safe); dev turns it on.
  SKILLS_DB_ENABLED: {{ .Values.agent.skillsDbEnabled | default "false" | quote }}
  # Emergency operator-only withdrawal of the immutable App Guide + reader.
  # Negative/default-off by design; provisioned agent pods inherit this value
  # via envFrom and expose operator_break_glass in persistent-agent health.
  APP_GUIDE_BREAK_GLASS_DISABLED: {{ .Values.agent.appGuideBreakGlassDisabled | default "false" | quote }}
  # Temporary operator-owned dark-launch gate for the authenticated M2
  # product-capability endpoint. It is deliberately not a user preference.
  PRODUCT_CAPABILITIES_ENDPOINT_ENABLED: {{ .Values.agent.productCapabilitiesEndpointEnabled | default "false" | quote }}
  # Separate default-off canary for the persistent-session capability tool.
  # Agent pods inherit it through envFrom; it does not enable the endpoint.
  PRODUCT_CAPABILITIES_TOOL_ENABLED: {{ .Values.agent.productCapabilitiesToolEnabled | default "false" | quote }}
  # User-added MCP servers. stdio is separately gated because it runs
  # third-party commands inside dynamically provisioned agent pods.
  MCP_DATASOURCES_ENABLED: {{ .Values.agent.mcpDatasourcesEnabled | default "false" | quote }}
  MCP_STDIO_ENABLED: {{ .Values.agent.mcpStdioEnabled | default "false" | quote }}
  # Compatibility gate for omitted datasource_ids on root REST/session work.
  DATASOURCE_DEFAULTS_ON_OMISSION: {{ .Values.agent.datasourceDefaultsOnOmission | default "false" | quote }}
  # Capability-advertisement gate for datasource project scope + auto-attach.
  DATASOURCE_SCOPE_AUTO_ATTACH_V1_ENABLED: {{ .Values.agent.datasourceScopeAutoAttachV1Enabled | default "false" | quote }}
  # Protected cloud mode: RO-reader provisioning + capture overlay. Read by the
  # orchestrator's RO engage gate + reader reconciler. Default-off (prod-safe).
  PROTECTED_CLOUD_MODE_ENABLED: {{ .Values.agent.protectedCloudModeEnabled | default "false" | quote }}
  # Exact-owner lifecycle CAS. Migration 0185 uses a drained maintenance
  # cutover, so every post-cutover pinned runtime must carry this identity.
  REQUIRE_PINNED_STATUS_IDENTITY: {{ .Values.agent.requirePinnedStatusIdentity | default "true" | quote }}
  # 0200 never guesses where a historical NULL-namespace authority lives.
  # The active Release.Namespace is searched automatically; this is the
  # bounded, operator-owned set of prior namespaces retained for adoption.
  PINNED_LEGACY_AGENT_NAMESPACES: {{ .Values.agent.pinnedLegacyNamespaces | default list | uniq | join "," | quote }}
  # Forward-only v1 VM remote-effect admission. It remains dark until Helm's
  # Recreate cutover has eliminated every predecessor replica.
  VM_REMOTE_OPERATION_PROTOCOL_ENABLED: {{ ternary "true" "false" (.Values.orchestrator.vmRemoteOperationProtocol.enabled | default false) | quote }}
  # Dynamic Canvas workspace-port live preview master gate. The orchestrator
  # derives the positive attach capability and rechecks every mutation; agents
  # never infer support from this environment value. Provisioned agents inherit
  # this shared ConfigMap, while the public-origin gateway uses its dedicated
  # allowlisted ConfigMap and separate database credential Secret. The
  # operator-owned edge and verified deployment attestations remain required.
  CANVAS_LIVE_PREVIEW_ENABLED: {{ ternary "true" "false" .Values.canvas.livePreview.enabled | quote }}
  CANVAS_LIVE_PREVIEW_DENIED_PORTS: {{ join "," .Values.canvas.livePreview.deniedPorts | quote }}
  # Workspace-Chromium screencast/input relay. Dark by default.
  CANVAS_SHARED_BROWSER_ENABLED: {{ ternary "true" "false" .Values.canvas.sharedBrowser.enabled | quote }}
  # Browser-facing viewer gate and isolation attestations. These stay present
  # but disabled/empty in ordinary installs so both the API capability and the
  # separate gateway fail closed.
  CANVAS_VIEWER_ENABLED: {{ ternary "true" "false" .Values.canvas.livePreview.viewer.enabled | quote }}
  CANVAS_VIEWER_DEPLOYMENT_PROFILE: {{ .Values.canvas.livePreview.viewer.deploymentProfile | quote }}
  CANVAS_VIEWER_COOKIE_MODE: {{ .Values.canvas.livePreview.viewer.cookieMode | quote }}
  CANVAS_VIEWER_DOMAIN: {{ .Values.canvas.livePreview.viewer.domain | quote }}
  CANVAS_VIEWER_HOST_SUFFIX: {{ .Values.canvas.livePreview.viewer.hostSuffix | quote }}
  CANVAS_VIEWER_COCKPIT_ORIGINS: {{ join "," .Values.canvas.livePreview.viewer.cockpitOrigins | quote }}
  CANVAS_VIEWER_PSL_BOUNDARY_VERIFIED: {{ ternary "true" "false" .Values.canvas.livePreview.viewer.pslBoundaryVerified | quote }}
  CANVAS_VIEWER_SESSION_TTL_SECONDS: {{ .Values.canvas.livePreview.viewer.sessionTtlSeconds | int | quote }}
  CANVAS_VIEWER_BOOTSTRAP_TTL_SECONDS: {{ .Values.canvas.livePreview.viewer.bootstrapTtlSeconds | int | quote }}
  CANVAS_VIEWER_ATTACHMENT_TTL_SECONDS: {{ .Values.canvas.livePreview.viewer.attachmentTtlSeconds | int | quote }}
  CANVAS_VIEWER_REVALIDATE_SECONDS: {{ .Values.canvas.livePreview.viewer.revalidateSeconds | int | quote }}
  CANVAS_VIEWER_MAX_CONNECTIONS: {{ .Values.canvas.livePreview.viewer.limits.maxConnections | int | quote }}
  CANVAS_VIEWER_MAX_HTTP_PER_SESSION: {{ .Values.canvas.livePreview.viewer.limits.maxHttpPerSession | int | quote }}
  CANVAS_VIEWER_MAX_HEADER_BYTES: {{ .Values.canvas.livePreview.viewer.limits.maxHeaderBytes | int | quote }}
  CANVAS_VIEWER_MAX_HEADER_FIELDS: {{ .Values.canvas.livePreview.viewer.limits.maxHeaderFields | int | quote }}
  CANVAS_VIEWER_MAX_QUERY_BYTES: {{ .Values.canvas.livePreview.viewer.limits.maxQueryBytes | int | quote }}
  CANVAS_VIEWER_MAX_QUERY_FIELDS: {{ .Values.canvas.livePreview.viewer.limits.maxQueryFields | int | quote }}
  CANVAS_VIEWER_MAX_REQUEST_BODY_BYTES: {{ .Values.canvas.livePreview.viewer.limits.maxRequestBodyBytes | int | quote }}
  CANVAS_VIEWER_MAX_RESPONSE_BODY_BYTES: {{ .Values.canvas.livePreview.viewer.limits.maxResponseBodyBytes | int | quote }}
  CANVAS_VIEWER_CONNECT_TIMEOUT_SECONDS: {{ .Values.canvas.livePreview.viewer.limits.connectTimeoutSeconds | int | quote }}
  CANVAS_VIEWER_IDLE_TIMEOUT_SECONDS: {{ .Values.canvas.livePreview.viewer.limits.idleTimeoutSeconds | int | quote }}
  CANVAS_VIEWER_EXCHANGE_TIMEOUT_SECONDS: {{ .Values.canvas.livePreview.viewer.limits.exchangeTimeoutSeconds | int | quote }}
  # Read-only Office Canvas / WOPI host. Values stay present but disabled or
  # empty in ordinary installs so no capability is advertised accidentally.
  COLLABORA_ENABLED: {{ ternary "true" "false" .Values.collabora.enabled | quote }}
  COLLABORA_INTERNAL_URL: {{ include "srw.collaboraInternalUrl" . | quote }}
  COLLABORA_PUBLIC_URL: {{ .Values.collabora.publicUrl | default "" | quote }}
  COLLABORA_WOPI_BASE_URL: {{ include "srw.orchestratorInternalUrl" . | quote }}
  COLLABORA_COCKPIT_ORIGIN: {{ include "srw.cockpitUrl" . | quote }}
  COLLABORA_TOKEN_TTL_SECONDS: {{ .Values.collabora.tokenTtlSeconds | int | quote }}
  COLLABORA_DISCOVERY_CACHE_TTL_SECONDS: {{ .Values.collabora.discoveryCacheTtlSeconds | int | quote }}
  COLLABORA_DISCOVERY_TIMEOUT_SECONDS: {{ .Values.collabora.discoveryTimeoutSeconds | quote }}
  CANVAS_MAX_OFFICE_BYTES: {{ .Values.collabora.maxOfficeBytes | int | quote }}
  # Effective context ceiling for models routed via the system codex proxy
  # (CLIProxyAPI / ChatGPT-OAuth backend), which caps context far below the
  # models' true API windows and rejects larger inputs with `context_too_large`.
  # Read by src/shared/runtime/core/model_registry.py (_cap_context_window) at dispatch. Set 0 to
  # disable the day OpenAI ships 1M-for-Codex. New sessions only (agents read env
  # at pod start). See knowledge-base/knowledge/issues/codex_proxy_context_window_cap.md.
  CODEX_CONTEXT_WINDOW_CAP: {{ .Values.agent.codexContextWindowCap | default 400000 | quote }}

  # OIDC / SSO — works with internal Keycloak or external OIDC provider
  KEYCLOAK_URL: {{ include "srw.keycloakInternalUrl" . | quote }}
  KEYCLOAK_ISSUER_URL: {{ include "srw.authUrl" . | quote }}
  KEYCLOAK_REALM: {{ .Values.keycloak.realm | quote }}
  # Orchestrator BFF client (confidential, NOT the cockpit SPA public client).
  # The cockpit SPA still uses .Values.keycloak.cockpitClientId for its
  # PKCE-only Bearer flow.
  KEYCLOAK_CLIENT_ID: {{ .Values.auth.bff.clientId | quote }}
  {{- if .Values.keycloak.adminApiDisabled }}
  KEYCLOAK_ADMIN_API_DISABLED: {{ "true" | quote }}
  {{- end }}

  # Cookie BFF — orchestrator-issued sessions for the cockpit.
  # See knowledge-base/knowledge/features/auth_bff_and_api_tokens.md.
  # When sameOriginApi=true, the BFF redirect lives on the cockpit origin
  # (path-routed to the orchestrator) so the OIDC callback and the cockpit
  # share an origin and the session cookie is first-party.
  SRW_BFF_REDIRECT_URI: {{ printf "%s/auth/callback" (ternary (include "srw.publicOrigin" .) (ternary (include "srw.cockpitUrl" .) (include "srw.apiUrl" .) .Values.auth.bff.sameOriginApi) (ne (include "srw.singleOrigin" .) "")) | quote }}
  SRW_SPA_BASE_URL: {{ include "srw.cockpitUrl" . | quote }}
  # auth.bff.cookieDomain semantics:
  #   "auto" (default) → ".<global.domain>" (rides on cockpit + api subdomains)
  #   ""               → host-only (right for localhost dev where browsers
  #                                  may reject Domain=.localhost as a public-suffix)
  #   anything else    → emitted literally
  SRW_COOKIE_DOMAIN: {{ if include "srw.singleOrigin" . }}""{{ else if eq .Values.auth.bff.cookieDomain "auto" }}{{ printf ".%s" .Values.global.domain | quote }}{{ else }}{{ .Values.auth.bff.cookieDomain | quote }}{{ end }}
  SRW_COOKIE_SECURE: {{ ternary "1" (.Values.auth.bff.cookieSecure | default "1") (ne (include "srw.singleOrigin" .) "") | quote }}
  SRW_COOKIE_SAMESITE: {{ ternary "lax" (.Values.auth.bff.cookieSamesite | default "lax") (ne (include "srw.singleOrigin" .) "") | quote }}
  SRW_SESSION_IDLE_TIMEOUT_S: {{ .Values.auth.bff.sessionIdleTimeoutSeconds | default 1800 | int | quote }}
  SRW_SESSION_ABSOLUTE_TIMEOUT_S: {{ .Values.auth.bff.sessionAbsoluteTimeoutSeconds | default 2592000 | int | quote }}
  SRW_ACCESS_TOKEN_REFRESH_SKEW_S: {{ .Values.auth.bff.accessTokenRefreshSkewSeconds | default 60 | int | quote }}

  # CORS (orchestrator reads this comma-separated list for allowed origins).
  # Canonical cockpit URL first, then any ingress.cors.additionalOrigins (e.g.
  # a legacy hostname kept as an alias during a domain migration).
  CORS_ORIGINS: {{ ternary (include "srw.publicOrigin" .) (concat (list (include "srw.cockpitUrl" .)) (.Values.ingress.cors.additionalOrigins | default list) | join ",") (ne (include "srw.singleOrigin" .) "") | quote }}

  # Cockpit external URL (for deep links in emails/notifications)
  COCKPIT_EXTERNAL_URL: {{ include "srw.cockpitUrl" . | quote }}

  # LLM routing
  # All routing (base URLs, vision/embedding/codex/builder model IDs and
  # providers) moved to admin-curated catalog rows + default-model pins:
  #   - system_api_keys + llm_endpoints → transports (helm-seeded)
  #   - models table → catalog rows (provider_kind + provider_ref + capability)
  #   - default_llm_models → admin-pinned per-capability defaults
  # Removed in chunk 7 of models_yaml_removal: VISION_MODEL, EMBEDDING_MODEL,
  # EMBEDDING_BASE_URL, CODEX_BASE_URL, BUILDER_LLM_PROVIDER. See
  # knowledge-base/knowledge/features/models_yaml_removal.md.
  KEY_COOLDOWN_SECONDS: {{ .Values.llm.keyCooldownSeconds | quote }}

  # (Citation embeddings now share SRW's EMBEDDING_* service — same 4096-dim
  # qwen3-embedding-8b model that backs memory/KB — so there is no separate
  # CITATION_EMBEDDING_* stack. See knowledge-history/done/citation_engine_integration.md.)

  # Codex raw-response diagnostic capture. Agent pods inherit this via envFrom,
  # so flipping llm.debugCodexRawResponse in values(-local).yaml enables the
  # /v1/responses usage-block dump on the next freshly-provisioned agent pod.
  DEBUG_CODEX_RAW_RESPONSE: {{ .Values.llm.debugCodexRawResponse | default "0" | quote }}
  CODEX_RAW_DUMP_DIR: {{ .Values.llm.codexRawDumpDir | default "/app/logs/codex-raw" | quote }}

  # Orchestrator settings
  AUTO_ASSIGN_ENABLED: {{ .Values.orchestrator.autoAssignEnabled | quote }}
  # Infrastructure metering gates and bounded Slice 1 collection settings.
  INFRASTRUCTURE_METERING_V2_READS_ENABLED: {{ .Values.infrastructureMetering.v2ReadsEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_SOURCE_AWARE_READS_ENABLED: {{ .Values.infrastructureMetering.sourceAwareReadsEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_COLLECTOR_ENABLED: {{ .Values.infrastructureMetering.collectorEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_SHADOW_ENABLED: {{ .Values.infrastructureMetering.shadowEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_CUTOVER_ENABLED: {{ .Values.infrastructureMetering.cutoverEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_PUBLICATION_ENABLED: {{ .Values.infrastructureMetering.publicationEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_PVC_INVENTORY_ENABLED: {{ .Values.infrastructureMetering.pvcInventoryEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_PV_INVENTORY_ENABLED: {{ .Values.infrastructureMetering.pvInventoryEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_PVC_SHADOW_ENABLED: {{ .Values.infrastructureMetering.pvcShadowEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_PV_SHADOW_ENABLED: {{ .Values.infrastructureMetering.pvShadowEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_PVC_PUBLICATION_ENABLED: {{ .Values.infrastructureMetering.pvcPublicationEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_PV_PUBLICATION_ENABLED: {{ .Values.infrastructureMetering.pvPublicationEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_IDE_POD_SHADOW_ENABLED: {{ .Values.infrastructureMetering.idePodShadowEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_AGENT_POD_SHADOW_ENABLED: {{ .Values.infrastructureMetering.agentPodShadowEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_IDE_POD_PUBLICATION_ENABLED: {{ .Values.infrastructureMetering.idePodPublicationEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_AGENT_POD_PUBLICATION_ENABLED: {{ .Values.infrastructureMetering.agentPodPublicationEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_INVENTORY_ENABLED: {{ .Values.infrastructureMetering.vmInventoryEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_SHADOW_ENABLED: {{ .Values.infrastructureMetering.vmShadowEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_PUBLICATION_ENABLED: {{ .Values.infrastructureMetering.vmPublicationEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_PVC_INVENTORY_ENABLED: {{ .Values.infrastructureMetering.vmPvcInventoryEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_PV_INVENTORY_ENABLED: {{ .Values.infrastructureMetering.vmPvInventoryEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_PVC_SHADOW_ENABLED: {{ .Values.infrastructureMetering.vmPvcShadowEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_PV_SHADOW_ENABLED: {{ .Values.infrastructureMetering.vmPvShadowEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_PVC_PUBLICATION_ENABLED: {{ .Values.infrastructureMetering.vmPvcPublicationEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_PV_PUBLICATION_ENABLED: {{ .Values.infrastructureMetering.vmPvPublicationEnabled | default false | quote }}
  INFRASTRUCTURE_METERING_VM_PV_CLUSTER_WIDE_RBAC_ACKNOWLEDGED: {{ .Values.infrastructureMetering.vmPvClusterWideRbacAcknowledged | default false | quote }}
  INFRASTRUCTURE_METERING_VM_STABLE_CLUSTER_ID: {{ $vmMeteringStableClusterId | quote }}
  INFRASTRUCTURE_METERING_VM_NAMESPACE: {{ $vmMeteringNamespace | quote }}
  INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY_VERSION: {{ .Values.infrastructureMetering.volumeIdentityKeyVersion | default "" | quote }}
  INFRASTRUCTURE_METERING_VOLUME_RESOURCE_MAPPINGS_JSON: {{ .Values.infrastructureMetering.volumeResourceMappings | default list | toJson | quote }}
  INFRASTRUCTURE_METERING_STABLE_CLUSTER_ID: {{ .Values.infrastructureMetering.stableClusterId | default "" | quote }}
  INFRASTRUCTURE_METERING_DEPLOYMENT_MODE: {{ .Values.infrastructureMetering.deploymentMode | default "dedicated" | quote }}
  INFRASTRUCTURE_METERING_NAMESPACE_ALLOWLIST: {{ concat (list .Release.Namespace) (.Values.infrastructureMetering.namespaceAllowlist | default list) | uniq | join "," | quote }}
  INFRASTRUCTURE_METERING_RELIST_INTERVAL_SECONDS: {{ .Values.infrastructureMetering.relistIntervalSeconds | default 300 | quote }}
  INFRASTRUCTURE_METERING_STALE_AFTER_SECONDS: {{ .Values.infrastructureMetering.staleAfterSeconds | default 900 | quote }}
  INFRASTRUCTURE_METERING_MAX_COLLECTOR_CLOCK_SKEW_SECONDS: {{ .Values.infrastructureMetering.maxCollectorClockSkewSeconds | default 300 | quote }}
  INFRASTRUCTURE_METERING_LIST_PAGE_SIZE: {{ .Values.infrastructureMetering.listPageSize | default 500 | quote }}
  INFRASTRUCTURE_METERING_SCOPE_CONCURRENCY: {{ .Values.infrastructureMetering.scopeConcurrency | default 2 | quote }}
  INFRASTRUCTURE_METERING_WATCH_QUEUE_SIZE: {{ .Values.infrastructureMetering.watchQueueSize | default 10000 | quote }}
  INFRASTRUCTURE_METERING_MAX_SNAPSHOT_ITEMS: {{ .Values.infrastructureMetering.maxSnapshotItems | default 50000 | quote }}
  INFRASTRUCTURE_METERING_MAX_SNAPSHOT_BYTES: {{ .Values.infrastructureMetering.maxSnapshotBytes | default 67108864 | int64 | quote }}
  INFRASTRUCTURE_METERING_INGESTION_TICKET_TTL_SECONDS: {{ .Values.infrastructureMetering.ingestionTicketTtlSeconds | default 600 | quote }}
  INFRASTRUCTURE_METERING_SNAPSHOT_ITEM_RETENTION_DAYS: {{ .Values.infrastructureMetering.snapshotItemRetentionDays | default 7 | quote }}
  INFRASTRUCTURE_METERING_DIAGNOSTIC_RETENTION_DAYS: {{ .Values.infrastructureMetering.diagnosticRetentionDays | default 35 | quote }}
  INFRASTRUCTURE_METERING_CLEANUP_INTERVAL_SECONDS: {{ .Values.infrastructureMetering.cleanupIntervalSeconds | default 300 | quote }}

  # Neo4j — only the Bolt URL is non-secret. Both NEO4J_USERNAME and
  # NEO4J_PASSWORD live in the Secret/Vault, mirroring the POSTGRES_USER /
  # VECTOR_POSTGRES_USER / CITATION_POSTGRES_USER pattern. The Neo4j server
  # image's NEO4J_AUTH env var is composed at pod-start from those two via
  # K8s $(VAR) substitution.
  {{- if .Values.databases.neo4j.enabled }}
  NEO4J_URL: {{ include "srw.neo4jUrl" . | quote }}
  DEFAULT_DS_NEO4J_URL: {{ include "srw.neo4jUrl" . | quote }}
  DEFAULT_DS_NEO4J_NAME: {{ "Default Neo4j" | quote }}
  DEFAULT_DS_NEO4J_READ_ONLY: {{ "false" | quote }}
  {{- end }}

  # S3 / Object Storage
  S3_ENDPOINT: {{ include "srw.effectiveS3Endpoint" . | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  SNAPSHOT_MAX_SIZE_GB: {{ .Values.s3.snapshotMaxSizeGb | quote }}
  SNAPSHOT_RETENTION_DAYS: {{ .Values.s3.snapshotRetentionDays | quote }}
  # Opt-in fail-closed: when "true" the orchestrator refuses to start unless
  # both object-store seams are configured (default warn-only).
  OBJECT_STORE_REQUIRED: {{ .Values.s3.required | default false | quote }}

  # IDE sessions
  IDE_SESSION_IDLE_TIMEOUT: {{ .Values.ide.sessionIdleTimeout | quote }}
  IDE_SESSION_MAX_LIFETIME: {{ .Values.ide.sessionMaxLifetime | quote }}
  IDE_MAX_CONCURRENT_PER_USER: {{ .Values.ide.maxConcurrentPerUser | quote }}
  CODE_SERVER_IMAGE: {{ .Values.ide.codeServerImage | quote }}
  IDE_PROXY_BASE_URL: {{ include "srw.apiUrl" . | quote }}

  # Notification — SMTP
  SMTP_HOST: {{ .Values.email.smtp.host | quote }}
  SMTP_PORT: {{ .Values.email.smtp.port | quote }}
  SMTP_USE_TLS: {{ .Values.email.smtp.useTls | quote }}
  SMTP_TRUST_SELF_SIGNED: {{ .Values.email.smtp.trustSelfSigned | quote }}
  SMTP_FROM: {{ .Values.email.smtp.from | quote }}

  # Notification — IMAP
  IMAP_HOST: {{ .Values.email.imap.host | quote }}
  IMAP_PORT: {{ .Values.email.imap.port | quote }}
  IMAP_USE_SSL: {{ .Values.email.imap.useSsl | quote }}
  IMAP_TRUST_SELF_SIGNED: {{ .Values.email.imap.trustSelfSigned | quote }}
  IMAP_POLL_INTERVAL: {{ .Values.email.imap.pollInterval | quote }}
  AGENT_EMAIL: {{ .Values.email.agentEmail | quote }}
  MAIL_DOMAIN: {{ .Values.email.domain | quote }}

  # Notification — Ntfy (optional)
  NTFY_URL: {{ .Values.notifications.ntfy.url | quote }}
  NTFY_TOPIC: {{ .Values.notifications.ntfy.topic | quote }}

  # Nextcloud — internal + public URLs
  {{- if .Values.nextcloud.enabled }}
  NEXTCLOUD_URL: {{ printf "http://%s" (include "srw.serviceName" (dict "context" . "component" "nextcloud")) | quote }}
  NEXTCLOUD_PUBLIC_URL: {{ include "srw.cloudUrl" . | quote }}
  NEXTCLOUD_ADMIN_USER: {{ "admin" | quote }}
  NEXTCLOUD_AGENT_USER: {{ "agent-service" | quote }}
  {{- if (eq (include "srw.nextcloudProtectedEffectEnabled" .) "true") }}
  # Server-enforced bounded lane for the five attempt-scoped authority POSTs.
  NEXTCLOUD_PROTECTED_EFFECT_URL: {{ printf "http://%s" (include "srw.nextcloudProtectedEffectName" .) | quote }}
  NEXTCLOUD_PROTECTED_EFFECT_CONFIG_SHA256: {{ include "srw.nextcloudProtectedEffectConfigSha256" . | quote }}
  {{- end }}

  # Nextcloud / WebDAV datasource (optional)
  DEFAULT_DS_WEBDAV_URL: {{ printf "http://%s/remote.php/dav/files/admin/" (include "srw.serviceName" (dict "context" . "component" "nextcloud")) | quote }}
  DEFAULT_DS_WEBDAV_NAME: {{ "Nextcloud" | quote }}
  DEFAULT_DS_WEBDAV_READ_ONLY: {{ "false" | quote }}
  {{- end }}

  # Main-cloud workspace data plane. "sync" preserves the legacy eager clone
  # path; "rclone_mount" asks supported agent runtimes to expose cloud folders
  # through lazy rclone/FUSE mounts instead.
  CLOUD_WORKSPACE_DRIVER: {{ .Values.cloud.workspaceDriver | default "rclone_mount" | quote }}
  CLOUD_RCLONE_ALLOW_CONTAINER: {{ ternary "true" "false" .Values.cloud.rcloneMount.allowContainer | quote }}

  # Virtual workspace tier (no_workspace_agent_mode.md §4/§5) — object store for
  # `workspace.backend: virtual` agents. Empty type disables the tier (a virtual
  # job/session then fails fast). For s3, endpoint/region/provider are non-secret
  # (here); credentials are the Secret keys VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID /
  # _SECRET_ACCESS_KEY, wired separately on the orchestrator pod.
  VIRTUAL_WORKSPACE_RCLONE_TYPE: {{ include "srw.effectiveVwRcloneType" . | quote }}
  VIRTUAL_WORKSPACE_RCLONE_ROOT: {{ include "srw.effectiveVwRcloneRoot" . | quote }}
  VIRTUAL_WORKSPACE_S3_ENDPOINT: {{ include "srw.effectiveVwEndpoint" . | quote }}
  VIRTUAL_WORKSPACE_S3_REGION: {{ .Values.virtualWorkspace.s3.region | default "us-east-1" | quote }}
  VIRTUAL_WORKSPACE_S3_PROVIDER: {{ include "srw.effectiveVwProvider" . | quote }}
  {{- if .Values.cloud.nextcloudRcloneUserHomeUsername }}
  NEXTCLOUD_RCLONE_USER_HOME_USERNAME: {{ .Values.cloud.nextcloudRcloneUserHomeUsername | quote }}
  {{- end }}

  # Cloud backend — opencloud (bundled), nextcloud (bundled), external, or unset
  {{- if .Values.opencloud.enabled }}
  MAIN_CLOUD_BACKEND: {{ "opencloud" | quote }}
  OPENCLOUD_URL: {{ printf "http://%s:9200" (include "srw.serviceName" (dict "context" . "component" "opencloud")) | quote }}
  OPENCLOUD_PUBLIC_URL: {{ include "srw.cloudUrl" . | quote }}
  OPENCLOUD_KEYCLOAK_ISSUER: {{ printf "%s/realms/%s" (include "srw.keycloakInternalUrl" .) .Values.keycloak.realm | quote }}
  OPENCLOUD_KEYCLOAK_CLIENT_ID: {{ "opencloud-orchestrator" | quote }}
  {{- if .Values.opencloud.mountInsecureTls }}
  # Local-dev only: rclone mounts skip TLS verification on the tus
  # data-gateway hop (mkcert edge cert). Never enable on real deployments.
  OPENCLOUD_MOUNT_INSECURE_TLS: "true"
  {{- end }}
  {{- else if .Values.nextcloud.enabled }}
  MAIN_CLOUD_BACKEND: {{ "nextcloud" | quote }}
  {{- else if .Values.cloud.externalBackend }}
  MAIN_CLOUD_BACKEND: {{ .Values.cloud.externalBackend | quote }}
  {{- if eq .Values.cloud.externalBackend "nextcloud" }}
  NEXTCLOUD_URL: {{ include "srw.cloudServiceUrl" . | quote }}
  NEXTCLOUD_PUBLIC_URL: {{ required "cloud.externalUrl is required when cloud.externalBackend is set" .Values.cloud.externalUrl | quote }}
  {{- else if eq .Values.cloud.externalBackend "opencloud" }}
  OPENCLOUD_URL: {{ include "srw.cloudServiceUrl" . | quote }}
  OPENCLOUD_PUBLIC_URL: {{ required "cloud.externalUrl is required when cloud.externalBackend is set" .Values.cloud.externalUrl | quote }}
  OPENCLOUD_KEYCLOAK_ISSUER: {{ printf "%s/realms/%s" (include "srw.keycloakInternalUrl" .) .Values.keycloak.realm | quote }}
  OPENCLOUD_KEYCLOAK_CLIENT_ID: {{ "opencloud-orchestrator" | quote }}
  {{- else if eq .Values.cloud.externalBackend "webdav" }}
  DEFAULT_DS_WEBDAV_URL: {{ include "srw.cloudServiceUrl" . | quote }}
  DEFAULT_DS_WEBDAV_NAME: {{ "External WebDAV" | quote }}
  DEFAULT_DS_WEBDAV_READ_ONLY: {{ "false" | quote }}
  {{- end }}
  {{- end }}

  # NATS — when nats.internal=true, points at the in-cluster Service;
  # otherwise the user-supplied .Values.nats.url (empty disables VM lifecycle).
  NATS_URL: {{ include "srw.natsUrl" . | quote }}
  VM_MODE: {{ include "srw.vmMode" . | quote }}
  {{- if eq (include "srw.vmMode" .) "external" }}
  # Per-orchestrator id used to scope vm.lifecycle.* NATS subjects. Must match
  # the paired VM controller chart's orchestratorId.
  ORCHESTRATOR_ID: {{ include "srw.orchestratorId" . | quote }}
  {{- end }}

  {{- if include "srw.vmSameCluster" . }}
  # VM Controller (HTTP transport, same-cluster mode).
  VM_CONTROLLER_URL: {{ include "srw.vmControllerUrl" . | quote }}
  VM_NAMESPACE: {{ .Release.Namespace | quote }}
  {{- end }}

  # -- Persistent VM rootdisks (knowledge-base/knowledge/features/vm_persistent_rootdisk.md).
  # MUST mirror the VM controller's own vmController.persistentRootdisk.enabled
  # (in same-cluster mode, this release's own vm-controller). The orchestrator
  # reads this to decide whether a VM's files survive a teardown — notably
  # whether VM session suspend may proceed without a snapshot. Enable the
  # CONTROLLER first: turning it on here against a controller that still
  # cascade-deletes disks would suspend sessions into nothing.
  VM_PERSISTENT_ROOTDISK: {{ .Values.vmController.persistentRootdisk.enabled | default false | quote }}
  {{- include "srw.vmPreparationEnvironment" . | nindent 2 }}

  {{- if eq (include "srw.vmMode" .) "external" }}
  # Headscale and agent mesh are external-VM topology settings.
  HEADSCALE_URL: {{ include "srw.headscaleUrl" . | quote }}

  # Agent tailscale sidecar gate (read by AgentProvisioner). When "false",
  # dynamically provisioned agent pods skip the tailscale sidecar entirely.
  AGENT_TAILSCALE_ENABLED: {{ .Values.agent.tailscale.enabled | quote }}
  # Sustained-dark window (seconds) for the agent tailscale sidecar liveness probe.
  AGENT_TAILSCALE_DARK_TIMEOUT_SECONDS: {{ .Values.agent.tailscale.darkTimeoutSeconds | default 600 | quote }}
  {{- end }}

  # Workspace containers (per-job sandboxed execution environments)
  WORKSPACE_IMAGE: {{ include "srw.imageRef" (dict "image" .Values.image.workspace) | quote }}
  WORKSPACE_NAMESPACE: {{ .Release.Namespace | quote }}
  WORKSPACE_FUSE_ENABLED: {{ ternary "true" "false" .Values.workspace.fuse.enabled | quote }}
  WORKSPACE_FUSE_PRIVILEGED: {{ ternary "true" "false" .Values.workspace.fuse.privileged | quote }}

  # PR 3 — one-time seed knob for the homelab operator. Empty in SaaS deployments.
  # When set, orchestrator init flips this user's default project from
  # the database default 'internet-only' to 'home-allowed' on first boot.
  OPERATOR_HOME_ALLOWED_EMAIL: {{ .Values.workspace.networkPolicy.operatorHomeAllowedEmail | default "" | quote }}

  # Agent pods (on-demand via AgentProvisioner)
  AGENT_IMAGE: {{ include "srw.imageRef" (dict "image" .Values.image.agent) | quote }}
  PERSISTENT_AGENT_IMAGE: {{ include "srw.imageRef" (dict "image" .Values.image.agent) | quote }}
  PERSISTENT_AGENT_IMAGE_PULL_POLICY: {{ .Values.image.agent.pullPolicy | quote }}

  # Agent pool sizing (AgentProvisioner)
  MAX_AGENTS: {{ .Values.agent.pool.maxAgents | quote }}
  MIN_AGENTS: {{ .Values.agent.pool.minAgents | quote }}
  AGENT_BUFFER: {{ .Values.agent.pool.buffer | quote }}
  RESERVED_SESSION_SLOTS: {{ .Values.agent.pool.reservedSessionSlots | quote }}
  RESERVED_JOB_SLOTS: {{ .Values.agent.pool.reservedJobSlots | quote }}

  # Logging
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  # JSON structured logs for the aggregation pipeline (Alloy -> Loki); "text"
  # for human-readable output. See knowledge-base/knowledge/features/centralized_logging.md.
  LOG_FORMAT: {{ .Values.logFormat | default "text" | quote }}

  # License acceptance (enforced at runtime by orchestrator)
  LICENSE_TERMS_ACCEPTED: {{ .Values.license.acceptTerms | quote }}
