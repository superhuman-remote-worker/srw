{{- if (include "srw.dbRendersStatefulset" (dict "context" . "key" "keycloak")) }}
# Dedicated PostgreSQL for the bundled Keycloak.
#
# Keeps the IdP's data plane isolated from the orchestrator's `srw-postgres`.
# The Postgres superuser IS the Keycloak DB user — POSTGRES_USER=keycloak,
# POSTGRES_DB=keycloak — which means no init script, no postStart hook, no
# separate role provisioning. Keycloak connects with KC_DB_USERNAME=keycloak
# and KC_DB_PASSWORD from the secret (same key already used elsewhere).
#
# NOTE: component label is short ("keycloakdb") so the StatefulSet name stays
# under 52 chars — the controller-revision-hash label adds "-<10char>"
# (11 chars), and total label value must be <= 63 chars.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "srw.fullname" . }}-keycloakdb-data
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloakdb") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.databases.keycloak.storageClass }}
  storageClassName: {{ .Values.databases.keycloak.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.databases.keycloak.storageSize }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "srw.fullname" . }}-keycloakdb
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloakdb") | nindent 4 }}
spec:
  serviceName: {{ include "srw.fullname" . }}-keycloakdb
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "keycloakdb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "keycloakdb") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.databases.keycloak.image }}
          {{- with .Values.databases.keycloak.maxConnections }}
          # The same max_connections CloudNativePG gets via srw.dbParameters.
          # No `command`: the image's docker-entrypoint.sh prepends `postgres`
          # when the first argument is a flag.
          args:
            - "-c"
            - {{ printf "max_connections=%v" . | quote }}
          {{- end }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "keycloak"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KC_DB_PASSWORD
            - name: POSTGRES_DB
              value: "keycloak"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.databases.keycloak.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-keycloakdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-keycloakdb
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloakdb") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "keycloakdb") | nindent 4 }}
{{- end }}
