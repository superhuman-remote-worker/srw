{{/*
CloudNativePG Cluster for one bundled database.

The cluster NAME equals the current Service name, so CNPG's "<name>-rw"
service is the only thing Phase 4's host helpers have to change.

Credentials come from a derived basic-auth Secret rather than CNPG's own
generated one, so every consumer's env stays untouched (see cnpg-credentials.yaml).

Rendered only when `databases.<name>.engine` is `migrating` or `cnpg`; the
chart default is `statefulset`, so a default release is unaffected.
*/}}
{{- define "srw.cnpgCluster" -}}
{{- $ctx := .context -}}
{{- $db := .db -}}
{{- $instances := int (include "srw.dbInstances" (dict "context" $ctx "db" $db)) -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "srw.fullname" $ctx }}-{{ .component }}
  labels:
    {{- include "srw.componentLabels" (dict "context" $ctx "component" .component) | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  instances: {{ $instances }}
  {{- with $db.cnpgImage }}
  # Omitted when empty: CNPG then uses its own default operand image. The
  # StatefulSet's `image` is NOT interchangeable -- its tag grammar
  # ("pg15") fails CNPG's version parse.
  imageName: {{ . }}
  {{- end }}
  {{- if eq (include "srw.dbEngine" (dict "context" $ctx "db" $db)) "cnpg" }}
  # Carries the chart's component labels onto every pod CNPG creates, so the
  # existing NetworkPolicy selectors keep matching unmodified.
  #
  # ONLY at engine `cnpg`, never while `migrating`. The legacy Service selects
  # on these exact labels, and during `migrating` it still exists and still
  # carries live traffic -- so labelling the new pods would make that Service
  # load-balance across the real database and a half-imported copy. Reads would
  # be intermittently wrong and any write landing on the new cluster would be
  # lost when the import is discarded.
  #
  # The cost is that no NetworkPolicy selects the importing cluster during the
  # window, so it is reachable in-namespace. That window is short and holds a
  # copy, where the alternative corrupts the original.
  inheritedMetadata:
    labels:
      {{- include "srw.componentSelectorLabels" (dict "context" $ctx "component" .component) | nindent 6 }}
  {{- end }}
  # Smart shutdown waits for client SESSIONS to end; pooled clients never end
  # theirs, so this timer is what a node drain or rolling upgrade actually pays
  # before CNPG will promote a replica. See databases.smartShutdownTimeout.
  smartShutdownTimeout: {{ $ctx.Values.databases.smartShutdownTimeout | int }}
  storage:
    # cnpgStorageSize when set. A logical import needs room for the data, the
    # indexes it rebuilds AND the WAL it generates, all on this one volume --
    # more than the legacy pod ever needed. Raising the shared `storageSize`
    # instead would resize the LEGACY PVC too, and a PVC cannot shrink.
    size: {{ $db.cnpgStorageSize | default $db.storageSize }}
    {{- if $db.storageClass }}
    storageClass: {{ $db.storageClass }}
    {{- end }}
  affinity:
    enablePodAntiAffinity: true
    # Hard once there is more than one instance: replicas stacked on a single
    # node look like insurance and are not. Pending is the honest failure.
    podAntiAffinityType: {{ if gt $instances 1 }}required{{ else }}preferred{{ end }}
    topologyKey: {{ $ctx.Values.databases.ha.topologyKey | quote }}
  postgresql:
    # Always render parameters, never an empty mapping: `postgresql:` with no
    # children YAML-parses to null, which breaks every consumer that expects a
    # dict. The connection budget lives here now, where the StatefulSet used to
    # inherit the image default of 100, alongside the memory GUCs derived from
    # resources.limits.memory. See srw.dbParameters for the precedence rules.
    parameters:
      {{- include "srw.dbParameters" (dict "context" $ctx "db" $db "name" .component) | nindent 6 }}
    {{- with $db.extensions }}
    extensions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if (include "srw.dbBacksUp" (dict "context" $ctx "key" .key)) }}
  {{- if (include "srw.backupIsObjectStore" $ctx) }}
  # Continuous WAL archiving. Base backups come from the ScheduledBackup beside
  # this; both go through the same plugin and the same ObjectStore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "srw.fullname" $ctx }}-backups
  {{- else }}
  {{- $snap := $ctx.Values.databases.backup.volumeSnapshot }}
  {{- if not $snap.className }}
  {{- fail "databases.backup.method is volumeSnapshot but databases.backup.volumeSnapshot.className is empty. It is storage-driver specific, so there is no safe default -- `kubectl get volumesnapshotclass` lists yours. If that command errors, the snapshot.storage.k8s.io CRDs are not installed and this method cannot work at all." }}
  {{- end }}
  # CSI snapshots, coordinated by CloudNativePG (pg_backup_start/stop) rather
  # than taken behind the database's back. NOTE: no WAL archiving in this mode,
  # so recovery granularity is the snapshot interval, not point-in-time.
  backup:
    volumeSnapshot:
      className: {{ $snap.className | quote }}
      {{- with $snap.walClassName }}
      walClassName: {{ . | quote }}
      {{- end }}
      online: {{ $snap.online }}
      onlineConfiguration:
        # The closing WAL segment is inside the volume being snapshotted (no
        # separate walStorage), so waiting for it to reach an archive that does
        # not exist would hang the backup forever.
        waitForArchive: {{ $snap.waitForArchive }}
  {{- end }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .database | quote }}
      owner: {{ .owner | quote }}
      secret:
        name: {{ include "srw.fullname" $ctx }}-{{ .component }}-app
      {{- with $ctx.Values.databases.locale }}
      # initdb defaults --lc-collate/--lc-ctype to `C` because the operand
      # image sets no LANG, while every legacy SRW database is en_US.utf8.
      # Left unpinned the import silently re-sorts text, breaks upper() on
      # non-ASCII, and re-tokenises full text -- which is what made pgvector's
      # restore die on `string is too long for tsvector`. initdb-only: these
      # cannot be changed once the Cluster exists.
      {{- with .encoding }}
      encoding: {{ . | quote }}
      {{- end }}
      {{- with .collate }}
      localeCollate: {{ . | quote }}
      {{- end }}
      {{- with .ctype }}
      localeCType: {{ . | quote }}
      {{- end }}
      {{- end }}
      {{- if eq (include "srw.dbEngine" (dict "context" $ctx "db" $db)) "migrating" }}
      # Logical dump/restore straight from the legacy Service. Chosen over
      # pg_basebackup because the fleet spans PG15 and PG16, the legacy pods
      # have no replication user or pg_hba entry, and no bytes pass through
      # `kubectl cp` -- which silently truncated a 31MB file during the Gitea
      # migration and left a short file that still opened cleanly.
      #
      # .spec.bootstrap is consulted ONLY at creation, so this stanza goes
      # inert once the Cluster exists. That is what makes the later flip to
      # `cnpg` a no-op rather than a re-import.
      import:
        type: microservice
        databases:
          - {{ .database | quote }}
        source:
          externalCluster: {{ .component }}-legacy
        {{- with $db.importRestoreJobs }}
        # pg_restore builds indexes in the post-data section, so this is the
        # lever on a slow rebuild -- and the only one that matters for a
        # database whose indexes dominate its restore.
        pgRestorePostdataOptions:
          - {{ printf "--jobs=%v" . | quote }}
        {{- end }}
      {{- end }}
  # cnpgResources when set: the shared `resources` also sizes the legacy
  # StatefulSet, and a Cluster rebuilding indexes needs a ceiling that pod
  # never does.
  resources:
    {{- toYaml ($db.cnpgResources | default $db.resources) | nindent 4 }}
  {{- if eq (include "srw.dbEngine" (dict "context" $ctx "db" $db)) "migrating" }}
  externalClusters:
    - name: {{ .component }}-legacy
      connectionParameters:
        # The LEGACY Service, which shares its name with the Cluster. The
        # Cluster's own endpoint is "-rw"; pointing here at that would have it
        # bootstrap from itself.
        host: {{ include "srw.fullname" $ctx }}-{{ .component }}
        port: "5432"
        user: {{ .owner | quote }}
        dbname: {{ .database | quote }}
        # The bundled StatefulSet serves no TLS -- verified on k3d 2026-08-21,
        # where "require" fails with 'rejected SSL upgrade'.
        sslmode: prefer
      password:
        name: {{ include "srw.secretName" $ctx }}
        key: {{ .passwordKey | quote }}
  {{- end }}
{{- end }}

{{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "postgres")) }}
{{- include "srw.cnpgCluster" (dict "context" . "component" "postgres" "key" "postgres" "db" .Values.databases.postgres "database" "srw" "owner" "srw" "passwordKey" "POSTGRES_PASSWORD") }}
---
{{- end }}

{{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "vector")) }}
{{- include "srw.cnpgCluster" (dict "context" . "component" "pgvector" "key" "vector" "db" .Values.databases.vector "database" "srw_vector" "owner" "srw" "passwordKey" "VECTOR_POSTGRES_PASSWORD") }}
---
{{- end }}

{{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "audit")) }}
{{- include "srw.cnpgCluster" (dict "context" . "component" "auditdb" "key" "audit" "db" .Values.databases.audit "database" "srw_audit" "owner" "srw" "passwordKey" "AUDIT_POSTGRES_PASSWORD") }}
---
{{- end }}

{{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "gitea")) }}
{{- include "srw.cnpgCluster" (dict "context" . "component" "giteadb" "key" "gitea" "db" .Values.databases.gitea "database" "gitea" "owner" "gitea" "passwordKey" "GITEA_DB_PASSWORD") }}
---
{{- end }}

{{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "keycloak")) }}
{{- include "srw.cnpgCluster" (dict "context" . "component" "keycloakdb" "key" "keycloak" "db" .Values.databases.keycloak "database" "keycloak" "owner" "keycloak" "passwordKey" "KC_DB_PASSWORD") }}
---
{{- end }}

{{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "nextcloud")) }}
{{- include "srw.cnpgCluster" (dict "context" . "component" "nextclouddb" "key" "nextcloud" "db" .Values.databases.nextcloud "database" "nextcloud" "owner" "nextcloud" "passwordKey" "NEXTCLOUD_DB_PASSWORD") }}
{{- end }}
