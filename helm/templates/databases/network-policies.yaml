{{- /*
Database-tier NetworkPolicies — one per internal DB StatefulSet.

Each policy locks the database pod to ingress from its legitimate consumers
only. Egress is intentionally unrestricted — a workspace-pod compromise that
reaches a DB is the threat model here, and that path is closed by the
podSelector-based allow-list below.

Probes (liveness/readiness) come from the kubelet on the node, which bypasses
NetworkPolicy entirely — no allowance needed.

Optional admin UIs (pgadmin) are conditionally added to the
allow-list when their respective .enabled toggles are set. The short-lived
llm-seed, research-provider-seed and canvas-gateway-role Jobs are allowed
against the main Postgres so the install can seed the model catalog and the
research provider catalog, and provision the canvas viewer role.
*/ -}}

{{- if and .Values.databases.postgres.enabled .Values.databases.postgres.internal }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-postgres
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 14 }}
        {{- if .Values.canvas.livePreview.viewer.enabled }}
        # Canvas origin/session authorization and revocation state is stored in
        # the application database; the internal gateway needs no other DB.
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "canvas-gateway") | nindent 14 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "agent") | nindent 14 }}
        {{- if .Values.agent.stateless.enabled }}
        # Stateless executor class — deliberately NOT component=agent (that
        # label pair would put it behind the agent Service/PDB), so it needs
        # its own ingress allowance.
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "agent-stateless") | nindent 14 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "llm-seed") | nindent 14 }}
        # Same shape as llm-seed above: a short-lived post-install Job that must
        # reach the main Postgres to seed its catalog. Without this entry the Job
        # cannot open a connection at all and dies with ConnectionRefusedError on
        # the Service IP, which reads like a database outage rather than a policy
        # denial -- the Service and its endpoint are both healthy.
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "research-provider-seed") | nindent 14 }}
        {{- if and .Values.canvas.livePreview.viewer.enabled .Values.canvas.livePreview.viewer.database.provisionRole }}
        # Third instance of the same shape, and it was missed until 2026-09-01:
        # the canvas role-provisioning Job is component=canvas-gateway-role, NOT
        # the canvas-gateway entry above, so that allowance never covered it. It
        # failed exactly as the research-provider-seed comment predicts -- refused
        # on a healthy Service -- and because the Job carried
        # ttlSecondsAfterFinished it deleted itself five minutes later, so every
        # trace of the failure disappeared before anyone looked.
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "canvas-gateway-role") | nindent 14 }}
        {{- end }}
        {{- if .Values.pgadmin.enabled }}
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "pgadmin") | nindent 14 }}
        {{- end }}
        {{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "postgres")) }}
        # CloudNativePG's OWN label, not the chart's component labels: those
        # are deliberately absent while `migrating` (the legacy Service would
        # otherwise capture these pods), and this same rule is what lets the
        # IMPORT read the legacy database. It is also tighter -- only pods of
        # this one cluster, rather than anything wearing the component label.
        # Covers both the import job and WAL streaming between instances.
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "srw.fullname" . }}-postgres
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
    {{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "postgres")) }}
    # The operator polls instance health on the STATUS port (8000), not 5432.
    # A rule that opens only 5432 leaves the Cluster reporting `Ready=False`
    # with "unable to receive the status from all the ready instances" while
    # the database itself serves normally -- and CNPG makes failover and
    # switchover decisions from that status, so at more than one instance this
    # is not cosmetic. Observed on srw-postgres and srw-keycloakdb 2026-08-23,
    # immediately after cutover.
    #
    # It only bites at engine `cnpg`: while `migrating` the CNPG pods do not
    # carry the chart's component labels, so this policy does not select them
    # at all. That is why a rehearsal cannot surface it.
    #
    # Its own rule, deliberately: 8000 stays reachable ONLY from the operator's
    # namespace, never from the application workloads allowed above.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.databases.operator.namespace | quote }}
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    {{- end }}
    {{- if and .Values.agent.stateless.enabled .Values.agent.stateless.autoscaling.enabled }}
    # The KEDA operator runs the stateless pool's scaler query
    # (agent/stateless-scaledobject.yaml) from ITS namespace. Both selectors in
    # one `from` entry: only the operator pod, only from that namespace, only
    # 5432. Without this the query times out, KEDA logs a scaler error, and the
    # pool silently stays at its floor — the failure mode reads like "the
    # autoscaler does nothing", never like a policy denial.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.agent.stateless.autoscaling.kedaNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keda-operator
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
---
{{- end }}

