{{- if and .Values.databases.neo4j.enabled .Values.databases.neo4j.internal }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-neo4j
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "neo4j") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "neo4j") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "agent") | nindent 14 }}
        {{- if .Values.agent.stateless.enabled }}
        # Stateless executor class — see the postgres policy above.
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "agent-stateless") | nindent 14 }}
        {{- end }}
      ports:
        - port: 7474
          protocol: TCP
        - port: 7688
          protocol: TCP
        # Bolt also listens on 7687 in some configs; current chart pins 7688.
    {{- if .Values.databases.neo4j.browser.enabled }}
    # Neo4j Browser UI reached through the Traefik ingress (home-network LB
    # only; the browser host is deliberately kept out of the Cloudflare tunnel).
    # Only the HTTP port is opened to Traefik — Bolt (7688) stays restricted to
    # the orchestrator/agent pods above.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 7474
          protocol: TCP
    {{- end }}
    {{- if and .Values.databases.neo4j.loadBalancer.enabled .Values.databases.neo4j.loadBalancer.allowedClientCIDRs }}
    # Bolt (7688) reached from the LAN via the MetalLB LoadBalancer, so the
    # Neo4j Browser SPA (served over Traefik/HTTPS) can open its wss connection
    # back to the advertised Bolt address. Scoped to the configured client
    # CIDRs; relies on the Bolt LB running externalTrafficPolicy: Local so the
    # pod sees the real client source IP. Bolt is authenticated — this gates
    # reachability, not access.
    - from:
        {{- range .Values.databases.neo4j.loadBalancer.allowedClientCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 7688
          protocol: TCP
    {{- end }}
---
{{- end }}

{{- if and .Values.keycloak.enabled .Values.keycloak.internal .Values.databases.keycloak.enabled .Values.databases.keycloak.internal }}
