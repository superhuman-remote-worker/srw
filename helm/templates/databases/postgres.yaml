{{- if (include "srw.dbRendersStatefulset" (dict "context" . "key" "postgres")) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "srw.fullname" . }}-postgres-data
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.databases.postgres.storageClass }}
  storageClassName: {{ .Values.databases.postgres.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.databases.postgres.storageSize }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "srw.fullname" . }}-postgres
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "srw.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 8 }}
      annotations:
        {{- include "srw.postgresRolesChecksum" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # `postgres` is the bootstrap superuser and SRW's role an ordinary
      # owner. This converts a volume initialised before that split and
      # re-applies it on every start; see _postgres-roles.tpl.
      initContainers:
        {{- include "srw.postgresRolesInitContainer" (dict "context" . "key" "postgres" "db" .Values.databases.postgres) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.databases.postgres.image }}
          # HA (M1): tighten TCP keepalives so a dead client backend — e.g. a
          # crashed/partitioned orchestrator holding the session-scoped leader
          # advisory lock — is detected in ~40s instead of the ~2h OS default,
          # bounding leader-election failover. (Server-side keepalives only
          # affect dead-connection detection; no risk to live sessions.)
          # See knowledge-history/researches/orchestrator_leader_election.md.
          args:
            - "-c"
            - "tcp_keepalives_idle=10"
            - "-c"
            - "tcp_keepalives_interval=10"
            - "-c"
            - "tcp_keepalives_count=3"
            {{- with .Values.databases.postgres.maxConnections }}
            # The same max_connections CloudNativePG gets via srw.dbParameters.
            - "-c"
            - {{ printf "max_connections=%v" . | quote }}
            {{- end }}
          ports:
            - containerPort: 5432
          env:
            {{- include "srw.postgresRolesEnv" (dict "context" . "key" "postgres") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- include "srw.postgresRolesInitdbMount" . | nindent 12 }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "srw"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "srw"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.databases.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-postgres-data
        {{- include "srw.postgresRolesVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-postgres
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 4 }}
{{- end }}
