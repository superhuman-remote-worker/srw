{{/*
Basic-auth projection of the chart's existing database credentials.

CloudNativePG's bootstrap.initdb.secret wants a kubernetes.io/basic-auth Secret
with `username`/`password`. Every SRW consumer already reads its own
differently-named keys from the shared Secret (POSTGRES_USER,
VECTOR_POSTGRES_USER, ...), so we PROJECT rather than migrate: no consumer's
secretKeyRef changes.

The projection has to work in all three secret modes, and each needs a
different mechanism:

  externalSecrets.enabled  a second ExternalSecret pulling the SAME vault
                           property into a basic-auth shape. This is how dev
                           runs, and the only mode where the password is not
                           knowable at render time.
  secrets.create           a plain Secret carrying the operator's own value.
  existingSecret / none    IMPOSSIBLE at render time -- the chart never sees
                           the password. Fails loudly with the exact Secret to
                           create, rather than emitting an empty one. An empty
                           password would bootstrap a database nothing can log
                           into, and would look configured while doing it.

`username` is a LITERAL, and must equal the Cluster's bootstrap.initdb.owner:
CNPG creates that role and gives it this password. If the shared Secret's
POSTGRES_USER says something else, consumers authenticate as a role that owns
nothing. Create mode checks this; the other modes cannot, so it is documented
at the values key.
*/}}
{{- define "srw.cnpgCredentials" -}}
{{- $ctx := .context -}}
{{- $name := printf "%s-%s-app" (include "srw.fullname" $ctx) .component -}}
{{- if $ctx.Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "srw.componentLabels" (dict "context" $ctx "component" .component) | nindent 4 }}
spec:
  refreshInterval: {{ $ctx.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $ctx.Values.externalSecrets.secretStoreRef }}
    kind: {{ $ctx.Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .owner | quote }}
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "externalSecrets.vaultPath is required when externalSecrets.enabled=true" $ctx.Values.externalSecrets.vaultPath }}
        property: {{ .passwordKey }}
{{- else if $ctx.Values.secrets.create }}
{{- $values := $ctx.Values.secrets.values | default dict -}}
{{- $password := index $values .passwordKey | default "" -}}
{{- if not $password }}
{{- fail (printf "databases.%s.engine needs a CloudNativePG owner password, but secrets.values.%s is unset. Set it (secrets.create mode cannot reuse a generated one -- the two renders would disagree)." .key .passwordKey) }}
{{- end }}
{{- if .usernameKey }}
{{- $username := index $values .usernameKey | default "" -}}
{{- if and $username (ne $username .owner) }}
{{- fail (printf "secrets.values.%s is %q but the %s Cluster's owner is %q. CloudNativePG creates the owner role; consumers connecting as %q would own nothing." .usernameKey $username .component .owner $username) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "srw.componentLabels" (dict "context" $ctx "component" .component) | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .owner | quote }}
  password: {{ $password | quote }}
{{- else if $ctx.Values.databases.credentialsPreCreated }}
{{- /* The operator asserts the Secret already exists. Render nothing: Helm
       cannot see a cluster resource it does not own, so there is no way to
       verify this beyond taking their word for it. The alternative is refusing
       to install at all, which is what this branch used to do. */ -}}
{{- else }}
{{- fail (printf "databases.%s.engine is %q, but the chart cannot see the database password in this secret mode. Either create a kubernetes.io/basic-auth Secret named %q with username=%q and the same password as %s in %q and set databases.credentialsPreCreated=true, or use externalSecrets/secrets.create so the chart can build it for you." .key (index $ctx.Values.databases .key).engine $name .owner .passwordKey (include "srw.secretName" $ctx)) }}
{{- end }}
{{- end }}

{{- $credentials := list
      (dict "key" "postgres" "component" "postgres" "owner" "srw" "usernameKey" "POSTGRES_USER" "passwordKey" "POSTGRES_PASSWORD")
      (dict "key" "vector" "component" "pgvector" "owner" "srw" "usernameKey" "VECTOR_POSTGRES_USER" "passwordKey" "VECTOR_POSTGRES_PASSWORD")
      (dict "key" "audit" "component" "auditdb" "owner" "srw" "usernameKey" "AUDIT_POSTGRES_USER" "passwordKey" "AUDIT_POSTGRES_PASSWORD")
      (dict "key" "gitea" "component" "giteadb" "owner" "gitea" "usernameKey" "GITEA_DB_USER" "passwordKey" "GITEA_DB_PASSWORD")
      (dict "key" "keycloak" "component" "keycloakdb" "owner" "keycloak" "usernameKey" "" "passwordKey" "KC_DB_PASSWORD")
      (dict "key" "nextcloud" "component" "nextclouddb" "owner" "nextcloud" "usernameKey" "" "passwordKey" "NEXTCLOUD_DB_PASSWORD") -}}
{{- $rendered := 0 -}}
{{- range $entry := $credentials }}
{{- if (include "srw.dbRendersCnpg" (dict "context" $ "key" $entry.key)) }}
{{- if $rendered }}
---
{{- end }}
{{- $rendered = add1 $rendered }}
{{- include "srw.cnpgCredentials" (merge (dict "context" $) $entry) }}
{{- end }}
{{- end }}
