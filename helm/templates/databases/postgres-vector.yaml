{{- if (include "srw.dbRendersStatefulset" (dict "context" . "key" "vector")) }}
# Vector Database (pgvector) — Citations, Embeddings, Memories, Knowledge Index
#
# Separate PostgreSQL instance with pgvector extension for all vector operations.
# Schema is applied by the orchestrator on startup (vector_schema.sql), not by initdb.
#
# NOTE: component label uses short name "pgvector" so the StatefulSet name stays
# under 52 chars — the controller-revision-hash label adds "-<10char>" (11 chars),
# and total label value must be <= 63 chars.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "srw.fullname" . }}-pgvector-data
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "pgvector") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.databases.vector.storageClass }}
  storageClassName: {{ .Values.databases.vector.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.databases.vector.storageSize }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "srw.fullname" . }}-pgvector
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "pgvector") | nindent 4 }}
spec:
  serviceName: {{ include "srw.fullname" . }}-pgvector
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "pgvector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "pgvector") | nindent 8 }}
      annotations:
        {{- include "srw.postgresRolesChecksum" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # `postgres` is the bootstrap superuser and SRW's role an ordinary
      # owner. This converts a volume initialised before that split and
      # re-applies it on every start; see _postgres-roles.tpl.
      initContainers:
        {{- include "srw.postgresRolesInitContainer" (dict "context" . "key" "vector" "db" .Values.databases.vector) | nindent 8 }}
      containers:
        - name: pgvector
          image: {{ .Values.databases.vector.image }}
          {{- with .Values.databases.vector.maxConnections }}
          # The same max_connections CloudNativePG gets via srw.dbParameters.
          # No `command`: the image's docker-entrypoint.sh prepends `postgres`
          # when the first argument is a flag.
          args:
            - "-c"
            - {{ printf "max_connections=%v" . | quote }}
          {{- end }}
          ports:
            - containerPort: 5432
          env:
            {{- include "srw.postgresRolesEnv" (dict "context" . "key" "vector") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- include "srw.postgresRolesInitdbMount" . | nindent 12 }}
          livenessProbe:
            exec:
              # -d postgres: probe the always-present maintenance DB. Without
              # -d, pg_isready defaults the dbname to the user (srw), which does
              # not exist on this server (DB is srw_vector) — the server logged
              # "FATAL: database \"srw\" does not exist" on every probe. The
              # probe passed regardless (server was accepting connections); this
              # only silences the spurious FATAL log line.
              command: ["pg_isready", "-U", "srw", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "srw", "-d", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.databases.vector.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-pgvector-data
        {{- include "srw.postgresRolesVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-pgvector
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "pgvector") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "pgvector") | nindent 4 }}
{{- end }}
