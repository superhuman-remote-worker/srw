    {{- end }}
    {{- if .Values.ingress.cors.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-cors@kubernetescrd
    {{- end }}
    {{- with .Values.ingress.annotations }}
