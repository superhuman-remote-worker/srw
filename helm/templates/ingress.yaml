# Cockpit web UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-cockpit-ingress
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "cockpit") | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $cockpitHost }}
      secretName: {{ $fullName }}-cockpit-tls
  {{- end }}
  rules:
    - host: {{ $cockpitHost }}
      http:
        paths:
          {{- if .Values.auth.bff.sameOriginApi }}
          # Same-origin API: /api, /auth, /ws (control-plane WebSocket), and
          # /p (session-router WebSocket) on the cockpit host route to the
          # orchestrator. Avoids cross-site cookies for split-host local dev.
          # Without these, browser blocks 3rd-party cookies on the API XHRs;
          # without /ws, WebSocket upgrades hit the cockpit SPA and fail with
          # "Unexpected response code: 200".
          # Order matters — longest-prefix-first so traefik matches these
          # before the cockpit catch-all.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
          # /p is intentionally NOT routed by the cockpit ingress — the
          # session router creates a per-session Ingress under that prefix
          # that points directly at the agent pod. Adding a /p Prefix here
          # would shadow it (Traefik picks the longer-prefix match, but the
          # per-session Ingress is "longer" only because of the {tid} suffix,
          # not the literal /p prefix — they collide).
          {{- end }}
          {{- if and .Values.mcp.enabled .Values.mcp.exposeOnRootHost }}
          # MCP on the cockpit host (local-dev convenience). Off by default;
          # prod keeps the dedicated mcp.<domain> subdomain (the Keycloak
          # OAuth-client host). FastMCP serves at /mcp and traefik preserves
          # the path (no StripPrefix), so https://<cockpit>/mcp lands on
          # srw-mcp:8055/mcp unchanged. Longest-prefix-first puts it ahead of
          # the cockpit catch-all. Bearer-token auth works on either host.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-mcp
                port:
                  number: 8055
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-cockpit
                port:
                  number: 4000
---
# Orchestrator API (browser calls from cockpit)
apiVersion: networking.k8s.io/v1
