# Nextcloud (cloud storage) — same $cloudHost as the OpenCloud Ingress above,
# so the two are mutually exclusive. The `not opencloud.enabled` guard mirrors
# the MAIN_CLOUD_BACKEND precedence in configmap.yaml (opencloud wins when both
# are on); without it a both-enabled values file would render two Ingresses
# claiming one host and Traefik would pick a winner arbitrarily.
# Only the bundled backend gets an Ingress: with `internal: false` the
# Nextcloud lives outside the release and brings its own routing.
