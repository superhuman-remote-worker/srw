---
# WOPI is token-authenticated but deliberately cluster-only. This higher
# priority route prevents the public API Ingress from forwarding /wopi while
# Collabora continues to use the in-cluster orchestrator Service directly.
# A tunnel which bypasses Traefik must apply the same path deny at its edge.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-block-public-wopi
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  ipWhiteList:
    sourceRange:
      - 127.0.0.99/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api-ingress-blocked-wopi
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    traefik.ingress.kubernetes.io/router.priority: "110"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-block-public-wopi@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $apiHost }}
      secretName: {{ $fullName }}-api-tls
  {{- end }}
  rules:
    - host: {{ $apiHost }}
      http:
        paths:
          - path: /wopi
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
{{- end }}
{{- if .Values.ingress.internalPathBlock.enabled }}
---
# Track B (P4b) — Layer 1 (opt-in). Block /api/agents/* and /api/internal/*
# at the public API ingress so agent-internal paths can't be probed from
# outside. This is OPT-IN because it only works when the orchestrator is
# fronted by Traefik (or another ingress controller that honors this CRD).
#
# If you use a tunnel/edge that bypasses your ingress controller
# (Cloudflare Tunnel, Tailscale Funnel, Ngrok, etc.), Traefik never sees
# the request and this middleware never fires — leave the toggle off and
# put the equivalent path rule at your tunnel/edge instead. See
# `knowledge-base/knowledge/multi_tenancy.md` for the cloudflared example.
#
# Layer 2 (app-layer ``require_internal`` checking the ``X-Internal-Key``
# header) is the primary defense and is always on regardless of this toggle.
# Cluster-internal callers (the agent reaching the orchestrator via the
# in-cluster Service DNS http://srw-orchestrator:8085) always bypass the
# ingress, so the agent's traffic is unaffected whether or not Layer 1 is on.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-block-external
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  # An IP allow-list with a single non-routable address effectively denies all
  # real clients while keeping the resource valid. Traefik returns 403.
  #
  # Field name: ``ipWhiteList`` works on both Traefik v2 (only known name) and
  # Traefik v3 (deprecated alias, still accepted). The newer ``ipAllowList``
  # spelling is v3-only and silently no-ops on v2.
  ipWhiteList:
    sourceRange:
      - 127.0.0.99/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api-ingress-blocked-internal
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    # Higher priority than the main API ingress so these path matches win.
    # Without this, Traefik may evaluate the shorter `/` prefix first.
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-block-external@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $apiHost }}
      secretName: {{ $fullName }}-api-tls
  {{- end }}
  rules:
    - host: {{ $apiHost }}
      http:
        paths:
          # Pure-agent paths (P4b ingress strip — agent ↔ orchestrator only).
          # These are still served on the in-cluster Service DNS; only the
          # public host blocks them.
          - path: /api/agents
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
          - path: /api/internal
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
{{- end }}
{{- if and .Values.infrastructureMetering.collectorEnabled (eq (.Values.ingress.className | default "traefik") "traefik") }}
{{- if ($remoteIngress.enabled | default false) }}
---
# Opt-in cross-cluster collector route. Source filtering is only the outer
# network fence; every request still requires its dedicated VMI or storage HMAC
# credential and is read through the application's bounded ingestion contract.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-allow-remote-infra-metering
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  ipWhiteList:
    sourceRange:
      {{- toYaml $remoteIngress.sourceCidrs | nindent 6 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api-ingress-remote-infra-metering
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "140"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-allow-remote-infra-metering@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ $apiHost }}
      secretName: {{ $fullName }}-api-tls
  rules:
    - host: {{ $apiHost }}
      http:
        paths:
          - path: /api/internal/infrastructure-metering
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
{{- end }}
---
# Signed metadata and the claimed digest are authenticated before a bounded
# body read, then the exact body is verified. This route is never browser-facing,
# so an enabled collector also blocks it at the public Traefik edge while leaving
# the ClusterIP Service available. Tunnels which bypass this ingress must mirror
# the path deny for /api/internal/infrastructure-metering at their edge.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-block-public-infra-metering
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  ipWhiteList:
    sourceRange:
      - 127.0.0.99/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api-ingress-blocked-infra-metering
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    traefik.ingress.kubernetes.io/router.priority: "120"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-block-public-infra-metering@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $apiHost }}
      secretName: {{ $fullName }}-api-tls
  {{- end }}
  rules:
    - host: {{ $apiHost }}
      http:
        paths:
          - path: /api/internal/infrastructure-metering
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
