{{- /*
The voice path's own secrets (local_voice_gateway.md §4.4): `api-key`, the
gateway's Bearer key (the seeded live_voice endpoint carries it to the
phone-line driver), and `asterisk-password`, shared by Asterisk's ARI, its
media connection to the gateway and the gateway. Generated once and kept
(resource-policy keep, read back on every upgrade) unless
voiceGateway.existingSecret names a Secret with both keys (Vault/ESO).
*/ -}}
{{- if and .Values.voiceGateway.enabled (not .Values.voiceGateway.existingSecret) }}
{{- include "srw.voiceValidate" . }}
{{- $name := include "srw.voiceSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $apiKey := "" }}
{{- $password := "" }}
{{- if and $existing $existing.data }}
{{- $apiKey = index $existing.data "api-key" | default "" | b64dec }}
{{- $password = index $existing.data "asterisk-password" | default "" | b64dec }}
{{- end }}
{{- if not $apiKey }}{{- $apiKey = randAlphaNum 48 }}{{- end }}
{{- if not $password }}{{- $password = randAlphaNum 32 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "voice-gateway") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  api-key: {{ $apiKey | b64enc | quote }}
  asterisk-password: {{ $password | b64enc | quote }}
{{- end }}
