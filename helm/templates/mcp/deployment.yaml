{{- if .Values.mcp.enabled }}
{{- if and .Values.mcp.requireImageDigest (not .Values.image.mcp.digest) }}
{{- fail "mcp.requireImageDigest=true requires image.mcp.digest (sha256:...)" }}
{{- end }}
{{- if and .Values.mcp.persistence.enabled (gt (int .Values.mcp.replicas) 1) }}
{{- fail "mcp.persistence.enabled needs mcp.replicas=1: the OAuth state volume is ReadWriteOnce and in-flight logins are held per process" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-mcp
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "mcp") | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  {{- if .Values.mcp.persistence.enabled }}
  # One ReadWriteOnce OAuth-state volume: the old pod must let go of it first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "mcp") | nindent 8 }}
      annotations:
        srw.io/mcp-image-identity: {{ include "srw.imageRef" (dict "image" .Values.image.mcp) | quote }}
        srw.io/mcp-source-revision: {{ .Values.provenance.components.mcp.sourceRevision | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.mcp.persistence.enabled }}
      securityContext:
        # The image's srw group (docker/Dockerfile.mcp pins GID 10001).
        fsGroup: 10001
      {{- end }}
      initContainers:
        - name: wait-for-orchestrator
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.fullname" . }}-orchestrator 8085; do sleep 2; done"]
      containers:
        - name: mcp
          image: {{ include "srw.imageRef" (dict "image" .Values.image.mcp) | quote }}
          imagePullPolicy: {{ .Values.image.mcp.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: COCKPIT_API_URL
              value: "http://{{ include "srw.fullname" . }}-orchestrator:8085"
            - name: XDG_DATA_HOME
              value: "/tmp/.local/share"
            {{- if .Values.mcp.persistence.enabled }}
            - name: FASTMCP_HOME
              value: "/var/lib/srw-mcp/fastmcp"
            {{- end }}
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
            - name: SRW_SOURCE_REVISION
              value: {{ .Values.provenance.components.mcp.sourceRevision | quote }}
            - name: SRW_RELEASE_VERSION
              value: {{ .Values.provenance.components.mcp.releaseVersion | quote }}
            - name: SRW_ARTIFACT_DIGEST
              value: {{ .Values.image.mcp.digest | quote }}
            - name: MCP_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: MCP_INTERNAL_KEY
            {{- if .Values.mcp.oauth.enabled }}
            - name: MCP_OAUTH_ENABLED
              value: "true"
            - name: MCP_OIDC_CLIENT_ID
              value: {{ .Values.mcp.oauth.clientId | quote }}
            - name: MCP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: MCP_OIDC_CLIENT_SECRET
                  optional: true
            - name: MCP_OIDC_CONFIG_URL
              value: "{{ include "srw.keycloakInternalUrl" . }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration"
            {{- with .Values.mcp.oauth.allowedRedirectUris }}
            - name: MCP_OAUTH_ALLOWED_REDIRECT_URIS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.mcp.oauth.extraRedirectUris }}
            - name: MCP_OAUTH_EXTRA_REDIRECT_URIS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            - name: MCP_BASE_URL
              value: {{ include "srw.mcpUrl" . | quote }}
          # Tool registration and OIDC discovery (retried for up to
          # MCP_OIDC_DISCOVERY_TIMEOUT_S, 240 s by default) can outlast the
          # liveness window on a cold VM at the default CPU limit. Gate those
          # checks on successful startup, as for the orchestrator and agents.
          # Startup and liveness ask only whether this process serves
          # (/livez): an orchestrator restart must not get MCP killed too.
          startupProbe:
            httpGet:
              path: /livez
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          # Readiness checks the orchestrator. Its client retries a connect
          # failure after 1 s and 2 s, so the probe waits longer than that
          # and tolerates a brief orchestrator restart before taking MCP out
          # of the Service.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          {{- if .Values.mcp.persistence.enabled }}
          volumeMounts:
            - name: oauth-state
              mountPath: /var/lib/srw-mcp
          {{- end }}
      {{- if .Values.mcp.persistence.enabled }}
      volumes:
        - name: oauth-state
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-mcp-oauth-state
      {{- end }}
{{- if .Values.mcp.persistence.enabled }}
---
# The MCP OAuth server's state (G5): dynamically registered clients and
# in-flight authorizations. Kept across uninstall like the other credential
# volumes; FastMCP encrypts it with a key derived from the OIDC client secret.
# Named "-mcp-oauth-state": the first claim ("-mcp-oauth", 256Mi) never bound
# on Longhorn/XFS (minimum 300Mi) and a Pending claim's size cannot be
# changed, so a resized claim needs a new name. The old one holds no data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "srw.fullname" . }}-mcp-oauth-state
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "mcp") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.mcp.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mcp.persistence.size }}
{{- end }}
{{- end }}
