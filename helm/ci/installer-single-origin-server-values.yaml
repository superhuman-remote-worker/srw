# One browser origin, one chart-owned self-signed certificate, and no DNS or cert-manager.
exposure:
  mode: single-origin
  singleOrigin:
    address: "192.0.2.10"
    publicPort: 30443
    service:
      nodePort: 30443
    tls:
      mode: self-signed
      validityDays: 365

sessionRouter:
  jwtSecret: "1616161616161616161616161616161616161616161616161616161616161616"

keycloak:
  enabled: true
  internal: true

gitea:
  enabled: true
  internal: true
  ssh:
    externalService:
      enabled: false

workspace:
  accessMode: ReadWriteMany

agent:
  pool:
    # Spin workers up on demand; nothing idles on a single box.
    minAgents: "0"
    buffer: "0"
    reservedSessionSlots: "0"
    reservedJobSlots: "0"
    maxAgents: "3"

# Cloud storage: Nextcloud is the supported bundled backend (OpenCloud stays off).
opencloud:
  enabled: false
nextcloud:
  enabled: true
  internal: true
  replicas: 1
  # Stage signed installation attestation without enabling protected cloud mode.
  protectedEffect:
    enabled: true
  objectStore:
    # Files on the Nextcloud PVC. Point this at an S3 bucket for a larger install.
    enabled: false

databases:
  neo4j:
    enabled: false
    boltTls:
      enabled: false
    loadBalancer:
      enabled: false
