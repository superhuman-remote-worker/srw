# Minimal test values for CI validation
license:
  acceptTerms: true

global:
  domain: "test.example.com"

# CI models an externally managed collector-only signing Secret. It must never
# resolve to the main application Secret consumed by dynamic agent Pods.
infrastructureMetering:
  ingestionSecretName: "test-infra-metering-ingestion"

externalSecrets:
  enabled: true
  vaultPath: "test/secrets"
  vmSshKeyVaultPath: "test/vm-ssh-key"

headscale:
  enabled: true

vm:
  mode: external

orchestratorId: test-orchestrator

pgadmin:
  enabled: true

dozzle:
  enabled: true

codexProxy:
  enabled: true

test:
  greenmail:
    enabled: true

agent:
  tailscale:
    enabled: true
  # Render the stateless executor pool WITH queue-driven autoscaling so CI
  # validates the ScaledObject/TriggerAuthentication against the KEDA CRD
  # schemas (kubeconform pulls keda.sh from the datree CRD catalog).
  stateless:
    enabled: true
    autoscaling:
      enabled: true

databases:
  neo4j:
    # Off by default; on here so CI renders and validates the Neo4j
    # StatefulSet, its Bolt TLS Certificate and the Bolt LoadBalancer.
    enabled: true
    boltTls:
      enabled: true
      issuerName: test-issuer
    loadBalancer:
      enabled: true

ingress:
  tls:
    issuerName: test-issuer

keycloak:
  bridgeCert:
    enabled: true
    smtpHost: "smtp.test.local"

email:
  enabled: true
  smtp:
    host: "smtp.test.local"
    from: "noreply@test.example.com"
  imap:
    host: "imap.test.local"
  agentEmail: "agent@test.example.com"
  domain: "test.example.com"

llm:
  baseUrl: "http://llm-server:8080/v1"
  browserBaseUrl: "http://llm-server:8080/v1"
  embeddingBaseUrl: "http://embedding-server:8080/v1"
  codexBaseUrl: "http://codex-proxy:8317/v1"

citation:
  llmUrl: "http://llm-server:8080/v1"
  embeddingUrl: "http://embedding-server:8080/v1"

s3:
  endpoint: "http://minio:9000"

nats:
  url: "nats://nats:4222"
