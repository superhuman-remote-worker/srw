          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ env.SRW_SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.version }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=driver-mcp-front
          provenance: false
          build-args: |
            SRW_SOURCE_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-driver-mcp-front:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-driver-mcp-front:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  # The git swap driver (C3): vetted and tested (race detector; its tests
  # also run a real git client) with the toolchain the image builds with,
  # then published; the release chart pins its digest.
  build-driver-git-swap:
    needs: [architecture, lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      needs.architecture.result == 'success' &&
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      # The same release as docker/Dockerfile.driver-git-swap's pinned base.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Vet and test the git swap driver
        working-directory: drivers/git-swap
        run: |
          go vet ./...
          go test -count=1 -race ./...
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-driver-git-swap
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.driver-git-swap
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ env.SRW_SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.version }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=driver-git-swap
          provenance: false
          build-args: |
            SRW_SOURCE_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-driver-git-swap:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-driver-git-swap:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true


  # ---------------------------------------------------------------------------
  # Package and publish Helm chart at the auto-bumped version.
  # Git tag goes LAST so a failed chart push doesn't leave dangling tags.
  # ---------------------------------------------------------------------------
  release-chart:
    name: Package and publish Helm chart
    needs: [architecture, resolve-version, build-agent, build-orchestrator, build-cockpit, build-mcp, build-workspace, build-vm-controller, build-vm-preparer, build-driver-shim, build-driver-mcp-front, build-driver-git-swap, build-agent-vm-base, chart-test, chart-schema-negative]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.architecture.result == 'success' &&
      needs.resolve-version.result == 'success' &&
      needs.build-agent.result == 'success' &&
      needs.build-orchestrator.result == 'success' &&
      needs.build-cockpit.result == 'success' &&
      needs.build-mcp.result == 'success' &&
      needs.build-agent-vm-base.result == 'success' &&
      needs.build-workspace.result == 'success' &&
      needs.build-vm-controller.result == 'success' &&
      needs.build-vm-preparer.result == 'success' &&
      needs.build-driver-shim.result == 'success' &&
      needs.build-driver-mcp-front.result == 'success' &&
      needs.build-driver-git-swap.result == 'success' &&
      needs.chart-test.result == 'success' &&
      needs.chart-schema-negative.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify every chart image before publication
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/verify_chart_images.py
          --repository "${{ env.REGISTRY }}/${{ env.REPO_LOWER }}"
          --release-sha "${{ github.sha }}"
          --inventory /tmp/verified-chart-images.json
      - name: Stamp release component provenance
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          export IMAGE_TAG="sha-${GITHUB_SHA::7}"
          yq -i '
            .provenance.releaseVersion = strenv(RELEASE_VERSION) |
            .image.mcp.digest = strenv(MCP_DIGEST) |
            .image.workspaceMinimal.tag = strenv(IMAGE_TAG) |
            .vmController.image.tag = strenv(IMAGE_TAG) |
            .vmController.preparation.image.tag = strenv(IMAGE_TAG) |
            .vmController.preparation.image.digest = strenv(VM_PREPARER_DIGEST) |
            .connectors.drivers.shim.image.tag = strenv(IMAGE_TAG) |
            .connectors.drivers.shim.image.digest = strenv(DRIVER_SHIM_DIGEST) |
            .connectors.drivers.mcpFront.image.tag = strenv(IMAGE_TAG) |
            .connectors.drivers.mcpFront.image.digest = strenv(DRIVER_MCP_FRONT_DIGEST) |
            .connectors.drivers.gitSwap.image.tag = strenv(IMAGE_TAG) |
            .connectors.drivers.gitSwap.image.digest = strenv(DRIVER_GIT_SWAP_DIGEST) |
            .provenance.components.vmController.sourceRevision = strenv(GITHUB_SHA) |
            .provenance.components.vmController.releaseVersion = strenv(RELEASE_VERSION)
          ' helm/values.yaml
          for component in orchestrator agent cockpit mcp workspace; do
            export component
            yq -i '
              .image[strenv(component)].tag = strenv(IMAGE_TAG) |
              .provenance.components[strenv(component)].sourceRevision = strenv(GITHUB_SHA) |
              .provenance.components[strenv(component)].releaseVersion = strenv(RELEASE_VERSION)
            ' helm/values.yaml
          done
      - name: Package chart
        run: |
          helm repo add collabora https://collaboraonline.github.io/online --force-update
          helm dependency build helm/
          mkdir -p dist
          helm package helm/ \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --app-version "${{ needs.resolve-version.outputs.version }}" \
            --destination ./dist
      - name: Push chart to OCI registry
        run: |
          helm push "./dist/superhuman-remote-worker-${{ needs.resolve-version.outputs.version }}.tgz" \
            oci://ghcr.io/superhuman-remote-worker/charts
      - name: Push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.resolve-version.outputs.tag }}" \
            -m "Release ${{ needs.resolve-version.outputs.tag }}"
          git push origin "${{ needs.resolve-version.outputs.tag }}"
