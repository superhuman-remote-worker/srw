  # ---------------------------------------------------------------------------
  # Stage 1: on main pushes, reuse a recent base with identical recorded inputs;
  # otherwise run heavy provisioning. Stage2 consumes the verified digest. PR
  # validation re-uses a published stage1 image, which makes PRs to main much
  # faster (only stage2 rebuilds). Direct develop promotions use develop's
  # :experimental image below; other PRs use :latest. Cron refresh runs in
  # stage1-rebuild.yml so the baseline never drifts more than a week.
  # ---------------------------------------------------------------------------
  build-agent-vm-base-stage1:
    needs:
      - architecture
      - lint
      - dependency-audit
      - test-python
      - test-cockpit
      - resolve-version
    if: needs.architecture.result == 'success' && always() && !cancelled() && github.event_name == 'push' && needs.lint.result
      == 'success' && needs.dependency-audit.result == 'success' && needs.test-python.result == 'success' && needs.test-cockpit.result
      == 'success' && needs.resolve-version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Resolve reusable stage1 base
        id: base
        env:
          STAGE1_IMAGE: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent-vm-base-stage1:latest
        run: python3 scripts/vm_stage1_image.py --image "$STAGE1_IMAGE" >> "$GITHUB_OUTPUT"
      - name: Free disk space
        if: steps.base.outputs.reuse != 'true' && (runner.environment == 'github-hosted')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
        if: steps.base.outputs.reuse != 'true'
      - name: Enable KVM (hosted runner udev rule)
        if: steps.base.outputs.reuse != 'true' && (runner.environment == 'github-hosted')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify KVM is usable
        # Fail before Packer can silently fall back to unaccelerated TCG.
        run: |
          set -euo pipefail
          ls -la /dev/kvm
          id
          python3 -c "import fcntl,os;fd=os.open('/dev/kvm',os.O_RDWR);print('KVM_GET_API_VERSION =',fcntl.ioctl(fd,0xAE00,0))"
        if: steps.base.outputs.reuse != 'true'
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
        if: steps.base.outputs.reuse != 'true'
      - name: Compute cloud image cache key
        id: img-key
        run: echo "key=ubuntu-noble-cloudimg-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
        if: steps.base.outputs.reuse != 'true'
      - name: Cache Ubuntu cloud image
        id: cloud-image-cache
        uses: actions/cache@v4
        with:
          path: docker/agent-vm-base/input/noble-server-cloudimg-amd64.img
          key: ${{ steps.img-key.outputs.key }}
        if: steps.base.outputs.reuse != 'true'
      - name: Download Ubuntu cloud image
        if: steps.base.outputs.reuse != 'true' && (steps.cloud-image-cache.outputs.cache-hit != 'true')
        working-directory: docker/agent-vm-base
        run: |
          mkdir -p input
          wget -q https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img \
            -O input/noble-server-cloudimg-amd64.img
      - name: Verify Ubuntu cloud image
        working-directory: docker/agent-vm-base
        run: qemu-img info input/noble-server-cloudimg-amd64.img
        if: steps.base.outputs.reuse != 'true'
      - name: Packer init (stage1)
        working-directory: docker/agent-vm-base
        run: packer init stage1.pkr.hcl
        if: steps.base.outputs.reuse != 'true'
      - name: Packer build (stage1)
        working-directory: docker/agent-vm-base
        run: |
          PW_VERSION=$(tr -d '[:space:]' < ../../.playwright-version)
          test -n "$PW_VERSION" || { echo "::error::.playwright-version is empty"; exit 1; }
          for attempt in 1 2; do
            if packer build -var "playwright_version=${PW_VERSION}" stage1.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage1 packer build attempt ${attempt} failed"
            rm -rf output-stage1
          done
          echo "::error::Stage1 packer build failed after 2 attempts"
          exit 1
        if: steps.base.outputs.reuse != 'true'
      - name: Build and push stage1 containerDisk
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1" | tr '[:upper:]' '[:lower:]')
          TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}" "${IMAGE}:latest")
          BUILD_ARGS=(
            --build-arg "SRW_SOURCE_REVISION=${GITHUB_SHA}"
            --build-arg "SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}"
            --build-arg "SRW_RELEASE_VERSION=${{ needs.resolve-version.outputs.version }}"
            --build-arg "SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}"
          )
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          STAGE1_INPUTS=$(python3 ../../scripts/vm_stage1_image.py)
          BUILD_ARGS+=(--build-arg "SRW_STAGE1_INPUTS=${STAGE1_INPUTS}")
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk-stage1 .
          for T in "${TAGS[@]}"; do docker push "$T"; done
          printf 'Pushed stage1:\n'; printf '  %s\n' "${TAGS[@]}"
        if: steps.base.outputs.reuse != 'true'
      - name: Publish exact stage1 reference
        id: resolved
        env:
          REUSED_IMAGE: ${{ steps.base.outputs.image }}
          STAGE1_REPOSITORY: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent-vm-base-stage1
        run: |
          if [ -n "$REUSED_IMAGE" ]; then
            echo "image=$REUSED_IMAGE" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/vm_stage1_image.py --require-match \
              --image "$STAGE1_REPOSITORY:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      image: ${{ steps.resolved.outputs.image }}

  # Stage2 layers per-commit configuration onto stage1. Main releases use the
  # verified digest above; PRs retain the published latest/experimental choice.
  build-agent-vm-base:
    needs: [architecture, lint, dependency-audit, test-python, test-cockpit, build-sudo-gate, resolve-version, build-agent-vm-base-stage1]
    if: >-
      needs.architecture.result == 'success' &&
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      needs.build-sudo-gate.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped') &&
      (needs.build-agent-vm-base-stage1.result == 'success' || needs.build-agent-vm-base-stage1.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fail if sudo-gate build failed
        if: needs.build-sudo-gate.result == 'failure'
        run: |
          echo "::error::build-sudo-gate failed — refusing to build VM image without gate binaries"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download sudo gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: sudo-gate-binaries
          path: docker/agent-vm-base/files/
      - name: Prepare sudo gate binaries for Packer
        working-directory: docker/agent-vm-base
        # upload-artifact@v4 roots the archive at the LONGEST COMMON ANCESTOR
        # of its paths (vm/), so the artifact extracts as sudo-daemon/... and
        # sudo-plugin/... — no vm/ prefix. This step checked files/vm/... and
        # silently shipped empty placeholders (VM images had no sudo gate).
        run: |
          mv files/sudo-daemon/sudo-gated files/sudo-gated-bin
          mv files/sudo-plugin/sudo_gate.so files/sudo_gate.so
          test -s files/sudo-gated-bin || { echo "::error::sudo-gated artifact is empty"; exit 1; }
          test -s files/sudo_gate.so || { echo "::error::sudo_gate.so artifact is empty"; exit 1; }
          echo "sudo-gated binary ready ($(wc -c < files/sudo-gated-bin) bytes)"
          echo "sudo_gate.so ready ($(wc -c < files/sudo_gate.so) bytes)"
          ls -la files/
      - name: Free disk space
        # Hosted runners have ~14 GiB free and these jobs need more. Self-hosted
        # runners do not need it, and the heavy variants below delete
        # /opt/hostedtoolcache, which is where setup-* install. Guarded rather
        # than deleted so the hosted fallback (gh variable delete CI_RUNNER_LABEL)
        # still works.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM (hosted runner udev rule)
        # Hosted runners ship /dev/kvm as root:kvm with no world access, so this
        # udev rule is how the runner user reaches it. Inside a container there is
        # no udevd: the rule file goes nowhere and `udevadm control` fails. There,
        # access comes from the pod spec instead — privileged + a /dev/kvm
        # CharDevice hostPath, see HomeLab deployments_managed/arc-runners-kvm/.
        # (Measured on node4: /dev/kvm is gid 36, mode 0666.)
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is usable
        # Runs on BOTH runner types, unconditionally. stage1.pkr.hcl and
        # stage2.pkr.hcl set accelerator = "kvm", and without acceleration packer
        # does not fail — it silently falls back to TCG and burns the entire
        # 75-90 minute timeout. Fail in five seconds instead.
        #
        # KVM_GET_API_VERSION = _IO(KVMIO=0xAE, 0) = 0xAE00. Opening the device
        # and getting an answer proves the permissions AND that the host kernel's
        # KVM subsystem is reachable from in here, which `ls` alone does not.
        run: |
          set -euo pipefail
          ls -la /dev/kvm
          id
          python3 -c "import fcntl,os;fd=os.open('/dev/kvm',os.O_RDWR);print('KVM_GET_API_VERSION =',fcntl.ioctl(fd,0xAE00,0))"
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      # Login is unconditional here — needed to PULL the stage1 containerDisk
      # from GHCR even on PR validation runs. Push of the final image still
      # gates on push events below.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull stage1 containerDisk and extract qcow2
        working-directory: docker/agent-vm-base
        env:
          STAGE1_TAG: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' && 'experimental' || 'latest' }}
          VERIFIED_STAGE1_IMAGE: ${{ needs.build-agent-vm-base-stage1.outputs.image }}
        run: |
          # Push releases consume the exact verified digest; concurrent weekly
          # refreshes cannot change this run's base between verification and use.
          STAGE1_IMAGE="$VERIFIED_STAGE1_IMAGE"
          if [ -z "$STAGE1_IMAGE" ]; then
            test "${{ github.event_name }}" = pull_request
            STAGE1_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1:${STAGE1_TAG}" | tr '[:upper:]' '[:lower:]')
          fi
          echo "Using stage1 image: ${STAGE1_IMAGE}"
          docker pull "$STAGE1_IMAGE"
          # FROM scratch images have no shell so a real CMD doesn't matter — we
          # never start the container, just create-then-cp.
          CID=$(docker create "$STAGE1_IMAGE" /noop 2>/dev/null || docker create "$STAGE1_IMAGE")
          mkdir -p input
          docker cp "$CID":/disk/agent-vm-base-stage1.qcow2 input/agent-vm-base-stage1.qcow2
          docker rm "$CID"
          qemu-img info input/agent-vm-base-stage1.qcow2
      - name: Packer init (stage2)
        working-directory: docker/agent-vm-base
        run: packer init stage2.pkr.hcl
      - name: Packer build (stage2)
        working-directory: docker/agent-vm-base
        run: |
          for attempt in 1 2; do
            if packer build stage2.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage2 packer build attempt ${attempt} failed"
            rm -rf output
          done
          echo "::error::Stage2 packer build failed after 2 attempts"
          exit 1
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }} containerDisk image
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation: build with a single throwaway tag, no push.
            TAGS=("${IMAGE}:pr-validate-${GITHUB_SHA::7}")
          else
            TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}" "${IMAGE}:latest" "${IMAGE}:${{ needs.resolve-version.outputs.tag }}")
          fi
          BUILD_ARGS=(
            --build-arg "SRW_SOURCE_REVISION=${GITHUB_SHA}"
            --build-arg "SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}"
            --build-arg "SRW_RELEASE_VERSION=${{ needs.resolve-version.outputs.version }}"
            --build-arg "SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}"
          )
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for T in "${TAGS[@]}"; do docker push "$T"; done
            printf 'Pushed:\n'; printf '  %s\n' "${TAGS[@]}"
          else
            printf 'Built (PR validation, not pushed):\n'; printf '  %s\n' "${TAGS[@]}"
          fi

  build-vm-controller:
    needs: [architecture, lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      needs.architecture.result == 'success' &&
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vm-controller
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.vm-controller
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ env.SRW_SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.version }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=vm-controller
          provenance: false
          build-args: |
            SRW_SOURCE_REVISION=${{ github.sha }}
            SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}
            SRW_RELEASE_VERSION=${{ needs.resolve-version.outputs.version }}
            SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

