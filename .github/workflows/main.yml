            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.version }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=agent
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true
          build-args: |
            BUILD_SHA=${{ steps.short_sha.outputs.sha }}
            SRW_SOURCE_REVISION=${{ github.sha }}
            SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}
            SRW_RELEASE_VERSION=${{ needs.resolve-version.outputs.version }}
            SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}

