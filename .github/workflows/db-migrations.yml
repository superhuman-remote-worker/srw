name: db-migrations

# Gate for changes under src/orchestrator/database/migrations/** (plus the schema
# artifacts, the runner and its import surface, and the squawk config).
#
# The trigger list carries database/__init__.py even though it is not a
# migration: `python -m orchestrator.database.migrate` loads the package initializer first.
# That initializer deliberately keeps application exports lazy so the runner
# needs only asyncpg; changing the import boundary must exercise this workflow.
# postgres.py remains listed because it owns the application-side schema
# capabilities and migration invocation used during normal startup.
#
# Runs four jobs in parallel:
#   1. squawk      — static lint of the migrations ADDED/MODIFIED by this push
#                    or ordinary PR (lock safety, missing NOT VALID,
#                    non-concurrent indexes, etc.). A develop-to-main release
#                    promotion trusts develop's admission gates instead of
#                    re-linting its frozen, already-applied history: those files
#                    can't be edited (the runner's checksum guard rejects
#                    drift), so their findings are unactionable and would keep
#                    the promotion permanently red.
#   2. dry-run     — dry-run every migration, then really apply the app chain
#                    and exercise the Canvas viewer credential lifecycle on a
#                    fresh pgvector/pgvector:pg15 service container (transactional
#                    dry-run pass rolls back; non-tx migrations are skipped
#                    under --dry-run and included in the real apply)
#   3. artifact    — regenerate the *_current.sql schema artifacts (real apply,
#                    all three families) and fail if they drift from committed
#   4. uniqueness  — refuse duplicate NNNN_ prefixes within each migrations
#                    subdirectory
#
# Design rationale: see knowledge-base/knowledge/db_migration.md §Testing & CI.

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/orchestrator/database/migrations/**.sql'
      - 'src/orchestrator/database/migrate.py'
      - 'src/orchestrator/database/migration_recovery.py'
      - 'src/orchestrator/__init__.py'
      - 'src/shared/**'
      - 'pyproject.toml'
      # Runner import surface, not migrations — see the header note.
      - 'src/orchestrator/database/__init__.py'
      - 'src/orchestrator/database/postgres.py'
      - 'src/orchestrator/database/*_current.sql'
      - 'src/orchestrator/services/canvas*.py'
      - 'helm/files/canvas-viewer-role.sql'
      - 'scripts/provision-canvas-gateway-database.sh'
      - 'tests/test_canvas_gateway_operator_provision.py'
      - 'tests/test_canvas_gateway_role_sql.py'
      - 'tests/test_canvas_viewer_postgres_integration.py'
      - 'scripts/schema-snapshot.sh'
      - '.github/workflows/db-migrations.yml'
      - '.squawk.toml'
  pull_request:
    paths:
      - 'src/orchestrator/database/migrations/**.sql'
      - 'src/orchestrator/database/migrate.py'
      - 'src/orchestrator/database/migration_recovery.py'
      - 'src/orchestrator/__init__.py'
      - 'src/shared/**'
      - 'pyproject.toml'
      # Runner import surface, not migrations — see the header note.
      - 'src/orchestrator/database/__init__.py'
      - 'src/orchestrator/database/postgres.py'
      - 'src/orchestrator/database/*_current.sql'
      - 'src/orchestrator/services/canvas*.py'
      - 'helm/files/canvas-viewer-role.sql'
      - 'scripts/provision-canvas-gateway-database.sh'
      - 'tests/test_canvas_gateway_operator_provision.py'
      - 'tests/test_canvas_gateway_role_sql.py'
      - 'tests/test_canvas_viewer_postgres_integration.py'
      - 'scripts/schema-snapshot.sh'
      - '.github/workflows/db-migrations.yml'
      - '.squawk.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repo. squawk now runs the pinned binary directly
# (findings surface in the job log, not as PR comments), so no write scope is
# needed.
permissions:
  contents: read

env:
  PYTHONSAFEPATH: "1"

jobs:
  squawk:
    name: lint (squawk)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Lint ONLY the migrations this push/PR adds or modifies — never the
      # whole frozen history. Applied migrations can't be edited (the runner's
      # checksum guard rejects any drift), so re-linting them just accumulates
      # unactionable findings and keeps the job permanently red. New migrations
      # still get the full rule set before they ever land.
      - name: Lint changed migrations
        env:
          SQUAWK_VERSION: v2.59.0
        run: |
          set -euo pipefail

          # A release PR from develop to main contains every migration since
          # main's previous release snapshot. Develop is the migration admission
          # branch, and that accumulated history is checksum-locked after
          # application. Re-linting it makes old, unactionable warnings block
          # promotion. The other jobs in this workflow still replay the complete
          # chain, regenerate all schema artifacts, and enforce unique prefixes
          # on this PR.
          #
          # BOTH halves of the promotion need this. Merging the release PR fires
          # a *push* to main whose `github.event.before` is main's PREVIOUS
          # release tip, so the diff spans the entire release exactly as the PR
          # did -- the PR-only guard skipped the PR and then reddened the merge.
          # Observed on run 34089638677, which re-linted 41 frozen migrations
          # (0189-0225, vector 0022-0026) and failed on findings in app/0203 and
          # app/0204: applied, checksum-frozen files whose bytes must never
          # change (see .squawk.toml's app/0183 note for what editing one costs).
          # main only ever receives develop promotions, so this makes squawk a
          # develop-admission gate; a migration pushed straight to main would
          # bypass it, which is why direct pushes of migrations to main are not
          # the release path.
          if { [ "${{ github.event_name }}" = "pull_request" ] \
                 && [ "${{ github.base_ref }}" = "main" ] \
                 && [ "${{ github.head_ref }}" = "develop" ]; } \
             || { [ "${{ github.event_name }}" = "push" ] \
                 && [ "${{ github.ref_name }}" = "main" ]; }; then
            echo "Develop-to-main promotion: relying on develop admission gates; skipping immutable-history re-lint."
            exit 0
          fi

          # Diff base: the PR's base, or the previous tip of the pushed branch.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Fall back to the parent commit when base is missing / empty / the
          # all-zero sentinel (first push of a branch, force-push, dispatch).
          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse -q --verify HEAD~1 || git rev-parse HEAD)"
          fi

          # Added/Modified migration files only, minus the 0001 bootstrap
          # snapshots (they lint like ALTERs on a hot table but are empty-DB
          # bootstraps; also pinned in .squawk.toml's excluded_paths).
          # Detect exact renames before filtering paths: limiting the diff to
          # the new directory hides the removed source and turns a pure move
          # of immutable SQL into an addition. A failed diff must fail the gate.
          changed_paths=$(git diff --find-renames=100% --name-only --diff-filter=AM "$base" "${{ github.sha }}")
          mapfile -t files < <(
            printf '%s\n' "$changed_paths" \
              | grep '^src/orchestrator/database/migrations/.*\.sql$' \
              | grep -v '/0001_initial\.sql$' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No added/modified migrations in this change — nothing to lint."
            exit 0
          fi

          # Drop the paths .squawk.toml already excludes. squawk applies its own
          # excluded_paths and then exits 1 with "Failed to find files for
          # provided patterns" when that leaves it nothing to lint. So a change
          # whose only touched migration is an excluded, byte-frozen file --
          # app/0183, app/0212 -- reds this lane with no actionable finding and
          # no way to act on it, since the whole point of those entries is that
          # the file must never be edited again. Observed on run 33489365630.
          # Filtering here keeps "everything was excluded" a skip, not a failure.
          # Assigned via a variable, not `mapfile < <(...)`: a process
          # substitution's exit status is invisible to mapfile, so a broken or
          # missing .squawk.toml would yield an empty list and silently SKIP the
          # lint rather than fail it. Fail closed instead.
          if ! filtered="$(printf '%s\n' "${files[@]}" | python3 -c 'import sys,tomllib,pathlib; ex=set(tomllib.loads(pathlib.Path(".squawk.toml").read_text()).get("excluded_paths",[])); sys.stdout.write("".join(p+"\n" for p in sys.stdin.read().splitlines() if p and p not in ex))')"; then
            echo "::error::could not read excluded_paths from .squawk.toml"
            exit 1
          fi
          if [ -n "$filtered" ]; then mapfile -t files <<<"$filtered"; else files=(); fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Every changed migration is excluded by .squawk.toml — nothing to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} changed migration(s):"
          printf '  %s\n' "${files[@]}"

          # Pinned squawk binary (the same tool sbdchd/squawk-action wraps).
          # Invoked directly so we control exactly which files are linted;
          # .squawk.toml at the repo root is auto-discovered.
          curl -fsSL -o /tmp/squawk \
            "https://github.com/sbdchd/squawk/releases/download/${SQUAWK_VERSION}/squawk-linux-x64"
          chmod +x /tmp/squawk
          /tmp/squawk "${files[@]}"

  dry-run:
    name: dry-run on pgvector/pgvector:pg15
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # pgvector/pgvector:pg15 matches the PROD major for the app + vector DBs
      # (helm/values.yaml pins both to pg15). pg_dump/DDL behaviour is
      # major-sensitive, so the gate must run the same major prod does. The
      # vector DB's 0001_initial.sql declares vector(4096) on source_embeddings,
      # so the stock postgres:15 image fails on CREATE EXTENSION vector; this
      # image bundles the extension. (The audit DB is postgres:16 in prod and
      # is covered by the `artifact` job below, which pins each family's major.)
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: ci_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # asyncpg drives the standalone runner. The remaining packages support
      # the focused Canvas lifecycle checks, which import the application DB
      # layer and its encryption/main-cloud value objects later in this job.
      - run: >-
          pip install --quiet asyncpg cryptography httpx tenacity
          'pydantic>=2.10' pytest pytest-asyncio 'testcontainers[postgres]>=4.0'
      - run: pip install --quiet --no-deps -e .
      - name: Create the vector database
        env:
          PGPASSWORD: ci
        run: |
          # 0001_initial.sql declares its own CREATE EXTENSION statements
          # (uuid-ossp on both DBs, vector on the vector DB), so we only
          # need to ensure the second database exists.
          psql -h localhost -U ci -d ci_app -c "CREATE DATABASE ci_vector;"
      # Resolve the same editable packages as production, from the repository root.
      - name: Dry-run app migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_app
        run: |
          python -m orchestrator.database.migrate \
            --dir src/orchestrator/database/migrations/app \
            --dry-run
      - name: Dry-run vector migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_vector
        run: |
          python -m orchestrator.database.migrate \
            --dir src/orchestrator/database/migrations/vector \
            --dry-run
      - name: Apply app migrations for Canvas viewer lifecycle test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_app
        run: python -m orchestrator.database.migrate --dir src/orchestrator/database/migrations/app
      - name: Exercise Canvas viewer lifecycle against PostgreSQL
        env:
          CANVAS_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_app
        run: >-
          pytest -q
          tests/test_canvas_viewer_postgres_integration.py
          tests/test_canvas_gateway_role_sql.py
          tests/test_canvas_gateway_operator_provision.py

  artifact:
    # The keystone drift gate (HF-1): regenerate the canonical *_current.sql
    # schema artifacts by replaying every migration from zero and fail if they
    # differ from what's committed. Unlike `dry-run`, this does a REAL apply
    # (so the .notx.sql CONCURRENTLY files execute), covers ALL THREE families
    # including audit (net-new — no audit dry-run exists), and pins each
    # family's prod major. See knowledge-base/knowledge/features/database_roadmap.md Phase 2.
    name: schema artifacts fresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The migration runner is intentionally independent of the application
      # database layer and needs only asyncpg.
      - run: pip install --quiet asyncpg
      - run: pip install --quiet --no-deps -e .
      - name: Prove the standalone migration import needs only asyncpg
        run: python -m orchestrator.database.migrate --help
      # Docker is preinstalled on ubuntu-latest; the script auto-detects it and
      # spins up one throwaway container per family (pgvector:pg15 x2,
      # postgres:16), migrates from zero, and dumps inside the container.
      - name: Regenerate schema artifacts
        run: scripts/schema-snapshot.sh
      # Fail if regeneration changed anything: a migration altered the schema
      # without the author re-running the snapshot, or an artifact was
      # hand-edited (regeneration overwrites hand edits -> diff). `git add -A`
      # first so a brand-new artifact (untracked) is caught too, not just edits.
      - name: Fail on stale or hand-edited artifacts
        run: |
          git add -A src/orchestrator/database/*_current.sql
          if git diff --cached --quiet -- src/orchestrator/database/*_current.sql; then
            echo "Schema artifacts are up to date."
          else
            echo "::error::Schema artifacts are stale or hand-edited. Regenerate with: scripts/schema-snapshot.sh && git add -A src/orchestrator/database/*_current.sql, then commit."
            git --no-pager diff --cached -- src/orchestrator/database/*_current.sql
            exit 1
          fi

  uniqueness:
    name: unique NNNN_ prefixes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: No duplicate migration prefixes
        run: |
          set -euo pipefail
          fail=0
          test -d src/orchestrator/database/migrations/app
          test -d src/orchestrator/database/migrations/vector
          test -d src/orchestrator/database/migrations/audit
          for d in src/orchestrator/database/migrations/*/; do
            if ! ls "$d"*.sql >/dev/null 2>&1; then
              echo "ERROR: no migrations discovered in $d"
              exit 1
            fi
            dupes=$(ls "$d"*.sql | xargs -n1 basename | awk -F_ '{print $1}' | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "ERROR: duplicate prefix(es) in $d: $dupes"
              fail=1
            fi
          done
          exit $fail
