  # ---------------------------------------------------------------------------
  # Stage 1: heavy, stable provisioning (apt + datasource clients + Tailscale +
  # Playwright + Node). Rebuilds only when stage1 inputs change. Published as
  # ghcr.io/<repo>-agent-vm-base-stage1; stage2 pulls and layers on top.
  # ---------------------------------------------------------------------------
  build-agent-vm-base-stage1:
    needs: [architecture, changes, dependency-audit, test-python, test-cockpit]
    if: >-
      needs.architecture.result == 'success' &&
      always() && !cancelled() &&
      (needs.changes.outputs.vm-base-stage1 == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Free disk space
        # Hosted runners have ~14 GiB free and these jobs need more. Self-hosted
        # runners do not need it, and the heavy variants below delete
        # /opt/hostedtoolcache, which is where setup-* install. Guarded rather
        # than deleted so the hosted fallback (gh variable delete CI_RUNNER_LABEL)
        # still works.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM (hosted runner udev rule)
        # Hosted runners ship /dev/kvm as root:kvm with no world access, so this
        # udev rule is how the runner user reaches it. Inside a container there is
        # no udevd: the rule file goes nowhere and `udevadm control` fails. There,
        # access comes from the pod spec instead — privileged + a /dev/kvm
        # CharDevice hostPath, see HomeLab deployments_managed/arc-runners-kvm/.
        # (Measured on node4: /dev/kvm is gid 36, mode 0666.)
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is usable
        # Runs on BOTH runner types, unconditionally. stage1.pkr.hcl and
        # stage2.pkr.hcl set accelerator = "kvm", and without acceleration packer
        # does not fail — it silently falls back to TCG and burns the entire
        # 75-90 minute timeout. Fail in five seconds instead.
        #
        # KVM_GET_API_VERSION = _IO(KVMIO=0xAE, 0) = 0xAE00. Opening the device
        # and getting an answer proves the permissions AND that the host kernel's
        # KVM subsystem is reachable from in here, which `ls` alone does not.
        run: |
          set -euo pipefail
          ls -la /dev/kvm
          id
          python3 -c "import fcntl,os;fd=os.open('/dev/kvm',os.O_RDWR);print('KVM_GET_API_VERSION =',fcntl.ioctl(fd,0xAE00,0))"
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      - name: Compute cloud image cache key
        id: img-key
        run: echo "key=ubuntu-noble-cloudimg-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Ubuntu cloud image
        id: cloud-image-cache
        uses: actions/cache@v4
        with:
          path: docker/agent-vm-base/input/noble-server-cloudimg-amd64.img
          key: ${{ steps.img-key.outputs.key }}
      - name: Download Ubuntu cloud image
        if: steps.cloud-image-cache.outputs.cache-hit != 'true'
        working-directory: docker/agent-vm-base
        run: |
          mkdir -p input
          wget -q https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img \
            -O input/noble-server-cloudimg-amd64.img
      - name: Verify Ubuntu cloud image
        working-directory: docker/agent-vm-base
        run: qemu-img info input/noble-server-cloudimg-amd64.img
      - name: Packer init (stage1)
        working-directory: docker/agent-vm-base
        run: packer init stage1.pkr.hcl
      - name: Packer build (stage1)
        working-directory: docker/agent-vm-base
        run: |
          PW_VERSION=$(tr -d '[:space:]' < ../../.playwright-version)
          test -n "$PW_VERSION" || { echo "::error::.playwright-version is empty"; exit 1; }
          for attempt in 1 2; do
            if packer build -var "playwright_version=${PW_VERSION}" stage1.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage1 packer build attempt ${attempt} failed"
            rm -rf output-stage1
          done
          echo "::error::Stage1 packer build failed after 2 attempts"
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }} stage1 containerDisk
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1" | tr '[:upper:]' '[:lower:]')
          # Image identity = newest input commit, not push HEAD (see build-agent).
          # The registry predicate in the changes job checks exactly this tag.
          IDENT="${{ needs.changes.outputs.vm-base-stage1-sha }}"
          : "${IDENT:=$GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS=("${IMAGE}:pr-validate-${GITHUB_SHA::7}")
          else
            # develop owns the :experimental stage1 tag; :latest belongs to main
            # (main.yml + the stage1-rebuild cron). Pushing :latest from develop
            # would clobber main's prod base image, and — worse — a main-built
            # :latest that lacks develop-only base changes (e.g. browser_use)
            # would then fail develop's own stage2 gate.
            TAGS=("${IMAGE}:sha-${IDENT::7}" "${IMAGE}:experimental")
          fi
          BUILD_ARGS=(
            --build-arg "SRW_SOURCE_REVISION=${GITHUB_SHA}"
            --build-arg "SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}"
            --build-arg "SRW_RELEASE_VERSION=${{ env.SRW_RELEASE_VERSION }}"
            --build-arg "SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}"
          )
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk-stage1 .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for T in "${TAGS[@]}"; do docker push "$T"; done
            printf 'Pushed stage1:\n'; printf '  %s\n' "${TAGS[@]}"
          else
            printf 'Built stage1 (PR validation, not pushed):\n'; printf '  %s\n' "${TAGS[@]}"
          fi

  # ---------------------------------------------------------------------------
  # Stage 2: light per-commit layer (user setup, SSH config, daemon, sudo gate).
  # Pulls the stage1 containerDisk from GHCR, extracts the qcow2, and layers
  # stage2 on top via stage2.pkr.hcl. Should finish in ~5-10 min.
  # ---------------------------------------------------------------------------
  build-agent-vm-base:
    needs: [architecture, changes, dependency-audit, test-python, test-cockpit, build-sudo-gate, build-agent-vm-base-stage1]
    if: >-
      needs.architecture.result == 'success' &&
      always() && !cancelled() &&
      (needs.changes.outputs.vm-base == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled' &&
      needs.build-sudo-gate.result == 'success' &&
      (needs.build-agent-vm-base-stage1.result == 'success' || needs.build-agent-vm-base-stage1.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fail if sudo-gate build failed
        if: needs.build-sudo-gate.result == 'failure'
        run: |
          echo "::error::build-sudo-gate failed — refusing to build VM image without gate binaries"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download sudo gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: sudo-gate-binaries
          path: docker/agent-vm-base/files/
      - name: Prepare sudo gate binaries for Packer
        working-directory: docker/agent-vm-base
        # upload-artifact@v4 roots the archive at the LONGEST COMMON ANCESTOR
        # of its paths (vm/), so the artifact extracts as sudo-daemon/... and
        # sudo-plugin/... — no vm/ prefix. This step checked files/vm/... and
        # silently shipped empty placeholders (VM images had no sudo gate).
        run: |
          mv files/sudo-daemon/sudo-gated files/sudo-gated-bin
          mv files/sudo-plugin/sudo_gate.so files/sudo_gate.so
          test -s files/sudo-gated-bin || { echo "::error::sudo-gated artifact is empty"; exit 1; }
          test -s files/sudo_gate.so || { echo "::error::sudo_gate.so artifact is empty"; exit 1; }
          echo "sudo-gated binary ready ($(wc -c < files/sudo-gated-bin) bytes)"
          echo "sudo_gate.so ready ($(wc -c < files/sudo_gate.so) bytes)"
          ls -la files/
      - name: Free disk space
        # Hosted runners have ~14 GiB free and these jobs need more. Self-hosted
        # runners do not need it, and the heavy variants below delete
        # /opt/hostedtoolcache, which is where setup-* install. Guarded rather
        # than deleted so the hosted fallback (gh variable delete CI_RUNNER_LABEL)
        # still works.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM (hosted runner udev rule)
        # Hosted runners ship /dev/kvm as root:kvm with no world access, so this
        # udev rule is how the runner user reaches it. Inside a container there is
        # no udevd: the rule file goes nowhere and `udevadm control` fails. There,
        # access comes from the pod spec instead — privileged + a /dev/kvm
        # CharDevice hostPath, see HomeLab deployments_managed/arc-runners-kvm/.
        # (Measured on node4: /dev/kvm is gid 36, mode 0666.)
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is usable
        # Runs on BOTH runner types, unconditionally. stage1.pkr.hcl and
        # stage2.pkr.hcl set accelerator = "kvm", and without acceleration packer
        # does not fail — it silently falls back to TCG and burns the entire
        # 75-90 minute timeout. Fail in five seconds instead.
        #
        # KVM_GET_API_VERSION = _IO(KVMIO=0xAE, 0) = 0xAE00. Opening the device
        # and getting an answer proves the permissions AND that the host kernel's
        # KVM subsystem is reachable from in here, which `ls` alone does not.
        run: |
          set -euo pipefail
          ls -la /dev/kvm
          id
          python3 -c "import fcntl,os;fd=os.open('/dev/kvm',os.O_RDWR);print('KVM_GET_API_VERSION =',fcntl.ioctl(fd,0xAE00,0))"
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      # Login is unconditional here — needed to PULL the stage1 containerDisk
      # from GHCR even on PR validation runs. Push of the final image still
      # gates on push events below.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull stage1 containerDisk and extract qcow2
        working-directory: docker/agent-vm-base
        run: |
          # develop layers stage2 on its OWN stage1 base (:experimental), NOT the
          # shared :latest that main's cron also writes. Otherwise a main-built
          # :latest lacking develop-only base changes (browser_use) fails develop's
          # stage2 gate. Contract: main.yml pulls :latest, develop pulls :experimental.
          STAGE1_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1:experimental" | tr '[:upper:]' '[:lower:]')
          docker pull "$STAGE1_IMAGE"
          # FROM scratch images have no shell so a real CMD doesn't matter — we
          # never start the container, just create-then-cp.
          CID=$(docker create "$STAGE1_IMAGE" /noop 2>/dev/null || docker create "$STAGE1_IMAGE")
          mkdir -p input
          docker cp "$CID":/disk/agent-vm-base-stage1.qcow2 input/agent-vm-base-stage1.qcow2
          docker rm "$CID"
          qemu-img info input/agent-vm-base-stage1.qcow2
      - name: Packer init (stage2)
        working-directory: docker/agent-vm-base
        run: packer init stage2.pkr.hcl
      - name: Packer build (stage2)
        working-directory: docker/agent-vm-base
        run: |
          for attempt in 1 2; do
            if packer build stage2.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage2 packer build attempt ${attempt} failed"
            rm -rf output
          done
          echo "::error::Stage2 packer build failed after 2 attempts"
          exit 1
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }} containerDisk image
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base" | tr '[:upper:]' '[:lower:]')
          # Image identity = newest input commit, not push HEAD (see build-agent).
          # The registry predicate in the changes job checks exactly this tag.
          IDENT="${{ needs.changes.outputs.vm-base-sha }}"
          : "${IDENT:=$GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation: build with a single throwaway tag, no push.
            TAGS=("${IMAGE}:pr-validate-${GITHUB_SHA::7}")
          else
            TAGS=("${IMAGE}:sha-${IDENT::7}" "${IMAGE}:experimental")
          fi
          BUILD_ARGS=(
            --build-arg "SRW_SOURCE_REVISION=${GITHUB_SHA}"
            --build-arg "SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}"
            --build-arg "SRW_RELEASE_VERSION=${{ env.SRW_RELEASE_VERSION }}"
            --build-arg "SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}"
          )
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for T in "${TAGS[@]}"; do docker push "$T"; done
            printf 'Pushed:\n'; printf '  %s\n' "${TAGS[@]}"
          else
            printf 'Built (PR validation, not pushed):\n'; printf '  %s\n' "${TAGS[@]}"
          fi

  build-vm-controller:
    needs: [architecture, changes, dependency-audit, test-python, test-cockpit]
    if: >-
      needs.architecture.result == 'success' &&
      always() && !cancelled() &&
      (needs.changes.outputs.vm-controller == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image identity = newest input commit, not push HEAD (see build-agent).
      - name: Resolve component identity
        id: ident
        run: |
          FULL="${{ needs.changes.outputs.vm-controller-sha }}"
          : "${FULL:?component identity is required}"
          {
            echo "full=$FULL"
            echo "short=${FULL::7}"
            echo "version=0.0.0-dev.sha-${FULL}"
          } >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vm-controller
          tags: |
            type=raw,value=sha-${{ steps.ident.outputs.short }}
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.vm-controller
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ env.SRW_SOURCE_URL }}
            org.opencontainers.image.revision=${{ steps.ident.outputs.full }}
            org.opencontainers.image.version=${{ steps.ident.outputs.version }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=vm-controller
          provenance: false
          build-args: |
            SRW_SOURCE_REVISION=${{ steps.ident.outputs.full }}
            SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}
            SRW_RELEASE_VERSION=${{ steps.ident.outputs.version }}
            SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-vm-preparer:
    needs: [architecture, changes, dependency-audit, test-python, test-cockpit]
    if: >-
      needs.architecture.result == 'success' &&
      always() && !cancelled() &&
      (needs.changes.outputs.vm-preparer == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image identity = newest input commit, not push HEAD (see build-agent).
      - name: Resolve component identity
        id: ident
        run: |
          FULL="${{ needs.changes.outputs.vm-preparer-sha }}"
          : "${FULL:?component identity is required}"
          {
            echo "full=$FULL"
            echo "short=${FULL::7}"
            echo "version=0.0.0-dev.sha-${FULL}"
          } >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vm-preparer
          tags: |
            type=raw,value=sha-${{ steps.ident.outputs.short }}
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.vm-preparer
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ env.SRW_SOURCE_URL }}
            org.opencontainers.image.revision=${{ steps.ident.outputs.full }}
            org.opencontainers.image.version=${{ steps.ident.outputs.version }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=vm-preparer
          provenance: false
          build-args: |
            SRW_SOURCE_REVISION=${{ steps.ident.outputs.full }}
            SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}
            SRW_RELEASE_VERSION=${{ steps.ident.outputs.version }}
            SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-preparer:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-preparer:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true


  # ---------------------------------------------------------------------------
  # Publish the dev Helm chart. The chart version (monotonic 0.0.<run_number>)
  # plus the baked image tags fully determine what the dev cluster runs — the
  # Fleet HelmOp on the rancher cluster resolves ">=0.0.911" from GHCR on its
  # own, so a publish IS the deploy. Nothing writes back to git.
  # ---------------------------------------------------------------------------
  deploy-experimental:
    needs:
      - architecture
      - changes
      - dependency-audit
      - test-python
      - test-cockpit
      - build-agent
      - build-orchestrator
      - build-cockpit
      - build-mcp
      - build-workspace
      - build-vm-controller
      - build-vm-preparer
      - chart-test
      - chart-schema-negative
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.architecture.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled' &&
      needs.chart-test.result != 'failure' && needs.chart-test.result != 'cancelled' &&
      needs.chart-schema-negative.result != 'failure' && needs.chart-schema-negative.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Full history: the staleness guard below compares commit ancestry.
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify every chart image before publication
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/verify_chart_images.py
          --repository "${{ env.REGISTRY }}/${{ env.REPO_LOWER }}"
          --inventory /tmp/verified-chart-images.json

      - name: Compute tags
        id: tag
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # The chart version MUST be monotonic: Fleet resolves an OCI chart by
          # semver constraint, and semver compares prerelease identifiers
          # LEXICALLY. The old "0.0.0-dev.sha-<short>" scheme therefore ordered
          # charts alphabetically by sha rather than chronologically. Measured
          # against the live 557-tag srw-dev package on 2026-08-30, a
          # ">=0.0.0-0" constraint selected a chart three days stale and would
          # not have moved again for ~407 builds, with every status green.
          #
          # Build metadata is NOT an escape hatch: "0.0.N+sha.x" is pushed as OCI
          # tag "0.0.N_sha.x" (a "+" is illegal in a tag) and Fleet never maps it
          # back, so such charts are invisible to resolution entirely. Verified
          # on the rancher cluster, same date.
          #
          # GITHUB_RUN_NUMBER is monotonic and never reused. The sha is not lost:
          # it ships as --app-version below. Note "0.0.<N>" outranks every
          # existing "0.0.0-dev.sha-*" tag, since a release beats any prerelease
          # of the same core version — so the cutover needs no tag cleanup.
          echo "chart_version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # -- Publish dev chart (only when helm/ changed or any build succeeded) --
      - name: Package and push dev chart
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-agent.result == 'success' ||
          needs.build-orchestrator.result == 'success' ||
          needs.build-cockpit.result == 'success' ||
          needs.build-mcp.result == 'success' ||
          needs.build-workspace.result == 'success' ||
          needs.build-vm-controller.result == 'success' ||
          needs.build-vm-preparer.result == 'success'
        env:
          SHA_ORCHESTRATOR: ${{ needs.changes.outputs.orchestrator-sha }}
          SHA_AGENT: ${{ needs.changes.outputs.agent-sha }}
          SHA_COCKPIT: ${{ needs.changes.outputs.cockpit-sha }}
          SHA_MCP: ${{ needs.changes.outputs.mcp-sha }}
          SHA_WORKSPACE: ${{ needs.changes.outputs.workspace-sha }}
          SHA_VMCONTROLLER: ${{ needs.changes.outputs.vm-controller-sha }}
          SHA_VMPREPARER: ${{ needs.changes.outputs.vm-preparer-sha }}
        run: |
          helm repo add collabora https://collaboraonline.github.io/online --force-update
          helm dependency build helm/
          # Override chart name for dev channel
          yq -i '.name = "srw-dev"' helm/Chart.yaml

          # -- Bake component image tags into the chart itself --
          # The chart version has to fully determine which images run: a Fleet
          # HelmOp resolves a chart from the registry and has no git-read values
          # overlay to carry tags alongside it. Baking them here is a build step,
          # not a commit — helm/values.yaml is restored below and never staged.
          #
          # These are the SAME per-component identities the deployment overlay
          # uses: the newest commit that touched each component's build inputs,
          # never the push HEAD. So a component whose inputs did not change keeps
          # its existing tag across runs and does not provoke a needless rollout
          # (which for the agent means a fleet drain). The changes job emits all
          # six unconditionally, so this is correct whether or not that
          # component rebuilt in this run.
          : "${SHA_ORCHESTRATOR:?verified component identity is required}"
          : "${SHA_AGENT:?verified component identity is required}"
          : "${SHA_COCKPIT:?verified component identity is required}"
          : "${SHA_MCP:?verified component identity is required}"
          : "${SHA_WORKSPACE:?verified component identity is required}"
          : "${SHA_VMCONTROLLER:?verified component identity is required}"
          export TAG_ORCHESTRATOR="sha-${SHA_ORCHESTRATOR::7}"
          export TAG_AGENT="sha-${SHA_AGENT::7}"
          export TAG_COCKPIT="sha-${SHA_COCKPIT::7}"
          export TAG_MCP="sha-${SHA_MCP::7}"
          export TAG_WORKSPACE="sha-${SHA_WORKSPACE::7}"
          export TAG_VMCONTROLLER="sha-${SHA_VMCONTROLLER::7}"
          : "${SHA_VMPREPARER:?verified component identity is required}"
          export TAG_VMPREPARER="sha-${SHA_VMPREPARER::7}"
          export REV_ORCHESTRATOR="$SHA_ORCHESTRATOR"
          export REV_AGENT="$SHA_AGENT"
          export REV_COCKPIT="$SHA_COCKPIT"
          export REV_MCP="$SHA_MCP"
          export REV_WORKSPACE="$SHA_WORKSPACE"
          export REV_VMCONTROLLER="$SHA_VMCONTROLLER"
          export CHART_VERSION="${{ steps.tag.outputs.chart_version }}"

          # The prior gate verified every expected image, including reused ones.
          : "${MCP_DIGEST:?verified MCP image digest is required}"

          yq -i '
            .image.orchestrator.tag = strenv(TAG_ORCHESTRATOR) |
            .image.agent.tag        = strenv(TAG_AGENT) |
            .image.cockpit.tag      = strenv(TAG_COCKPIT) |
            .image.mcp.tag          = strenv(TAG_MCP) |
            .image.mcp.digest       = strenv(MCP_DIGEST) |
            .image.workspace.tag    = strenv(TAG_WORKSPACE) |
            .vmController.image.tag = strenv(TAG_VMCONTROLLER) |
            .vmController.preparation.image.tag = strenv(TAG_VMPREPARER) |
            .vmController.preparation.image.digest = strenv(VM_PREPARER_DIGEST) |
            .provenance.releaseVersion = strenv(CHART_VERSION) |
            .provenance.components.orchestrator.sourceRevision = strenv(REV_ORCHESTRATOR) |
            .provenance.components.agent.sourceRevision        = strenv(REV_AGENT) |
            .provenance.components.cockpit.sourceRevision      = strenv(REV_COCKPIT) |
            .provenance.components.mcp.sourceRevision          = strenv(REV_MCP) |
            .provenance.components.workspace.sourceRevision    = strenv(REV_WORKSPACE) |
            .provenance.components.vmController.sourceRevision = strenv(REV_VMCONTROLLER)
          ' helm/values.yaml

          # Fail closed: a silently-unstamped chart would deploy ":latest" to
          # every component — the exact failure this step exists to prevent, and
          # invisible until pods started rolling. Checked structurally and scoped
          # to .image.*; vmController.image.tag lives outside that map and is
          # checked on its own right below.
          UNSTAMPED=$(yq '[.image[] | select(.tag == "latest")] | length' helm/values.yaml)
          if [ "$UNSTAMPED" != "0" ]; then
            echo "::error::${UNSTAMPED} image tag(s) under .image are still 'latest' in helm/values.yaml; refusing to publish a chart that would deploy :latest"
            exit 1
          fi
          # The controller was the one component this step used to leave at
          # "latest" — and only main.yml ever pushes that tag, so dev ran a
          # main-released controller beside develop-built everything else until
          # 2026-09-02 (design note single_cluster_vm_deployment.md §11.15).
          if [ "$(yq '.vmController.image.tag' helm/values.yaml)" = "latest" ]; then
            echo "::error::vmController.image.tag is still 'latest' in helm/values.yaml; refusing to publish a chart that would deploy an unpinned VM controller"
            exit 1
          fi

          mkdir -p dist
          helm package helm/ \
            --version "${{ steps.tag.outputs.chart_version }}" \
            --app-version "${{ steps.tag.outputs.sha }}" \
            --destination ./dist
          helm push ./dist/srw-dev-${{ steps.tag.outputs.chart_version }}.tgz \
            oci://ghcr.io/superhuman-remote-worker/charts
          # Restore working copy (never commit the name override or baked tags)
          git checkout helm/Chart.yaml helm/values.yaml
