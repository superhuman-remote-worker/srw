# A small task with an obvious end, run in agent mode: the worker does it in
# one loop and ends it with job_complete, without a plan or phases.
# Omit jobMode (or set it to worker) for big or open-ended work. Any Expert on
# SRW's own worker can run in either mode; a generic or custom image cannot
# take jobMode, and an agent-mode Job cannot be a live-session Job.
apiVersion: srw/v1alpha1
kind: Job
metadata:
  name: write-release-note
  scope: {kind: Account, name: personal}
spec:
  task:
    text: Write output/release-note.md, one short paragraph that announces version 2.4.
  jobMode: agent
  execution:
    expert:
      inline:
        runtime:
          adapter: srw/v1
          config: {config_name: general-worker}
    connectors: {}
  completion: {mode: Reported}
  retry: {maxAttempts: 1}
  timeoutSeconds: 900
