[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superhuman-remote-worker"
version = "0.0.0"
description = "Superhuman Remote Worker application packages"
requires-python = ">=3.11"
# Images install their existing, separate requirements before --no-deps -e .
dependencies = []

[project.scripts]
srw = "orchestrator.operator_cli.manifest_resources:main"

[project.optional-dependencies]
manifests = ["PyYAML>=6.0", "jsonschema>=4.18,<5"]
cli = ["httpx>=0.27,<1", "PyYAML>=6.0", "jsonschema>=4.18,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "agent", "agent.*",
  "orchestrator", "orchestrator.*",
  "mcp_server", "mcp_server.*",
  "vm_controller", "vm_controller.*",
  "shared", "shared.*",
]
namespaces = false

[tool.setuptools.package-data]
orchestrator = [
  "database/*.sql",
  "database/migrations/*/*.sql",
  "database/queries/*.sql",
  "database/queries/**/*.sql",
  "config/*.yaml",
  "config/prompts/*.md",
]
mcp_server = ["templates/*.html"]
shared = ["**/*.sql", "manifests/schema.json"]

[tool.ruff]
# Preserve the formatter/linter target used before packaging metadata existed.
target-version = "py310"

[tool.importlinter]
root_packages = ["agent", "orchestrator", "mcp_server", "vm_controller", "shared"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Applications and shared code use canonical package names"
type = "forbidden"
source_modules = ["agent", "orchestrator", "mcp_server", "vm_controller", "shared"]
forbidden_modules = [
  "src", "database", "services", "security", "models", "main", "auth",
  "routers", "utils", "graph_routes", "logging_config", "uploads", "seed",
  "operator_cli", "ssh_gateway", "canvas_gateway", "controller",
  "headscale_client", "lifecycle_auth",
]

[[tool.importlinter.contracts]]
name = "Applications are independent"
type = "independence"
modules = ["agent", "orchestrator", "mcp_server", "vm_controller"]

[[tool.importlinter.contracts]]
name = "Shared code does not depend on applications"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["agent", "orchestrator", "mcp_server", "vm_controller"]

[[tool.importlinter.contracts]]
name = "Lightweight shared modules do not depend on shared runtime"
type = "forbidden"
# Import Linter 2.13 skips the overlapping shared.runtime source/target pair.
# Every other current or future shared child remains covered as a package.
source_modules = ["shared.*"]
forbidden_modules = ["shared.runtime"]

[[tool.importlinter.contracts]]
name = "Generic manifest operations do not load application startup or the legacy harness"
type = "forbidden"
source_modules = ["orchestrator.routers.manifests", "orchestrator.schemas.manifests", "orchestrator.services.manifests"]
