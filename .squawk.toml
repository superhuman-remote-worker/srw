# Squawk linter config for src/orchestrator/database/migrations/**.sql.
# Wired into CI by .github/workflows/db-migrations.yml; design rationale
# and the rule list this complements live in knowledge-base/knowledge/db_migration.md
# §Testing & CI.

# Match the orchestrator's deployed Postgres version. Squawk uses this to
# decide which rules apply (e.g. PG 11+ skips table rewrites for ADD COLUMN
# with a constant default; PG 12+ tightens NOT NULL behaviour).
pg_version = "16.0"

# Stylistic rules disabled across all migrations — too noisy in practice
# and orthogonal to the lock-safety / breakage rules we actually care about.
excluded_rules = [
    "prefer-bigint-over-int",
    # Sibling of prefer-bigint-over-int above, same stylistic/noisy bucket:
    # widening a deliberately tiny, CHECK-bounded column (e.g.
    # knowledge_index.priority, a 0-2 rank) to 64 bits to satisfy this rule
    # would be strictly worse, not safer.
    "prefer-bigint-over-smallint",
    "prefer-text-field",
    # Unsatisfiable for our runner model. `.notx.sql` migrations
    # (CREATE/DROP INDEX CONCURRENTLY) must be a SINGLE statement: the runner
    # sends each file as one simple-query, so a multi-statement file would put
    # CONCURRENTLY inside an implicit transaction and fail. That makes it
    # impossible to precede the op with `SET lock_timeout` / `SET
    # statement_timeout` in-file. Timeout safety is instead a deploy-model
    # concern (serialized, advisory-locked runner; moderate table sizes).
    # Revisit if we ever alter hot, high-volume tables online.
    "require-timeout-settings",
]

# Files excluded from lint coverage. Two categories:
#
#   1. 0001_initial.sql (both DBs) — snapshot of the cutover state, not a
#      hand-written migration. Trips rules appropriate for ALTERs on a hot
#      prod table but irrelevant for an empty-DB bootstrap.
#
#   2. Already-applied migrations whose lint findings can't be acted on
#      without tripping the migration runner's checksum guard. The
#      underlying advice (prefer IDENTITY over BIGSERIAL, NOT VALID on
#      new CHECK constraints, CREATE INDEX CONCURRENTLY in .notx.sql) is
#      documented in knowledge-base/knowledge/db_migration.md and applies to all NEW migrations.
#      Files here shipped before squawk caught them; rewriting in place
#      would re-execute against a DB that's already at the target state.
#        - app/0004 / app/0006: BIGSERIAL primary keys (fixed forward by 0007).
#        - app/0008: ADD CHECK without NOT VALID and CREATE INDEX without
#                CONCURRENTLY on threads. Already applied 2026-05-13.
#        - app/0058: CREATE INDEX without CONCURRENTLY on the brand-new Canvas
#                table. The applied bytes predate its lint annotation and are
#                pinned by the migration checksum guard.
#        - vector/0008: six CREATE INDEX without CONCURRENTLY. Four are on
#                brand-new empty tables (knowledge_chunks) — instant build, no
#                meaningful lock; the two on knowledge_index are sub-second on a
#                small table. The file is transactional-atomic by design
#                (knowledge-base/knowledge/features/okf_knowledge_base.md slice-3 PR1), so
#                CONCURRENTLY — which cannot run in a transaction — can't live in
#                it anyway, and it is already applied on develop; the runner's
#                checksum guard forbids editing it in place.
#        - app/0132: the exact settled critic index intentionally omits IF NOT
#                EXISTS. A failed concurrent build leaves an INVALID shell, so
#                treating that shell as success would make the guard both
#                unusable and write-rejecting. Migration 0131 performs the
#                same-name concurrent drop first; the applied 0132 checksum is
#                immutable, so this intentional prefer-robust-stmts exception
#                belongs here rather than in the SQL file.
#        - app/0117: CREATE INDEX without CONCURRENTLY on run_queue — a table
#                CREATEd two files earlier in the same chain (0115a), so the
#                build is against an empty table on every DB that applies it.
#                Squawk only tracks same-file creations, so it cannot see that.
#                The file is transactional-atomic by design (the affinity index
#                and the column comments it documents must land together), and
#                CONCURRENTLY cannot run in a transaction — identical shape to
#                app/0058 and vector/0008 above.
#        - app/0122: ban-char-field on sync_scope_sha256 CHAR(64) — a
#                fixed-width lowercase-hex SHA-256, which is precisely the
#                carve-out in the rule's own "almost always" wording. Its
#                sibling stylistic rule prefer-text-field is already excluded
#                wholesale above; this file is the only place the char variant
#                fires, so a path entry keeps the rule live for future
#                migrations rather than disabling it globally.
#        - app/0123: the same digest-column exception as 0122, plus two
#                constraint-missing-not-valid findings. Both CHECKs constrain
#                columns added by the SAME ALTER TABLE, each with a constant
#                DEFAULT that satisfies its own constraint — so the validation
#                scan can only ever see rows it accepts, and there is no
#                pre-existing data to scan (the table is CREATEd by 0122 in
#                this chain). Splitting to NOT VALID + a later VALIDATE would
#                open a window in which a violating row could land, i.e.
#                strictly worse than the atomic form.
#        - app/0143: two constraint-missing-not-valid findings on the Gate-3
#                completion command table. The commands feature is tracked
#                default-off, so production applies this migration before it
#                can contain rows; local k3d had only the deliberately retained
#                soak fixtures. The checks were therefore bounded empty-table
#                validation, protected by a 2 s lock timeout. Tilt applied and
#                checksummed these bytes before the pinned-linter pass, so an
#                in-place annotation or NOT VALID rewrite would violate the
#                migration ledger. Future constraints retain the normal
#                NOT VALID + later VALIDATE rule.
#        - app/0147: the composite permission-request identity UNIQUE supports
#                the same-file composite receipt FK. PostgreSQL cannot add a
#                UNIQUE constraint NOT VALID, and the migration explicitly
#                bounded/retried its ACCESS EXCLUSIVE lock on the small
#                permission table. Tilt applied and checksummed these bytes
#                before the pinned-linter pass, so fix-forward migrations
#                0148/0149 add the receipt index concurrently and validate the
#                FK/CHECK while this already-applied file remains immutable.
#        - app/0171: two constraint-missing-not-valid plus three
#                require-concurrent-index-creation findings on the Officer
#                runtime-grant liveness fence. The CHECKs are the app/0123
#                carve-out exactly: both constrain columns added by the SAME
#                ALTER TABLE, and neither can see a row it would reject —
#                credential_generation arrives NOT NULL DEFAULT 1 (satisfies
#                > 0) and the four refresh-handoff columns arrive all-NULL
#                (satisfies the shape check). NOT VALID + a later VALIDATE
#                would be strictly worse here, opening a window in which a
#                violating row could land. The three indexes are the app/0117
#                shape: the file is transactional-atomic by design — the two
#                UNIQUE indexes are the enforcement half of the same fence as
#                the BEFORE INSERT OR UPDATE trigger this file creates, so
#                they must land in the trigger's transaction, and
#                CONCURRENTLY cannot run in one. runtime_actor_grants is a
#                small retained ledger (dev: ~750 rows), so each build is
#                sub-second under the file's 2 s lock timeout. Applied on the
#                dev cluster 2026-08-20 (the develop pipeline shipped the
#                image before this gate reported), so the bytes are pinned by
#                the migration checksum guard and an in-place rewrite would
#                wedge that cluster's boot.
#        - app/0183: two constraint-missing-not-valid findings. This file is the
#                cautionary case the rule exists for, and it has now caused an
#                outage twice in opposite directions. 2a950908 appended
#                NOT VALID to both CHECKs *inside* 0183 after it had shipped;
#                the checksum guard then refused to boot the orchestrator on
#                every database that had already applied the original bytes,
#                taking the whole stack down (every other pod's init container
#                waits on the orchestrator). The repair attempt restored the
#                original bytes -- but the fleet had overwhelmingly applied the
#                *edited* bytes, not the original: the dev cluster recorded
#                46002314... on 2026-08-27 and origin/main ships the same
#                content. Restoring the original therefore inverted the outage
#                rather than ending it. 0183 now carries the bytes the fleet
#                actually applied, and app/0213 re-expresses the same NOT VALID
#                shape idempotently so either lineage converges. Acting on this
#                finding in place is precisely the outage; the file must stay
#                byte-frozen forever, at these bytes.
#        - app/0203: one prefer-robust-stmts finding on the concurrent unique
#                index behind threads.ssh_handle. The app/0132 carve-out
#                exactly, and 0203's own `rollout:` header already argues it:
#                IF NOT EXISTS reports success against an INVALID same-name
#                shell left by a failed concurrent build, which would record
#                0203 as applied while uniqueness went unenforced. That is not
#                cosmetic here -- the handle is how SSH addresses a session, so
#                an unenforced index routes a connection to the wrong
#                workspace. It buys nothing on the success path either, since
#                the runner re-reads schema_migrations and skips an applied
#                .notx migration. The file documents the explicit DROP INDEX
#                CONCURRENTLY repair instead.
#        - app/0204: two require-concurrent-index-creation findings on the
#                ssh_attachments audit table. The app/0117 shape, but stronger:
#                both indexes sit inside the same BEGIN/COMMIT as the
#                CREATE TABLE IF NOT EXISTS public.ssh_attachments a few lines
#                above them, so each build is against a table this same file
#                just created -- empty, instant, no meaningful lock. The file
#                is transactional-atomic by design (the table, its FK-lock
#                retry wrapper and its indexes must land together) and
#                CONCURRENTLY cannot run in a transaction, so the rule is
#                unsatisfiable here rather than merely inconvenient.
#          Both 0203 and 0204 were flagged on develop when they landed (run
#          021232f4, 2026-08-29). That red self-cleared on the next push --
#          the lint covers only files changed in that push -- and the files
#          were applied and checksum-frozen before anyone acted on it. They
#          are recorded here so the exemption lives where every other one
#          does, rather than resting on the promotion skip in db-migrations.yml.
#        - app/0212: one constraint-missing-not-valid on models_capabilities_check.
#                The app/0123 carve-out shape: the migration REPLACES the
#                existing constraint with a strictly wider one (same predicate
#                plus 'search' and 'fetch' in the allowed array), so every row
#                that satisfied the old constraint satisfies the new one and
#                the validation scan can only ever see rows it accepts. models
#                is a small catalog table, so the scan is sub-second. The file
#                is transactional-atomic by design — its own header records
#                that replacing the inline CHECK must be one atomic change so
#                no row can be written between the DROP and the ADD — and a
#                NOT VALID split would reopen exactly that window.
#        - app/0235: two ban-drop-not-null findings. The rule's stated risk is
#                breaking existing clients, and there are none: both columns
#                belong to srw_workspace_instances and srw_resource_secrets,
#                tables CREATEd by app/0234 one file earlier in this same
#                chain. No database has ever held these tables with a NOT NULL
#                owner_id, because every database that applies 0235 applied
#                0234 in the same startup sequence moments earlier. Relaxing
#                the column is this migration's entire documented purpose:
#                deleting a principal must preserve completed manifest history
#                and shared Project credentials rather than cascade through
#                them. The two constraint-missing-not-valid findings the file
#                also raised are fixed rather than excluded: both CHECKs are
#                now added NOT VALID and validated by app/0239, so this entry
#                covers only the two deliberate nullability relaxations.
#        - app/0251-0256: immutable recovery rollout shipped in 2a9f65a3;
#                reviewed after develop run 35196885330 reported 43 findings.
#                These only alter the recovery/cleanup ledgers introduced by
#                0250/0252 in the same rollout, not jobs or other existing hot
#                tables. 0251/0252/0254 widen phase/identity checks; 0253
#                backfills the new intent digest before enforcing NOT NULL;
#                0255 adds controller evidence with all-null initial shape;
#                0256 atomically replaces uniqueness with parent/child fences.
#                Their scans, volatile-default rewrite (0255), and ordinary
#                index builds are confined to these new ledgers. Recovery is
#                default-off. The runner wraps even files without explicit
#                BEGIN in a transaction and records the checksum atomically,
#                so partial retries cannot leave the unguarded DDL behind.
#                Preserve shipped SQL bytes: retrofitting NOT VALID, IF EXISTS,
#                or concurrent indexes would cause checksum drift. These are
#                exact-file exceptions; future migrations retain all rules.
excluded_paths = [
    "src/orchestrator/database/migrations/app/0001_initial.sql",
    "src/orchestrator/database/migrations/vector/0001_initial.sql",
    "src/orchestrator/database/migrations/app/0004_thread_events.sql",
    "src/orchestrator/database/migrations/app/0006_headless_notifications.sql",
    "src/orchestrator/database/migrations/app/0008_thread_awaiting_user.sql",
    "src/orchestrator/database/migrations/app/0058_canvases.sql",
    "src/orchestrator/database/migrations/app/0117_run_queue_affinity.sql",
    "src/orchestrator/database/migrations/app/0122_thread_cloud_sync_generations.sql",
    "src/orchestrator/database/migrations/app/0123_thread_cloud_sync_baselines.sql",
    "src/orchestrator/database/migrations/app/0132_jobs_verification_uniq.notx.sql",
    "src/orchestrator/database/migrations/app/0143_job_completion_accept_status.sql",
    "src/orchestrator/database/migrations/app/0147_thread_permission_lease_receipts.sql",
    "src/orchestrator/database/migrations/app/0171_officer_runtime_grant_liveness.sql",
    "src/orchestrator/database/migrations/app/0183_persistent_input_delivery_cancellation.sql",
    "src/orchestrator/database/migrations/app/0203_threads_ssh_handle_idx.notx.sql",
    "src/orchestrator/database/migrations/app/0204_ssh_attachments.sql",
    "src/orchestrator/database/migrations/app/0212_search_fetch_capabilities.sql",
    "src/orchestrator/database/migrations/app/0235_manifest_user_retirement.sql",
    "src/orchestrator/database/migrations/app/0251_vm_workspace_recovery_attention_identity.sql",
    "src/orchestrator/database/migrations/app/0252_vm_workspace_recovery_controls.sql",
    "src/orchestrator/database/migrations/app/0253_vm_workspace_cleanup_intent.sql",
    "src/orchestrator/database/migrations/app/0254_vm_workspace_recovery_reconciler.sql",
    "src/orchestrator/database/migrations/app/0255_vm_workspace_recovery_controller_evidence.sql",
    "src/orchestrator/database/migrations/app/0256_vm_workspace_cleanup_delegation.sql",
    "src/orchestrator/database/migrations/vector/0008_kb_index_chunking.sql",
]
