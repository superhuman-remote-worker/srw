  # A D6b should name `node --test "code/**/*.test.js"`.
  - id: D6-semver-js
    family: dev
    config_name: engineer
    description: |
      Write a small dependency-free Node.js module `code/semver.js`
      (CommonJS, `module.exports = { compare, satisfies }`) and its tests.

      - `compare(a, b)` returns -1, 0 or 1 by Semantic Versioning 2.0.0
        precedence. Versions are `MAJOR.MINOR.PATCH` with an optional
        `-prerelease` of dot-separated identifiers (no build metadata).
        Numeric identifiers compare numerically, alphanumeric ones in ASCII
        order, numeric ones sort before alphanumeric ones, a shorter set of
        identifiers sorts first when all earlier ones are equal, and a
        version with a prerelease sorts before the same version without one
        (`1.0.0-alpha < 1.0.0-alpha.1 < 1.0.0-beta < 1.0.0-beta.2 <
        1.0.0-beta.11 < 1.0.0-rc.1 < 1.0.0`).
      - `satisfies(version, range)` supports exactly four range forms:
        `1.2.3` (equal), `>=1.2.3`, `~1.2.3` (>=1.2.3 <1.3.0) and `^1.2.3`
        (>=1.2.3 <2.0.0; when MAJOR is 0 the next MINOR is the bound,
        `^0.2.3` = >=0.2.3 <0.3.0; when MAJOR and MINOR are 0 the next PATCH
        is, `^0.0.3` = >=0.0.3 <0.0.4). A version with a prerelease satisfies
        only an exact range equal to it.
      - Malformed versions or ranges throw a `TypeError`.

      Write `code/semver.test.js` with the built-in `node:test` runner
      covering both functions, run `node --test code/` from the workspace
      root, and save its complete output to `output/test-run.txt`.
    required_deliverables: [code/semver.js, code/semver.test.js, output/test-run.txt]

  - id: D7-cart-package
    family: dev
    config_name: engineer
    description: |
      Create the small Python package below under `code/shop/`. It has
      three real bugs. Fix them, add one feature, and test it.

      1. Write pytest tests under `code/tests/` that expose each bug
         (each must fail against the code as given), document each bug in a
         comment above its test, then fix the bugs.
      2. Feature: a cart line with quantity 10 or more is charged 95% of its
         line amount, rounded half-up to whole cents, and `subtotal()`
         returns the sum after that rule. Test it.
      3. `python -m pytest code -v`, run from the workspace root, must pass;
         save its complete output to `output/test-run.txt`.

      `code/shop/__init__.py`:
      ```python
      from .cart import Cart
      from .discounts import apply_discounts

      __all__ = ["Cart", "apply_discounts"]
      ```

      `code/shop/money.py`:
      ```python
      from decimal import ROUND_HALF_UP, Decimal


      def to_cents(amount):
          """Euros as str/int/Decimal -> integer cents, rounded half-up."""
          return int((Decimal(str(amount)) * 100).quantize(Decimal("1"), rounding=ROUND_HALF_UP))
      ```

      `code/shop/cart.py`:
      ```python
      from .discounts import apply_discounts
      from .money import to_cents


      class Cart:
          def __init__(self):
              self.lines = {}  # sku -> [unit_cents, qty]

          def add(self, sku, unit_price, qty=1):
              """Add qty units of sku; adding an existing sku increases its quantity."""
              if qty <= 0:
                  raise ValueError("qty must be positive")
              cents = to_cents(unit_price)
              if sku in self.lines:
                  self.lines[sku][1] = qty
              else:
                  self.lines[sku] = [cents, qty]

          def subtotal(self):
              return sum(unit * qty for unit, qty in self.lines.values())

          def total(self, codes=()):
              return apply_discounts(self.subtotal(), list(codes))
      ```

      `code/shop/discounts.py`:
      ```python
      def apply_discounts(subtotal_cents, codes):
          """Apply discount codes to a subtotal in cents.

          Percentage codes (PCTnn, nn percent off) apply first, each to the
          running total, rounding the discount down to whole cents; flat
          codes (FLATnnn, nnn cents off) apply after all percentage codes.
          The result is never below zero.
          """
          total = subtotal_cents
          for code in codes:
              if code.startswith("PCT"):
                  total = total - total * int(code[3:]) // 100
              elif code.startswith("FLAT"):
                  total = total - int(code[4:])
          return total
      ```
    required_deliverables: [code/shop/cart.py, code/shop/discounts.py, output/test-run.txt]

