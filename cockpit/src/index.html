<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cockpit</title>
  <!-- Bump the app-shell hash when trusted-parent response policy changes. -->
  <meta name="srw-app-shell-policy" content="anti-framing-v1">
  <base href="/">
  <!-- interactive-widget=resizes-content: since Chrome 108 the Android keyboard
       only shrinks the *visual* viewport by default, so the flex column (100dvh)
       keeps the composer underneath the keyboard and the browser scroll-hacks the
       focused textarea alone into view. resizes-content shrinks the layout
       viewport instead, re-laying the whole column above the keyboard.
       maximum-scale=1 + user-scalable=no: lock page zoom on mobile — the cockpit
       is an app shell, not a document. Honored by Android Chrome and installed
       iOS PWAs; Safari browser tabs ignore the lock for accessibility, but
       maximum-scale=1 still suppresses iOS auto-zoom on focusing <16px inputs.
       Double-tap zoom is separately disabled via touch-action in styles.scss. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Purple fallback; pre-paint resolution and ThemeService follow the app's
       selected accent and mode, which can differ from the OS preference. -->
  <meta name="theme-color" content="#5f499c">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SRW">
  <meta name="msapplication-TileColor" content="#5f499c">
  <meta property="og:title" content="SRW · Cockpit">
  <meta property="og:description" content="Command center for remote AI workers.">
  <meta property="og:image" content="assets/social/og-1200x630.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="assets/env.js"></script>
  <script>
    // Reveal Material Symbols ligatures only after the icon font has loaded.
    // Without this, the literal text (e.g. "settings") flashes before glyphs
    // arrive — visible as broken `.notdef` boxes in the UI.
    (function () {
      function markLoaded() {
        // When the font is already cached, document.fonts.load() resolves in a
        // microtask that runs before <body> is parsed — document.body is null.
        // Guard and defer to DOMContentLoaded in that case.
        if (document.body) { document.body.classList.add('fonts-loaded'); }
        else { document.addEventListener('DOMContentLoaded', markLoaded, { once: true }); }
      }
      if (document.fonts && document.fonts.load) {
        document.fonts.load('1em "Material Symbols Outlined"')
          .then(markLoaded)
          .catch(markLoaded);
        // Hard fallback so icons never stay invisible if the font fails.
        setTimeout(markLoaded, 3000);
      } else {
        markLoaded();
      }
    })();
  </script>
</head>
<body class="theme-travertine">
  <script>
    // Pre-paint theme resolution: pick the body class before Angular hydrates so
    // dark-OS users don't flash through the Travertine fallback class on first paint.
    // Mirrors ThemeService.readStoredPreference() and readStoredAccent() — keep in sync.
    (function () {
      try {
        var raw = window.localStorage.getItem('cockpit:theme');
        var migrate = {dark: 'senate', light: 'travertine', praetorian: 'senate'};
        var pref = (raw && migrate[raw]) || raw || 'system';
        var valid = {travertine: 1, senate: 1, system: 1};
        if (!valid[pref]) pref = 'system';
        var resolved = pref;
        if (pref === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'senate' : 'travertine';
        }
        document.body.classList.remove('theme-travertine', 'theme-senate', 'theme-praetorian');
        document.body.classList.add('theme-' + resolved);
        // Accent axis: tyrian is the default the bare theme class already
        // paints; only a stored alternative needs the extra class pre-paint.
        var accent = window.localStorage.getItem('cockpit:accent');
        var validAccent = {tyrian: 1, porphyry: 1, graphite: 1};
        if (!accent || !validAccent[accent]) accent = 'tyrian';
        document.body.classList.remove('accent-tyrian', 'accent-porphyry', 'accent-graphite');
        document.body.classList.add('accent-' + accent);
      } catch (e) { /* leave fallback class in place */ }
      // Read the same token as the app rather than duplicating the palette.
      // ThemeService repeats this after bootstrap and on appearance changes.
      function syncBrowserThemeColor() {
        var color = window.getComputedStyle(document.body).getPropertyValue('--accent-color').trim();
        if (color) {
          document.querySelectorAll('meta[name="theme-color"], meta[name="msapplication-TileColor"]')
            .forEach(function (meta) { meta.content = color; });
        }
      }
      syncBrowserThemeColor();
      // Production CSS can arrive after this script AND Angular bootstrap.
      // Wait until its onload handler has changed media="print" to "all".
      document.addEventListener('load', function (event) {
        if (event.target instanceof HTMLLinkElement && event.target.rel === 'stylesheet') {
          window.requestAnimationFrame(syncBrowserThemeColor);
        }
      }, true);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
