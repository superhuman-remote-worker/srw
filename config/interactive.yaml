# yaml-language-server: $schema=schema.json
$extends: session_base

agent_id: interactive
display_name: Interactive Assistant

llm:
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic
  temperature: 0.3
  reasoning_level: null

# Simpler tool set for interactive testing
tools:
  workspace:
    - read_file
    - write_file
    - list_files
    - search_files
  research:
    - web_search
  shell:
    - run_command
    - shell_read
  # git: intentionally absent. This agent has shell tools, and
  # ToolsConfig.__post_init__ (src/shared/runtime/core/loader.py) suppresses the git_* group
  # whenever shell is present — a shell can run git against ANY repository in
  # the workspace, including repos/<name>/, which git_* cannot. Declaring them
  # here would advertise tools the pod never binds.
  orchestrator: [ ]
  agent_catalog: [ ]
  workflows: [ ]
  core: [ ]
  citation: [ ]
  graph: [ ]
  sql: [ ]
  mongodb: [ ]
  evaluation: [ ]
  knowledge: [ ]
  delegation: [ ]

interactive:
  permission_mode: autonomous
