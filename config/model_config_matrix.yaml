# Model Config Matrix — unified replacement for the three legacy matrix files
# (prompt_matrix.yaml, instruction_matrix.yaml, settings_matrix.yaml).
#
# Top-level keys are model families (output of family_of() in
# src/shared/runtime/core/model_registry.py); `default` is the fall-through. Each family
# block can carry up to three subsections:
#   - prompts:       (prompt_type)      → filename in config/prompts/
#   - instructions:  (instruction_type) → filename in config/templates/
#   - settings:      inference parameters (incl. model_max_context_tokens)
#
# Resolution: per-section, expert family → expert default → base family →
# base default → hardcoded fallback. Sections and keys missing for a family
# fall through to `default`.
#
# Context window: a family's `settings.model_max_context_tokens` is the model's
# true max — a SINGLE value, with no separate conservative working-window cap.
# The context-management `limits` leaves (model_max_context_tokens,
# context_threshold_tokens, message_count_min_tokens) are DERIVED at load as
# fixed fractions of that base (see the *_FRACTION constants +
# _apply_settings_matrix in src/shared/runtime/core/loader.py); do not hand-author them here.
# When a model is added with an explicit per-model context window (Admin →
# Models `context_window`), that value overrides the family base and the same
# fractions re-derive the leaves. To run a model below its true max, set a
# smaller per-model `context_window` — the app imposes no default cap of its own.
#
# Summarization budgets are deliberately NOT derived here: they are computed
# at call time from the AUXILIARY model's own window (src/agent/core/summarizer.py).
# Deriving them from the main model's window sent 951k-token payloads to a
# 131k summarizer — knowledge-base/knowledge/features/context_summarization_rework.md.

default:
  # Reasoning control per family (see knowledge-base/knowledge/features/family_centered_reasoning.md).
  # method: effort_enum | binary_toggle | token_budget | always_on | none
  #
  # `xhigh` sits in the FALL-THROUGH list on purpose (2026-09-11): every
  # frontier family that shipped an effort control in the last year takes it, so
  # a model SRW has no family block for is likelier to support it than not, and
  # clamping it down to `high` silently spent the human's choice. The trade is
  # explicit — an unknown model whose provider does NOT know `xhigh` now gets a
  # 400 instead of a quiet degrade, and on the subscription proxy a 400 is
  # charged to the CREDENTIAL, benching the whole lane for ~60s. So give a model
  # its own family block as soon as its real ladder is known. `max` stays out:
  # it is rarer, and the clamp walks max -> xhigh, so asking for `max` on an
  # unknown model still lands on the strongest level this list declares.
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high, xhigh] }
  prompts:
    systemprompt: systemprompt.txt
    systemprompt_interactive: systemprompt_interactive.txt
    persona: persona.txt
    summarization: summarization_prompt.txt
    memory_extraction: memory_extraction_prompt.txt
    memory_assembler: memory_assembler_prompt.txt
    curation: curation_prompt.txt
    knowledge_assembler: knowledge_assembler_prompt.txt
    citation_verification: citation_verification_prompt.txt
  instructions:
    instructions: instructions.md
    strategic_todos_initial: strategic_todos_initial.yaml
    strategic_todos_transition: strategic_todos_transition.yaml
    strategic_todos_resume: strategic_todos_resume.yaml
    workspace_template: workspace_template.md
  guardrails:
    file: default.yaml
  settings:
    temperature: 0.0
    multimodal: false
    parallel_tool_calls: false
    model_max_context_tokens: 128000
    # Per-image token cost for the compaction trigger. `default` is the flat
    # biased-high fallback used for unknown families and unreadable image dims;
    # multimodal families below override with a dimension-aware mode. Verified
    # formulas: knowledge-history/done/context_token_accounting.md §4 + appendix.
    image_tokens: { mode: flat, flat: 1600 }
    # Session delegation cap for a PARENT of this family: how many
    # delegate_agent children a session with fan-out runs at once (1..20).
    # Routed to delegation.family_session_max_concurrent, not llm; an expert or
    # session delegation.session_max_concurrent beats it. Unset everywhere, so
    # every family uses the code default 6 until the live measurements set
    # per-family values (parallel_subagents.md §6.4, §13 D2, WP5/WP6).
    # session_max_concurrent: 6

minimax:
  # M2.7 reasoning is not a level we drive (no effort param); rely on endpoint
  # default. NOTE: may actually be a thinking toggle (vLLM minimax_m2_append_think
  # parser) — verify before promoting to binary_toggle.
  reasoning: { method: none }
  prompts:
    systemprompt: systemprompt_minimax.txt
    persona: persona_minimax.txt
    summarization: summarization_prompt_minimax.txt
  instructions:
    instructions: instructions_minimax.md
  guardrails:
    file: minimax.yaml
  settings:
    structured_output_method: json_schema
    temperature: 1.0  # M2.7 is a reasoning model; use default
    top_p: 0.95
    multimodal: false
    parallel_tool_calls: true
    model_max_context_tokens: 204800  # M2.7: 204,800 context, 131K max output
    max_output_tokens: 49152  # reasoning headroom (resolver clamps to ctx backstop)
    # MiniMax's OpenAI-compatible API defaults to thinking inside `content`
    # wrapped in <think> tags (+ a stray extra `</think>` on tool-call turns).
    # reasoning_split moves it to reasoning_content/reasoning_details — fields
    # the reasoning capture layer already parses. Harmless via OpenRouter
    # (normalizes either way). See
    # knowledge-base/knowledge/issues/minimax_m3_think_tag_reasoning_leak_post_gateway.md
    extra_body:
      reasoning_split: true

# MiniMax M3 (released 2026-06-01) — distinct family from `minimax` (M2.7) so
# the two coexist. M3 ships the MSA sparse-attention architecture, a 1M-token
# context window, native image+video multimodality, and an optional thinking
# toggle (on for agentic/long-horizon work). Served via an OpenAI-compatible
# API (LangChain ChatOpenAI), so tool calls use standard parens-form
# serialization and `default.yaml` guardrails apply.
minimax-m3:
  # M3 thinking toggle on the NATIVE MiniMax API (the current transport):
  # `thinking: {"type": adaptive|disabled}` on the OpenAI-compat wire. The API
  # originally also took "enabled"; MiniMax removed it (live 400 on 2026-07-23:
  # 'invalid thinking.type: "enabled" (allowed: adaptive, disabled)'), so "on"
  # now maps to "adaptive" (the surviving reasoning-on value). Default "on" is
  # sent explicitly (gemma precedent — robust against upstream default flips).
  # NOTE: if an M3 row is ever served from self-hosted vLLM instead, the kwarg
  # differs (chat_template_kwargs — verify the parser) and OpenRouter can't
  # express this at all (effort ignored, invalid values 400 → its factory
  # injects nothing, provider default applies).
  reasoning:
    method: binary_toggle
    default: "on"
    options: ["on", "off"]
    toggle_param: thinking.type
    toggle_map: { "on": "adaptive", "off": "disabled" }
  prompts:
    systemprompt: systemprompt_minimax_m3.txt
    persona: persona_minimax_m3.txt
    summarization: summarization_prompt_minimax_m3.txt
  instructions:
    instructions: instructions_minimax_m3.md
  guardrails:
    file: minimax_m3.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    structured_output_method: function_calling
    temperature: 1.0   # MiniMax recommends temp 1.0 for M-series reasoning models
    top_p: 0.95        # MiniMax recommended top_p
    # top_k: intentionally omitted. MiniMax recommends top_k=40, but the OpenAI
    #   Chat Completions wire format (LangChain ChatOpenAI) has no top_k field,
    #   so it would be silently dropped here. Same reason the `minimax` (M2.7)
    #   family omits it; top_k/min_p live in the builder/native-client matrices
    #   where the transport accepts them.
    multimodal: true   # M3 is natively multimodal (image + video input)
    parallel_tool_calls: true  # M3 supports continuous + parallel tool calls
    model_max_context_tokens: 1000000  # M3: up to 1M context (>=512K guaranteed) via MSA
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    image_tokens: { mode: flat, flat: 1600 }  # no public per-image formula — calibrate via usage
    # Same as the `minimax` family: without reasoning_split MiniMax's direct
    # API returns thinking as <think> tags inside `content` (leaky titles,
    # duplicated streaming text, stray double closer on tool-call turns).
    # See knowledge-base/knowledge/issues/minimax_m3_think_tag_reasoning_leak_post_gateway.md
    extra_body:
      reasoning_split: true

o-series:
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0
    multimodal: true  # o3/o4-mini support image inputs
    parallel_tool_calls: true
    model_max_context_tokens: 200000
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # o1/o3 tile model: 75 base + 150/tile after 2048/768 fit. NOTE: o4-mini is
    # actually patch-based, but family_of() folds o1/o3/o4 -> "o-series"
    # (model_registry.py), so a standalone o4-mini matrix row would be dead
    # config — it shares this tile estimate (biased-low for o4-mini). Acceptable
    # while o4-mini is unused; the real fix when it is adopted is splitting it
    # into its own family + an openai_patches row (budget 1536, x1.72).
    image_tokens: { mode: openai_tiles, base: 75, per_tile: 150, tile_px: 512, flat: 1000 }

# DeepSeek V4 family (released 2026-04-24). Covers BOTH variants — family_of()
# maps `deepseek-v4-pro` (1.6T/49B) and `deepseek-v4-flash` (284B/13B) to this
# single `deepseek` block; per-model differences (context window, reasoning
# effort) ride on the catalog row, not here. Both are 1M-context HYBRID reasoning
# models with a thinking mode, served OpenAI-compatible via OpenRouter (LangChain
# ChatOpenAI) — so tool calls use the standard parens-form serialization and
# reasoning comes back out-of-band (DeepSeek `reasoning_content`, OpenRouter
# `reasoning`/`reasoning_details`), captured by src/shared/runtime/llm/reasoning_chat.py.
#
# Prompts: forks the every-call scaffold (`systemprompt` + `systemprompt_interactive`),
# the identity (`persona`), and the auxiliary-path prompts (`memory_extraction`,
# `memory_assembler`, `curation`). The aux trio is forked because V4 Flash is wired
# as the auxiliary model, so those background tasks actually run on DeepSeek and want
# terse, structured-only output (the `<deepseek_output_contract>` block). The shared
# behavioral tuning — output-length discipline (V4's signature verbosity) and
# reasoning-channel hygiene — rides in these scaffolds. `strategic` / `tactical` /
# `summarization` / `instructions` intentionally inherit `default`: they are
# model-agnostic and DeepSeek's tool wire is the standard parens-form, so a fork
# would add maintenance with no benefit. Fork the phase prompts only if real V4 runs
# show a need.
deepseek:
  # Served via OpenRouter → unified effort param (superset incl. xhigh→max upstream).
  reasoning: { method: effort_enum, delivery: native, default: high, options: [none, minimal, low, medium, high, xhigh] }
  prompts:
    # Worker-path scaffold + identity
    systemprompt: systemprompt_deepseek.txt
    persona: persona_deepseek.txt
    # Interactive/persistent-session scaffold (V4 may serve sessions too)
    systemprompt_interactive: systemprompt_interactive_deepseek.txt
    # Auxiliary-path (memory + knowledge), loaded when V4 Flash is the aux model
    memory_extraction: memory_extraction_prompt_deepseek.txt
    memory_assembler: memory_assembler_prompt_deepseek.txt
    curation: curation_prompt_deepseek.txt
  guardrails:
    file: deepseek.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    # In THINKING mode DeepSeek V4 ignores temperature/top_p/penalties — tune the
    # prompt, not sampling. These values apply only to any non-thinking fallback
    # turn; DeepSeek's own guidance is temp 0.0 for code/agentic work. Reasoning
    # effort defaults to `high` (auto-`max` for agent harnesses) and is set
    # per-model via the catalog row's reasoningLevel, not here.
    temperature: 0.0
    top_p: 0.95
    multimodal: false  # V4 Pro + Flash are text-only
    parallel_tool_calls: false  # DeepSeek parallel tool calls remain unreliable
    model_max_context_tokens: 1000000  # V4 Pro + Flash: 1M context (was 64K on V3/R1)
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)

# Zhipu GLM-5.2 (released 2026-06-13) — text-only hybrid reasoning model,
# 744B-MoE / ~40B-active, with a usable 1M-token context window, served
# OpenAI-compatible via OpenRouter (LangChain ChatOpenAI). Closest analogue is
# `deepseek`: standard parens-form tool wire, reasoning returned out-of-band and
# captured by src/shared/runtime/llm/reasoning_chat.py. Reasoning EFFORT rides on the per-model
# catalog row (reasoning_level → OpenRouter `reasoning.effort`), NOT here. Vision
# is a separate model (GLM-5V-Turbo), so this family is text-only.
#
# Prompts: forks the worker scaffold (`systemprompt`), the persistent-chat
# scaffold (`systemprompt_interactive`), and the identity (`persona`). The phase
# prompts (`strategic`/`tactical`/`summarization`) and `instructions` inherit
# `default` — they are model-agnostic and GLM's tool wire is the standard
# parens-form, so a fork would add maintenance with no benefit. Aux-path prompts
# (memory_*, curation) are NOT forked: GLM is a chat/worker model, not the
# auxiliary model.
glm:
  # Served via OpenRouter → unified effort param (superset incl. xhigh→max upstream).
  reasoning: { method: effort_enum, delivery: native, default: high, options: [none, minimal, low, medium, high, xhigh] }
  prompts:
    systemprompt: systemprompt_glm.txt
    systemprompt_interactive: systemprompt_interactive_glm.txt
    persona: persona_glm.txt
  guardrails:
    file: glm.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0           # Z.ai published default for GLM-5.2 (thinking on by default)
    top_p: 0.95                # Z.ai published default
    multimodal: false          # text-only; vision is the separate GLM-5V-Turbo
    parallel_tool_calls: false # brand-new model — start safe, flip to true once validated
    model_max_context_tokens: 1000000  # usable 1M-token window
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)

# GLM-5.3 requires reasoning (low/high/max) on both Z.ai and OpenRouter.
# Flash adds native vision; the flagship remains text-only. These entries
# expand their shared YAML anchors independently (there is no family inheritance).
# Verified 2026-09-15:
# https://docs.z.ai/guides/llm/glm-5.3
# https://docs.z.ai/guides/vlm/glm-5.3-flash
# https://openrouter.ai/api/v1/models
glm-5.3:
  reasoning: &glm53_reasoning
    method: effort_enum
    delivery: native
    default: &glm53_default_effort max
    options: [low, high, max]
  prompts: &glm53_prompts
    systemprompt: systemprompt_glm_5_3.txt
    systemprompt_interactive: systemprompt_interactive_glm_5_3.txt
    persona: persona_glm_5_3.txt
  guardrails:
    file: default.yaml
  settings: &glm53_settings
    shell_mode: persistent
    structured_output_method: function_calling
    temperature: 1.0
    top_p: 0.95
    # Apply the same default at config load, overriding expert_base's high.
    # Explicit expert/user/catalog settings still win.
    reasoning_level: *glm53_default_effort
    multimodal: false
    parallel_tool_calls: false
    # Z.ai's documented 1M window; larger OpenRouter windows depend on provider.
    model_max_context_tokens: 1000000
    max_output_tokens: 131072  # documented 128K output, including reasoning

glm-5.3-flash:
  reasoning: *glm53_reasoning
  prompts: *glm53_prompts
  guardrails:
    file: default.yaml
  settings:
    <<: *glm53_settings
    multimodal: true
    image_tokens: { mode: flat, flat: 1600 }  # no verified per-image formula

# Meta Muse Spark 1.3, including the separately selected Contributor tier.
# OpenRouter catalog verified 2026-09-15: required reasoning, medium default,
# 1,048,576 context. https://openrouter.ai/api/v1/models
muse-spark-1.3:
  reasoning:
    method: effort_enum
    delivery: native
    default: &muse13_default_effort medium
    options: [minimal, low, medium, high, xhigh, max]
  prompts:
    systemprompt: systemprompt_muse_spark_1_3.txt
    systemprompt_interactive: systemprompt_interactive_muse_spark_1_3.txt
    persona: persona_muse_spark_1_3.txt
  guardrails:
    file: default.yaml
  settings:
    shell_mode: persistent
    structured_output_method: function_calling
    # Conventional sampling defaults listed by OpenRouter; no Meta tuning verified.
    temperature: 1.0
    top_p: 1.0
    # Override inherited expert-base high; explicit settings still win.
    reasoning_level: *muse13_default_effort
    multimodal: true
    parallel_tool_calls: false
    model_max_context_tokens: 1048576
    # SRW's per-response ceiling, including reasoning. OpenRouter advertises
    # up to 943,718 output tokens; the existing runtime cap is 131,072.
    max_output_tokens: 131072
    image_tokens: { mode: flat, flat: 1600 }  # no verified per-image formula

# Moonshot Kimi K3 (API 2026-07-16, open weights 2026-07-27): 2.8T MoE / 104B
# active, 1,048,576-token context, native image + video input, served
# OpenAI-compatible (api.moonshot.ai/v1 as `kimi-k3`, OpenRouter as
# `moonshotai/kimi-k3`). Standard parens-form tool wire, so `default.yaml`
# guardrails apply. Older Kimi rows (K2.x: 256K, `thinking` toggle, no effort
# field) stay on `default` — the resolvers match K3 only.
# Verified 2026-09-29:
# https://platform.kimi.ai/docs/guide/kimi-k3-quickstart
# https://platform.kimi.ai/docs/api/models-overview
# https://openrouter.ai/api/v1/models
#
# Reasoning is always on and cannot be disabled; the only control is the
# top-level `reasoning_effort` (low|high|max, provider default max). The K2.x
# `thinking` param is gone — never send it. Moonshot warns that changing the
# level mid-conversation invalidates prefix-cache hits.
#
# The native API rejects any temperature other than 1.0, and fixes top_p at 0.95,
# n at 1 and both penalties at 0 (other values return an error; Moonshot's advice is to
# omit them). The factories always send `temperature`, so it stays at the one
# accepted value; top_p is left unset so each provider applies its own default.
#
# Structured output MUST stay `json_schema` (strict supported). A forced
# named tool — what `function_calling` does — returns HTTP 400 with thinking on
# ("tool_choice 'specified' is incompatible with thinking enabled"), and K3
# always thinks. `tool_choice: required` is accepted.
#
# Moonshot asks for the complete assistant message, `reasoning_content`
# included, to be sent back on every turn (Preserved Thinking). The
# OpenAI-compatible transport does not serialize reasoning back, so K3
# loses its prior reasoning between calls. No 400 is documented for that, but
# it is a quality gap; the K3 prompts ask for a one-line visible intent before
# each tool call so the thread survives.
kimi-k3:
  reasoning:
    method: effort_enum
    delivery: native
    default: &kimik3_default_effort max
    options: [low, high, max]
  prompts:
    systemprompt: systemprompt_kimi_k3.txt
    systemprompt_interactive: systemprompt_interactive_kimi_k3.txt
    persona: persona_kimi_k3.txt
  guardrails:
    file: default.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    structured_output_method: json_schema  # function_calling forces a named tool -> 400 (see above)
    temperature: 1.0  # the only value the native API accepts
    # Override inherited expert-base high with the provider default; explicit
    # expert/user/catalog settings still win.
    reasoning_level: *kimik3_default_effort
    multimodal: true  # images as base64 data URLs; native API rejects public image URLs
    # Moonshot documents parallel tool calls, but OpenRouter does not list the
    # param for K3 — start safe like every new family, flip once validated.
    parallel_tool_calls: false
    model_max_context_tokens: 1048576
    # Moonshot's own max_completion_tokens default (reasoning included); the
    # provider allows up to the full window.
    max_output_tokens: 131072
    # MoonViT-V2 token cost is dynamic and unpublished (Moonshot points to its
    # estimate-tokens API) — calibrate from usage.
    image_tokens: { mode: flat, flat: 1600 }

# Qwen3.8-27B (open weights 2026-08-14, Apache 2.0): dense vision-language model
# (image + video), 262,144-token native context (1M only with YaRN, which Qwen
# says costs quality on short inputs). Served OpenAI-compatible — self-hosted
# vLLM/SGLang (`--reasoning-parser qwen3 --tool-call-parser qwen3_xml`),
# OpenRouter `qwen/qwen3.8-27b`, Qwen Cloud. Only the 27B is matched: Qwen3.8
# Max has its own family (1M window), and Flash and older Qwen rows stay on
# `default`.
# Verified 2026-09-29:
# https://huggingface.co/Qwen/Qwen3.8-27B (model card + chat_template.jinja)
# https://recipes.vllm.ai/Qwen/Qwen3.8-27B
# https://openrouter.ai/api/v1/models
#
# Reasoning: thinking is on by default; `reasoning_effort` takes exactly
# xhigh (default) | medium | low. The official chat template RAISES on any
# other value — `high` is a hard error — so the ladder here must never grow
# a level the template lacks (the factory clamp maps high -> medium,
# max -> xhigh). Qwen: lower effort "does not always reduce overall task
# completion time" on multi-turn agent work, hence the xhigh default. The
# `enable_thinking` off-switch is not exposed (one reasoning method per
# family). vLLM's recipe passes effort in chat_template_kwargs, while the
# model card shows the top-level field on "most frameworks" — if a vLLM build
# ignores the top-level field, the template default (xhigh) applies.
#
# The template also RAISES on a system message that is not first ("System
# message must be at the beginning.") — and SRW sends the compaction summary
# as a second system message. `single_system_message` folds the request to
# one leading system turn (later system messages become user turns).
#
# Sampling is the model card's thinking-mode set (temperature 1.0, top_p 0.95,
# top_k 20; min_p / penalties at their defaults, so not sent).
qwen3.8-27b:
  reasoning:
    method: effort_enum
    delivery: native
    default: &qwen38_default_effort xhigh
    options: [low, medium, xhigh]
  guardrails:
    file: default.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    structured_output_method: json_schema
    single_system_message: true  # template rejects any system message but the first
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    # Override inherited expert-base high (which the template rejects) with
    # the model default; explicit expert/user/catalog settings still win.
    reasoning_level: *qwen38_default_effort
    multimodal: true
    parallel_tool_calls: false  # new family — start safe, flip once validated
    model_max_context_tokens: 262144
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # 16px patches merged 2x2 -> one token per 32x32 px, at most 16,777,216 px
    # (16,384 tokens) per image (preprocessor_config.json). ceil() biases high.
    image_tokens: { mode: openai_patches, patch_px: 32, budget: 16384, flat: 16384 }

# Qwen3.8 Max (2.4T MoE; text, image and video in) and Max Prime (the same
# model on a higher-throughput SKU). API only: Alibaba Model Studio (DashScope,
# OpenAI-compatible) or OpenRouter `qwen/qwen3.8-max-0902` /
# `qwen/qwen3.8-max-prime`. The open-weight Qwen3.8-2.4T-A95B is not matched:
# it is text-only, and its chat template raises on images.
# Verified 2026-09-29:
# https://www.alibabacloud.com/help/en/model-studio/qwen3-8-max
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
# https://www.alibabacloud.com/help/en/model-studio/qwen-function-calling
# https://openrouter.ai/api/v1/models
#
# Reasoning: top-level `reasoning_effort`, valid xhigh (default) | medium |
# low; effort sets the thinking budget (4,096 / 16,384 / 262,144). Unlike the
# open-weight template the API does not raise on `high`, it maps high and max
# to xhigh, so the ladder lists only the levels that differ. `thinking_budget`
# alongside an effort is a 400; SRW never sends it.
#
# Forced tool use is unsupported in thinking mode (no `required`, no named
# tool), so structured output stays on json_schema. Alibaba documents no rule
# for system messages after the first; the open variant's template raises on
# them, so fold them (see qwen3.8-27b). `preserve_thinking` is on and asks for
# prior reasoning_content, which SRW never replays (all families). Very verbose:
# Artificial Analysis measured about twice the median output tokens.
#
# Sampling: Alibaba publishes no thinking-mode set for Max; this is Qwen's set
# for the open 2.4T variant and for Flash (1.0 / 0.95 / 20).
qwen3.8-max:
  reasoning:
    method: effort_enum
    delivery: native
    default: &qwen38max_default_effort xhigh
    options: [low, medium, xhigh]
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    structured_output_method: json_schema  # forced tool use is unsupported in thinking mode
    single_system_message: true  # undocumented on the API; the open variant's template raises
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    # Override inherited expert-base high with the API default; explicit
    # expert/user/catalog settings still win.
    reasoning_level: *qwen38max_default_effort
    multimodal: true
    parallel_tool_calls: false  # new family — start safe, flip once validated
    model_max_context_tokens: 1000000
    max_output_tokens: 131072  # API max (reasoning is budgeted separately)
    # One token per 32x32 px; the API downsizes to its default max_pixels
    # (2,621,440 px = 2,560 tokens), which SRW does not raise. ceil() biases high.
    image_tokens: { mode: openai_patches, patch_px: 32, budget: 2560, flat: 2560 }

# xAI Grok 4.7 (2026-09-16). Reached over the xAI API (OpenAI-compatible Chat
# Completions), OpenRouter `x-ai/grok-4.7`, or the Grok Build subscription
# lane on the proxy. Only 4.7 is matched: older 4.x rows differ (4.3 defaults
# to low and takes `none`, 4.5's docs disagree on xhigh, 4.20 has a 2M window).
# Verified 2026-09-29:
# https://docs.x.ai/developers/models/grok-4.7.md
# https://docs.x.ai/developers/model-capabilities/text/reasoning.md
# https://docs.x.ai/developers/tools/function-calling.md
# https://openrouter.ai/api/v1/models
#
# Reasoning is always on: `reasoning_effort` low | medium | high | xhigh,
# default high ("Reasoning cannot be disabled"). That is the `default` ladder;
# this block exists for the rest: a 500K window (`default` is 128K), vision,
# and sampling (0.7 / 0.95, as in xAI's Grok Build config and on OpenRouter).
#
# The API returns an error for presence_penalty, frequency_penalty and stop on
# reasoning models. SRW sends none of them; keep it that way.
#
# Cost: once a prompt reaches 200K tokens xAI bills EVERY token in the request
# at double rate. The window below is the true max (matrix convention), so
# compaction starts at 400K and long jobs pay double for most late turns. To
# stay under the tier, give the model a 250K `context_window` in Admin -> Models.
# xAI also calls omitted reasoning_content "the top cause of cache misses";
# SRW never replays it (all families), so expect fewer cache hits.
grok-4.7:
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high, xhigh] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    structured_output_method: json_schema
    temperature: 0.7
    top_p: 0.95
    multimodal: true
    parallel_tool_calls: false  # documented and on by default upstream; start safe, flip once validated
    model_max_context_tokens: 500000
    max_output_tokens: 128000  # xAI's default when unset (resolver clamps to ctx backstop)
    # Current docs don't say how images are counted. The last published formula
    # (448px tiles, 256 tokens each plus one, at most 6 tiles) caps at 1,792.
    image_tokens: { mode: flat, flat: 1792 }

gemini:
  # Phase 2 → token_budget (thinkingConfig.thinkingBudget; 2.5 Pro is always_on).
  # v1: no control wired; output capture via include_thoughts stays in the factory.
  reasoning: { method: none }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    top_p: 0.95
    top_k: 40
    multimodal: true  # Gemini models are natively multimodal
    parallel_tool_calls: true
    model_max_context_tokens: 1000000
    max_output_tokens: 65536  # thinking counts against output (always-on) — give room
    # Gemini API (ai.google.dev) bills a small flat per image (258 at MEDIUM /
    # ~1120 at Gemini-3 HIGH). 2304 = biased-high (256 + Pan&Scan upside). NOT
    # Vertex (which crop-tiles ~7x higher) — log the endpoint if that changes.
    image_tokens: { mode: flat, flat: 2304 }

claude-opus:
  # Anthropic moved from a raw thinking budget to *adaptive* thinking driven by
  # an effort level, and that is what an OpenAI-shaped client can actually
  # reach: CLIProxyAPI maps `reasoning_effort` onto `thinking` +
  # `output_config.effort` (or a legacy budget for models without adaptive
  # support). Sending nothing is not "provider default" — it leaves
  # `thinking.type` unset, which stops the proxy from asking for a *visible*
  # summary, so Claude still reasons (thinking_tokens are billed) and returns
  # signature-only blocks. Verified end-to-end against a live Claude Code
  # account on 2026-09-07: effort low ⇒ short summary, high ⇒ longer one.
  # The native Anthropic factory ignores this block (it injects no reasoning
  # control), so this changes the proxied/OpenRouter paths only.
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0  # Anthropic: just use temperature, leave top_p/top_k at defaults
    multimodal: true  # Claude Opus 4.6 supports vision
    parallel_tool_calls: true
    model_max_context_tokens: 1000000  # Opus 4.6: 1M context, 128K max output
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # 28px patches, Opus 4.7+/Fable5 high-res cap (2576px edge / 4784 tok max).
    image_tokens: { mode: anthropic_patches, patch_px: 28, max_edge: 2576, max_tokens: 4784, flat: 4784 }

claude-opus-5:
  # Split off `claude-opus` for one reason: Opus 5 accepts the FULL effort
  # ladder. Anthropic grew it per generation — 4.5 and older take
  # low|medium|high, 4.6 added `max`, 4.7 added `xhigh` — and Opus 5 takes all
  # five. The generic `claude-opus` family still has to serve those older rows,
  # so widening it there would offer every 4.x Opus a level its wire rejects.
  #
  # Everything else mirrors `claude-opus` on purpose: a family block falls
  # through to `default`, NEVER to a sibling family, so the settings have to be
  # repeated here or Opus 5 would silently inherit `default` (multimodal:false,
  # 128k window) — the same trap the claude-sonnet note below records.
  #
  # Delivery is unchanged: effort rides `reasoning_effort` on the OpenAI-shaped
  # wire (subscription proxy / OpenRouter), which CLIProxyAPI maps onto
  # Anthropic `thinking` + `output_config.effort`. The native Anthropic factory
  # injects no reasoning control, so a row served by a direct Anthropic key
  # ignores this block — see the claude-opus note above.
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high, xhigh, max] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0  # Anthropic: just use temperature, leave top_p/top_k at defaults
    multimodal: true
    parallel_tool_calls: true
    model_max_context_tokens: 1000000  # Opus 5: 1M context, 128K max output
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # 28px patches, Opus 4.7+/Fable5 high-res cap (2576px edge / 4784 tok max).
    image_tokens: { mode: anthropic_patches, patch_px: 28, max_edge: 2576, max_tokens: 4784, flat: 4784 }

# Claude Opus 5.5 (released 2026-09-22). Same ladder, window, output cap and
# vision as Opus 5, but split off because the calibrated default moved:
# Anthropic's API default effort is `medium` on 5.5 (`high` on every other
# effort model), and 5.5 thinks more per turn than Opus 5 at the same level —
# carrying `high` over would silently buy a deeper, costlier default than the
# provider tuned for. `high`/`xhigh`/`max` stay one dropdown pick away.
#
# 5.5 also rejects two things Opus 5 accepted, both upstream 400s — which on
# the subscription proxy bench the whole Claude credential for ~60s:
#   - thinking cannot be disabled (`thinking.type` disabled/enabled+budget).
#     SRW never sends either; effort is the only reasoning control it drives.
#   - forced tool use (`tool_choice` any/tool). Structured output here goes
#     through `json_schema` (default block), never a forced tool; keep it that
#     way — `function_calling` on this family would 400 every aux call.
# OpenRouter lists it as `anthropic/claude-opus-5.5` (dot), Anthropic and
# CLIProxyAPI as `claude-opus-5-5` (hyphen); all three resolvers take both.
claude-opus-5-5:
  reasoning: { method: effort_enum, delivery: native, default: medium, options: [low, medium, high, xhigh, max] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0  # Anthropic: just use temperature, leave top_p/top_k at defaults
    multimodal: true
    parallel_tool_calls: true
    model_max_context_tokens: 1000000  # Opus 5.5: 1M context, 128K max output
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # 28px patches, Opus 4.7+/Fable5 high-res cap (2576px edge / 4784 tok max).
    image_tokens: { mode: anthropic_patches, patch_px: 28, max_edge: 2576, max_tokens: 4784, flat: 4784 }

# Claude Sonnet / Haiku — NEW rows. Without them family_of('claude-sonnet')
# falls through to `default` (multimodal:false!), so the homelab interactive
# main model never counted images and compacted at the 128k default window.
# Vision = 28px patches at the legacy cap (1568px edge / 1568 tok).
claude-sonnet:
  # Effort-driven adaptive thinking — see the claude-opus note above.
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0
    multimodal: true
    parallel_tool_calls: true
    model_max_context_tokens: 1000000  # Sonnet 4.x: up to 1M context
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    image_tokens: { mode: anthropic_patches, patch_px: 28, max_edge: 1568, max_tokens: 1568, flat: 1568 }
    # 1568px edge cap ⇒ the provider downscales a 150-DPI A4 anyway; render at
    # 130 (~at the cap) to stop paying for pixels the model discards. Omitting
    # this key on a family ⇒ renderer default (150). Tune with calibration data
    # (multimodal_image_cost_optimization.md §1) before lowering other families.
    pdf_render_dpi: 130

# Claude Sonnet 5 / 5.5 (2026-06-30 / 2026-09-28). ONE family for both, split
# off `claude-sonnet` for the effort ladder: both accept all five levels, default
# `high`, while 4.x Sonnet takes low|medium|high (the generic block still serves
# those rows). 5.5 recalibrated what each level does, but the knobs this matrix
# carries are the same for both: 1M context, 128K output, high-res vision.
#
# 5.5 rejects the same two things Opus 5.5 does, both upstream 400s (which on
# the subscription proxy bench the Claude credential for ~60s):
#   - disabling thinking (`disabled`, or `enabled` with a budget). SRW sends
#     neither; effort is the only reasoning control it drives.
#   - forced tool use (`tool_choice` any/tool). Structured output goes through
#     `json_schema` (default block); never set `function_calling` here.
# A non-default temperature/top_p/top_k is also a 400. 1.0 IS the default, and
# the key must stay: without it the family falls through to `default`'s 0.0.
# Unverified live: 5.5 rejects a thinking block when earlier history changed,
# and compaction changes history. SRW's OpenAI-shaped paths never send thinking
# back, so it should not apply there.
# Verified 2026-09-29:
# https://platform.claude.com/docs/en/build-with-claude/effort
# https://platform.claude.com/docs/en/models/sonnet-5-5/whats-new-sonnet-5-5
# https://openrouter.ai/api/v1/models
claude-sonnet-5:
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high, xhigh, max] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0  # the API default; anything else is a 400
    multimodal: true
    parallel_tool_calls: true
    model_max_context_tokens: 1000000  # Sonnet 5/5.5: 1M context, 128K max output
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # 28px patches, Opus 4.7+/Fable5 high-res cap (2576px edge / 4784 tok max).
    image_tokens: { mode: anthropic_patches, patch_px: 28, max_edge: 2576, max_tokens: 4784, flat: 4784 }

claude-haiku:
  # Effort-driven adaptive thinking — see the claude-opus note above.
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0
    multimodal: true
    parallel_tool_calls: true
    model_max_context_tokens: 200000  # Haiku 4.5: 200K context
    image_tokens: { mode: anthropic_patches, patch_px: 28, max_edge: 1568, max_tokens: 1568, flat: 1568 }
    pdf_render_dpi: 130  # legacy 1568px cap — see claude-sonnet note

# Claude Fable 5 / 5.1 — Anthropic's tier above Opus. ONE family for both:
# they share every knob this matrix carries (1M context, 128K output, the full
# effort ladder, native vision). Thinking is always on and cannot be disabled,
# and `budget_tokens` is rejected outright — neither is something we send:
# effort is the only reasoning control SRW drives on this path.
#
# NOTE (2026-09-11, proxy v7.2.110): `claude-fable-5-1` is LISTED by CLIProxyAPI
# but Anthropic rejects it — the proxy identifies itself as Claude Code 2.1.63
# and 5.1 requires >= 2.1.251. `claude-fable-5` works today (verified 200 at
# low/xhigh/max, with reasoning text scaling by level). The family is right
# either way; 5.1 needs the proxy pin to move, not a matrix change.
# The chart pin moved to v7.3.13 on 2026-09-22, which presents Claude Code
# 2.1.258; `scripts/subscription-proxy-probe.py fable-5-1` confirms it on the wire.
claude-fable:
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high, xhigh, max] }
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    # 1.0 mirrors the other Claude families and is accepted on the proxy path
    # (verified 2026-09-11). Anthropic's native API rejects sampling params on
    # Fable and on Opus 4.7+, so a direct-key row would need them dropped in the
    # factory — out of scope here: that route injects no reasoning control
    # either (see the claude-opus note above).
    temperature: 1.0
    multimodal: true
    parallel_tool_calls: true
    model_max_context_tokens: 1000000  # Fable 5/5.1: 1M context, 128K max output
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # 28px patches, Opus 4.7+/Fable5 high-res cap (2576px edge / 4784 tok max).
    image_tokens: { mode: anthropic_patches, patch_px: 28, max_edge: 2576, max_tokens: 4784, flat: 4784 }

gpt-5:
  # minimal (GPT-5 family) is the deferred correctness pass — clamped to low today.
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high] }
  prompts:
    systemprompt: systemprompt_gpt_5.txt
    systemprompt_interactive: systemprompt_interactive_gpt_5.txt
    persona: persona_gpt_5.txt
    summarization: summarization_prompt_gpt_5.txt
    # Auxiliary task prompts — tuned for the gpt-5 family wire format
    # (XML-tagged, structured-output aware). Loaded when an aux model in this
    # family runs background tasks (e.g. gpt-5.4-mini as the auxiliary model).
    memory_extraction: memory_extraction_prompt_gpt_5.txt
    memory_assembler: memory_assembler_prompt_gpt_5.txt
    curation: curation_prompt_gpt_5.txt
  guardrails:
    file: gpt_5.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0  # Reasoning model: only default 1.0 is supported
    multimodal: true  # GPT-5 supports image inputs
    # Enabled 2026-07-15. langchain#34660 is still OPEN but only concerns the
    # final `response.completed` Responses chunk lacking tool_calls; the
    # incremental function_call/args-delta stream chunks are emitted correctly
    # and the graph loop aggregates them via AIMessageChunk (verified against
    # langchain-openai 1.1.12 and upstream master — code path unchanged). The
    # Codex proxy only supports the Responses API; validated on gpt-5.6, and
    # gpt-5/codex/codex-spark share the identical transport.
    parallel_tool_calls: true
    model_max_context_tokens: 1050000  # gpt-5.4: 1.05M, 128K max output
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # 32px patches. gpt-5.5 `auto`->original (budget 10000); gpt-5.4 `auto`->high
    # (2500). budget 10000 is biased-high across both; full models bill patches
    # ~1:1 (no published multiplier). A 1700x2200 page ~= 3726 tok.
    image_tokens: { mode: openai_patches, patch_px: 32, budget: 10000, flat: 3000 }

gpt-5.6:
  # GPT-5.6 (GA 2026-07-09): Luna / Terra / Sol tiers, 1M ctx / 128K max output.
  # Dedicated family because effort options are a family-level property and
  # 5.6 adds xhigh + max, which older gpt-5.x rows must not offer. `ultra` is
  # NOT an effort — it's `reasoning.mode` (standard/pro/ultra), deliberately
  # unsupported here (different API param, ~4x token burn).
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high, xhigh, max] }
  prompts:
    # Aliases the gpt-5 prompt set (same wire format) — exactly how `codex`
    # does it. Fork into _gpt_5_6 files only when 5.6-specific drift shows up.
    systemprompt: systemprompt_gpt_5.txt
    systemprompt_interactive: systemprompt_interactive_gpt_5.txt
    persona: persona_gpt_5.txt
    summarization: summarization_prompt_gpt_5.txt
    memory_extraction: memory_extraction_prompt_gpt_5.txt
    memory_assembler: memory_assembler_prompt_gpt_5.txt
    curation: curation_prompt_gpt_5.txt
  guardrails:
    file: gpt_5_6.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    structured_output_method: json_schema
    temperature: 1.0  # Reasoning model: only default 1.0 is supported
    multimodal: true  # GPT-5.6 supports image inputs
    # Enabled 2026-07-15 — empirically validated. Same Responses-API path as
    # gpt-5; see the gpt-5 block for why langchain#34660 doesn't block this.
    parallel_tool_calls: true
    model_max_context_tokens: 1000000  # Luna/Terra/Sol: 1M ctx, 128K max output
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # Same 32px-patch vision scheme as the gpt-5 family.
    image_tokens: { mode: openai_patches, patch_px: 32, budget: 10000, flat: 3000 }

# GPT-6 Astra (GA 2026-09-03) — OpenAI's flagship. ONE API model today,
# `gpt-6-astra`: no mini/nano/pro/codex tiers, so this family is a single row
# rather than a tier set like gpt-5.6's Luna/Terra/Sol.
#
# Its own family (not a gpt-5.6 alias) because three properties the matrix owns
# actually differ:
#   1. 1.05M context (5.6 is 1M), with a 922K max-INPUT sub-cap under it. The
#      derived compaction threshold is 0.80 x 1.05M = 840K, comfortably below
#      that 922K input ceiling, so the sub-cap needs no separate knob here.
#   2. `none` effort is REJECTED (HTTP 400) — 5.6 accepts it. `none` never
#      reaches the wire anyway: resolve_reasoning_plan() maps it to "inject
#      nothing" and the provider default applies, so the UI value stays safe.
#   3. Tool calling requires the RESPONSES API. Chat Completions serves Astra
#      only WITHOUT tools, so the graph loop must run this family on the
#      codex/Responses lane — never the `openai` factory, which hard-forces
#      use_responses_api=False.
#
# `max` effort is likewise Responses-API-only. That is why
# _should_use_reasoning_summary() in loader.py matches gpt-6: without it the
# codex factory would emit a Chat-Completions-shaped `reasoning_effort` and
# `max` would silently degrade to the provider default.
#
# `reasoning.mode` (standard/pro) exists on Astra as it does on 5.6, and stays
# deliberately unsupported here — a different API param with a much higher
# token burn. Same call as the 5.6 block makes for `ultra`.
gpt-6:
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high, xhigh, max] }
  prompts:
    # Aliases the gpt-5 prompt set (identical Responses-API wire format) —
    # exactly how gpt-5.6 and codex do it. Fork into _gpt_6 files only when
    # Astra-specific drift actually shows up.
    systemprompt: systemprompt_gpt_5.txt
    systemprompt_interactive: systemprompt_interactive_gpt_5.txt
    persona: persona_gpt_5.txt
    summarization: summarization_prompt_gpt_5.txt
    memory_extraction: memory_extraction_prompt_gpt_5.txt
    memory_assembler: memory_assembler_prompt_gpt_5.txt
    curation: curation_prompt_gpt_5.txt
  guardrails:
    file: gpt_6.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    structured_output_method: json_schema  # Structured Outputs supported (Responses `text.format`)
    # Astra rejects CUSTOM temperature/top_p (Azure: "doesn't support custom
    # `temperature` or `top_p` values"); 1.0 IS the default, so it is not a
    # custom value — same posture as gpt-5/gpt-5.6, which run this exact wire
    # today. OpenAI's migration note phrases it as "remove temperature", so if a
    # live call ever 400s on this param, the fix is to stop sending it at all
    # (loader.py factories pass config.temperature unconditionally).
    temperature: 1.0
    multimodal: true  # text + image in, text out (no audio/video)
    parallel_tool_calls: true
    model_max_context_tokens: 1050000  # Astra: 1.05M ctx (922K max input, 128K max output)
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # Same 32px-patch vision scheme as the gpt-5 family.
    image_tokens: { mode: openai_patches, patch_px: 32, budget: 10000, flat: 3000 }

codex:
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high] }
  prompts:
    systemprompt: systemprompt_gpt_5.txt
    systemprompt_interactive: systemprompt_interactive_gpt_5.txt
    persona: persona_gpt_5.txt
    summarization: summarization_prompt_gpt_5.txt
    # Shared with the gpt-5 family — codex aliases gpt-5 for prompts.
    memory_extraction: memory_extraction_prompt_gpt_5.txt
    memory_assembler: memory_assembler_prompt_gpt_5.txt
    curation: curation_prompt_gpt_5.txt
  guardrails:
    file: codex.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0  # Reasoning model: temperature effectively disabled
    multimodal: true  # gpt-5.3-codex supports image inputs (screenshots, diagrams, UI)
    # Enabled 2026-07-15. Same Responses-API/codex-proxy path as gpt-5; see the
    # gpt-5 block for why langchain#34660 doesn't block the graph loop.
    parallel_tool_calls: true
    model_max_context_tokens: 400000  # gpt-5.3-codex: 400K context, 128K max output
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)
    # Same 32px-patch vision scheme as the gpt-5 family.
    image_tokens: { mode: openai_patches, patch_px: 32, budget: 10000, flat: 3000 }

codex-spark:
  reasoning: { method: effort_enum, delivery: native, default: high, options: [low, medium, high] }
  prompts:
    systemprompt: systemprompt_codex_spark.txt
    systemprompt_interactive: systemprompt_interactive_gpt_5.txt
    persona: persona_codex_spark.txt
    summarization: summarization_prompt_gpt_5.txt
  guardrails:
    file: codex_spark.yaml
  settings:
    shell_mode: persistent  # capable family -> stateful multi-tab shell (shell_execute); human/session override wins
    temperature: 1.0  # Reasoning model: temperature effectively disabled
    multimodal: false  # Codex Spark is code-focused, no vision
    # Enabled 2026-07-15. Same Responses-API/codex-proxy path as gpt-5; see the
    # gpt-5 block for why langchain#34660 doesn't block the graph loop.
    parallel_tool_calls: true
    model_max_context_tokens: 128000  # gpt-5.3-codex-spark: 128K context (distilled)
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)

gpt-oss:
  # Effort delivered via the `Reasoning: {level}` system-prompt line (harmony), not an API param.
  reasoning: { method: effort_enum, delivery: prompt, default: medium, options: [low, medium, high] }
  prompts:
    systemprompt: systemprompt_gpt_oss.txt
    persona: persona_gpt_oss.txt
    summarization: summarization_prompt_gpt_oss.txt
    memory_extraction: memory_extraction_prompt_gpt_oss.txt
    memory_assembler: memory_assembler_prompt_gpt_oss.txt
    curation: curation_prompt_gpt_oss.txt
  instructions:
    instructions: instructions_gpt_oss.md
    strategic_todos_transition: strategic_todos_transition_gpt_oss.yaml
  guardrails:
    file: gpt_oss.yaml
  settings:
    temperature: 1.0  # OpenAI official: use 1.0 for full reasoning capability
    top_p: 1.0        # OpenAI official: do not restrict vocabulary distribution
    # top_k: DO NOT SET — HuggingFace defaults to 50 if present; must stay disabled
    # repetition_penalty: DO NOT SET — some clients enable by default; OpenAI says disable
    multimodal: false  # gpt-oss-120b is text-only (MoE architecture)
    parallel_tool_calls: false  # Served via vLLM; parallel calls need provider support
    model_max_context_tokens: 131072  # True 128K context (MoE: 117B total, 5.1B active)
    max_output_tokens: 65536  # reasoning headroom (resolver clamps to ctx backstop)

# Gemma 4 has native system role, native multimodality, and strong Markdown
# instruction following. Two integration challenges drove the variants below:
#
# 1. Tool-call wire format: vLLM's `gemma4` parser is regex-strict and only
#    accepts Gemma's canonical `<|tool_call>call:fn{k:<|"|>v<|"|>}<tool_call|>`
#    syntax — no parens, no JSON, no equals. The model drifts to Python-style
#    parens when its prompts/instructions show parens-style examples, and the
#    parser silently rejects the call. The worker-path prompts and
#    `instructions_gemma.md` teach the canonical format with concrete examples
#    and a positive contrast ("braces, never parens"). The runtime-side
#    no-tool-call streak detector in `src/agent/graph.py` is the safety net.
#    Precipitating incident: knowledge-base/knowledge/issues/gemma_tool_call_parser_loop.md.
#
# 2. Repetition loops: the structured-output (memory/curation) variants add
#    explicit anti-repetition guidance to mitigate vllm#40080 (xgrammar JSON
#    schema can trigger infinite repetition). The complementary
#    `repetition_penalty` / `frequency_penalty` below are the runtime-side
#    mitigation.
gemma:
  reasoning:
    # Gemma 4 is a hybrid thinking model — binary on/off via the vLLM chat
    # template (`enable_thinking`), NOT an effort level. Default ON so SRW gets
    # reasoning regardless of the upstream endpoint default (which other tenants
    # can flip off). Verified live on k3d 2026-06-22. The previous behaviour sent
    # an inert `reasoning_effort` the gemma4 parser ignores.
    method: binary_toggle
    default: "on"
    options: ["on", "off"]
    toggle_param: chat_template_kwargs.enable_thinking
    toggle_map: { "on": true, "off": false }
  prompts:
    # Worker-path variants
    systemprompt: systemprompt_gemma.txt
    persona: persona_gemma.txt
    summarization: summarization_prompt_gemma.txt
    # Auxiliary-path variants (anti-repetition; mitigate vllm#40080)
    memory_extraction: memory_extraction_prompt_gemma.txt
    memory_assembler: memory_assembler_prompt_gemma.txt
    curation: curation_prompt_gemma.txt
  instructions:
    # instructions.md is loaded into agent context every turn — its tool-call
    # examples train the model's surface form. The default uses Python-style
    # `read_file(path="...")` which directly contradicts the canonical Gemma
    # wire format. The Gemma variant rewrites every example with braces and
    # `<|"|>` string delimiters.
    instructions: instructions_gemma.md
  guardrails:
    file: gemma.yaml
  settings:
    structured_output_method: json_schema
    # Google official for Gemma 4 instruct is temp=1.0, top_p=0.95, top_k=64.
    # We run temp=0.3 because the workload is heavy tool-calling / structured
    # output and community evidence shows high entropy increases malformed
    # tool-call rate on vLLM's gemma4 parser.
    temperature: 0.3
    top_p: 0.95
    top_k: 64
    # Partial mitigation for vllm#40080 — Gemma 4 + xgrammar JSON schema
    # enters infinite repetition loops. Values >1.0 discourage token repeats.
    # Kept mild (1.05) to avoid distorting legitimate repeated structure
    # (e.g. code, tables, list items). Upstream fix not yet shipped.
    repetition_penalty: 1.05
    frequency_penalty: 0.1  # Additional defense-in-depth against loop output
    multimodal: true  # Gemma 4 31B accepts text + image + video (no audio on 31B)
    parallel_tool_calls: false  # vllm#39392: concurrent tool calls can emit <pad> tokens
    model_max_context_tokens: 131072  # Endpoint reports 131072 for current deployment
    # Flat per image (Gemma 4 default 280; pan-and-scan off in vLLM). 320 =
    # 280 x ~1.14 bias. Forward-looking — gemma is the text-only summarizer.
    image_tokens: { mode: flat, flat: 320 }

# Mistral 3 family — Large 3 / Medium 3.5 / Small 4 / Codestral, wired as a
# native first-class provider (provider slug 'mistral' → ReasoningChatOpenAI at
# api.mistral.ai/v1, see src/shared/runtime/core/loader.py::_create_mistral_llm). Like claude/
# gemini/o-series this is a SETTINGS-ONLY family: Mistral speaks the standard
# OpenAI Chat Completions wire (parens-form tool calls + function calling), so
# the `default` prompts/instructions and `default.yaml` guardrails apply
# unchanged — only vision/context/sampling need a row. WITHOUT this block,
# family_of() maps mistral-* → "mistral" but the lookup falls through to
# `default` (multimodal: false!), so the vision models accept images yet
# mis-count image tokens and compact at the wrong window — the failure the
# claude-sonnet row documents. Codestral is text-only but shares the block; its
# catalog row omits the `vision` capability, so it never receives images.
mistral:
  reasoning: { method: none }   # Mistral has no reasoning-level control we drive
  settings:
    temperature: 0.0   # agentic/tool-use default (matches `default`/deepseek); raise toward ~0.3 for freeform chat
    multimodal: true   # Large 3 / Medium 3.5 / Small 4 take image input
    # Mistral's documented default ("the model decides if it uses parallel tool
    # calls"); Large 3 / Medium 3.5 / Small / Codestral all support it. Safe here
    # because we hit Chat Completions via ChatOpenAI — the gpt-5/codex
    # Responses-API parallel-call corruption bug (langchain#34660) doesn't apply.
    parallel_tool_calls: true
    model_max_context_tokens: 256000  # Mistral 3 family: 256K (a per-model catalog context_window still overrides this)
    # Mistral 3 vision encoder: 14px patches merged into 2x2 blocks ⇒ one image
    # token per 28x28px region (Mistral docs bill at 784px = 28²). The longest
    # edge is resized to ≤1540 (short side to the nearest multiple of 28), so the
    # ceiling is (1540/28)² = 55×55 = 3025 tokens/image. `anthropic_patches` is
    # the generic two-constraint (max_edge + max_tokens) resize-then-patchify
    # estimator — reused here with Mistral's numbers, not Anthropic's. Sources:
    # docs.mistral.ai/capabilities/vision + the Mistral-Small-2503 encoder spec.
    image_tokens: { mode: anthropic_patches, patch_px: 28, max_edge: 1540, max_tokens: 3025, flat: 3025 }

# Model-specific overrides — add as needed (use a real family_of() key; note
# claude-sonnet/claude-haiku already have rows above):
# my-custom-family:
#   prompts:
#     systemprompt: systemprompt_custom.txt
#   instructions:
#     instructions: instructions_custom.md
#   settings:
#     temperature: 1.0
