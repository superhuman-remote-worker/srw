# Strategic todos for phase transitions (between tactical phases).
#
# Keep these todos about outcomes and ordering. Verification technique belongs
# in verify-before-done, which is rendered for the capabilities actually bound
# to the workspace. In particular, Git history is useful when available but is
# not a prerequisite: virtual workspaces may have no Git transport at all.
todos:
  - id: 1
    content: >-
      VERIFY THE RESULT — finish this before deciding whether to continue.

      Apply `skills/verify-before-done/SKILL.md` (delivered at the start of the
      tactical phase; read the file only if it is no longer in your context).
      Verify the current outputs against the original requirements in
      instructions.md and any runtime-declared required deliverables. Do not update plan.md or plan
      another phase yet.

      Complete this todo with `todo_complete`. Record the skill's concise
      verdict and evidence in `completion_note`, beginning with `PASS:` or
      `GAPS:`.

      COMPLETION CRITERIA: Fresh evidence has been reconciled against the
      original requirements and a durable PASS/GAPS completion note exists.

  - id: 2
    content: >-
      CLOSE OR CONTINUE — begin only after todo 1 is complete and use its
      recorded verdict. Do not repeat a successful check unless a verified
      deliverable changed after todo 1; updating plan.md is not a reason to
      reverify unchanged deliverables.

      If todo 1 recorded GAPS: update plan.md once with those verified gaps,
      then call next_phase_todos for one focused tactical phase that repairs
      them. Do not add housekeeping or invented work.

      If todo 1 recorded PASS: update plan.md once to mark the actual phases and
      deliverables complete, then call job_complete with the deliverable paths
      and any verification limitations.

      Take exactly one branch. When this is the last pending todo, the
      lifecycle tool completes it for you; do not call todo_complete for it
      before job_complete or next_phase_todos has succeeded.

      COMPLETION CRITERIA: Verified gaps produced a corrective tactical phase,
      or a verified complete result produced job completion.
