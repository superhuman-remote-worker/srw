# Strategic todos for job initialization (first strategic phase)
# These todos guide the agent through initial exploration, planning,
# knowledge base setup, and first phase todo generation.
#
# Each todo includes explicit completion criteria and guidance
# to prevent scope creep and busywork phases.
todos:
  - id: 1
    content: >-
      EXPLORE: Thoroughly understand the task before doing anything else.

      The task brief and instructions.md are already in your opening message, in full.
      Read them there, every line; do not read_file task_brief.md or instructions.md
      again unless a compaction has removed that message.

      Steps:
      (1) Use list_files on the tools/ directory to understand your available capabilities.
      (2) Use list_files on documents/ to inventory all input materials.
      (3) Use list_files on reference/ to check for domain-specific reference material.

      {% if has_tool("kb_write") -%}
      Then persist critical rules as knowledge notes using kb_write:
      - Required output files (exact paths and formats) → kb_write with type="goal", tag="deliverable"
      - Style/language constraints (tone, formatting, language) → kb_write with type="decision", tag="constraint"
      - Hard rules (things explicitly forbidden or required) → kb_write with type="decision", tag="pinned"
      - Delivery expectations (what "done" looks like) → kb_write with type="goal", tag="acceptance-criteria"

      These knowledge notes persist across context compaction AND across future jobs
      in the same project. Search existing notes first (kb_search) to avoid duplicates.

      COMPLETION CRITERIA: Knowledge notes created for all four categories above
      (verify with kb_list). The brief and instructions in the opening message have been read in full.
      {% else -%}
      Then persist critical rules to a notes/ file so they survive compaction:
      - Required output files (exact paths and formats) → notes/task_rules.md under "## Deliverables"
      - Style/language constraints (tone, formatting, language) → notes/task_rules.md under "## Constraints"
      - Hard rules (things explicitly forbidden or required) → notes/task_rules.md under "## Hard Rules"
      - Delivery expectations (what "done" looks like) → notes/task_rules.md under "## Acceptance Criteria"

      The memory system also recalls key context automatically across compaction.

      COMPLETION CRITERIA: Critical rules recorded in notes/task_rules.md under the four
      categories above. The brief and instructions in the opening message have been read in full.
      {%- endif %}

      INSTEAD OF: Starting to write output files now — this phase is read-only exploration.
      Instead of skimming the instructions — read every line, since every task failure
      starts with skipping this step.

  - id: 2
    content: >-
      PLAN: Create plan.md with a phased execution strategy.

      Start with a "## Deliverables" section listing every required output:
      - Exact output path (always in output/, e.g., output/report.md)
      - Format and structure requirements
      - Quality criteria (what "good" looks like)

      Then structure the rest of the plan as a phase table where each phase has:
      - Phase name and description
      - Phase type: research, elaboration, execution, batch, integration, or verification
      - Expected output: which deliverable(s) this phase advances

      PHASE SIZING: Default to ONE execution phase covering the whole task, and
      prefer few long phases over many short ones. Every extra phase costs a full
      planning cycle, so a second phase must earn it: plan one only when its todos
      genuinely cannot be written until the first phase's results are in. Choose
      todo granularity to fit the work into a single phase (up to 30 todos), and if
      execution reveals the plan is wrong, the tactical phase invokes
      `request_replan` rather than you pre-splitting phases in anticipation.

      PHASE ORDERING: Scaffold the deliverable file in phase 1 — create it at its
      output/ path with the required structure — and update it at every phase
      boundary. Research fills the scaffold in; it does not precede it. An
      interrupted job must still leave a partial deliverable, never just notes.
      Use web_search before writing about any topic — your training data may be outdated.

      Focus on the first 2-3 phases in detail. Later phases can be sketches — they
      WILL be adapted as you learn. Every phase must map to a concrete deliverable
      or milestone from instructions.md.

      PLAN VERIFICATION: After creating the plan, cross-check it against instructions.md.
      For each requirement, confirm at least one phase addresses it. If a requirement
      has no corresponding phase, add one.

      COMPLETION CRITERIA: plan.md exists with at least 2 phases defined, each with
      an expected deliverable that traces back to instructions.md.

      INSTEAD OF: Planning "cleanup", "archiving", "packaging", or "final review"
      phases — git versioning handles all history automatically, and Gitea handles
      delivery. Instead of creating phases that produce nothing listed in instructions.md —
      every phase should advance a deliverable. Instead of over-planning — you will
      adapt the plan after every tactical phase.

  - id: 3
    content: >-
      {% if has_tool("kb_search") -%}
      REVIEW PROJECT KNOWLEDGE: Check the project knowledge base for existing context.

      Search the knowledge base for existing notes from prior jobs in this project:
      (1) Use kb_list to see all existing notes (filter by status="active").
      (2) Use kb_search with key terms from the task description to find relevant prior knowledge.
      (3) Review any existing decision notes — they may constrain your approach.
      (4) Check for contradictions (kb_contradictions) that need resolution.

      If this is the first job in the project, the knowledge base will be empty — that's fine.
      The notes you create during this job will benefit future jobs.

      Create initial state notes if they don't exist:
      - A "goal" note summarizing the current job's objective
      - Any facts discovered during exploration (IDs, paths, configurations) as "learning" notes

      COMPLETION CRITERIA: kb_list or kb_search called at least once. If prior knowledge
      exists, it has been reviewed. Initial state notes created for this job.

      INSTEAD OF: Skipping this step — prior knowledge from the same project can save
      significant work. Instead of creating notes that duplicate existing ones — search first.
      {% else -%}
      REVIEW PROJECT CONTEXT: Check plan.md and notes/ for existing context.

      Review any prior context available in the workspace:
      (1) Read plan.md if it exists from a prior phase.
      (2) Check notes/ for any decisions or constraints recorded earlier.
      (3) Check archive/ for any retrospectives from previous phases.

      Record initial state in notes/ if not already present:
      - The current job's objective under "## Goal"
      - Any facts discovered during exploration (IDs, paths, configurations) under "## Facts"

      COMPLETION CRITERIA: prior context reviewed; goal and discovered facts recorded in notes/.

      INSTEAD OF: Skipping this step — prior context can save significant work.
      {%- endif %}

  - id: 4
    content: >-
      CREATE first phase todos using the next_phase_todos tool.

      Create the todos for the execution phase — enough to cover the task. (The todo-guide skill at
      skills/todo-guide/SKILL.md covers todo specificity, phase design patterns,
      and worked examples.)

      Each todo must be:
      - A concrete action completable in 1-3 tool calls
      - Specific: names exact files, sections, page ranges, or tool calls
      - Directly advancing the task from instructions.md
      - Clear on what "done" looks like

      SIMPLE TASK SHORTCUT: If the entire task can be completed in one phase
      (e.g., a straightforward transformation, simple analysis, or single-document
      output), create execution todos directly. Not every task needs multiple
      phases — match the structure to the complexity.

      For complex or unfamiliar tasks, phase 1 should scaffold the deliverable
      file(s) first, then gather the context and sources that fill them in —
      research feeds the scaffold, it doesn't precede it.

      Include a final verification todo (e.g., "Verify Phase 1 outputs: confirm
      [specific files] exist and contain [specific content]").

      COMPLETION CRITERIA: next_phase_todos called successfully with todos covering the phase.

      INSTEAD OF: Vague todos like "research the topic" — be specific about what
      to search for and where to save results. Instead of meta-todos about
      workspace management, archiving, status updates, or file reorganization —
      every todo must advance the actual task. The system handles workspace
      management automatically.
