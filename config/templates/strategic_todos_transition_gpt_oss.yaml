# Strategic todos for phase transitions (gpt-oss optimized).
#
# Explicit ordering prevents the former "stop condition first" loop. The
# capability-aware verify-before-done skill owns verification technique; these
# todos never require Git or a shell because virtual workspaces may expose
# neither capability.
todos:
  - id: 1
    content: >-
      TODO 1 — VERIFY THE RESULT. Finish this todo before starting todo 2.

      Read and apply `skills/verify-before-done/SKILL.md`. Verify the current
      outputs against instructions.md and every runtime-declared required
      deliverable. Do not update plan.md and do not plan another phase yet.

      Invoke todo_complete for todo_1 with the skill's concise verdict and
      evidence in `completion_note`, beginning with `PASS:` or `GAPS:`.

      COMPLETION CRITERIA: Current evidence was checked against the original
      requirements and the PASS/GAPS verdict was saved in the completion note.

  - id: 2
    content: >-
      TODO 2 — CLOSE OR CONTINUE. Start only after todo 1 is complete. Use its
      recorded PASS/GAPS verdict; NEVER rerun an unchanged successful check.
      Updating plan.md does not change the verified deliverables.

      GAPS branch: rewrite the relevant part of plan.md once with the verified
      gaps and required correction, then invoke next_phase_todos for one
      focused tactical phase that fixes them. Do not create housekeeping,
      archive, packaging, or status-update work.

      PASS branch: rewrite the relevant part of plan.md once to mark the actual
      phases and deliverables complete, then invoke job_complete with the real
      deliverable paths and any verification limitations.

      Choose exactly one branch. When todo_2 is the last pending todo,
      job_complete or next_phase_todos completes it for you; never invoke
      todo_complete for todo_2 before that tool has succeeded.

      COMPLETION CRITERIA: GAPS created a corrective tactical phase, or PASS
      completed the job. No verification loop and no invented extra work.
