# Gemma 4 guardrails — canonical brace wire format for vLLM `gemma4` parser
#
# Wire format (from instructions_gemma.md, mirrored by the vLLM parser regex
# `<\|tool_call>call:(\w+)\{(.*?)\}(?:<tool_call\|>|<turn\|>)`):
#
#   <|tool_call>call:fn{key:<|"|>string val<|"|>,n:42,b:true}<tool_call|>
#
# Rules:
#   - braces, never parens
#   - string values wrapped in `<|"|> ... <|"|>` — never `"..."` or `'...'`
#   - numbers and booleans bare (`count:42`, `enabled:true`)
#   - closing tag `<tool_call|>` (pipe on the right)
#   - one tool call per turn
#
# Anything not overridden here inherits from default.yaml.

tool_examples:

  # ----- src/agent/tools/core/todo.py -----
  next_phase_todos: |-
    Examples:
        <|tool_call>call:next_phase_todos{todos:[<|"|>Extract document text from uploaded PDF<|"|>,<|"|>Chunk document into processable segments<|"|>,<|"|>Identify requirements in each chunk<|"|>,<|"|>Validate extracted requirements<|"|>,<|"|>Write requirements to database<|"|>],phase_name:<|"|>Phase 1: Document Processing<|"|>}<tool_call|>

  todo_complete: |-
    Examples:
        <|tool_call>call:todo_complete{}<tool_call|>                              # complete the first pending task
        <|tool_call>call:todo_complete{todo_id:<|"|>todo_3<|"|>}<tool_call|>      # complete a specific task by id

  # ----- src/agent/tools/git/git_tools.py -----
  git_log: |-
    Examples:
        <|tool_call>call:git_log{}<tool_call|>                       # last 10 commits, compact one-line format
        <|tool_call>call:git_log{max_count:5}<tool_call|>            # last 5 commits
        <|tool_call>call:git_log{oneline:false}<tool_call|>          # full commit details

  git_show: |-
    Examples:
        <|tool_call>call:git_show{}<tool_call|>                                                       # latest commit, full diff
        <|tool_call>call:git_show{stat_only:true}<tool_call|>                                         # latest commit, file list only
        <|tool_call>call:git_show{commit_ref:<|"|>HEAD~3<|"|>}<tool_call|>                            # commit from 3 commits ago
        <|tool_call>call:git_show{commit_ref:<|"|>phase-1-tactical-complete<|"|>}<tool_call|>         # tagged commit
        <|tool_call>call:git_show{commit_ref:<|"|>5e08d4fa<|"|>,repo:<|"|>WidgetShop<|"|>}<tool_call|>    # commit in an ATTACHED repository

  git_diff: |-
    Examples:
        <|tool_call>call:git_diff{}<tool_call|>                                                                 # uncommitted changes
        <|tool_call>call:git_diff{ref1:<|"|>HEAD~5<|"|>}<tool_call|>                                            # last 5 commits vs working dir
        <|tool_call>call:git_diff{ref1:<|"|>phase-1-tactical-complete<|"|>,ref2:<|"|>HEAD<|"|>}<tool_call|>     # between tag and HEAD
        <|tool_call>call:git_diff{file_path:<|"|>plan.md<|"|>}<tool_call|>                                 # uncommitted changes in one file

  git_status: |-
    Example output (clean):
        Branch: master
        Status: clean (no uncommitted changes)

    Example output (dirty):
        Branch: master
        Status: dirty (uncommitted changes)

        Staged (2):
          + new_file.txt
          + updated.md

        Modified (1):
          M plan.md

  git_tags: |-
    Examples:
        <|tool_call>call:git_tags{}<tool_call|>                                  # phase tags for the current job
        <|tool_call>call:git_tags{pattern:<|"|>phase-1-*<|"|>}<tool_call|>       # only phase 1 tags for this job
        <|tool_call>call:git_tags{pattern:<|"|>*<|"|>}<tool_call|>               # all tags for this job
        <|tool_call>call:git_tags{all_jobs:true}<tool_call|>                     # phase tags from every job in the repo

  git_merge_squash: |-
    Examples:
        <|tool_call>call:git_merge_squash{branch:<|"|>subagent/0<|"|>}<tool_call|>
        <|tool_call>call:git_merge_squash{branch:<|"|>subagent/1<|"|>,commit_message:<|"|>Merge research results<|"|>}<tool_call|>

  git_worktree_cleanup: |-
    Examples:
        <|tool_call>call:git_worktree_cleanup{branch:<|"|>subagent/0<|"|>}<tool_call|>
        <|tool_call>call:git_worktree_cleanup{branch:<|"|>subagent/2<|"|>,force:true}<tool_call|>

  # ----- src/agent/tools/shell/shell_tools.py -----
  run_command: |-
    Examples:
        <|tool_call>call:run_command{command:<|"|>pytest tests/ -x<|"|>,working_dir:<|"|>.<|"|>}<tool_call|>
        <|tool_call>call:run_command{command:<|"|>git diff HEAD~1<|"|>,working_dir:<|"|>.<|"|>,tail:100}<tool_call|>
        <|tool_call>call:run_command{command:<|"|>npm run build<|"|>,working_dir:<|"|>.<|"|>,timeout:300}<tool_call|>

  shell_execute: |-
    Examples:
        <|tool_call>call:shell_execute{command:<|"|>pytest tests/ -x<|"|>,working_dir:<|"|>.<|"|>}<tool_call|>
        <|tool_call>call:shell_execute{command:<|"|>npm run dev<|"|>,working_dir:<|"|>.<|"|>,name:<|"|>dev<|"|>,is_async:true}<tool_call|>
        <|tool_call>call:shell_execute{command:<|"|>C-c<|"|>,working_dir:<|"|>.<|"|>,name:<|"|>dev<|"|>,keys:true}<tool_call|>

  shell_read: |-
    Examples:
        <|tool_call>call:shell_read{}<tool_call|>                                                  # tail of default tab
        <|tool_call>call:shell_read{name:<|"|>build<|"|>,lines:100}<tool_call|>                    # last 100 lines of build tab
        <|tool_call>call:shell_read{name:<|"|>srv<|"|>,offset:0,lines:50}<tool_call|>              # first 50 lines

  # ----- src/agent/tools/workspace/files.py and filesystem.py -----
  edit_file: |-
    Examples:
        # Replace mode (default)
        <|tool_call>call:edit_file{path:<|"|>plan.md<|"|>,old_string:<|"|>## Draft<|"|>,new_string:<|"|>## Final<|"|>}<tool_call|>

        # Append mode — add to end of file
        <|tool_call>call:edit_file{path:<|"|>notes.md<|"|>,new_string:<|"|>\n## New Section<|"|>,position:<|"|>end<|"|>}<tool_call|>

        # Prepend mode — add to start of file
        <|tool_call>call:edit_file{path:<|"|>log.md<|"|>,new_string:<|"|># Header\n\n<|"|>,position:<|"|>start<|"|>}<tool_call|>

  move_file: |-
    Examples:
        <|tool_call>call:move_file{source:<|"|>todos.yaml<|"|>,dest:<|"|>archive/todos_phase_1.yaml<|"|>}<tool_call|>     # move to subdir
        <|tool_call>call:move_file{source:<|"|>draft.md<|"|>,dest:<|"|>final.md<|"|>}<tool_call|>                        # rename in place

  read_file: |-
    Examples:
        <|tool_call>call:read_file{path:<|"|>documents/report.pdf<|"|>}<tool_call|>                                                  # whole document
        <|tool_call>call:read_file{path:<|"|>documents/report.pdf<|"|>,page_start:1,page_end:5}<tool_call|>                          # specific pages
        <|tool_call>call:read_file{path:<|"|>output/notes.md<|"|>,offset:500,limit:100}<tool_call|>                                  # text lines 500-599

  write_file: |-
    Examples:
        <|tool_call>call:write_file{path:<|"|>output/summary.md<|"|>,content:<|"|># Summary\n\n...<|"|>}<tool_call|>
        <|tool_call>call:write_file{path:<|"|>notes/observations.md<|"|>,content:<|"|>...<|"|>}<tool_call|>

  get_document_info: |-
    Examples:
        <|tool_call>call:get_document_info{path:<|"|>documents/report.pdf<|"|>}<tool_call|>                                          # page count + structure preview

  # ----- src/agent/tools/knowledge/knowledge_tools.py -----
  kb_write: |-
    Examples:
        <|tool_call>call:kb_write{title:<|"|>Chose JWT over OAuth<|"|>,type:<|"|>decision<|"|>,content:<|"|>...<|"|>,tags:[<|"|>authentication<|"|>,<|"|>security<|"|>]}<tool_call|>
        <|tool_call>call:kb_write{title:<|"|>API rate limit experiment<|"|>,type:<|"|>learning<|"|>,content:<|"|>...<|"|>,tags:[<|"|>api<|"|>,<|"|>rate-limits<|"|>]}<tool_call|>

  kb_search: |-
    Examples:
        <|tool_call>call:kb_search{query:<|"|>how do we authenticate API requests<|"|>}<tool_call|>
        <|tool_call>call:kb_search{query:<|"|>prior decisions about rate limiting<|"|>,max_results:20}<tool_call|>

  kb_read: |-
    Examples:
        <|tool_call>call:kb_read{note:<|"|>chose-jwt-over-oauth<|"|>}<tool_call|>                  # by slug
        <|tool_call>call:kb_read{note:<|"|>api-rate-limit-experiment<|"|>}<tool_call|>

  kb_update: |-
    Examples:
        <|tool_call>call:kb_update{note:<|"|>chose-jwt-over-oauth<|"|>,append:<|"|>Update: also adopted refresh-token rotation.<|"|>}<tool_call|>
        <|tool_call>call:kb_update{note:<|"|>api-rate-limit-experiment<|"|>,status:<|"|>resolved<|"|>,confidence:<|"|>high<|"|>}<tool_call|>

  # ----- src/agent/tools/citation/sources.py -----
  cite_web: |-
    Examples:
        <|tool_call>call:cite_web{text:<|"|>LLMs hallucinate at higher rates on out-of-distribution prompts.<|"|>,url:<|"|>https://example.com/llm-hallucinations<|"|>,claim:<|"|>Out-of-distribution prompts increase hallucination risk.<|"|>}<tool_call|>

  cite_document: |-
    Examples:
        <|tool_call>call:cite_document{text:<|"|>Total revenue rose 12% YoY.<|"|>,document_path:<|"|>documents/q3_report.pdf<|"|>,page:12,claim:<|"|>Q3 revenue grew 12% year-over-year.<|"|>}<tool_call|>

  # ----- src/agent/tools/delegation/delegate_agent.py -----
  delegate_agent: |-
    Examples:
        <|tool_call>call:delegate_agent{description:<|"|>Map the rate limiter module<|"|>,prompt:<|"|>Objective: explain how src/ratelimit/ enforces per-user quotas. Expected output: at most 10 evidence bullets. Context: this maps the module before implementation. Read src/ratelimit/*.py and tests/test_ratelimit.py. Report entry points, the data model, the quota check (file:line), and gaps. Scope: no changes.<|"|>,subagent_type:<|"|>explorer<|"|>}<tool_call|>
        <|tool_call>call:delegate_agent{description:<|"|>Probe refresh races<|"|>,prompt:<|"|>Objective: probe refresh-token rotation races. Expected output: exact commands, timestamps, status codes, and a compact conclusion. Scope: read and execute tests only; do not change files.<|"|>,subagent_type:<|"|>probe<|"|>,run_in_background:true}<tool_call|>

  wait_agent: |-
    Examples:
        <|tool_call>call:wait_agent{handle:<|"|>probe-7f3a<|"|>,timeout_s:120}<tool_call|>

  message_agent: |-
    Examples:
        <|tool_call>call:message_agent{handle:<|"|>probe-7f3a<|"|>,message:<|"|>Also test two simultaneous refreshes for the same token.<|"|>}<tool_call|>

  stop_agent: |-
    Examples:
        <|tool_call>call:stop_agent{handle:<|"|>probe-7f3a<|"|>,grace_s:30}<tool_call|>

  list_agents: |-
    Examples:
        <|tool_call>call:list_agents{}<tool_call|>

  # ----- src/agent/tools/research/web.py -----
  web_search: |-
    Examples:
        <|tool_call>call:web_search{query:<|"|>vLLM gemma4 tool-call parser regex<|"|>}<tool_call|>
        <|tool_call>call:web_search{query:<|"|>recent layoffs in semiconductor industry<|"|>,topic:<|"|>news<|"|>,time_range:<|"|>month<|"|>}<tool_call|>
        <|tool_call>call:web_search{query:<|"|>OpenAI revenue 2026<|"|>,topic:<|"|>finance<|"|>,search_depth:<|"|>advanced<|"|>}<tool_call|>

  extract_webpage: |-
    Examples:
        <|tool_call>call:extract_webpage{urls:<|"|>https://docs.vllm.ai/en/latest/models/supported_models.html<|"|>}<tool_call|>
        <|tool_call>call:extract_webpage{urls:<|"|>https://example.com/a, https://example.com/b<|"|>,query:<|"|>rate limiting strategies<|"|>}<tool_call|>

  # ----- src/agent/tools/research/papers.py -----
  search_papers: |-
    Examples:
        <|tool_call>call:search_papers{query:<|"|>speculative decoding<|"|>}<tool_call|>                      # arxiv default
        <|tool_call>call:search_papers{query:<|"|>retrieval augmented generation<|"|>,source:<|"|>semantic_scholar<|"|>,max_results:20}<tool_call|>

  download_paper: |-
    Examples:
        <|tool_call>call:download_paper{identifier:<|"|>2408.08921<|"|>}<tool_call|>                          # arXiv ID
        <|tool_call>call:download_paper{identifier:<|"|>10.1038/nature12373<|"|>}<tool_call|>                 # DOI
        <|tool_call>call:download_paper{identifier:<|"|>https://arxiv.org/pdf/2408.08921<|"|>}<tool_call|>    # URL


nudges:

  # Family-sensitive: anything that mentions a tool name needs to remind the
  # model of the brace format. Doubled `{{` / `}}` because str.format() will
  # consume single braces — placeholder braces stay single, literal braces
  # are doubled.

  todo_action: |-
    Action required: complete the current todo `{todo_id}` now by invoking the `todo_complete` tool.
    The Gemma tool-call format is `<|tool_call>call:fn{{key:<|"|>val<|"|>}}<tool_call|>` — use braces, never parens.

  # See default.yaml: never enumerate the tool surface here — models read such
  # lists as exhaustive and conclude their other bound tools are gone.
  todo_list_footer: |-
    Mark each finished task by invoking the `todo_complete` tool with its todo id. This task list is a status reminder, not a tool list — every tool bound in this request stays available. Invocations use the canonical Gemma tool-call format from your system prompt: `<|tool_call>call:fn{{...}}<tool_call|>`.
    Never type tool calls as plain text or with parens.

  read_file_required_error: |-
    Error: You must read `{file_path}` before using {tool_name}. It contains critical instructions for this operation.
    Read it first by invoking the `read_file` tool, then invoke {tool_name} again. Use the canonical Gemma tool-call format — braces only.

  read_file_delivered_with_refusal: |-
    Not run yet: {tool_name} needs the instructions in `{file_path}`, which you have not read here. They are below and now count as read. Follow them, then invoke {tool_name} again. Use the canonical Gemma tool-call format — braces only.

    <instructions path="{file_path}">
    {content}
    </instructions>

  read_file_delivered_in_batch: |-
    Not run yet: the instructions for {tool_name} (`{file_path}`) came with an earlier refusal in this same batch. Follow them, then invoke {tool_name} again. Use the canonical Gemma tool-call format — braces only.

  phase_transition_tactical_to_strategic: |-
    [PHASE_TRANSITION] Tactical phase complete. Entering strategic phase {phase_number}. Review what was accomplished, update plan.md and record key learnings, then either stage todos for the next tactical phase using the `next_phase_todos` tool or invoke the `job_complete` tool. All tool invocations use the canonical Gemma brace format from your system prompt.

  # Other nudges (loop_warning_suffix, tool_not_found_suffix,
  # phase_transition_strategic_to_tactical, degenerate_recovery_*,
  # memory/knowledge headers/footers, empty_response_recovery)
  # inherit from default.yaml unchanged — they don't reference a wire format.
