apiVersion: srw/v1alpha1
kind: Expert
metadata:
  name: general-worker
  scope:
    kind: Catalog
    name: shared
  annotations:
    srw.io/display-name: General Worker
    srw.io/description: 'General-purpose worker for research, writing, analysis, planning,
      and file

      deliverables. It runs commands in its workspace, so it can convert documents

      (for example to PDF), run scripts and process data. Delegation, scholar pre-job,

      critic verification, automations and loops stay off unless an administrator

      or copied expert explicitly enables them.'
    srw.io/icon: engineering
    srw.io/color: '#a6e3a1'
    srw.io/expert-type: worker
    srw.io/bundled-selector: general-worker
  tags:
  - general
  - worker
  - safe-default
spec:
  workspacePreference: {backend: sandbox}
  runtime:
    adapter: srw/v1
    config:
      config_name: worker_base
      asset_name: general-worker
      config:
        # General Worker — bundled seed for the application worker default.
        $extends: worker_base

        agent_id: general-worker
        display_name: General Worker
        description: |
          General-purpose worker for research, writing, analysis, planning, and file
          deliverables. It runs commands in its workspace, so it can convert documents
          (for example to PDF), run scripts and process data. Delegation, scholar pre-job,
          critic verification, automations and loops stay off unless an administrator
          or copied expert explicitly enables them.
        icon: engineering
        color: "#a6e3a1"
        tags:
          - general
          - worker
          - safe-default

        verification:
          enabled: false
        scholar:
          enabled: false
        curator:
          enabled: false
        delegation:
          enabled: false

        # The shell group (the shell_tools grant is on by default). A Job's
        # workspace is a container unless the request picks another tier; on a
        # Virtual workspace the backend filter drops these tools again.
        tools:
          shell:
            - run_command
            - cancel_command
            - shell_read
