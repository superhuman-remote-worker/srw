# Strategic todos for developer job initialization (first strategic phase)
# These todos bootstrap a TDD job: read the brief, explore the repo (so the
# spec can reference real test paths and test commands), review prior knowledge,
# outline the plan, then create the first tactical phase — a `spec` phase that
# will produce spec.yaml before any red/green work begins.
todos:
  - id: 1
    content: >-
      EXPLORE: Read the task brief and instructions before doing anything else.

      The task brief and instructions.md are already in your opening message, in full.
      Read them there, every line; do not read_file task_brief.md or instructions.md
      again unless a compaction has removed that message. Pay attention to: required
      deliverables, the TDD discipline (spec → red → green → refactor), forbidden test
      patterns, and the abort token rules (BLOCKED / ABORT).

      Steps:
      (1) Use list_files on the tools/ directory to understand your available capabilities.
      (2) Use list_files on documents/ to inventory all input materials.

      Then persist critical rules as knowledge notes using kb_write:
      - Required deliverables (exact output paths and formats) → kb_write with type="goal", tag="deliverable"
      - Hard rules (forbidden test patterns, phase-type discipline) → kb_write with type="decision", tag="pinned"
      - Delivery expectations (PRs, branches, commit conventions) → kb_write with type="goal", tag="acceptance-criteria"

      These knowledge notes persist across context compaction AND across future jobs
      in the same project. Search existing notes first (kb_search) to avoid duplicates.

      COMPLETION CRITERIA: Knowledge notes created for deliverables, pinned rules, and
      delivery expectations (verify with kb_list). The brief and instructions in the opening message have been read in full.

      INSTEAD OF: Starting to write or modify code — this is the bootstrap strategic phase.
      Instead of skipping the abort-token and forbidden-pattern rules — these are the
      TDD discipline that makes this expert different.

  - id: 2
    content: >-
      EXPLORE REPOSITORY: Map the codebase so the spec can reference real paths.

      You cannot write a meaningful spec.yaml without knowing the test framework, the test
      command, and where tests live in this repo. Spend this todo discovering those facts.

      Steps:
      (1) Read README.md in the workspace root to find the attached repository: it is
          cloned at repos/<name>/ and README.md names its base branch. Use that <name>
          in every path below. If README.md lists no repository, say so — record a
          blocker via kb_write (type=state, tag=blocker) and stop exploring; do NOT
          invent a repository directory or treat the workspace root as the codebase.
      (2) Use list_files on repos/<name>/ to see the top-level structure.
      (3) Read repos/<name>/README.md (or equivalent) for project overview.
      (4) Read repos/<name>/package.json, requirements.txt, pyproject.toml, or the
          equivalent dependency file to understand the tech stack.
      (5) Use list_files on the main source directory (repos/<name>/src/, repos/<name>/app/,
          repos/<name>/lib/, or whatever convention this repo uses) to map the module structure.
      (6) Use list_files on the test directory (repos/<name>/tests/, repos/<name>/test/,
          repos/<name>/spec/) to map the test layout.
      (7) Read 2-3 representative test files to understand:
          - Test framework (pytest, vitest, jest, go test, etc.)
          - Test command (e.g., "pytest tests/ -x -v", "npm test") — run it with the
            shell tool's working_dir="repos/<name>" argument, never by cd-ing into the repo
          - Test naming conventions (test_*.py vs *.test.ts vs *_test.go)
          - Fixture style and imports
      (8) Check for CI config (repos/<name>/.github/workflows/, repos/<name>/.gitlab-ci.yml,
          etc.) to see how tests are run on the pipeline.

      {% if has_tool("delegate_agent") -%}
      FAN-OUT (the default when the repo has several independent areas): steps (2)-(8)
      are mostly parallel reads — instead of doing them all yourself, delegate them to
      `explorer` children. Several delegate_agent calls in ONE turn run in parallel,
      each maps one area with a fresh context and returns a distilled summary, and you
      assemble the repo map and write the notes. Give each a self-contained brief ("map
      repos/<name>/src/<area>: modules, key classes, conventions — report back"; "find the test
      framework + exact test command — report back"; or a websearch like "how does
      <framework> configure its test runner?"). You own the spec and failing test. After
      that, delegate at most ONE bounded implementation at a time to `implementer` with
      explicit owned_paths (a green-phase brief forbids tests/), then use `tester` for the
      suite and `reviewer` for the diff; read the diff yourself before todo_complete.
      Write directly when the change is small or cross-cutting.
      {% endif -%}

      Record findings as knowledge notes via kb_write (type=learning, tag=repository):
      - Repository clone name (repos/<name>/) and base branch, from README.md
      - Framework and language version
      - Test framework + exact test command
      - Source directory layout (where src/ lives, what it's called)
      - Test directory layout (where tests/ lives, what it's called, naming convention)
      - Linter/formatter command (e.g., ruff, eslint, prettier)
      - Branch and commit conventions (if discoverable from git log)

      COMPLETION CRITERIA: Knowledge notes created for the repository name + base branch,
      test framework, test command, source dir, and test dir. You can name the path under
      which the next tactical phase will write tests and source.

      INSTEAD OF: Trying to read the entire codebase — focus on test infrastructure,
      conventions, and the specific area touched by the task. Instead of guessing
      conventions — read actual code.

  - id: 3
    content: >-
      REVIEW PROJECT KNOWLEDGE: Check the knowledge base for existing context.

      Steps:
      (1) Use kb_list to see all existing notes (filter by status="active").
      (2) Use kb_search with key terms from the task description to find relevant prior knowledge.
      (3) Review any existing decision notes — they may constrain your approach.
      (4) Check for contradictions (kb_contradictions) that need resolution.

      If this is the first job in the project, the knowledge base will be empty — that's fine.
      The notes you create during this job will benefit future jobs.

      Create initial state notes if they don't exist:
      - A "goal" note summarizing the current job's objective
      - A "state" note tracking AC progress (one note per AC, updated as work proceeds)

      COMPLETION CRITERIA: kb_list or kb_search called at least once. Prior knowledge,
      if any, has been reviewed. Initial state notes created for this job.

      INSTEAD OF: Skipping this step — prior knowledge from the same project can save
      significant work. Instead of creating notes that duplicate existing ones — search first.

  - id: 4
    content: >-
      PLAN: Create plan.md with a TDD-phased implementation strategy.

      The plan must follow the TDD lifecycle. Every non-trivial task is shaped as:

      1. **Spec phase** — Produce spec.yaml with EARS acceptance criteria. Lock it into
         spec_lock.md's PROTECTED `## Acceptance Criteria` section.
      2. **Red phase(s)** — For each batch of related AC, write failing tests. Each test
         must fail with AssertionError (not ImportError) before the green phase begins.
      3. **Green phase(s)** — Minimum implementation to make the red tests pass. No
         speculative features. No edits under `tests/`.
      4. **Refactor phase(s)** — Optional. Only when green and structure genuinely needs work.
      5. **Integration phase** — PR / commit prep.

      Phase plan structure in plan.md:

      ```
      ## Deliverables
      - <exact output description>
      - Files that will be created or modified
      - Quality criteria (from spec.yaml done_when)

      ## Phases
      | # | tdd_phase   | Scope                                     | AC IDs       |
      |---|--------------|-------------------------------------------|--------------|
      | 1 | spec         | Produce spec.yaml + lock to spec_lock.md  | (defines)    |
      | 2 | red          | Tests for happy-path AC                   | AC-1, AC-2   |
      | 3 | green        | Implementation for happy-path AC          | AC-1, AC-2   |
      | 4 | red          | Tests for edge/error-case AC              | AC-3, AC-4   |
      | 5 | green        | Implementation for edge/error AC          | AC-3, AC-4   |
      | 6 | refactor     | (optional)                                | -            |
      | 7 | integration  | Commit + PR                               | -            |
      ```

      PHASE SIZING: Target 8-16 todos per tactical phase. Each phase is one coherent
      slice of TDD work — the phase count is set by the TDD cycle itself, not by
      batch size. Do NOT split within a type: one red phase covering every failing
      test beats three small ones, because each extra boundary costs a full planning
      cycle.

      AC GROUPING: A red phase + the matching green phase covers ~2-4 AC at a time. Smaller
      AC batches mean tighter feedback loops; larger batches mean more risk of partial green.

      Focus on the first 2-3 phases in detail. Later phases can be sketches — they WILL be
      adapted as you learn what actually lands.

      PLAN VERIFICATION: Cross-check the plan against instructions.md. Every required
      deliverable must trace to at least one green-or-later phase.

      COMPLETION CRITERIA: plan.md exists with at least 3 phases (spec, red, green at
      minimum). Each phase has tdd_phase, scope, and (for red/green) AC IDs.

      INSTEAD OF: Planning "cleanup", "archiving", or "final packaging" phases — git
      versioning handles history. Instead of creating phases that produce nothing listed
      in instructions.md. Instead of over-planning — you will adapt the plan after every
      tactical phase based on the actual diff.

  - id: 5
    content: >-
      CREATE first phase todos using the next_phase_todos tool.

      (The todo-guide skill at skills/todo-guide/SKILL.md covers the TDD phase
      types, exit gates, and forbidden test patterns.)

      The FIRST tactical phase has `tdd_phase: spec`. Create 3-6 todos that will produce
      spec.yaml and lock it into spec_lock.md. Each todo must reference tdd_phase=spec
      and may not touch `src/` or `tests/`.

      Suggested first-phase (spec) todos:

      1. "Search kb_search for prior decisions related to this feature. Compile findings
          via kb_write (type=learning, tag=spec-input)."

      2. "Write spec.yaml in the workspace root. Format:
          - feature: <kebab-case-id>
          - intent: <one-sentence purpose>
          - acceptance_criteria: list of {id, ears, test_oracle}
          - not_included: explicit scope boundaries
          - done_when: exact commands that must pass
          Each AC must use one of the EARS templates (Ubiquitous / Event-driven / State-driven /
          Unwanted-behavior / Optional) and name a test_oracle path that matches this repo's
          test layout (recorded in kb during todo 2 above)."

      3. "Lock spec into spec_lock.md's PROTECTED `## Acceptance Criteria` section. Copy
          the AC block verbatim. Initialize the traceability matrix table with each AC at
          status `not_started`."

      4. "Verify the spec against instructions.md: every required deliverable must be covered
          by >= 1 AC. If anything is missing, add the AC; if anything is over-scoped, add
          it to `not_included`. Confirm done_when commands exist and are runnable."

      Then the SECOND strategic phase will (after reading the locked spec) set `tdd_phase: red`
      and create todos to write the failing tests for the first AC batch.

      COMPLETION CRITERIA: next_phase_todos called successfully with 3-6 todos, each
      stamped with tdd_phase=spec.

      INSTEAD OF: Creating red or green todos in the first phase — the spec must
      exist first. Instead of writing the spec yourself in this strategic phase —
      strategic plans, tactical writes files.
