apiVersion: srw/v1alpha1
kind: Expert
metadata:
  name: phone-desk
  scope:
    kind: Catalog
    name: shared
  annotations:
    srw.io/display-name: Voice Desk
    srw.io/description: 'Back office for one live voice session, such as a call
      on a phone line. A voice assistant talks to the caller; this worker answers
      the questions the voice hands it while the session lasts, then carries out
      the follow-ups. Started by its live connector, not by hand.'
    srw.io/icon: call
    srw.io/color: '#94e2d5'
    srw.io/expert-type: worker
    srw.io/bundled-selector: phone-desk
  tags:
  - phone
  - worker
spec:
  # A voice desk needs no repository and no workspace files: answers come from
  # the voice's facts, the project knowledge base and the attached datasources.
  workspacePreference: {backend: none}
  runtime:
    adapter: srw/v1
    config:
      config_name: worker_base
      asset_name: phone-desk
      config:
        # Voice Desk — a generic example of a live-session job's expert.
        #
        # A live connector (a phone line) receives the session; the
        # orchestrator admits a job for it with config.live_session and hands
        # the session to the connector's pod, which speaks with the caller
        # through the voice engine using the `voice` entry's `live` block. The
        # job starts tactical with that entry attached as its voice subagent
        # (the history begins with the delegate_agent call and its receipt),
        # answers the voice's questions through wait_agent/message_agent until
        # the session ends, and then turns strategic for the follow-ups.
        # Design: knowledge-base/knowledge/features/live_session_jobs.md §6.
        # A real desk (its persona, greeting and facts) is a DB expert built
        # from this one; customer content never lives in this repository.
        $extends: worker_base

        agent_id: phone-desk
        display_name: Voice Desk
        description: |
          Back office for one live voice session, such as a call on a phone
          line. A voice assistant talks to the caller; this worker answers the
          questions the voice hands it while the session lasts, then carries
          out the follow-ups. Started by its live connector, not by hand.
        icon: call
        color: "#94e2d5"
        tags:
          - phone
          - worker

        verification:
          enabled: false
        scholar:
          enabled: false
        curator:
          enabled: false

        delegation:
          enabled: true
          max_concurrent: 2

        # The follow-ups happen in the strategic phase after the session
        # (live_post_session_todos): open the datasource tools there too.
        phase_settings:
          strategic_tools:
            - sql_schema
            - sql_query
            - sql_execute

        # No workspace means no read_file: the worker overlay's read-before-tool
        # gates (todo-guide before next_phase_todos, verify-before-done before
        # todo_complete/job_complete) could never open, and the job could not
        # finish. Keep only the phase skills, which arrive as messages.
        instruction_files:
          - skill: strategic-phase
            trigger: phase_start:strategic
            enforce: false
          - skill: tactical-phase
            trigger: phase_start:tactical
            enforce: false

        subagents:
          roster:
            voice:
              description: >-
                The live voice session this job was started for. A voice
                assistant talks to the caller; wait_agent returns its questions,
                message_agent(reply_to=...) speaks your answer, and stop_agent
                ends the session. Attached by the session; never delegate it.
              # Not an LLM child: the subagent runtime drives it with the live
              # driver (agent/subagents/live.py) on the job's session.
              driver: live
              isolation: shared
              write_policy: none
              llm:
                model: inherit
              limits:
                return_budget_tokens: 6000
              # The voice itself: the orchestrator turns this block into the
              # session's instructions and greeting (live_session_jobs §6.4).
              live:
                persona: >-
                  You are the voice assistant of a service desk. You are an AI
                  assistant and say so when asked. Speak briefly and warmly, one
                  question at a time, in the caller's language.
                facts: >-
                  You can take a message, arrange a call back, or put the caller
                  through to a person. Hand everything else to the back office:
                  questions about the caller's own records, requests to change
                  something, and anything these facts do not answer.
                greeting: Hello, you are speaking with an AI assistant. How can I help?
                voice: marin
                answer_timeout_s: 25

        # A caller is waiting: the back office answers from the knowledge base
        # and the project's datasources (their SQL tools are added when a
        # datasource is attached), never from the web or a browser.
        tools:
          workspace: []
          research: []
          browser_direct: []
          git: []
          delegation:
            - delegate_agent
            - wait_agent
            - message_agent
            - stop_agent
            - list_agents
          citation: []
          graph: []
