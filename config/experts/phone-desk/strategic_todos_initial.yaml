# Strategic todos for a phone call job (phone-desk).
#
# The call is already connected when the job starts: the history begins with
# the delegate_agent call that attached it as the background subagent `phone`
# and its receipt (handle in the receipt). The first todo IS the call. The
# datasource tools (sql_schema / sql_query / sql_execute) are allowed in this
# phase (phase_settings.strategic_tools), so the whole job — the call and its
# follow-ups — runs here and ends with job_complete; no tactical phase.
todos:
  - id: 1
    content: >-
      HANDLE THE LIVE CALL. The phone subagent is already attached (see the
      delegate_agent call and its receipt above; its handle starts with "phone-").
      Loop: call wait_agent(handle, timeout_s=600).
      - result "question": answer it at once with
        message_agent(handle, message=<what the voice should tell the caller>,
        reply_to=<question.delegation_id>). Look things up or act first if
        needed: sql_schema / sql_query / sql_execute on the attached datasource,
        kb_search for clinic knowledge. Answer before answer_by; send a holding
        message first if you need longer.
      - result "timeout": the call is still running; wait again.
      - result "ready" (or the call's report arrives): the call has ended.
      COMPLETION CRITERIA: the phone subagent has ended and you have its final
      report (transcript, questions, follow-ups).
      INSTEAD OF: planning or exploring while the call is live — the caller is
      waiting.

  - id: 2
    content: >-
      CARRY OUT THE FOLLOW-UPS. Read the call's final report. For every request
      the caller made that still needs action, act now with the datasource
      tools: find the record with sql_query (by name, phone number and date),
      change it with sql_execute (for a cancellation set status='abgesagt' and
      add a note with the reason and "per Telefon"; never delete rows), and
      verify the change with sql_query. A callback wish goes into the callbacks
      table. Something you cannot do with your tools stays open.
      COMPLETION CRITERIA: every request in the report is done and verified,
      or recorded as open with the reason.

  - id: 3
    content: >-
      FINISH with job_complete. The summary names the caller, each request,
      what you did (with the record it changed) and what is still open.
