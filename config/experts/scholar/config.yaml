apiVersion: srw/v1alpha1
kind: Expert
metadata:
  name: scholar
  scope:
    kind: Catalog
    name: shared
  annotations:
    srw.io/display-name: Scholar
    srw.io/description: 'Continuous exploration agent. Scans the web, digs through
      codebases,

      analyzes logs and test results, runs experiments. Generates a high volume

      of idea artifacts — the Critic decides which survive.'
    srw.io/icon: lightbulb
    srw.io/color: '#f9e2af'
    srw.io/expert-type: worker
    srw.io/bundled-selector: scholar
  tags:
  - research
  - exploration
  - ideas
  - worker
spec:
  runtime:
    adapter: srw/v1
    config:
      config_name: worker_base
      asset_name: scholar
      config:
        # Scholar - Continuous R&D exploration and idea generation
        $extends: worker_base

        agent_id: scholar
        display_name: Scholar
        description: |
          Continuous exploration agent. Scans the web, digs through codebases,
          analyzes logs and test results, runs experiments. Generates a high volume
          of idea artifacts — the Critic decides which survive.
        icon: lightbulb
        color: "#f9e2af"
        tags:
          - research
          - exploration
          - ideas

        llm: {}

        scholar:
          enabled: false

        # Built-in subagents (delegate_agent): readers fanned out per research thread
        # — the parent delegates the reading and authors the synthesis. `enabled` gates
        # the tool binding; the children and their model live in `subagents.roster`
        # (model defaults to the parent's; override per job via
        # config_override.subagents.llm).
        delegation:
          enabled: true
          max_concurrent: 4

        subagents:
          default: reader
          roster:
            explorer: {$ref: subagents/explorer}
            reader: {$ref: subagents/reader}

        workspace:
          structure:
            - archive/
            - documents/
            - output/ideas/
            - output/experiments/
            - notes/
            - reference/
          git_versioning: true

        # Scholar-specific instruction files (the conservative base does not add these)
        instruction_files:
          # Phase skills restated: this list replaces the worker overlay's wholesale.
          - skill: strategic-phase
            trigger: phase_start:strategic
            enforce: false
          - skill: tactical-phase
            trigger: phase_start:tactical
            enforce: false
          - skill: todo-guide
            trigger: before_tool:next_phase_todos
            enforce: true
          - skill: research-guide
            trigger: phase_start:tactical
            enforce: false  # Injected once per concrete tactical phase
          - skill: verify-before-done
            trigger: before_tool:todo_complete
            enforce: true
            phases: [tactical]
            read_scope: phase
            max_read_age_turns: 20
          - skill: verify-before-done
            trigger: before_tool:job_complete
            enforce: true
            phases: [strategic]
            read_scope: phase
            max_read_age_turns: 20
          # Reference every claim inline with its [^c…] handle (cite-and-place, not cite-and-forget).
          - skill: cite-as-you-write
            trigger: before_tool:cite_web
            enforce: true
          - skill: cite-as-you-write
            trigger: before_tool:cite_document
            enforce: true

        tools:
          workspace:
            - read_file
            - write_file
            - edit_file
            - list_files
            - delete_file
            - search_files
            - file_exists
            - move_file
            - copy_file
            - get_document_info
            - create_directory
          core:
            - next_phase_todos
            - todo_complete
            - todo_list
            - request_replan
            - mark_complete
            - job_complete
          research:
            - web_search
            - extract_webpage
            - crawl_website
            - map_website
            - search_papers
            - download_paper
            - get_paper_info
            - research_topic
          shell:
            - run_command
            - cancel_command
          # git: intentionally absent. This agent has shell tools, and
          # ToolsConfig.__post_init__ (src/shared/runtime/core/loader.py) suppresses the git_* group
          # whenever shell is present — a shell can run git against ANY repository in
          # the workspace, including repos/<name>/, which git_* cannot. Declaring them
          # here would advertise tools the pod never binds.
          delegation:
            - delegate_agent
            - wait_agent
            - message_agent
            - stop_agent
            - list_agents
          # SQL injected when system datasource attached (for reading job data, test results)
          sql: []
          # Citations: a research agent must back every factual claim with a source.
          # the research-guide skill (tactical phase) instructs cite_web / cite_document,
          # so the tools must exist. Mirrors expert_base.yaml's citation suite.
          citation:
            - cite_document
            - cite_web
            - list_sources
            - get_citation
            - list_citations
            - edit_citation
            - withdraw_citation
            - annotate_source
            - get_annotations
            - tag_source
            - search_library
            - generate_bibliography
          # Graph + MongoDB auto-injected when a matching datasource is attached
          graph: []
          mongodb: []
