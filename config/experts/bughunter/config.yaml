apiVersion: srw/v1alpha1
kind: Expert
metadata:
  name: bughunter
  scope:
    kind: Catalog
    name: shared
  annotations:
    srw.io/display-name: Bug Hunter
    srw.io/description: 'Adversarial QA. Picks a target surface (module, endpoint
      family, feature

      flag, tenant boundary) and tries to break it. Probes inputs, races,

      permissions, and assumptions. Every finding ships with a reproduction —

      a failing test, curl, SQL query, or browser trace. Hunts; does not fix.'
    srw.io/icon: bug_report
    srw.io/color: '#fab387'
    srw.io/expert-type: worker
    srw.io/bundled-selector: bughunter
  tags:
  - testing
  - security
  - audit
  - reliability
  - worker
spec:
  workspacePreference: {backend: sandbox}
  runtime:
    adapter: srw/v1
    config:
      config_name: worker_base
      asset_name: bughunter
      config:
        # Bug Hunter - Adversarial, exploratory testing of an existing target surface.
        $extends: worker_base

        agent_id: bughunter
        display_name: Bug Hunter
        # This expert plans in phases (shared/job_phases.py; false by default).
        # The bughunter's method lives in its own phase skills (skills/).
        phases: true
        description: |
          Adversarial QA. Picks a target surface (module, endpoint family, feature
          flag, tenant boundary) and tries to break it. Probes inputs, races,
          permissions, and assumptions. Every finding ships with a reproduction —
          a failing test, curl, SQL query, or browser trace. Hunts; does not fix.
        icon: bug_report
        color: "#fab387"
        tags:
          - testing
          - security
          - audit
          - reliability

        llm:
          reasoning_level: high

        # Built-in subagents (delegate_agent): independent hunt vectors fan out to
        # raw-evidence probes; the parent classifies and files. `enabled` gates the
        # tool binding; the roster defines the children and their budgets.
        delegation:
          enabled: true
          max_concurrent: 4

        subagents:
          default: probe
          roster:
            explorer: {$ref: subagents/explorer}
            probe: {$ref: subagents/probe}

        workspace:
          structure:
            - archive/
            - documents/
            - output/findings/
            - output/repros/
            - notes/
          git_versioning: true

        tools:
          workspace:
            - read_file
            - write_file
            - edit_file
            - list_files
            - search_files
            - file_exists
            - get_document_info
            - create_directory
          core:
            - next_phase_todos
            - todo_complete
            - todo_list
            - request_replan
            - mark_complete
            - job_complete
          shell:
            - run_command
            - cancel_command
            - shell_execute
            - shell_read
          # git: intentionally absent. This agent has shell tools, and
          # ToolsConfig.__post_init__ (src/shared/runtime/core/loader.py) suppresses the git_* group
          # whenever shell is present — a shell can run git against ANY repository in
          # the workspace, including repos/<name>/, which git_* cannot. Declaring them
          # here would advertise tools the pod never binds.
          # Read-only DB probes — write tools (sql_execute, mongo_insert/update) are
          # NOT listed here. If a hunt mission genuinely needs writes (e.g. fuzzing
          # a write path against an ephemeral DB), inject them per-job via
          # config_override at dispatch time.
          sql: []
          mongodb: []
          # Browser for UI/SSE/WebSocket probes — high signal for the kinds of bugs
          # surface-level review misses (auth flows, race conditions in streams).
          browser_direct:
            - browser_navigate
            - browser_snapshot
            - browser_click
            - browser_type
            - browser_select
            - browser_scroll
            - browser_screenshot
            - browser_back
            - browser_close
          # Web search for known CVEs / advisories in dependencies the hunt touches.
          research:
            - web_search
            - extract_webpage
          # Spawn + background controls (each bound only with delegation.enabled).
          delegation:
            - delegate_agent
            - wait_agent
            - message_agent
            - stop_agent
            - list_agents
          # Not needed
          citation: []
          graph: []
