# Model servers for the voice gateway's cascade test profiles
# (local_voice_gateway.md §4.3, §6.2). Fetch the pinned models first:
#   python docker/voice-models/models.py fetch [--set cpu,gpu,judge]
#   docker compose -f docker/voice-models/compose.yaml up -d                  # cascade-cpu
#   docker compose -f docker/voice-models/compose.yaml --profile gpu up -d    # + cascade-gpu
#   ... --profile gpu-rocm up -d llm speech-gpu tts-gpu-rocm                  # cascade-gpu-rocm
# Details, licences and the SELinux/GPU notes: docker/voice-models/README.md.
name: srw-voice-models

# A Vulkan GPU for llama.cpp and whisper.cpp: only the card's render node
# (all of /dev/dri would also hand them an iGPU), and SELinux labels off,
# since containers may not open /dev/dri devices otherwise.
x-vulkan-gpu: &vulkan-gpu
  devices:
    - "${VOICE_LLM_RENDER_NODE:-/dev/dri/renderD128}:${VOICE_LLM_RENDER_NODE:-/dev/dri/renderD128}"
  security_opt:
    - label=disable
  # Nothing in these servers writes; what they read is mounted read-only.
  read_only: true
  tmpfs:
    - /tmp

services:
  # STT: faster-whisper behind Speaches' OpenAI-compatible API, on the CPU.
  # Offline: it only reads the pinned snapshot in the HF cache.
  speech:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    user: "${VOICE_MODELS_UID:-1000}:${VOICE_MODELS_GID:-1000}"
    environment:
      HOME: /tmp
      HF_HUB_CACHE: /hf
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      # Speaches logs transcriptions at debug.
      LOG_LEVEL: warning
      ENABLE_UI: "false"
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "${VOICE_STT_THREADS:-8}"
      # Keep the model loaded.
      WHISPER__TTL: "-1"
    volumes:
      - ${VOICE_MODELS_DIR:-../../.cache/voice-models}/hf:/hf:z
    # Uploads larger than 1 MB (about 30 s of a caller's speech) spill to
    # /tmp; keep that in memory (no audio on disk).
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${VOICE_SPEECH_PORT:-18450}:8000"
    restart: unless-stopped

  # TTS: Piper with a chosen MLS speaker (Speaches always takes the first,
  # which reads at half speed). Build: see Dockerfile.piper.
  tts:
    image: srw-voice-piper:2023.11.14-2
    build:
      context: .
      dockerfile: Dockerfile.piper
    environment:
      PIPER_MODEL: /models/de_DE-mls-medium.onnx
      PIPER_SPEAKER: "${VOICE_TTS_SPEAKER:-10}"
    volumes:
      - ${VOICE_MODELS_DIR:-../../.cache/voice-models}/piper:/models:ro,z
    ports:
      - "127.0.0.1:${VOICE_TTS_PORT:-18452}:8000"
    restart: unless-stopped

  # The voice LLM: llama.cpp's server on an AMD (or any Vulkan) GPU. Pass
  # only the card's render node, or llama.cpp also splits onto an iGPU.
  # SELinux keeps containers off /dev/dri unless labels are off for this one.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11783@sha256:57350ca6eb16ea4470e784499290e703e5ca92219d63b14232ddd0e1556b0856
    # Same path inside: libdrm finds the card's sysfs entry by the node name.
    <<: *vulkan-gpu
    volumes:
      - ${VOICE_MODELS_DIR:-../../.cache/voice-models}/llm:/models:ro
    command: &llm-args
      - --model
      - /models/${VOICE_LLM_MODEL:-gemma-4-12b-it-qat-q4_0.gguf}
      - --alias
      - ${VOICE_LLM_ALIAS:-gemma-4-12b-it}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "999"
      - --ctx-size
      - "${VOICE_LLM_CONTEXT:-12288}"
      - --parallel
      - "${VOICE_LLM_SLOTS:-1}"
      # The model's own chat template (tool calls), thinking off.
      - --jinja
      - --reasoning-budget
      - "0"
      # The prompt cache (on by default) keeps each call's fixed prefix. With
      # Gemma's sliding-window layers it only helps with a full-size window
      # cache: without --swa-full each turn re-processed its ~50 new tokens
      # around llama.cpp's window checkpoints, ~0.5 s to the first token on
      # an RX 9070 XT; with it, ~0.12 s (WP4). The 8-bit KV cache (needs
      # flash attention) pays for most of the extra memory.
      - --swa-full
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
    ports:
      - "127.0.0.1:${VOICE_LLM_PORT:-18451}:8080"
    restart: unless-stopped

  # Fallback without a GPU: the same server on the CPU (`--profile cpu`,
  # stop `llm` first). A 12B model answers in seconds there; point
  # VOICE_LLM_MODEL at a smaller GGUF for function tests.
  llm-cpu:
    profiles: [cpu]
    image: ghcr.io/ggml-org/llama.cpp:server-b11459@sha256:33868c035b21dc63f7c60b7438774283fd99215bc319114eb03de5df4ce7cd6b
    volumes:
      - ${VOICE_MODELS_DIR:-../../.cache/voice-models}/llm:/models:ro,z
    command: *llm-args
    ports:
      - "127.0.0.1:${VOICE_LLM_PORT:-18451}:8080"

  # --- cascade-gpu (WP4): STT and TTS on the GPU, `--profile gpu` ---------
  # STT: whisper.cpp's server with whisper-large-v3-turbo on Vulkan, behind
  # OpenAI's /v1/audio/transcriptions. Built locally (Dockerfile.whisper-vulkan).
  speech-gpu:
    profiles: [gpu]
    image: srw-voice-whisper-vulkan:1.9.5
    build:
      context: .
      dockerfile: Dockerfile.whisper-vulkan
    <<: *vulkan-gpu
    volumes:
      - ${VOICE_MODELS_DIR:-../../.cache/voice-models}/stt:/models:ro
    command:
      - --model
      - /models/${VOICE_STT_GPU_MODEL:-ggml-large-v3-turbo-q8_0.bin}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --inference-path
      - /v1/audio/transcriptions
      - --language
      - de
      - --threads
      - "4"
      - --no-timestamps
      # Beam search: on the phone clips WER 0.33 instead of 0.40 greedy, for
      # a few milliseconds on the GPU (WP4).
      - --beam-size
      - "5"
    ports:
      - "127.0.0.1:${VOICE_SPEECH_GPU_PORT:-18453}:8080"
    restart: unless-stopped

  # TTS: Qwen3-TTS 1.7B Base on llama.cpp (Vulkan; streamed /tts), with the
  # adapter in front for OpenAI's /v1/audio/speech and the reference voice.
  tts-gpu-model:
    profiles: [gpu]
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11783@sha256:57350ca6eb16ea4470e784499290e703e5ca92219d63b14232ddd0e1556b0856
    <<: *vulkan-gpu
    volumes:
      - ${VOICE_MODELS_DIR:-../../.cache/voice-models}/tts:/models:ro
    command:
      - --model
      - /models/Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf
      - --mmproj
      - /models/mmproj-Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "999"
      # One sentence at a time per call; a sentence and the voice's reference
      # need well under 4k tokens (12.5 audio frames per second).
      - --parallel
      - "${VOICE_TTS_SLOTS:-1}"
      - --ctx-size
      - "4096"
    restart: unless-stopped

  tts-gpu:
    profiles: [gpu]
    image: srw-voice-audio-adapter:1
    build:
      context: .
      dockerfile: Dockerfile.audio-adapter
    environment:
      TTS_UPSTREAM: http://tts-gpu-model:8080
      TTS_VOICE: "${VOICE_TTS_GPU_VOICE:-de-1}"
      TTS_LANG: de
    volumes:
      - ./voices:/voices:ro,z
    read_only: true
    ports:
      - "127.0.0.1:${VOICE_TTS_GPU_PORT:-18454}:8000"
    depends_on: [tts-gpu-model]
    restart: unless-stopped

  # TTS on an AMD GPU with ROCm (`--profile gpu-rocm`, the cascade-gpu-rocm
  # profile): Qwen3-TTS 0.6B Base on PyTorch, streamed, so the first audio
  # leaves after 0.67 s of speech is made instead of the whole sentence.
  # PyTorch and the model come from models.py fetch --set rocm.
  tts-gpu-rocm:
    profiles: [gpu-rocm]
    image: srw-voice-qwen-tts:1
    build:
      context: .
      dockerfile: Dockerfile.qwen-tts
    devices:
      - /dev/kfd:/dev/kfd
      - "${VOICE_LLM_RENDER_NODE:-/dev/dri/renderD128}:${VOICE_LLM_RENDER_NODE:-/dev/dri/renderD128}"
    # The host's `render` group (getent group render), for /dev/kfd.
    group_add:
      - "${VOICE_RENDER_GID:-105}"
    security_opt:
      - label=disable
    environment:
      TTS_VOICE: "${VOICE_TTS_GPU_VOICE:-de-1}"
      TTS_LANGUAGE: German
    volumes:
      - ${VOICE_MODELS_DIR:-../../.cache/voice-models}/qwen-tts:/opt/qwen-tts:ro
      - ./voices:/voices:ro,z
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${VOICE_TTS_ROCM_PORT:-18456}:8000"
    restart: unless-stopped

  # --- the bench's judge (WP4), `--profile judge` ---------------------------
  # Qwen3-ASR 0.6B on llama.cpp: transcribes what a caller heard, for
  # voice_models_bench.py, voice_cascade_try.py --judge-url and the bench
  # call's --judge-url. Another model family than the STT stage it judges.
  judge-model:
    profiles: [judge]
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11783@sha256:57350ca6eb16ea4470e784499290e703e5ca92219d63b14232ddd0e1556b0856
    <<: *vulkan-gpu
    volumes:
      - ${VOICE_MODELS_DIR:-../../.cache/voice-models}/judge:/models:ro
    command:
      - --model
      - /models/Qwen3-ASR-0.6B-Q8_0.gguf
      - --mmproj
      - /models/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "999"
      # A clip of a few seconds and its text; the model's own context would
      # reserve gigabytes of KV cache.
      - --parallel
      - "1"
      - --ctx-size
      - "4096"
    restart: unless-stopped

  judge:
    profiles: [judge]
    image: srw-voice-audio-adapter:1
    build:
      context: .
      dockerfile: Dockerfile.audio-adapter
    environment:
      ASR_UPSTREAM: http://judge-model:8080
    read_only: true
    ports:
      - "127.0.0.1:${VOICE_JUDGE_PORT:-18455}:8000"
    depends_on: [judge-model]
    restart: unless-stopped
