; Generic start-up config baked into srw-asterisk. Consumers (the WP0 bench,
; the WP2 addon) mount their own /etc/asterisk over this directory.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
; The container runs as uid 10001; never try to switch users.
nofork = yes
transmit_silence = no
hideconnect = yes
